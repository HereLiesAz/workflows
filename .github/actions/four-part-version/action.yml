name: Four-part release version
description: Derive MAJOR.MINOR.PATCH.BUILD and minor grouping metadata from a project version source.
inputs:
  source-version:
    description: Optional explicit MAJOR.MINOR.PATCH.BUILD base version.
    required: false
    default: ""
  source-version-file:
    description: Optional properties-style file containing the base version.
    required: false
    default: ""
  source-version-key:
    description: Key to read from source-version-file.
    required: false
    default: ""
  build-number:
    description: Build number replacing the fourth component.
    required: true
  prerelease-major-max:
    description: Highest major version considered prerelease by default.
    required: false
    default: "0"
  environment-variable:
    description: Optional environment variable name to export the derived version for later steps.
    required: false
    default: ""
outputs:
  version:
    description: Derived MAJOR.MINOR.PATCH.BUILD.
    value: ${{ steps.derive.outputs.version }}
  minor-version:
    description: MAJOR.MINOR grouping key.
    value: ${{ steps.derive.outputs.minor-version }}
  prerelease:
    description: true when the derived version should be a prerelease.
    value: ${{ steps.derive.outputs.prerelease }}
runs:
  using: composite
  steps:
    - id: derive
      shell: bash
      env:
        SOURCE_VERSION: ${{ inputs.source-version }}
        SOURCE_VERSION_FILE: ${{ inputs.source-version-file }}
        SOURCE_VERSION_KEY: ${{ inputs.source-version-key }}
        BUILD_NUMBER: ${{ inputs.build-number }}
        PRERELEASE_MAJOR_MAX: ${{ inputs.prerelease-major-max }}
        ENVIRONMENT_VARIABLE: ${{ inputs.environment-variable }}
      run: python3 "$GITHUB_ACTION_PATH/derive.py"
