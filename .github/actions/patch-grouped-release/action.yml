name: Patch-grouped GitHub release (deprecated alias)
description: >-
  Deprecated alias for .github/actions/minor-grouped-release, which now groups releases by
  MAJOR.MINOR instead of MAJOR.MINOR.PATCH. Update the source workflow to call
  minor-grouped-release directly; this alias exists only so already-registered source workflows
  do not break before they are resynced.
inputs:
  github-token:
    description: Repository-scoped token with contents:write.
    required: true
  target-repository:
    description: owner/repository receiving tags and the grouped release.
    required: true
  target-sha:
    description: Immutable commit SHA for this exact build.
    required: true
  build-version:
    description: Exact MAJOR.MINOR.PATCH.BUILD version.
    required: true
  assets:
    description: Shell-style glob selecting this build's already-versioned release assets.
    required: true
  title-prefix:
    description: Human-readable product name used in the release title.
    required: true
  asset-name-mode:
    description: inject-version adds BUILD_VERSION to asset names that do not already contain it; require-version rejects them.
    required: false
    default: "inject-version"
  notes-file:
    description: Optional Markdown file containing changes for this build.
    required: false
    default: ""
  tag-prefix:
    description: Prefix for exact-build and grouped tags. Defaults to none — tags are bare version numbers.
    required: false
    default: ""
  prerelease:
    description: Whether the grouped release is a prerelease.
    required: false
    default: "false"
  make-latest:
    description: Whether the grouped release should be marked latest.
    required: false
    default: "true"
  migrate-legacy-build-releases:
    description: Move assets from old release objects into the grouped release, preserving their tags.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: HereLiesAz/workflows/.github/actions/minor-grouped-release@main
      with:
        github-token: ${{ inputs.github-token }}
        target-repository: ${{ inputs.target-repository }}
        target-sha: ${{ inputs.target-sha }}
        build-version: ${{ inputs.build-version }}
        assets: ${{ inputs.assets }}
        title-prefix: ${{ inputs.title-prefix }}
        asset-name-mode: ${{ inputs.asset-name-mode }}
        notes-file: ${{ inputs.notes-file }}
        tag-prefix: ${{ inputs.tag-prefix }}
        prerelease: ${{ inputs.prerelease }}
        make-latest: ${{ inputs.make-latest }}
        migrate-legacy-build-releases: ${{ inputs.migrate-legacy-build-releases }}
