name: HereLiesAz version contract
description: Resolve and persist the canonical major.minor.patch.build version before a compilation.
inputs:
  target_repository:
    description: owner/repository being compiled
    required: true
  target_sha:
    description: source commit being compiled
    required: true
  target_ref_name:
    description: source ref name
    required: false
    default: ""
  target_ref_type:
    description: source ref type
    required: false
    default: ""
  token:
    description: token with write access to the target repository
    required: true
  trigger_id:
    description: triggering event (webhook delivery); runs sharing one reuse one version
    required: false
    default: ""
outputs:
  version:
    value: ${{ steps.version.outputs.version }}
  major:
    value: ${{ steps.version.outputs.major }}
  minor:
    value: ${{ steps.version.outputs.minor }}
  patch:
    value: ${{ steps.version.outputs.patch }}
  build:
    value: ${{ steps.version.outputs.build }}
  bump:
    value: ${{ steps.version.outputs.bump }}
  android_version_code:
    value: ${{ steps.version.outputs.android_version_code }}
runs:
  using: composite
  steps:
    - name: Apply major.minor.patch.build contract
      id: version
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        # Every input goes through the environment, never into the script text: a branch name
        # may contain $( ), backticks and quotes.
        TARGET_REPOSITORY: ${{ inputs.target_repository }}
        TARGET_SHA: ${{ inputs.target_sha }}
        TARGET_REF_NAME: ${{ inputs.target_ref_name }}
        TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
        TRIGGER_ID: ${{ inputs.trigger_id }}
      run: |
        set -euo pipefail
        python "$GITHUB_ACTION_PATH/../../../scripts/version_contract.py" \
          --repository "$TARGET_REPOSITORY" \
          --target-sha "$TARGET_SHA" \
          --ref-name "$TARGET_REF_NAME" \
          --ref-type "$TARGET_REF_TYPE" \
          --workspace "$GITHUB_WORKSPACE" \
          --trigger-id "$TRIGGER_ID"
