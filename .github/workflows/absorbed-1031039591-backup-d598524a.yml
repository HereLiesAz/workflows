        run: "set -euo pipefail\npayload=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg details \"$DETAILS_URL\" '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$details,output:{title:$name,summary:\"Running centrally in HereLiesAz/workflows.\"}}')\"\nresponse=\"$(gh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$payload\")\"\necho \"check_id=$(jq -r '.id' <<<\"$response\")\" >> \"$GITHUB_OUTPUT\""
  surgical-extraction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ github.token }}
          persist-credentials: false
      - name: Generate Surgical Context
        shell: bash
        run: "TIMESTAMP=$(date +'%Y%m%d_%H%M%S')\nOUTFILE=\"project_backup_surgical_${TIMESTAMP}.txt\"\nMANIFEST=\"skipped_files.tmp\"\n\n# --- CONFIGURATION ---\n\n# 1. TRASH (Dead to us. Never listed, never read.)\nTRASH_DIRS=\"build out bin obj .gradle .idea .vscode .git node_modules captures captured .cxx generated build_test libs venv __pycache__ .dart_tool .next .nuxt dist site-packages .pytest_cache\"\nTRASH_FILES=\"package-lock.json yarn.lock local.properties .DS_Store Thumbs.db\"\n\n# 2. WHITELIST (We read the content of these.)\nEXTENSIONS=(\n    # JVM / Android\n    \"kt\" \"kts\" \"java\" \"xml\" \"gradle\" \"properties\" \"pro\" \"toml\"\n    \n    # NDK / Native\n    \"cpp\" \"c\" \"cc\" \"h\" \"hpp\" \"ld\" \"S\" \"cmake\" \"in\"\n    \n    # Web (JS/TS/Frameworks)\n    \"js\" \"jsx\" \"ts\" \"tsx\" \"html\" \"css\" \"vue\" \"svelte\" \"json\"\n    \n    # Flutter / Dart\n    \"dart\" \"arb\"\n    \n    # Python\n    \"py\" \"ipynb\" \"ini\" \"cfg\"\n    \n    # Config / Data / Docs (UPDATED)\n    \"yaml\" \"yml\" \"sql\" \"env\"\n    \"md\" \"markdown\" \"rst\" \"adoc\" \"txt\"\n)\n\n# Specific critical filenames\nCRITICAL_FILES=(\"CMakeLists.txt\" \"Android.mk\" \"Application.mk\" \"Makefile\" \"Dockerfile\" \"docker-compose.yml\" \"requirements.txt\" \"Gemfile\" \"Rakefile\" \"LICENSE\" \"README\")\n\necho -e \"\\033[36m[+] Starting Universal Surgical Extraction...\\033[0m\"\n\n# Helper: Check for binary content\nis_binary() {\n    if head -c 512 \"$1\" | grep -qP '\\x00'; then return 0; else return 1; fi\n}\n\n# 1. FIND ALL \"ALIVE\" FILES (Everything except Trash Dirs)\nif [ -d \".git\" ]; then\n    # Git is smarter about ignoring trash, so we use it if possible\n    FILES=$(git ls-files -c -o --exclude-standard)\nelse\n    FILES=$(find . -type f)\nfi\n\ntouch \"$OUTFILE\"\ntouch \"$MANIFEST\"\n\necho \"$FILES\" > filelist.tmp\n\nwhile IFS= read -r file; do\n    # A. TRASH FILTER (Double Check)\n    SKIP=0\n    for trash in $TRASH_DIRS; do\n        if [[ \"$file\" == *\"/$trash/\"* ]] || [[ \"$file\" == \"$trash/\"* ]] || [[ \"$file\" == *\"/$trash\" ]]; then\n            SKIP=1; break\n        fi\n    done\n    basename=$(basename \"$file\")\n    for trash in $TRASH_FILES; do\n        if [[ \"$basename\" == \"$trash\" ]]; then SKIP=1; break; fi\n    done\n    if [[ \"$SKIP\" -eq 1 ]]; then continue; fi\n\n    # B. WHITELIST CHECK\n    IS_WHITELISTED=0\n    ext=\"${file##*.}\"\n    \n    # Check extension\n    for valid_ext in \"${EXTENSIONS[@]}\"; do\n        if [[ \"$ext\" == \"$valid_ext\" ]]; then IS_WHITELISTED=1; break; fi\n    done\n    \n    # Check filename\n    if [[ \"$IS_WHITELISTED\" -eq 0 ]]; then\n        for valid_name in \"${CRITICAL_FILES[@]}\"; do\n            if [[ \"$basename\" == \"$valid_name\" ]]; then IS_WHITELISTED=1; break; fi\n        done\n    fi\n\n    # C. ACTION\n    if [[ \"$IS_WHITELISTED\" -eq 1 ]]; then\n        # It's on the list. Add CONTENT.\n        echo \">>> $file\" >> \"$OUTFILE\"\n        if is_binary \"$file\"; then\n            echo \"[BINARY CONTENT REDACTED]\" >> \"$OUTFILE\"\n        else\n            cat \"$file\" >> \"$OUTFILE\" 2>>/dev/null || echo \"[READ ERROR]\" >> \"$OUTFILE\"\n        fi\n        echo -e \"\\n\\n\" >> \"$OUTFILE\"\n    else\n        # It's not trash, but not whitelisted. Add to MANIFEST.\n        echo \"$file\" >> \"$MANIFEST\"\n    fi\n\ndone < filelist.tmp\nrm filelist.tmp\n\n# D. APPEND MANIFEST\necho -e \"\\n\\n==================================================================\" >> \"$OUTFILE\"\necho \"       SKIPPED FILES REPORT (The Grey Zone)\" >> \"$OUTFILE\"\necho \"       (Files present in repo but extensions not whitelisted)\" >> \"$OUTFILE\"\necho \"==================================================================\" >> \"$OUTFILE\"\n\nif [ -s \"$MANIFEST\" ]; then\n    cat \"$MANIFEST\" >> \"$OUTFILE\"\nelse\n    echo \"(None)\" >> \"$OUTFILE\"\nfi\nrm \"$MANIFEST\"\n\n# STATS\nSIZE_KB=$(du -k \"$OUTFILE\" | cut -f1)\necho -e \"\\033[32m[+] Final Payload Size: ${SIZE_KB} KB\\033[0m\"\necho \"BACKUP_FILE=$OUTFILE\" >>
          $GITHUB_ENV\n"
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: surgical-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 1
    needs: __central_check_start
  __central_check_finish:
    if: ${{ always() }}
    needs:
      - __central_check_start
      - surgical-extraction
    runs-on: ubuntu-latest
    steps:
      - name: Complete target check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_ID: ${{ needs.__central_check_start.outputs.check_id }}
          CHECK_NAME: Context Backup (Universal Surgical)
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\n[[ -n \"${CHECK_ID:-}\" ]] || exit 0\nif [[ \"$FAILED\" == \"true\" ]]; then conclusion=\"failure\"; summary=\"Central workflow failed. Open the linked run for details.\"; else conclusion=\"success\"; summary=\"Central workflow completed successfully.\"; fi\npayload=\"$(jq -n --arg conclusion \"$conclusion\" --arg title \"$CHECK_NAME\" --arg summary \"$summary\" --arg details \"$DETAILS_URL\" '{status:\"completed\",conclusion:$conclusion,details_url:$details,output:{title:$title,summary:$summary}}')\"\ngh api --method PATCH \"repos/${TARGET_REPOSITORY}/check-runs/${CHECK_ID}\" --input - <<<\"$payload\""
