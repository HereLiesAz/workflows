        run: "set -euo pipefail\npayload=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg details \"$DETAILS_URL\" '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$details,output:{title:$name,summary:\"Running centrally in HereLiesAz/workflows.\"}}')\"\nresponse=\"$(gh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$payload\")\"\necho \"check_id=$(jq -r '.id' <<<\"$response\")\" >> \"$GITHUB_OUTPUT\""
  dispatch:
    if: "${{ ((\n  fromJSON(inputs.target_event_json)_name == 'pull_request' &&\n  fromJSON(inputs.target_event_json).pull_request.head.repo.fork == false\n) || (\n  fromJSON(inputs.target_event_json)_name == 'issues' &&\n  contains(fromJSON('[\"opened\", \"reopened\"]'), fromJSON(inputs.target_event_json).action)\n) || (\n  fromJSON(inputs.target_event_json).sender.type == 'User' &&\n  startsWith(fromJSON(inputs.target_event_json).comment.body || fromJSON(inputs.target_event_json).review.body || fromJSON(inputs.target_event_json).issue.body, '@jules') &&\n  contains(fromJSON('[\"OWNER\", \"MEMBER\", \"COLLABORATOR\"]'), fromJSON(inputs.target_event_json).comment.author_association || fromJSON(inputs.target_event_json).review.author_association || fromJSON(inputs.target_event_json).issue.author_association)\n)) && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
