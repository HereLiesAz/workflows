      additional_context: ${{ steps.extract_command.outputs.additional_context }}
      issue_number: ${{ fromJSON(inputs.target_event_json).pull_request.number || fromJSON(inputs.target_event_json).issue.number }}
    steps:
      - name: Extract command
        id: extract_command
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          EVENT_TYPE: ${{ fromJSON(inputs.target_event_json)_name }}.${{ fromJSON(inputs.target_event_json).action }}
          REQUEST: ${{ fromJSON(inputs.target_event_json).comment.body || fromJSON(inputs.target_event_json).review.body || fromJSON(inputs.target_event_json).issue.body }}
        with:
          script: "const eventType = process.env.EVENT_TYPE;\nconst request = process.env.REQUEST || '';\nif (eventType === 'pull_request.opened') {\n  core.setOutput('command', 'review');\n} else if (['issues.opened', 'issues.reopened'].includes(eventType)) {\n  core.setOutput('command', 'triage');\n} else if (request.startsWith('@jules /review')) {\n  core.setOutput('command', 'review');\n  core.setOutput('additional_context', request.replace(/^@jules \\/review/, '').trim());\n} else if (request.startsWith('@jules /triage')) {\n  core.setOutput('command', 'triage');\n} else if (request.startsWith('@jules')) {\n  core.setOutput('command', 'invoke');\n  core.setOutput('additional_context', request.replace(/^@jules/, '').trim());\n} else {\n  core.setOutput('command', 'fallthrough');\n}\n"
      - name: Acknowledge request
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GH_TOKEN }}
          ISSUE_NUMBER: ${{ fromJSON(inputs.target_event_json).pull_request.number || fromJSON(inputs.target_event_json).issue.number }}
          REPOSITORY: ${{ inputs.target_repository }}
        run: "gh issue comment \"${ISSUE_NUMBER}\" \\\n  --body \"🤖 Hi @${{ inputs.target_actor }}, Jules is on it. Track progress in [the logs](${{ github.server_url }}/${{ inputs.target_repository }}/actions/runs/${{ inputs.target_run_id }}).\" \\\n  --repo \"${REPOSITORY}\""
    needs: __central_check_start
  review__review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Invoke Jules for PR review
        uses: google-labs-code/jules-invoke@v1.0.0
        with:
          prompt: "Please review pull request #${{ fromJSON(inputs.target_event_json).pull_request.number || fromJSON(inputs.target_event_json).issue.number }} in ${{ inputs.target_repository }}.\n\n**Title:** ${{ fromJSON(inputs.target_event_json).pull_request.title || fromJSON(inputs.target_event_json).issue.title }}\n\n**Description:**\n${{ fromJSON(inputs.target_event_json).pull_request.body || fromJSON(inputs.target_event_json).issue.body }}\n\n${{ (needs.dispatch.outputs.additional_context) && format('**Additional context from requester:** {0}', (needs.dispatch.outputs.additional_context)) || '' }}\n\nReview the diff for:\n- Correctness bugs and logic errors\n- Security issues (injection, permission leaks, unvalidated input at boundaries)\n- Performance regressions\n- Opportunities for simplification or reuse\n\nPost your findings as a review comment on the PR. If you find fixable issues, open a follow-up PR with the corrections rather than blocking the review."
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          include_last_commit: true
          include_commit_log: true
    if: ${{ (${{ needs.dispatch.outputs.command == 'review' }}) && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}
    needs:
      - __central_check_start
      - dispatch
    concurrency:
      group: ${{ inputs.target_workflow_name }}-review-${{ fromJSON(inputs.target_event_json)_name }}-${{ fromJSON(inputs.target_event_json).pull_request.number || fromJSON(inputs.target_event_json).issue.number }}
      cancel-in-progress: true
  triage__triage:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      available_labels: ${{ steps.get_labels.outputs.available_labels }}
    steps:
      - name: Get repository labels
        id: get_labels
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: "const labels = [];\nfor await (const response of github.paginate.iterator(github.rest.issues.listLabelsForRepo, {\n  owner: context.repo.owner,\n  repo: context.repo.repo,\n  per_page: 100,\n})) {\n  labels.push(...response.data);\n}\nif (!labels || labels.length === 0) {\n  core.setFailed('No issue labels found in this repository.')\n}\nconst labelNames = labels.map(label => label.name).sort();\ncore.setOutput('available_labels', labelNames.join(','));\ncore.info(`Found ${labelNames.length} labels: ${labelNames.join(', ')}`);"
      - name: Invoke Jules for issue triage
        if: ${{ steps.get_labels.outputs.available_labels != '' }}
        uses: google-labs-code/jules-invoke@v1.0.0
        with:
          prompt: "Triage the following GitHub issue and apply the most appropriate labels from the available set.\n\n**Issue #${{ fromJSON(inputs.target_event_json).issue.number }}: ${{ fromJSON(inputs.target_event_json).issue.title }}**\n\n${{ fromJSON(inputs.target_event_json).issue.body }}\n\n**Available labels (comma-separated):**\n${{ steps.get_labels.outputs.available_labels }}\n\n${{ (needs.dispatch.outputs.additional_context) && format('**Additional context:** {0}', (needs.dispatch.outputs.additional_context)) || '' }}\n\nApply labels to issue #${{ fromJSON(inputs.target_event_json).issue.number }} in ${{ inputs.target_repository }} using only labels from the available set above. Do not invent new labels. If the issue provides insufficient information to pick a label confidently, apply \"status/needs-triage\" if it exists, otherwise leave it unlabeled."
          jules_api_key: ${{ secrets.JULES_API_KEY }}
    if: ${{ (${{ needs.dispatch.outputs.command == 'triage' }}) && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}
    needs:
      - __central_check_start
      - dispatch
    concurrency:
      group: ${{ inputs.target_workflow_name }}-triage-${{ fromJSON(inputs.target_event_json)_name }}-${{ fromJSON(inputs.target_event_json).issue.number }}
      cancel-in-progress: true
  invoke__invoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Invoke Jules
        uses: google-labs-code/jules-invoke@v1.0.0
        with:
          prompt: "${{ (needs.dispatch.outputs.additional_context) || fromJSON(inputs.target_inputs_json).prompt }}\n\nRepository: ${{ inputs.target_repository }}\nTriggered by: @${{ inputs.target_actor }}\nIssue/PR: #${{ fromJSON(inputs.target_event_json).pull_request.number || fromJSON(inputs.target_event_json).issue.number }}"
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          include_last_commit: true
    if: ${{ (${{ needs.dispatch.outputs.command == 'invoke' }}) && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}
    needs:
      - __central_check_start
      - dispatch
    concurrency:
      group: ${{ inputs.target_workflow_name }}-invoke-${{ fromJSON(inputs.target_event_json)_name }}-${{ fromJSON(inputs.target_event_json).pull_request.number || fromJSON(inputs.target_event_json).issue.number }}
      cancel-in-progress: false
  fallthrough:
    needs:
      - __central_check_start
      - dispatch
      - review__review
      - triage__triage
      - invoke__invoke
    if: ${{ (always() && !cancelled() && (failure() || needs.dispatch.outputs.command == 'fallthrough')) && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
