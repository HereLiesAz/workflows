      - name: Run live runtime lifecycle verification
        run: "./gradlew \\\n  :providers:llm:desktopTest \\\n  --tests com.hereliesaz.geministrator.providers.llm.ProviderNeutralLiveRuntimeVerificationTest \\\n  --no-daemon \\\n  --stacktrace\n"
      - name: Print live verification report on failure
        if: failure()
        shell: bash
        run: "find providers/llm/build/test-results -type f -name '*.xml' -print -exec cat {} \\; || true\n"
    needs: central_check_start
