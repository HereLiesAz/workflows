  verify-live-runtime:
    if: ${{ (inputs.target_event_name == 'workflow_dispatch' || (inputs.target_event_name == 'pull_request' && fromJSON(inputs.target_event_json).pull_request.head.repo.full_name == inputs.target_repository && fromJSON(inputs.target_event_json).pull_request.head.ref == 'acceptance/live-runtime-verification')) && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIVE_LIVE_RUNTIME_VERIFICATION: '1'
      AIVE_LIVE_PROVIDER: ${{ fromJSON(inputs.target_inputs_json).provider }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Check out pinned h2g2
        uses: actions/checkout@v7
        with:
          repository: HereLiesAz/conveyance-h2g2
          ref: 8566a9db02d533d9534327df40424ee7b88ebe88
          path: vendor/conveyance-h2g2
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Check out pinned Conveyance
        uses: actions/checkout@v7
        with:
          repository: HereLiesAz/Conveyance
          ref: b3e13674df9dfbcc0b35f800b57d78a305d07b03
          path: vendor/conveyance-h2g2/vendor/Conveyance
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Select or bootstrap live provider
        shell: bash
        run: "set -euo pipefail\n\nrequested=\"${AIVE_LIVE_PROVIDER:-}\"\nuse_ollama=false\n\nif [ -n \"$requested\" ] && [ \"$requested\" != \"ollama\" ]; then\n  case \"$requested\" in\n    openai) required=\"${OPENAI_API_KEY:-}\" ;;\n    anthropic) required=\"${ANTHROPIC_API_KEY:-}\" ;;\n    gemini) required=\"${GEMINI_API_KEY:-}\" ;;\n    xai) required=\"${XAI_API_KEY:-}\" ;;\n    *)\n      echo \"::error::AIVE_LIVE_PROVIDER must be one of: openai, anthropic, gemini, xai, ollama\"\n      exit 1\n      ;;\n  esac\n  test -n \"$required\" || {\n    echo \"::error::The requested provider '$requested' has no configured credential.\"\n    exit 1\n  }\nelif [ \"$requested\" = \"ollama\" ]; then\n  use_ollama=true\nelif [ -z \"${OPENAI_API_KEY:-}\" ] && [ -z \"${ANTHROPIC_API_KEY:-}\" ] && [ -z \"${GEMINI_API_KEY:-}\" ] && [ -z \"${XAI_API_KEY:-}\" ]; then\n  use_ollama=true\nfi\n\nif [ \"$use_ollama\" = true ]; then\n  echo \"No hosted-provider credential selected; bootstrapping real local Ollama inference.\"\n  curl -fsSL https://ollama.com/install.sh | sh\n  nohup env OLLAMA_HOST=127.0.0.1:11434 ollama serve >\"${RUNNER_TEMP}/ollama.log\" 2>&1 &\n  for attempt in $(seq 1 60); do\n    if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then\n      break\n    fi\n    if [ \"$attempt\" -eq 60 ]; then\n      cat \"${RUNNER_TEMP}/ollama.log\" || true\n      echo \"::error::Ollama did not become ready.\"\n      exit 1\n    fi\n    sleep 1\n  done\n  ollama pull smollm2:135m-instruct-q2_K\n\n  echo \"AIVE_LIVE_PROVIDER=ollama\" >> \"$GITHUB_ENV\"\n  echo \"AIVE_LIVE_OLLAMA_BASE_URL=http://127.0.0.1:11434/v1\" >> \"$GITHUB_ENV\"\n  echo \"AIVE_LIVE_OLLAMA_MODEL=smollm2:135m-instruct-q2_K\" >> \"$GITHUB_ENV\"\n\n  response=\"$(curl -fsS http://127.0.0.1:11434/v1/chat/completions \\\n    -H 'Content-Type: application/json' \\\n    -d '{\"model\":\"smollm2:135m-instruct-q2_K\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with OK.\"}],\"stream\":false}')\"\n  python - \"$response\" <<'PY'\nimport json\nimport sys\n\npayload = json.loads(sys.argv[1])\ntext = payload[\"choices\"][0][\"message\"][\"content\"].strip()\nif not text:\n    raise SystemExit(\"Ollama smoke response contained no assistant text\")\nprint(\"Ollama live provider ready:\", text[:120])\nPY\nfi\n"
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
