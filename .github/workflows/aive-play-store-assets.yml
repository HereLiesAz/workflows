      - name: Capture real production UI
        shell: bash
        run: "set -euo pipefail\npython3 -m http.server 8080 --directory build/play-store-site > /tmp/aive-store-assets-wasm-http.log 2>&1 &\nWASM_SERVER_PID=$!\npython3 -m http.server 8081 --directory build/play-store-js-site > /tmp/aive-store-assets-js-http.log 2>&1 &\nJS_SERVER_PID=$!\ntrap 'kill \"$WASM_SERVER_PID\" \"$JS_SERVER_PID\" 2>/dev/null || true' EXIT\n\nfor port in 8080 8081; do\n  for attempt in $(seq 1 30); do\n    if curl --fail --silent \"http://127.0.0.1:$port/\" >/dev/null; then\n      break\n    fi\n    sleep 1\n  done\n  curl --fail --silent \"http://127.0.0.1:$port/\" >/dev/null\ndone\n\ncat > build/capture-store-assets.mjs <<'JS'\nimport { chromium } from 'playwright';\n\nconst browser = await chromium.launch({\n  headless: true,\n  args: ['--enable-unsafe-swiftshader'],\n});\n\nasync function capture(name, url, width, height, terrarium = false) {\n  const page = await browser.newPage({ viewport: { width, height }, deviceScaleFactor: 1 });\n  const diagnostics = [];\n  page.on('console', message => diagnostics.push(`[console:${message.type()}] ${message.text()}`));\n  page.on('pageerror', error => diagnostics.push(`[pageerror] ${error.stack || error.message}`));\n  try {\n    await page.goto(url, { waitUntil: 'domcontentloaded' });\n    if (terrarium) {\n      await page.waitForFunction(() => {\n        if (globalThis.__haiveStartupError) throw new Error(globalThis.__haiveStartupError);\n        return globalThis.__haiveNodeCreaturesReady === true &&\n          globalThis.__haiveAppScriptLoaded === true;\n      }, null, { timeout: 15000 });\n    }\n    await page.waitForSelector('#webApp > *', { timeout: 15000 });\n    await page.waitForTimeout(1800);\n    await page.screenshot({\n      path: `build/play-store-captures/${name}.png`,\n      fullPage: false,\n    });\n  } catch (error) {\n    console.error(`${name}: ${error.stack || error}`);\n    diagnostics.forEach(entry => console.error(entry));\n    throw error;\n  } finally {\n    await page.close();\n  }\n}\n\nasync function smoke(url) {\n  const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });\n  try {\n    await page.goto(url, { waitUntil: 'domcontentloaded' });\n    await page.waitForSelector('#webApp > *', { timeout: 15000 });\n    await page.waitForTimeout(500);\n  } finally {\n    await page.close();\n  }\n}\n\ntry {\n  await smoke('http://127.0.0.1:8081/');\n  await capture('overview-portrait', 'http://127.0.0.1:8080/', 1080, 1920, false);\n  await capture('terrarium-portrait', 'http://127.0.0.1:8080/?terrariumPreview=1', 1080, 1920, true);\n  await capture('overview-landscape', 'http://127.0.0.1:8080/', 1920, 1080, false);\n  await capture('terrarium-landscape', 'http://127.0.0.1:8080/?terrariumPreview=1', 1920, 1080, true);\n} finally {\n  await browser.close();\n}\nJS\n\nnode build/capture-store-assets.mjs\n"
