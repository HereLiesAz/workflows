  wasm-screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Rust renderer toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish pinned Conveyance for isolated WASM build
        run: "./gradlew -p vendor/conveyance-h2g2/vendor/Conveyance \\\n  :conveyance-core:publishToMavenLocal \\\n  :conveyance-compose:publishToMavenLocal\n"
      - name: Publish pinned H2G2 for isolated WASM build
        run: ./gradlew -p vendor/conveyance-h2g2 publishToMavenLocal
      - name: Build production WASM terrarium
        run: ./gradlew -Phaive.useLocalH2g2=false -Phaive.useMavenLocalH2g2=true :webApp:wasmJsBrowserProductionWebpack
      - name: Stage WASM visual proof
        shell: bash
        run: "set -euo pipefail\nWASM_BUNDLE=\"$(find webApp/build -type f -path '*/wasmJs/productionExecutable/haive.js' -print -quit)\"\nif [ -z \"$WASM_BUNDLE\" ]; then\n  echo \"::error::WASM production bundle was not found\"\n  find webApp/build -type f -name 'haive.js' -print\n  exit 1\nfi\nWASM_DIR=\"$(dirname \"$WASM_BUNDLE\")\"\nrm -rf webApp/build/terrarium-proof\nmkdir -p webApp/build/terrarium-proof\ncp -R \"$WASM_DIR\"/. webApp/build/terrarium-proof/\ncp -R webApp/src/webMain/resources/. webApp/build/terrarium-proof/\ntest -f webApp/build/terrarium-proof/index.html\ntest -f webApp/build/terrarium-proof/haive.js\ntest -f webApp/build/terrarium-proof/node-creatures.js\ntest -f webApp/build/terrarium-proof/haive_node_creatures.wasm\n"
      - name: Install Chromium for visual proof
        shell: bash
        run: "npm install --no-save --package-lock=false playwright@1.55.0\nnpx playwright install --with-deps chromium\n"
      - name: Capture and verify real Rust-rendered terrarium
        shell: bash
        run: "set -euo pipefail\npython3 -m http.server 8080 --directory webApp/build/terrarium-proof > /tmp/haive-terrarium-http.log 2>&1 &\nSERVER_PID=$!\ntrap 'kill \"$SERVER_PID\" 2>/dev/null || true' EXIT\nfor attempt in $(seq 1 30); do\n  if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then\n    break\n  fi\n  sleep 1\ndone\nfor asset in haive.js node-creatures.js haive_node_creatures.wasm; do\n  curl --fail --silent --output /dev/null \"http://127.0.0.1:8080/$asset\"\ndone\n\nmkdir -p visual-proof\ncat > visual-proof/haive-terrarium-proof.mjs <<'JS'\nimport { chromium } from 'playwright';\n\nconst browser = await chromium.launch({\n  headless: true,\n  args: ['--enable-unsafe-swiftshader'],\n});\nconst page = await browser.newPage({ viewport: { width: 1440, height: 900 } });\nconst diagnostics = [];\npage.on('console', message => diagnostics.push(`[console:${message.type()}] ${message.text()}`));\npage.on('pageerror', error => diagnostics.push(`[pageerror] ${error.stack || error.message}`));\npage.on('requestfailed', request => diagnostics.push(`[requestfailed] ${request.url()} :: ${request.failure()?.errorText || 'unknown'}`));\n\ntry {\n  await page.goto('http://127.0.0.1:8080/?terrariumPreview=1', { waitUntil: 'domcontentloaded' });\n  await page.waitForFunction(() => {\n    if (globalThis.__haiveStartupError) throw new Error(globalThis.__haiveStartupError);\n    return globalThis.__haiveNodeCreaturesReady === true &&\n      globalThis.__haiveAppScriptLoaded === true;\n  }, null, { timeout: 15000 });\n  await page.waitForSelector('#webApp > *', { timeout: 15000 });\n  await page.waitForTimeout(1800);\n\n  const state = await page.evaluate(() => ({\n    rustReady: globalThis.HaiveNodeCreatures?.ready === true,\n    bridgeReady: globalThis.__haiveNodeCreaturesReady === true,\n    appScriptLoaded: globalThis.__haiveAppScriptLoaded === true,\n    startupError: globalThis.__haiveStartupError || null,\n    browserLocale: globalThis.__haiveBrowserLocale || null,\n    navigatorLanguage: navigator.language || null,\n    canvases: document.querySelectorAll('#webApp canvas').length,\n    appChildren: document.getElementById('webApp')?.childNodes.length || 0,\n  }));\n  console.log('Browser state:', JSON.stringify(state));\n  if (!state.rustReady || !state.bridgeReady || !state.appScriptLoaded || state.startupError ||\n      !state.browserLocale || state.browserLocale !== state.navigatorLanguage || state.appChildren < 1) {\n    throw new Error(`Terrarium did not reach a Rust-rendered ready state: ${JSON.stringify(state)}`);\n  }\n\n  await page.screenshot({ path: 'visual-proof/haive-terrarium-wasm.png' });\n} catch (error) {\n  console.error(error.stack || error);\n  console.error('=== Browser diagnostics ===');\n  for (const entry of diagnostics) console.error(entry);\n  console.error('=== DOM ===');\n  console.error(await page.content());\n  process.exitCode = 1;\n} finally {\n  await browser.close();\n}\nJS\n\nif ! node visual-proof/haive-terrarium-proof.mjs; then\n  echo \"=== HTTP server log ===\"\n  cat /tmp/haive-terrarium-http.log || true\n  echo \"=== Staged files ===\"\n  find webApp/build/terrarium-proof -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort || true\n  exit 1\nfi\n\ntest -s visual-proof/haive-terrarium-wasm.png\npython3 -m pip install --quiet pillow\npython3 - <<'PY'\nfrom PIL import Image\nfrom collections import Counter\n\nimage = Image.open(\"visual-proof/haive-terrarium-wasm.png\").convert(\"RGB\")\ncolors = Counter(image.getdata())\nbackground = (18, 18, 18)\nnon_background = image.width * image.height - colors.get(background, 0)\ndistinct = len(colors)\nprint(f\"Visual proof: {image.width}x{image.height}, {distinct} colors, {non_background} non-background pixels\")\nif distinct < 8 or non_background < 10000:\n    raise SystemExit(\n        f\"Terrarium visual proof is effectively blank: {distinct} colors, \"\n        f\"{non_background} non-background pixels\"\n    )\nPY\n"
      - name: Upload terrarium screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: haive-terrarium-wasm-proof
          path: visual-proof/haive-terrarium-wasm.png
