  v_68abd6bac3e63f20__build_and_test:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ inputs.target_ref != 'refs/heads/main' }}
      - name: Synthesise a placeholder google-services.json
        run: "sed -e 's/{{PROJECT_NUMBER}}/000000000000/' \\\n    -e 's/{{PROJECT_ID}}/lexorcist-ci/' \\\n    -e 's/{{APP_ID}}/1:000000000000:android:0000000000000000000000/' \\\n    -e 's/{{CLIENT_ID}}/000000000000-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.apps.googleusercontent.com/' \\\n    -e 's/{{GOOGLE_SERVICES_API_KEY}}/AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA/' \\\n    app/google-services.template.json > app/google-services.json\n"
      - name: Validate the version catalog and project layout
        run: ./gradlew projects --no-daemon
      - name: Compile
        run: ./gradlew :shared:assemble :app:compileDebugKotlin --no-daemon
      - name: Test
        run: ./gradlew :shared:allTests :app:testDebugUnitTest --no-daemon
      - name: Assemble a debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Shrink the release build
        run: ./gradlew :app:minifyReleaseWithR8 --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "app/build/reports/tests/\napp/build/test-results/\nshared/build/reports/tests/\nshared/build/test-results/\n"
          if-no-files-found: ignore
          retention-days: 7
    needs: v_68abd6bac3e63f20__central_check_start
