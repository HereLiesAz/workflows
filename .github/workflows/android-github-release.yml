# Generalized purpose workflow: Android GitHub Release.
# Signing, project configuration, and test differences are profiles instead of duplicate workflows.
# Generated for HereLiesAz/AzNavRail:.github/workflows/android-release-apk.yml.
# Edit the registered source or synchronizer, not this compiled workflow.
name: Android GitHub Release
run-name: ${{ inputs.target_repository_name }} · Android GitHub Release
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
      target_repository_name:
        required: true
        type: string
      purpose_profile_json:
        required: false
        type: string
        default: '{}'
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
  version_contract:
    needs: central_check_start
    uses: ./.github/workflows/version-contract.yml
    with:
      target_repository: ${{ inputs.target_repository }}
      target_sha: ${{ inputs.target_sha }}
      target_ref_name: ${{ inputs.target_ref_name }}
      target_ref_type: ${{ inputs.target_ref_type }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  build_and_release:
    needs: version_contract
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: ${{ inputs.target_repository_name }}
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      VERSION: ${{ needs.version_contract.outputs.version }}
      VERSION_MAJOR: ${{ needs.version_contract.outputs.major }}
      VERSION_MINOR: ${{ needs.version_contract.outputs.minor }}
      VERSION_PATCH: ${{ needs.version_contract.outputs.patch }}
      VERSION_BUILD: ${{ needs.version_contract.outputs.build }}
      ANDROID_VERSION_CODE: ${{ needs.version_contract.outputs.android_version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Apply canonical version to checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("version.properties")
          lines = path.read_text(encoding="utf-8").splitlines() if path.exists() else []
          values = {
              "versionMajor": os.environ["VERSION_MAJOR"],
              "versionMinor": os.environ["VERSION_MINOR"],
              "versionPatch": os.environ["VERSION_PATCH"],
              "versionBuild": os.environ["VERSION_BUILD"],
          }
          aliases = {
              "MAJOR": values["versionMajor"], "VERSION_MAJOR": values["versionMajor"],
              "MINOR": values["versionMinor"], "VERSION_MINOR": values["versionMinor"],
              "PATCH": values["versionPatch"], "VERSION_PATCH": values["versionPatch"],
              "BUILD": values["versionBuild"], "BUILD_NUMBER": values["versionBuild"], "VERSION_BUILD": values["versionBuild"],
          }
          seen = set()
          out = []
          for line in lines:
              stripped = line.strip()
              if "=" not in stripped or stripped.startswith("#"):
                  out.append(line)
                  continue
              key = stripped.split("=", 1)[0].strip()
              if key in values:
                  out.append(f"{key}={values[key]}")
                  seen.add(key)
              elif key in aliases:
                  out.append(f"{key}={aliases[key]}")
              else:
                  out.append(line)
          prefix = [f"{key}={values[key]}" for key in values if key not in seen]
          if prefix and out and out[0].strip():
              prefix.append("")
          path.write_text("\n".join(prefix + out).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Resolve release profile
        id: release_profile
        env:
          PROFILE_JSON: ${{ inputs.purpose_profile_json }}
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_JSON="$(jq -c 'if type == "string" then fromjson else . end' <<<"$PROFILE_JSON")"
          jq -e 'type == "object"' >/dev/null <<<"$PROFILE_JSON" || {
            echo "::error::Android release purpose_profile_json must decode to a JSON object." >&2
            exit 1
          }
          {
            echo "SIGNING_MODE=$(jq -r '.signing // "raw-jks"' <<<"$PROFILE_JSON")"
            echo "CHAIN_SECRET=$(jq -r '.chain_secret // "KEYSTORE_CHAIN"' <<<"$PROFILE_JSON")"
            echo "JAVA_VERSION=$(jq -r '.java_version // "21"' <<<"$PROFILE_JSON")"
            echo "INJECT_SIGNING_ARGS=$(jq -r '.inject_signing_args // false' <<<"$PROFILE_JSON")"
            echo "ARCORE_LOCAL_PROPERTIES=$(jq -r '.arcore_local_properties // false' <<<"$PROFILE_JSON")"
            echo "GOOGLE_SERVICES_MODE=$(jq -r '.google_services // "template"' <<<"$PROFILE_JSON")"
            echo "TEST_COMMAND=$(jq -r '.test_command // empty' <<<"$PROFILE_JSON")"
            echo "BUILD_COMMAND=$(jq -r '.build_command // "./gradlew assembleRelease"' <<<"$PROFILE_JSON")"
            echo "ARTIFACT_GLOB=$(jq -r '.artifact_glob // "app/build/outputs/apk/*/release/*.apk"' <<<"$PROFILE_JSON")"
            echo "MAPPING_FILE=$(jq -r '.mapping_file // empty' <<<"$PROFILE_JSON")"
            echo "PERSIST_VERSION=$(jq -r '.persist_version // true' <<<"$PROFILE_JSON")"
            echo "VERSION_MODE=$(jq -r '.version_mode // "version-properties"' <<<"$PROFILE_JSON")"
            echo "ASSET_NAME_MODE=$(jq -r '.asset_name_mode // "normalized"' <<<"$PROFILE_JSON")"
            echo "MOVE_TAG=$(jq -r '.move_tag // true' <<<"$PROFILE_JSON")"
            echo "PRERELEASE=$(jq -r '.prerelease // false' <<<"$PROFILE_JSON")"
            echo "BASE_VERSION=$(jq -r '.base_version // empty' <<<"$PROFILE_JSON")"
            echo "FIXED_TAG=$(jq -r '.fixed_tag // empty' <<<"$PROFILE_JSON")"
            echo "RELEASE_TITLE=$(jq -r '.release_title // empty' <<<"$PROFILE_JSON")"
            echo "RELEASE_NOTES_MODE=$(jq -r '.release_notes_mode // "simple"' <<<"$PROFILE_JSON")"
            echo "WRAPPER_VALIDATION=$(jq -r '.wrapper_validation // false' <<<"$PROFILE_JSON")"
            echo "KEYSTORE_OUTPUT=$(jq -r '.keystore_output // "app/keystore.jks"' <<<"$PROFILE_JSON")"
            echo "GRADLE_PROPERTIES_JSON=$(jq -c '.gradle_properties // []' <<<"$PROFILE_JSON")"
            echo "RELEASE_TITLE_STYLE=$(jq -r '.release_title_style // "simple"' <<<"$PROFILE_JSON")"
            echo "APP_NAME_OVERRIDE=$(jq -r '.app_name // empty' <<<"$PROFILE_JSON")"
          } >> "$GITHUB_ENV"
          echo "prerelease=$(jq -r '.prerelease // false' <<<"$PROFILE_JSON")" >> "$GITHUB_OUTPUT"

      - name: Inject optional project configuration
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GOOGLE_SERVICES_MODE" in
            raw)
              if [ -n "$GOOGLE_SERVICES" ]; then printf '%s' "$GOOGLE_SERVICES" > app/google-services.json; fi
              ;;
            template)
              if [ -f app/google-services.json.template ]; then
                sed -e 's/{{\([^}]*\)}}/${\1}/g' app/google-services.json.template | envsubst > app/google-services.json
              fi
              ;;
            none) ;;
            *) echo "::error::Unknown google_services mode: $GOOGLE_SERVICES_MODE" >&2; exit 1 ;;
          esac
          if [ "$ARCORE_LOCAL_PROPERTIES" = "true" ]; then
            test -n "$ARCORE_API_KEY" || { echo "::error::ARCORE_API_KEY is required by this release profile" >&2; exit 1; }
            printf 'ARCORE_API_KEY=%s\n' "$ARCORE_API_KEY" >> local.properties
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          CHAIN: ${{ secrets.CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KEYSTORE_OUTPUT")"
          case "$SIGNING_MODE" in
            raw-jks)
              test -n "$KEYSTORE_RAW" || { echo "::error::KEYSTORE_RAW is required" >&2; exit 1; }
              printf '%s' "$KEYSTORE_RAW" | base64 --decode > "$KEYSTORE_OUTPUT"
              ;;
            project)
              ;;
            pem-chain)
              chain="$KEYSTORE_CHAIN"
              [ "$CHAIN_SECRET" != "CHAIN" ] || chain="$CHAIN"
              test -n "$KEYSTORE_PRIVATE" || { echo "::error::KEYSTORE_PRIVATE is required" >&2; exit 1; }
              test -n "$chain" || { echo "::error::$CHAIN_SECRET is required" >&2; exit 1; }
              printf '%s\n' "$KEYSTORE_PRIVATE" > private-key.pem
              printf '%s\n' "$chain" > certificate-chain.crt
              # -legacy: the destination is always a legacy JKS keystore (re-imported below via
              # keytool). Without it, OpenSSL 3.x defaults to AES/PBES2 encryption for the
              # intermediate PKCS12, which keytool/AGP's bundle signer then fails to parse with
              # "Tag number over 30 is not supported".
              openssl pkcs12 -export -in certificate-chain.crt -inkey private-key.pem -out keystore.p12 -name "$KEY_ALIAS" -passout pass:"$KEYSTORE_PASSWORD" -legacy
              keytool -importkeystore -srckeystore keystore.p12 -srcstoretype PKCS12 -srcstorepass "$KEYSTORE_PASSWORD" -destkeystore "$KEYSTORE_OUTPUT" -deststoretype JKS -deststorepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -noprompt
              rm -f private-key.pem certificate-chain.crt keystore.p12
              ;;
            *)
              echo "::error::Unknown signing mode: $SIGNING_MODE" >&2
              exit 1
              ;;
          esac
          if [ "$SIGNING_MODE" != "project" ]; then
            test -s "$KEYSTORE_OUTPUT" || { echo "::error::Signing keystore is empty" >&2; exit 1; }
          fi

      - name: Validate Gradle wrapper
        if: ${{ env.WRAPPER_VALIDATION == 'true' }}
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Apply profile Gradle properties
        if: ${{ env.GRADLE_PROPERTIES_JSON != '[]' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          jq -r '.[]' <<<"$GRADLE_PROPERTIES_JSON" >> ~/.gradle/gradle.properties

      - name: Run release tests
        if: ${{ env.TEST_COMMAND != '' }}
        shell: bash
        run: bash -eo pipefail -c "$TEST_COMMAND"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/${{ env.KEYSTORE_OUTPUT }}
          KEYSTORE_PATH: ${{ github.workspace }}/${{ env.KEYSTORE_OUTPUT }}
          RUN_NUMBER: ${{ inputs.target_run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$INJECT_SIGNING_ARGS" = "true" ]; then
            bash -eo pipefail -c "$BUILD_COMMAND -Pandroid.injected.signing.store.file=\"$KEYSTORE_FILE\" -Pandroid.injected.signing.store.password=\"$KEYSTORE_PASSWORD\" -Pandroid.injected.signing.key.alias=\"$KEY_ALIAS\" -Pandroid.injected.signing.key.password=\"$KEY_PASSWORD\""
          else
            bash -eo pipefail -c "$BUILD_COMMAND"
          fi

      - name: Resolve version and artifact
        id: release
        shell: bash
        run: |
          set -euo pipefail
          MAJOR="$VERSION_MAJOR"
          MINOR="$VERSION_MINOR"
          PATCH="$VERSION_PATCH"
          BUILD="$VERSION_BUILD"
          TAG="$VERSION"
          APP_NAME="${APP_NAME_OVERRIDE:-${{ inputs.target_repository_name }}}"
          APK="$(compgen -G "$ARTIFACT_GLOB" | sort | head -1 || true)"
          test -n "$APK" && test -s "$APK" || { echo "::error::No release APK matched $ARTIFACT_GLOB" >&2; exit 1; }
          case "$ASSET_NAME_MODE" in
            preserve)
              ASSET="$APK"
              ;;
            app-v-version)
              ASSET="${APP_NAME}-v${VERSION}.apk"
              cp "$APK" "$ASSET"
              ;;
            normalized)
              ASSET="${APP_NAME}-${VERSION}-release.apk"
              cp "$APK" "$ASSET"
              ;;
            *)
              echo "::error::Unknown asset_name_mode: $ASSET_NAME_MODE" >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
      - name: Upload mapping.txt as workflow artifact
        if: ${{ env.MAPPING_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target_repository_name }}-${{ steps.release.outputs.version }}-mapping
          path: ${{ env.MAPPING_FILE }}
          if-no-files-found: error

      - name: Stage grouped release assets
        env:
          ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-files
          mkdir -p release-files
          cp "$ASSET" "release-files/$(basename "$ASSET")"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_NOTES_MODE" = "changelog" ]; then
            last_tag="$(git tag --sort=-v:refname | grep -v "^v$VERSION$" | head -n 1 || true)"
            if [ -n "$last_tag" ]; then
              {
                echo "### Changelog (since $last_tag)"
                git log "$last_tag"..HEAD --oneline --pretty=format:"* %s (%h)"
              } > grouped-release-notes.md
            else
              {
                echo "### Initial Build"
                git log --oneline --pretty=format:"* %s (%h)"
              } > grouped-release-notes.md
            fi
          else
            printf 'Release build from commit %s\n' "$(git rev-parse HEAD)" > grouped-release-notes.md
          fi

      - name: Publish patch-grouped GitHub release
        uses: HereLiesAz/workflows/.github/actions/patch-grouped-release@main
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          target-repository: ${{ inputs.target_repository }}
          target-sha: ${{ inputs.target_sha }}
          build-version: ${{ steps.release.outputs.version }}
          assets: release-files/**/*
          title-prefix: ${{ steps.release.outputs.app_name }}
          notes-file: grouped-release-notes.md
          tag-prefix: ""
          prerelease: ${{ steps.release_profile.outputs.prerelease }}
          make-latest: "true"
          migrate-legacy-build-releases: "true"

      - name: Cleanup signing material
        if: ${{ always() }}
        run: rm -f "$KEYSTORE_OUTPUT" private-key.pem certificate-chain.crt keystore.p12
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - version_contract
      - build_and_release
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
