# Generalized purpose workflow: Android Play Release.
# Flavor, signing, versioning, and track rollout differences are profiles; the publisher is centralized.
# Generated for HereLiesAz/AzNavRail:.github/workflows/android-release-aab.yml.
# Edit the registered source or synchronizer, not this compiled workflow.
name: Android Play Release
run-name: ${{ inputs.target_repository_name }} · Android Play Release
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
      target_repository_name:
        required: true
        type: string
      purpose_profile_json:
        required: false
        type: string
        default: '{}'
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
  version_contract:
    needs: central_check_start
    uses: ./.github/workflows/version-contract.yml
    with:
      target_repository: ${{ inputs.target_repository }}
      target_sha: ${{ inputs.target_sha }}
      target_ref_name: ${{ inputs.target_ref_name }}
      target_ref_type: ${{ inputs.target_ref_type }}
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  build_and_publish:
    needs: version_contract
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    environment: ${{ inputs.target_repository_name }}
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      PROFILE_JSON: ${{ inputs.purpose_profile_json }}
      VERSION: ${{ needs.version_contract.outputs.version }}
      VERSION_MAJOR: ${{ needs.version_contract.outputs.major }}
      VERSION_MINOR: ${{ needs.version_contract.outputs.minor }}
      VERSION_PATCH: ${{ needs.version_contract.outputs.patch }}
      VERSION_BUILD: ${{ needs.version_contract.outputs.build }}
      ANDROID_VERSION_CODE: ${{ needs.version_contract.outputs.android_version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Check out optional build dependency
        if: ${{ fromJSON(inputs.purpose_profile_json).extra_checkout_repository != null && fromJSON(inputs.purpose_profile_json).extra_checkout_repository != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ fromJSON(inputs.purpose_profile_json).extra_checkout_repository }}
          ref: ${{ fromJSON(inputs.purpose_profile_json).extra_checkout_ref }}
          path: ${{ fromJSON(inputs.purpose_profile_json).extra_checkout_path }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Apply canonical version to checkout
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("version.properties")
          lines = path.read_text(encoding="utf-8").splitlines() if path.exists() else []
          values = {
              "versionMajor": os.environ["VERSION_MAJOR"],
              "versionMinor": os.environ["VERSION_MINOR"],
              "versionPatch": os.environ["VERSION_PATCH"],
              "versionBuild": os.environ["VERSION_BUILD"],
          }
          aliases = {
              "MAJOR": values["versionMajor"], "VERSION_MAJOR": values["versionMajor"],
              "MINOR": values["versionMinor"], "VERSION_MINOR": values["versionMinor"],
              "PATCH": values["versionPatch"], "VERSION_PATCH": values["versionPatch"],
              "BUILD": values["versionBuild"], "BUILD_NUMBER": values["versionBuild"], "VERSION_BUILD": values["versionBuild"],
          }
          seen = set()
          out = []
          for line in lines:
              stripped = line.strip()
              if "=" not in stripped or stripped.startswith("#"):
                  out.append(line)
                  continue
              key = stripped.split("=", 1)[0].strip()
              if key in values:
                  out.append(f"{key}={values[key]}")
                  seen.add(key)
              elif key in aliases:
                  out.append(f"{key}={aliases[key]}")
              else:
                  out.append(line)
          prefix = [f"{key}={values[key]}" for key in values if key not in seen]
          if prefix and out and out[0].strip():
              prefix.append("")
          path.write_text("\n".join(prefix + out).rstrip() + "\n", encoding="utf-8")
          PY

      - name: Resolve Play profile
        env:
          PROFILE_JSON: ${{ inputs.purpose_profile_json }}
          TARGET_INPUTS_JSON: ${{ inputs.target_inputs_json }}
        shell: bash
        run: |
          set -euo pipefail
          default_tracks='[{"track":"internal","status":"completed"},{"track":"alpha","status":"draft"},{"track":"beta","status":"draft"},{"track":"production","status":"draft"}]'
          signing="$(jq -r '.signing // "raw-jks"' <<<"$PROFILE_JSON")"
          java="$(jq -r '.java_version // "21"' <<<"$PROFILE_JSON")"
          build="$(jq -r '.build_command // "./gradlew bundleRelease"' <<<"$PROFILE_JSON")"
          glob="$(jq -r '.aab_glob // "app/build/outputs/bundle/release/*.aab"' <<<"$PROFILE_JSON")"
          apk_glob="$(jq -r '.apk_glob // empty' <<<"$PROFILE_JSON")"
          signing_env_prefix="$(jq -r '.signing_env_prefix // empty' <<<"$PROFILE_JSON")"
          signing_env_style="$(jq -r '.signing_env_style // "prefix"' <<<"$PROFILE_JSON")"
          pre_build_command="$(jq -r '.pre_build_command // empty' <<<"$PROFILE_JSON")"
          built_release_on_tag="$(jq -r '.github_built_release_on_tag // false' <<<"$PROFILE_JSON")"
          built_release_always="$(jq -r '.github_built_release_always // false' <<<"$PROFILE_JSON")"
          built_release_tag_env="$(jq -r '.github_built_release_tag_env // empty' <<<"$PROFILE_JSON")"
          built_release_include_aab="$(jq -r '.github_built_release_include_aab // true' <<<"$PROFILE_JSON")"
          built_release_checksum="$(jq -r '.github_built_release_checksum // false' <<<"$PROFILE_JSON")"
          built_release_changes="$(jq -r '.github_built_release_changes // false' <<<"$PROFILE_JSON")"
          google_mode="$(jq -r '.google_services // "template"' <<<"$PROFILE_JSON")"
          arcore="$(jq -r '.arcore_local_properties // false' <<<"$PROFILE_JSON")"
          version_arg="$(jq -r '.version_arg // "versionBuild"' <<<"$PROFILE_JSON")"
          inject_signing="$(jq -r '.inject_signing_args // false' <<<"$PROFILE_JSON")"
          pem_legacy="$(jq -r '.pem_legacy // false' <<<"$PROFILE_JSON")"
          publish_default="$(jq -r '.publish_default // true' <<<"$PROFILE_JSON")"
          publish_on_push="$(jq -r '.publish_on_push // true' <<<"$PROFILE_JSON")"
          test_command="$(jq -r '.test_command // empty' <<<"$PROFILE_JSON")"
          ad_id_check="$(jq -r '.ad_id_check // false' <<<"$PROFILE_JSON")"
          mapping_file="$(jq -r '.mapping_file // empty' <<<"$PROFILE_JSON")"
          github_release_after_play="$(jq -r '.github_release_after_play // "never"' <<<"$PROFILE_JSON")"
          release_app_name="$(jq -r '.release_app_name // empty' <<<"$PROFILE_JSON")"
          tracks="$(jq -c --argjson d "$default_tracks" '.tracks // $d' <<<"$PROFILE_JSON")"
          if [ "$TARGET_EVENT_NAME" = push ] && jq -e '.push_tracks' >/dev/null 2>&1 <<<"$PROFILE_JSON"; then
            tracks="$(jq -c '.push_tracks' <<<"$PROFILE_JSON")"
          elif [ "$(jq -r '.tracks_from_inputs // false' <<<"$PROFILE_JSON")" = true ]; then
            track="$(jq -r '.track // "internal"' <<<"$TARGET_INPUTS_JSON")"
            status="$(jq -r '.status // "draft"' <<<"$TARGET_INPUTS_JSON")"
            tracks="$(jq -nc --arg track "$track" --arg status "$status" '[{track:$track,status:$status}]')"
          elif [ "$(jq -r '.tracks_from_csv_input // false' <<<"$PROFILE_JSON")" = true ]; then
            csv="$(jq -r '.tracks // "internal"' <<<"$TARGET_INPUTS_JSON")"
            status="$(jq -r '.status // "draft"' <<<"$TARGET_INPUTS_JSON")"
            tracks="$(jq -nc --arg csv "$csv" --arg status "$status" '$csv | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length>0)) | map({track:.,status:$status})')"
          fi
          if [ "$TARGET_EVENT_NAME" = push ]; then
            publish="$publish_on_push"
          elif [ "$(jq -r 'has("dry_run")' <<<"$TARGET_INPUTS_JSON")" = true ]; then
            dry="$(jq -r '.dry_run' <<<"$TARGET_INPUTS_JSON")"
            [ "$dry" = true ] && publish=false || publish=true
          elif [ "$(jq -r 'has("publish")' <<<"$TARGET_INPUTS_JSON")" = true ]; then
            publish="$(jq -r '.publish' <<<"$TARGET_INPUTS_JSON")"
          elif [ "$(jq -r 'has("publish_play")' <<<"$TARGET_INPUTS_JSON")" = true ]; then
            publish="$(jq -r '.publish_play' <<<"$TARGET_INPUTS_JSON")"
          else
            publish="$publish_default"
          fi
          {
            echo "SIGNING_MODE=$signing"
            echo "JAVA_VERSION=$java"
            echo "BUILD_COMMAND=$build"
            echo "AAB_GLOB=$glob"
            echo "APK_GLOB=$apk_glob"
            echo "SIGNING_ENV_PREFIX=$signing_env_prefix"
            echo "SIGNING_ENV_STYLE=$signing_env_style"
            echo "PRE_BUILD_COMMAND=$pre_build_command"
            echo "BUILT_RELEASE_TAG_ENV=$built_release_tag_env"
            echo "BUILT_RELEASE_INCLUDE_AAB=$built_release_include_aab"
            echo "BUILT_RELEASE_CHECKSUM=$built_release_checksum"
            echo "BUILT_RELEASE_CHANGES=$built_release_changes"
            echo "GOOGLE_SERVICES_MODE=$google_mode"
            echo "ARCORE_LOCAL_PROPERTIES=$arcore"
            echo "VERSION_ARG=$version_arg"
            echo "INJECT_SIGNING_ARGS=$inject_signing"
            echo "PEM_LEGACY=$pem_legacy"
            echo "PUBLISH_PLAY=$publish"
            echo "TRACKS_JSON=$tracks"
            echo "TEST_COMMAND=$test_command"
            echo "AD_ID_CHECK=$ad_id_check"
            echo "MAPPING_FILE=$mapping_file"
            echo "GITHUB_RELEASE_AFTER_PLAY=$github_release_after_play"
            echo "RELEASE_APP_NAME=$release_app_name"
            release=false
            if [ "$publish" = true ] && { [ "$github_release_after_play" = always ] || { [ "$github_release_after_play" = manual ] && [ "$TARGET_EVENT_NAME" = workflow_dispatch ]; }; }; then
              release=true
            fi
            echo "PUBLISH_GITHUB_RELEASE=$release"
            built_release=false
            if [ "$built_release_always" = true ] || { [ "$built_release_on_tag" = true ] && [ "$TARGET_REF_TYPE" = tag ]; }; then
              built_release=true
            fi
            echo "PUBLISH_BUILT_GITHUB_RELEASE=$built_release"
          } >> "$GITHUB_ENV"

      - name: Wait for earlier Play publish for this repository
        if: ${{ env.PUBLISH_PLAY == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CURRENT_RUN: ${{ github.run_id }}
          QUEUE_TITLE: ${{ inputs.target_repository_name }} · Android Play Release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 360); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-play-release.yml/runs?per_page=100" > "$RUNNER_TEMP/play-runs.json"
            blockers="$(jq --argjson current "$CURRENT_RUN" --arg title "$QUEUE_TITLE" '[.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and .id < $current and .display_title == $title)] | length' "$RUNNER_TEMP/play-runs.json")"
            if [ "$blockers" -eq 0 ]; then
              echo "Play publish slot acquired."
              exit 0
            fi
            echo "Waiting behind $blockers earlier Play publish run(s) for this repository..."
            sleep 10
          done
          echo "::error::Timed out waiting for this repository's Play publish queue" >&2
          exit 1

      - name: Guard Play publish to default branch
        if: ${{ env.PUBLISH_PLAY == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$TARGET_REPOSITORY" --jq .default_branch)"
          test "$TARGET_REF_NAME" = "$default_branch" || { echo "::error::Play publishing is only allowed from the default branch ($default_branch); got $TARGET_REF_NAME" >&2; exit 1; }

      - name: Inject Google services
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GOOGLE_SERVICES_MODE" in
            raw)
              if [ -n "$GOOGLE_SERVICES" ]; then printf '%s' "$GOOGLE_SERVICES" > app/google-services.json; fi
              ;;
            template)
              template="$(find . -name google-services.json.template -print -quit)"
              if [ -n "$template" ]; then sed -e 's/{{\([^}]*\)}}/${\1}/g' "$template" | envsubst > "${template%.template}"; fi
              ;;
            none) ;;
            *) echo "::error::Unknown Google services mode: $GOOGLE_SERVICES_MODE" >&2; exit 1 ;;
          esac
          if [ "$ARCORE_LOCAL_PROPERTIES" = true ]; then
            test -n "$ARCORE_API_KEY" || { echo "::error::ARCORE_API_KEY is required" >&2; exit 1; }
            printf 'ARCORE_API_KEY=%s\n' "$ARCORE_API_KEY" >> local.properties
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_RSA: ${{ secrets.KEYSTORE_RSA }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app
          case "$SIGNING_MODE" in
            raw-jks)
              test -n "$KEYSTORE_RAW" || { echo "::error::KEYSTORE_RAW is required" >&2; exit 1; }
              printf '%s' "$KEYSTORE_RAW" | base64 --decode > app/keystore.jks
              ;;
            pem-chain)
              private_key="${KEYSTORE_PRIVATE:-$KEYSTORE_RSA}"
              test -n "$private_key" && test -n "$KEYSTORE_CHAIN" || { echo "::error::KEYSTORE_PRIVATE/KEYSTORE_RSA and KEYSTORE_CHAIN are required" >&2; exit 1; }
              printf '%s\n' "$private_key" > private-key.pem
              printf '%s\n' "$KEYSTORE_CHAIN" > certificate-chain.crt
              openssl_args=(-export -in certificate-chain.crt -inkey private-key.pem -out keystore.p12 -name "$KEY_ALIAS" -passout pass:"$KEYSTORE_PASSWORD")
              if [ -n "$KEY_PASSWORD" ]; then openssl_args+=(-passin env:KEY_PASSWORD); fi
              if [ "$PEM_LEGACY" = true ]; then openssl_args+=(-legacy); fi
              openssl pkcs12 "${openssl_args[@]}"
              keytool -importkeystore -srckeystore keystore.p12 -srcstoretype PKCS12 -srcstorepass "$KEYSTORE_PASSWORD" -destkeystore app/keystore.jks -deststoretype JKS -deststorepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -noprompt
              rm -f private-key.pem certificate-chain.crt keystore.p12
              ;;
            *) echo "::error::Unknown signing mode: $SIGNING_MODE" >&2; exit 1 ;;
          esac
          test -s app/keystore.jks || { echo "::error::Signing keystore is empty" >&2; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Set up Android SDK
        if: ${{ fromJSON(inputs.purpose_profile_json).setup_android == true }}
        uses: android-actions/setup-android@v4
        with:
          packages: ${{ fromJSON(inputs.purpose_profile_json).android_packages || 'platform-tools' }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: chmod +x gradlew

      - name: Prepare project-specific release inputs
        if: ${{ env.PRE_BUILD_COMMAND != '' }}
        shell: bash
        run: bash -eo pipefail -c "$PRE_BUILD_COMMAND"

      - name: Run release tests
        if: ${{ env.TEST_COMMAND != '' }}
        shell: bash
        run: bash -eo pipefail -c "$TEST_COMMAND"

      - name: Resolve package and version arguments
        id: meta
        env:
          TARGET_VARS_JSON: ${{ inputs.target_vars_json }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          package="$(jq -r '.package_name // empty' <<<"$PROFILE_JSON")"
          if [ -z "$package" ]; then
            build_file="$(jq -r '.ANDROID_BUILD_FILE // "app/build.gradle.kts"' <<<"$TARGET_VARS_JSON")"
            if [ ! -f "$build_file" ]; then build_file="$(find . \( -path '*/build.gradle.kts' -o -path '*/build.gradle' \) -print | head -1)"; fi
            package="$(grep -m1 -E 'applicationId[[:space:]]*=' "$build_file" | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          test -n "$package" || { echo "::error::Could not determine Android applicationId" >&2; exit 1; }
          echo "package_name=$package" >> "$GITHUB_OUTPUT"
          release_version_code="${RELEASE_VERSION_CODE:-$ANDROID_VERSION_CODE}"
          release_version_name="${RELEASE_VERSION_NAME:-$VERSION}"
          test "$release_version_code" -ge 0 || { echo "::error::Release version cannot be encoded as Android versionCode: $release_version_name" >&2; exit 1; }
          args="-P${VERSION_ARG}=${release_version_code} -PversionCodeOverride=${release_version_code} -PversionNameOverride=${release_version_name} -PreleaseVersionCode=${release_version_code} -PreleaseVersionName=${release_version_name} -PversionBuild=${VERSION_BUILD} -PversionName=${release_version_name}"
          echo "VERSION_ARGS=$args" >> "$GITHUB_ENV"
          echo "EFFECTIVE_RELEASE_VERSION_CODE=$release_version_code" >> "$GITHUB_ENV"
          echo "EFFECTIVE_RELEASE_VERSION_NAME=$release_version_name" >> "$GITHUB_ENV"

      - name: Build signed AAB
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ACRA_URL: ${{ secrets.ACRA_URL }}
          ACRA_TOKEN: ${{ secrets.ACRA_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          command="$BUILD_COMMAND $VERSION_ARGS"
          if [ -n "$SIGNING_ENV_PREFIX" ]; then
            export "${SIGNING_ENV_PREFIX}_KEYSTORE_FILE=$KEYSTORE_FILE"
            export "${SIGNING_ENV_PREFIX}_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            export "${SIGNING_ENV_PREFIX}_KEY_ALIAS=$KEY_ALIAS"
            export "${SIGNING_ENV_PREFIX}_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          fi
          if [ "$SIGNING_ENV_STYLE" = "release-store" ]; then
            export RELEASE_STORE_FILE="$KEYSTORE_FILE"
            export RELEASE_STORE_PASSWORD="$KEYSTORE_PASSWORD"
            export RELEASE_KEY_ALIAS="$KEY_ALIAS"
            export RELEASE_KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          fi
          if [ "$INJECT_SIGNING_ARGS" = true ]; then
            command="$command -Pandroid.injected.signing.store.file=\"$KEYSTORE_FILE\" -Pandroid.injected.signing.store.password=\"$KEYSTORE_PASSWORD\" -Pandroid.injected.signing.key.alias=\"$KEY_ALIAS\" -Pandroid.injected.signing.key.password=\"$KEY_PASSWORD\""
          fi
          bash -eo pipefail -c "$command"
          aab="$(compgen -G "$AAB_GLOB" | head -1 || true)"
          test -n "$aab" && test -s "$aab" || { echo "::error::No AAB matched $AAB_GLOB" >&2; exit 1; }
          echo "AAB_PATH=$aab" >> "$GITHUB_ENV"
          if [ -n "$APK_GLOB" ]; then
            apk="$(compgen -G "$APK_GLOB" | head -1 || true)"
            test -n "$apk" && test -s "$apk" || { echo "::error::No APK matched $APK_GLOB" >&2; exit 1; }
            echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          else
            echo "APK_PATH=" >> "$GITHUB_ENV"
          fi

      - name: Resolve required mapping.txt
        id: mapping
        shell: bash
        run: |
          set -euo pipefail
          mapping="${MAPPING_FILE:-}"
          if [ -n "$mapping" ] && [ ! -s "$mapping" ]; then
            echo "::error::Configured mapping_file does not exist or is empty: $mapping" >&2
            exit 1
          fi
          if [ -z "$mapping" ]; then
            module="${AAB_PATH%%/build/outputs/bundle/*}"
            relative="${AAB_PATH#*/build/outputs/bundle/}"
            variant="${relative%%/*}"
            candidate="$module/build/outputs/mapping/$variant/mapping.txt"
            if [ -s "$candidate" ]; then mapping="$candidate"; fi
          fi
          if [ -z "$mapping" ]; then
            mapping="$(find . -type f -path '*/build/outputs/mapping/*/mapping.txt' -size +0c | sort | head -1 || true)"
          fi
          canonical="$RUNNER_TEMP/mapping.txt"
          if [ -z "$mapping" ]; then
            embedded='BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map'
            if unzip -Z1 "$AAB_PATH" | grep -Fxq "$embedded"; then
              unzip -p "$AAB_PATH" "$embedded" > "$canonical"
              mapping="$canonical"
            fi
          fi
          test -n "$mapping" && test -s "$mapping" || {
            echo "::error::Play publishing requires a nonempty R8/ProGuard mapping.txt, but none was produced for $AAB_PATH" >&2
            exit 1
          }
          if [ "$mapping" != "$canonical" ]; then cp "$mapping" "$canonical"; fi
          test -s "$canonical"
          echo "MAPPING_FILE=$canonical" >> "$GITHUB_ENV"
          echo "path=$canonical" >> "$GITHUB_OUTPUT"

      - name: Upload mapping.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target_repository_name }}-${{ env.EFFECTIVE_RELEASE_VERSION_NAME }}-mapping
          path: ${{ steps.mapping.outputs.path }}
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target_repository_name }}-release-aab
          path: |
            ${{ env.AAB_PATH }}
            ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Verify bundle declares no AD_ID permission
        if: ${{ env.AD_ID_CHECK == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          BT_VERSION=1.17.2
          curl -fsSL -o bundletool.jar "https://github.com/google/bundletool/releases/download/${BT_VERSION}/bundletool-all-${BT_VERSION}.jar"
          modules="$(unzip -Z1 "$AAB_PATH" | sed -n 's#^\([^/]*\)/manifest/AndroidManifest\.xml$#\1#p' | sort -u)"
          test -n "$modules" || { echo "::error::No module manifests found in $AAB_PATH" >&2; exit 1; }
          dirty=0
          for module in $modules; do
            manifest="$(java -jar bundletool.jar dump manifest --bundle="$AAB_PATH" --module="$module")"
            if grep -q "com.google.android.gms.permission.AD_ID" <<<"$manifest"; then
              echo "::error::module '$module' declares com.google.android.gms.permission.AD_ID"
              dirty=1
            fi
          done
          test "$dirty" -eq 0 || exit 1

      - name: Publish bundle to configured Play tracks
        id: play
        if: ${{ env.PUBLISH_PLAY == 'true' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          MAPPING_FILE: ${{ env.MAPPING_FILE }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet google-api-python-client google-auth google-auth-httplib2
          python - <<'PY'
          import json, os, time
          import httplib2
          from google.oauth2 import service_account
          from google_auth_httplib2 import AuthorizedHttp
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError

          HTTP_TIMEOUT_SECONDS=180
          REQUEST_RETRIES=5
          EDIT_ATTEMPTS=6

          info=json.loads(os.environ['PLAY_SERVICE_ACCOUNT_JSON'])
          creds=service_account.Credentials.from_service_account_info(
              info,
              scopes=['https://www.googleapis.com/auth/androidpublisher'],
          )
          http=AuthorizedHttp(creds, http=httplib2.Http(timeout=HTTP_TIMEOUT_SECONDS))
          svc=build('androidpublisher','v3',http=http,cache_discovery=False)
          package=os.environ['PACKAGE_NAME']
          aab=os.environ['AAB_PATH']
          tracks=json.loads(os.environ['TRACKS_JSON'])

          def execute(request, retries=REQUEST_RETRIES):
              return request.execute(num_retries=retries)

          def upload_bundle(edit_id):
              # Android Publisher's resumable upload uses HTTP 308 responses without
              # a Location header. httplib2 treats those as broken redirects before
              # googleapiclient can process the upload range, raising
              # RedirectMissingLocation. Use a single multipart upload here instead;
              # the outer edit retry loop still retries transient transport failures.
              request=svc.edits().bundles().upload(
                  packageName=package,
                  editId=edit_id,
                  media_body=MediaFileUpload(
                      aab,
                      mimetype='application/octet-stream',
                      resumable=False,
                  ),
              )
              return execute(request)

          transient=(HttpError, TimeoutError, ConnectionError, httplib2.HttpLib2Error)

          for attempt in range(1,EDIT_ATTEMPTS + 1):
              edit=None
              try:
                  edit=execute(svc.edits().insert(packageName=package,body={}))['id']
                  bundle=upload_bundle(edit)
                  code=str(bundle['versionCode'])
                  mapping=os.environ['MAPPING_FILE']
                  if not os.path.isfile(mapping) or os.path.getsize(mapping) == 0:
                      raise RuntimeError(f'Required mapping.txt is missing or empty: {mapping}')
                  execute(svc.edits().deobfuscationfiles().upload(
                      packageName=package,
                      editId=edit,
                      apkVersionCode=code,
                      deobfuscationFileType='proguard',
                      media_body=MediaFileUpload(mapping,mimetype='text/plain'),
                  ))
                  print(f'Uploaded mapping.txt for versionCode {code}')
                  for spec in tracks:
                      release={'versionCodes':[code],'status':spec['status']}
                      if spec.get('name'):
                          release['name']=os.path.expandvars(str(spec['name']))
                      releases=[release]
                      if spec.get('preserve_existing'):
                          current=execute(svc.edits().tracks().get(
                              packageName=package,
                              editId=edit,
                              track=spec['track'],
                          ))
                          releases=[
                              item for item in current.get('releases', [])
                              if item.get('status') != 'draft'
                              and code not in [str(value) for value in item.get('versionCodes', [])]
                          ] + [release]
                      body={'track':spec['track'],'releases':releases}
                      execute(svc.edits().tracks().update(
                          packageName=package,
                          editId=edit,
                          track=spec['track'],
                          body=body,
                      ))
                  execute(svc.edits().commit(packageName=package,editId=edit))
                  print(f'Published versionCode {code} to {tracks}')
                  break
              except transient as exc:
                  if edit:
                      try:
                          execute(svc.edits().delete(packageName=package,editId=edit), retries=2)
                      except Exception as cleanup_exc:
                          print(f'Warning: could not discard failed Play edit {edit}: {cleanup_exc}', flush=True)
                  if attempt == EDIT_ATTEMPTS:
                      raise
                  wait=min(60, 5 * 2 ** (attempt-1))
                  print(
                      f'Play edit attempt {attempt} failed with {type(exc).__name__}: '
                      f'{exc}; retrying in {wait}s',
                      flush=True,
                  )
                  time.sleep(wait)
          PY

      - name: Publish built release assets to GitHub
        if: ${{ env.PUBLISH_BUILT_GITHUB_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$BUILT_RELEASE_TAG_ENV" ]; then
            version="${!BUILT_RELEASE_TAG_ENV:-}"
            test -n "$version" || { echo "::error::$BUILT_RELEASE_TAG_ENV is empty" >&2; exit 1; }
            tag="v$version"
          else
            test "$TARGET_REF_TYPE" = tag || { echo "::error::Built release requires either a tag trigger or github_built_release_tag_env" >&2; exit 1; }
            tag="$TARGET_REF_NAME"
            version="${tag#v}"
          fi
          assets=()
          if [ "$BUILT_RELEASE_INCLUDE_AAB" = true ]; then assets+=("$AAB_PATH"); fi
          if [ -n "${APK_PATH:-}" ]; then assets+=("$APK_PATH"); fi
          test "${#assets[@]}" -gt 0 || { echo "::error::No GitHub release assets selected" >&2; exit 1; }
          title="${RELEASE_APP_NAME:-${{ inputs.target_repository_name }}} ${version:-$tag}"
          notes="Built from commit $TARGET_SHA."
          if [ "$BUILT_RELEASE_CHANGES" = true ]; then
            previous="$(git describe --tags --abbrev=0 "$TARGET_SHA^" 2>/dev/null || true)"
            if [ -n "$previous" ]; then
              changes="$(git log "$previous..$TARGET_SHA" --pretty='format:- %s' --no-merges)"
            else
              changes="- Initial release"
            fi
            printf -v notes '## Changes\n%s\n\nBuilt from commit %s.' "$changes" "$TARGET_SHA"
          fi
          if [ "$BUILT_RELEASE_CHECKSUM" = true ] && [ -n "${APK_PATH:-}" ]; then
            checksum="$(sha256sum "$APK_PATH" | awk '{print $1}')"
            printf -v notes '%s\n\nSHA-256: %s' "$notes" "$checksum"
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            existing_sha="$(git rev-list -n 1 "$tag")"
            test "$existing_sha" = "$TARGET_SHA" || { echo "::error::Tag $tag points to $existing_sha, expected $TARGET_SHA" >&2; exit 1; }
          else
            git tag -a "$tag" "$TARGET_SHA" -m "$title"
            git push origin "$tag"
          fi
          if gh release view "$tag" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$TARGET_REPOSITORY" --title "$title" --notes "$notes" --target "$TARGET_SHA"
            gh release upload "$tag" "${assets[@]}" --repo "$TARGET_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "$title" --notes "$notes"
          fi
      - name: Build universal APK from published bundle
        if: ${{ env.PUBLISH_GITHUB_RELEASE == 'true' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          BT_VERSION=1.17.2
          if [ ! -f bundletool.jar ]; then
            curl -fsSL -o bundletool.jar "https://github.com/google/bundletool/releases/download/${BT_VERSION}/bundletool-all-${BT_VERSION}.jar"
          fi
          key_password="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          java -jar bundletool.jar build-apks --bundle="$AAB_PATH" --output=universal.apks --mode=universal --overwrite             --ks=app/keystore.jks --ks-pass=pass:"$KEYSTORE_PASSWORD" --ks-key-alias="$KEY_ALIAS" --key-pass=pass:"$key_password"
          unzip -o -p universal.apks universal.apk > app-universal.apk
          test -s app-universal.apk || { echo "::error::Universal APK extraction failed" >&2; exit 1; }
          echo "UNIVERSAL_APK=$PWD/app-universal.apk" >> "$GITHUB_ENV"

      - name: Publish immutable GitHub release for Play build
        if: ${{ env.PUBLISH_GITHUB_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          app_name="$RELEASE_APP_NAME"
          if [ -z "$app_name" ] && [ -f settings.gradle.kts ]; then
            app_name="$(sed -nE "s/.*rootProject\\.name[[:space:]]*=[[:space:]]*['\\\"]([^'\\\"]+)['\\\"].*/\\1/p" settings.gradle.kts | head -1)"
          fi
          if [ -z "$app_name" ] && [ -f settings.gradle ]; then
            app_name="$(sed -nE "s/.*rootProject\\.name[[:space:]]*=[[:space:]]*['\\\"]([^'\\\"]+)['\\\"].*/\\1/p" settings.gradle | head -1)"
          fi
          app_name="${app_name:-${{ inputs.target_repository_name }}}"
          tag="v$version"
          asset="$app_name-$version.apk"
          cp "$UNIVERSAL_APK" "$asset"
          prerelease=--prerelease
          if [ "$(jq 'length' <<<"$TRACKS_JSON")" -eq 1 ] && [ "$(jq -r '.[0].track' <<<"$TRACKS_JSON")" = production ] && [ "$(jq -r '.[0].status' <<<"$TRACKS_JSON")" = completed ]; then
            prerelease=
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$tag" "$TARGET_SHA" -m "Play release $version"
          git push origin "$tag" --force
          notes="Signed APK for the build published to Google Play. Tracks: $TRACKS_JSON. Built from commit $TARGET_SHA."
          if gh release view "$tag" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$TARGET_REPOSITORY" $prerelease --title "$app_name $version" --notes "$notes" --target "$TARGET_SHA"
            gh release upload "$tag" "$asset" --repo "$TARGET_REPOSITORY" --clobber
          else
            gh release create "$tag" "$asset" --repo "$TARGET_REPOSITORY" $prerelease --title "$app_name $version" --notes "$notes" --target "$TARGET_SHA"
          fi

      - name: Cleanup signing material
        if: ${{ always() }}
        run: rm -f app/keystore.jks private-key.pem certificate-chain.crt keystore.p12
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - version_contract
      - build_and_publish
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
