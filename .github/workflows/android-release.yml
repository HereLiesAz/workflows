# workflow-policy: generalized-v1
# workflow-purpose: Build, sign, version and publish any HereLiesAz Android app (Google Play and/or GitHub Release) with one rule for versionCode and versionName.
# required-secret: GH_TOKEN | Checks out the app, posts its commit status, creates its GitHub release and records the published version.
# required-secret: KEYSTORE_RAW | Base64 upload keystore used to sign the release build.
# required-secret: KEYSTORE_PRIVATE | PEM private key for apps whose upload key is stored as a key and certificate chain instead of a keystore.
# required-secret: KEYSTORE_CHAIN | PEM certificate chain paired with KEYSTORE_PRIVATE.
# required-secret: KEYSTORE_PASSWORD | Unlocks the upload keystore.
# required-secret: KEY_ALIAS | Names the upload key inside the keystore.
# required-secret: KEY_PASSWORD | Unlocks the upload key; KEYSTORE_PASSWORD is used when it is not set.
# required-secret: PLAY_SERVICE_ACCOUNT_JSON | Reads Play's highest versionCode and publishes to Play, for apps that publish to Play.
# required-secret: GOOGLE_SERVICES | The app's google-services.json, for apps that use Firebase or Google services.
# required-secret: ARCORE_API_KEY | ARCore API key written to local.properties, for apps that use ARCore.
# required-secret: TRAKT_CLIENT_ID | Build-time Trakt client ID, for apps whose profile requires it.
# required-secret: TRAKT_CLIENT_SECRET | Build-time Trakt client secret, for apps whose profile requires it.
# required-secret: TMDB_API_KEY | Build-time TMDB key, for apps whose profile requires it.
# required-secret: ACRA_URL | Build-time crash-report endpoint, for apps whose profile requires it.
# required-secret: ACRA_TOKEN | Build-time crash-report token, for apps whose profile requires it.
#
# The single Android build-and-publish workflow. Every app gets the same steps; a profile in
# scripts/semantic_catalog.py says only what differs (build command, outputs, tracks, extras).
#   versionCode = max(code recorded in version.properties, highest code Play ever accepted) + 1
#   versionName = major.minor.patch from version.properties, last field + 1
# Gradle receives exactly -PversionCode and -PversionName; signing arrives as KEYSTORE_FILE,
# KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD. Only pushes and dispatches on the default branch
# publish; everything else builds and stops. The pair is recorded only after a successful publish.
name: Android Release
run-name: ${{ inputs.target_repository_name }} · Android Release
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
      target_repository_name:
        required: true
        type: string
      purpose_profile_json:
        required: false
        type: string
        default: '{}'
# One release at a time per app, so two runs can never compute the same versionCode.
concurrency:
  group: android-release-${{ inputs.target_repository_id }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
  policy_secret_preflight:
    needs: central_check_start
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_repository_name }}
    env:
      PROFILE_JSON: ${{ inputs.purpose_profile_json }}
      REQUIRED_GH_TOKEN: ${{ secrets.GH_TOKEN }}
      REQUIRED_KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
      REQUIRED_KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
      REQUIRED_KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
      REQUIRED_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      REQUIRED_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      REQUIRED_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      REQUIRED_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      REQUIRED_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
      REQUIRED_ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
      REQUIRED_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      REQUIRED_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      REQUIRED_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      REQUIRED_ACRA_URL: ${{ secrets.ACRA_URL }}
      REQUIRED_ACRA_TOKEN: ${{ secrets.ACRA_TOKEN }}
    steps:
      - name: Check the secrets this app's profile needs
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          need() { [ -n "${!1:-}" ] || { echo "::error::$2"; missing=1; }; }
          profile() { jq -r "$1" <<<"$PROFILE_JSON"; }
          need REQUIRED_GH_TOKEN "Missing required secret GH_TOKEN — Checks out the app, posts its commit status, creates its GitHub release and records the published version."
          if [ -z "${REQUIRED_KEYSTORE_RAW:-}" ]; then
            if [ -z "${REQUIRED_KEYSTORE_PRIVATE:-}" ] || [ -z "${REQUIRED_KEYSTORE_CHAIN:-}" ]; then
              echo "::error::Missing required secret KEYSTORE_RAW — Base64 upload keystore used to sign the release build."
              need REQUIRED_KEYSTORE_PRIVATE "Missing required secret KEYSTORE_PRIVATE — PEM private key for apps whose upload key is stored as a key and certificate chain instead of a keystore."
              need REQUIRED_KEYSTORE_CHAIN "Missing required secret KEYSTORE_CHAIN — PEM certificate chain paired with KEYSTORE_PRIVATE."
              missing=1
            fi
          fi
          need REQUIRED_KEYSTORE_PASSWORD "Missing required secret KEYSTORE_PASSWORD — Unlocks the upload keystore."
          need REQUIRED_KEY_ALIAS "Missing required secret KEY_ALIAS — Names the upload key inside the keystore."
          [ -n "${REQUIRED_KEY_PASSWORD:-}" ] || echo "::notice::Missing required secret KEY_PASSWORD — Unlocks the upload key; KEYSTORE_PASSWORD is used when it is not set."
          if [ "$(profile '(.play_tracks // []) | length')" -gt 0 ]; then
            need REQUIRED_PLAY_SERVICE_ACCOUNT_JSON "Missing required secret PLAY_SERVICE_ACCOUNT_JSON — Reads Play's highest versionCode and publishes to Play, for apps that publish to Play."
          fi
          if [ -n "$(profile '.google_services_path // empty')" ]; then
            need REQUIRED_GOOGLE_SERVICES "Missing required secret GOOGLE_SERVICES — The app's google-services.json, for apps that use Firebase or Google services."
          fi
          if [ "$(profile '.arcore_local_properties // false')" = true ]; then
            need REQUIRED_ARCORE_API_KEY "Missing required secret ARCORE_API_KEY — ARCore API key written to local.properties, for apps that use ARCore."
          fi
          # build_secrets are passed to the build when set; required_build_secrets must exist.
          for name in $(profile '(.required_build_secrets // [])[]'); do
            case "$name" in
              TRAKT_CLIENT_ID) need REQUIRED_TRAKT_CLIENT_ID "Missing required secret TRAKT_CLIENT_ID — Build-time Trakt client ID, for apps whose profile requires it." ;;
              TRAKT_CLIENT_SECRET) need REQUIRED_TRAKT_CLIENT_SECRET "Missing required secret TRAKT_CLIENT_SECRET — Build-time Trakt client secret, for apps whose profile requires it." ;;
              TMDB_API_KEY) need REQUIRED_TMDB_API_KEY "Missing required secret TMDB_API_KEY — Build-time TMDB key, for apps whose profile requires it." ;;
              ACRA_URL) need REQUIRED_ACRA_URL "Missing required secret ACRA_URL — Build-time crash-report endpoint, for apps whose profile requires it." ;;
              ACRA_TOKEN) need REQUIRED_ACRA_TOKEN "Missing required secret ACRA_TOKEN — Build-time crash-report token, for apps whose profile requires it." ;;
              *) echo "::error::Profile lists unknown build secret $name"; missing=1 ;;
            esac
          done
          exit "$missing"

  release:
    needs: policy_secret_preflight
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.target_repository_name }}
    outputs:
      published: ${{ steps.published.outputs.published }}
      default_branch: ${{ steps.plan.outputs.default_branch }}
      version_code: ${{ steps.version.outputs.version-code }}
      version_name: ${{ steps.version.outputs.version-name }}
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_INPUTS_JSON: ${{ inputs.target_inputs_json }}
      PROFILE_JSON: ${{ inputs.purpose_profile_json }}
      VERSION_FILE: ${{ fromJSON(inputs.purpose_profile_json).version_file || 'version.properties' }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Check out the app
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          submodules: ${{ fromJSON(inputs.purpose_profile_json).submodules == true && 'recursive' || 'false' }}
          persist-credentials: false

      - name: Decide whether this run publishes
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$TARGET_REPOSITORY" --jq .default_branch)"
          inputs_json="${TARGET_INPUTS_JSON:-}"; [ -n "$inputs_json" ] || inputs_json='{}'
          requested="$(jq -r 'if (.publish|tostring) == "false" or (.dry_run|tostring) == "true" then "false" else "true" end' <<<"$inputs_json")"
          publish=false
          case "$TARGET_EVENT_NAME" in
            push|workflow_dispatch) [ "$TARGET_REF_NAME" = "$default_branch" ] && [ "$requested" = true ] && publish=true ;;
          esac
          echo "Publishing: $publish (event $TARGET_EVENT_NAME on $TARGET_REF_NAME; default branch $default_branch)"
          { echo "publish=$publish"; echo "default_branch=$default_branch"; } >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ fromJSON(inputs.purpose_profile_json).java_version || '21' }}
          distribution: temurin

      - name: Set up Android SDK
        if: ${{ fromJSON(inputs.purpose_profile_json).setup_android == true }}
        uses: android-actions/setup-android@v4
        with:
          packages: ${{ fromJSON(inputs.purpose_profile_json).android_packages || 'platform-tools' }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Write build-time configuration
        shell: bash
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          path="$(jq -r '.google_services_path // empty' <<<"$PROFILE_JSON")"
          if [ -n "$path" ]; then mkdir -p "$(dirname "$path")"; printf '%s' "$GOOGLE_SERVICES" > "$path"; fi
          if [ "$(jq -r '.arcore_local_properties // false' <<<"$PROFILE_JSON")" = true ]; then
            printf 'ARCORE_API_KEY=%s\n' "$ARCORE_API_KEY" >> local.properties
          fi

      - name: Prepare the upload keystore
        shell: bash
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/upload.jks"
          key_password="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          if [ -n "$KEYSTORE_RAW" ]; then
            printf '%s' "$KEYSTORE_RAW" | base64 -d > "$keystore"
          else
            # Legacy secret format, kept until the app's KEYSTORE_RAW exists.
            printf '%s\n' "$KEYSTORE_PRIVATE" > "$RUNNER_TEMP/key.pem"
            printf '%s\n' "$KEYSTORE_CHAIN" > "$RUNNER_TEMP/chain.crt"
            openssl pkcs12 -export -legacy -in "$RUNNER_TEMP/chain.crt" -inkey "$RUNNER_TEMP/key.pem" \
              -out "$RUNNER_TEMP/upload.p12" -name "$KEY_ALIAS" -passout pass:"$KEYSTORE_PASSWORD"
            keytool -importkeystore -srckeystore "$RUNNER_TEMP/upload.p12" -srcstoretype PKCS12 -srcstorepass "$KEYSTORE_PASSWORD" \
              -destkeystore "$keystore" -deststoretype JKS -deststorepass "$KEYSTORE_PASSWORD" -destkeypass "$key_password" -alias "$KEY_ALIAS" -noprompt
            rm -f "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/chain.crt" "$RUNNER_TEMP/upload.p12"
          fi
          test -s "$keystore" || { echo "::error::The upload keystore is empty" >&2; exit 1; }
          {
            echo "KEYSTORE_FILE=$keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"

      - name: Compute the next version
        id: version
        uses: HereLiesAz/workflows/.github/actions/android-version@main
        with:
          mode: next
          version-file: ${{ env.VERSION_FILE }}
          service-account-json: ${{ fromJSON(inputs.purpose_profile_json).play_tracks && secrets.PLAY_SERVICE_ACCOUNT_JSON || '' }}
          package-name: ${{ fromJSON(inputs.purpose_profile_json).package_name }}

      - name: Run the app's pre-build step
        if: ${{ fromJSON(inputs.purpose_profile_json).pre_build_command }}
        shell: bash
        env:
          PRE_BUILD_COMMAND: ${{ fromJSON(inputs.purpose_profile_json).pre_build_command }}
        run: bash -euo pipefail -c "$PRE_BUILD_COMMAND"

      - name: Build
        shell: bash
        env:
          BUILD_COMMAND: ${{ fromJSON(inputs.purpose_profile_json).build_command }}
          VERSION_CODE: ${{ steps.version.outputs.version-code }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          # Passed only to apps whose profile lists them in build_secrets or required_build_secrets.
          TRAKT_CLIENT_ID: ${{ (contains(fromJSON(inputs.purpose_profile_json).build_secrets, 'TRAKT_CLIENT_ID') || contains(fromJSON(inputs.purpose_profile_json).required_build_secrets, 'TRAKT_CLIENT_ID')) && secrets.TRAKT_CLIENT_ID || '' }}
          TRAKT_CLIENT_SECRET: ${{ (contains(fromJSON(inputs.purpose_profile_json).build_secrets, 'TRAKT_CLIENT_SECRET') || contains(fromJSON(inputs.purpose_profile_json).required_build_secrets, 'TRAKT_CLIENT_SECRET')) && secrets.TRAKT_CLIENT_SECRET || '' }}
          TMDB_API_KEY: ${{ (contains(fromJSON(inputs.purpose_profile_json).build_secrets, 'TMDB_API_KEY') || contains(fromJSON(inputs.purpose_profile_json).required_build_secrets, 'TMDB_API_KEY')) && secrets.TMDB_API_KEY || '' }}
          ACRA_URL: ${{ (contains(fromJSON(inputs.purpose_profile_json).build_secrets, 'ACRA_URL') || contains(fromJSON(inputs.purpose_profile_json).required_build_secrets, 'ACRA_URL')) && secrets.ACRA_URL || '' }}
          ACRA_TOKEN: ${{ (contains(fromJSON(inputs.purpose_profile_json).build_secrets, 'ACRA_TOKEN') || contains(fromJSON(inputs.purpose_profile_json).required_build_secrets, 'ACRA_TOKEN')) && secrets.ACRA_TOKEN || '' }}
        run: |
          set -euo pipefail
          test -n "$BUILD_COMMAND" || { echo "::error::The profile has no build_command" >&2; exit 1; }
          echo "Building $VERSION_NAME ($VERSION_CODE)"
          bash -euo pipefail -c "$BUILD_COMMAND -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME"

      - name: Collect outputs
        id: outputs
        shell: bash
        env:
          AAB_GLOB: ${{ fromJSON(inputs.purpose_profile_json).aab_glob }}
          APK_GLOB: ${{ fromJSON(inputs.purpose_profile_json).apk_glob }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          aab=""; apk=""
          if [ -n "$AAB_GLOB" ]; then matches=($AAB_GLOB); aab="${matches[0]:-}"; test -n "$aab" || { echo "::error::No bundle matched $AAB_GLOB" >&2; exit 1; }; fi
          if [ -n "$APK_GLOB" ]; then matches=($APK_GLOB); apk="${matches[0]:-}"; test -n "$apk" || { echo "::error::No APK matched $APK_GLOB" >&2; exit 1; }; fi
          test -n "$aab$apk" || { echo "::error::The profile names no aab_glob or apk_glob" >&2; exit 1; }
          { echo "aab=$aab"; echo "apk=$apk"; } >> "$GITHUB_OUTPUT"

      - name: Keep the outputs as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target_repository_name }}-${{ steps.version.outputs.version-name }}
          path: |
            ${{ steps.outputs.outputs.aab }}
            ${{ steps.outputs.outputs.apk }}
          if-no-files-found: ignore

      - name: Publish to Google Play
        if: ${{ steps.plan.outputs.publish == 'true' && fromJSON(inputs.purpose_profile_json).play_tracks }}
        uses: HereLiesAz/workflows/.github/actions/google-play-publish@main
        env:
          # Track release names in a profile may use $VERSION.
          VERSION: ${{ steps.version.outputs.version-name }}
        with:
          service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          package-name: ${{ fromJSON(inputs.purpose_profile_json).package_name }}
          aab-path: ${{ steps.outputs.outputs.aab }}
          tracks: ${{ toJSON(fromJSON(inputs.purpose_profile_json).play_tracks) }}

      - name: Publish a GitHub release
        if: ${{ steps.plan.outputs.publish == 'true' && fromJSON(inputs.purpose_profile_json).github_release == true }}
        shell: bash
        env:
          AAB: ${{ steps.outputs.outputs.aab }}
          APK: ${{ steps.outputs.outputs.apk }}
          VERSION_CODE: ${{ steps.version.outputs.version-code }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          APP_NAME: ${{ fromJSON(inputs.purpose_profile_json).release_app_name || inputs.target_repository_name }}
          PRERELEASE: ${{ fromJSON(inputs.purpose_profile_json).github_prerelease != false }}
        run: |
          set -euo pipefail
          apk="$APK"
          if [ -z "$apk" ]; then
            # Universal APK from the signed bundle, for people installing outside Play.
            curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
            java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$AAB" --output="$RUNNER_TEMP/universal.apks" --mode=universal \
              --ks="$KEYSTORE_FILE" --ks-pass=pass:"$KEYSTORE_PASSWORD" --ks-key-alias="$KEY_ALIAS" --key-pass=pass:"$KEY_PASSWORD"
            unzip -o -q "$RUNNER_TEMP/universal.apks" universal.apk -d "$RUNNER_TEMP"
            apk="$RUNNER_TEMP/universal.apk"
          fi
          asset="$RUNNER_TEMP/$APP_NAME-$VERSION_NAME.apk"
          cp "$apk" "$asset"
          args=(release create "v$VERSION_NAME" "$asset" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" \
            --title "$APP_NAME $VERSION_NAME" --notes "versionCode $VERSION_CODE" --generate-notes)
          [ "$PRERELEASE" = true ] && args+=(--prerelease)
          gh "${args[@]}"

      - name: Mark the release as published
        id: published
        if: ${{ steps.plan.outputs.publish == 'true' && (fromJSON(inputs.purpose_profile_json).play_tracks || fromJSON(inputs.purpose_profile_json).github_release == true) }}
        shell: bash
        run: echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Remove the keystore
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/upload.jks"

  # Separate from the job that held the signing key and Play credential.
  record_version:
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record the published version
        uses: HereLiesAz/workflows/.github/actions/android-version@main
        with:
          mode: record
          version-file: ${{ fromJSON(inputs.purpose_profile_json).version_file || 'version.properties' }}
          repository: ${{ inputs.target_repository }}
          branch: ${{ needs.release.outputs.default_branch }}
          version-code: ${{ needs.release.outputs.version_code }}
          version-name: ${{ needs.release.outputs.version_name }}
          github-token: ${{ secrets.GH_TOKEN }}

  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - policy_secret_preflight
      - release
      - record_version
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
