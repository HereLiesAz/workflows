      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
    concurrency:
      group: release-${{ inputs.target_ref }}-${{ inputs.shared_variant }}
      cancel-in-progress: false
    if: ${{ inputs.shared_variant == '043e9d80a19ee35e' }}
  v_043e9d80a19ee35e__release:
    name: bundleRelease + sign + upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Materialize google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: "if [ -z \"$GOOGLE_SERVICES_JSON_B64\" ]; then\n  echo \"GOOGLE_SERVICES_JSON_B64 secret is required for release builds.\"\n  exit 1\nfi\nprintf '%s' \"$GOOGLE_SERVICES_JSON_B64\" | base64 -d > app/google-services.json\n"
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: "if [ -z \"$KEYSTORE_B64\" ]; then\n  echo \"KEYSTORE_B64 secret is required for release builds.\"\n  exit 1\nfi\nprintf '%s' \"$KEYSTORE_B64\" | base64 -d > \"$RUNNER_TEMP/keystore.jks\"\necho \"KEYSTORE_PATH=$RUNNER_TEMP/keystore.jks\" >> \"$GITHUB_ENV\"\n"
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Bundle release (signed AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace
      - name: Locate AAB
        id: locate
        run: "aab=$(find app/build/outputs/bundle -name '*.aab' -print -quit)\necho \"aab=$aab\" >> \"$GITHUB_OUTPUT\"\nversion=$(grep -E '^\\s*versionName' app/build.gradle.kts | head -1 | sed -E 's/.*\"([^\"]+)\".*/\\1/')\necho \"version=$version\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: barcodencrypt-${{ steps.locate.outputs.version }}-release
          path: ${{ steps.locate.outputs.aab }}
          if-no-files-found: error
      - name: Tag commit
        if: ${{ fromJSON(inputs.target_inputs_json).tag_release && inputs.target_ref_name == fromJSON(inputs.target_event_json).repository.default_branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: "tag=\"v${{ steps.locate.outputs.version }}\"\ngit config user.name  \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\nif git rev-parse \"$tag\" >/dev/null 2>&1; then\n  echo \"Tag $tag already exists; skipping.\"\nelse\n  git tag -a \"$tag\" -m \"Release $tag\"\n  git push origin \"$tag\"\nfi\n"
    needs: v_043e9d80a19ee35e__central_check_start
    if: ${{ (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) && (inputs.shared_variant == '043e9d80a19ee35e') }}
