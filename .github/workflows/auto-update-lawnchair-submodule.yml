# Central semantic shared-workflow family.
# Public identity is the filename; implementation hashes are internal registry metadata only.
# Do not edit generated variant jobs by hand; update the source workflow or synchronizer.
name: Shared · Auto Update Lawnchair Submodule
run-name: ${{ inputs.target_repository }} · ${{ inputs.source_workflow_path }}
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
      shared_variant:
        required: true
        type: string
        description: Internal implementation selector from the central registry.
jobs:
  shared_variant_guard:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SHARED_VARIANT: ${{ inputs.shared_variant }}
    steps:
      - name: Validate registered shared workflow variant
        shell: bash
        run: "set -euo pipefail\ncase \"$SHARED_VARIANT\" in\n  372021e48d4ce7bf) ;;\n  *) echo \"Unknown shared workflow variant: $SHARED_VARIANT\" >&2; exit 1 ;;\nesac\n"
  v_372021e48d4ce7bf__central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
    concurrency:
      group: upstream-autobump-${{ inputs.shared_variant }}
      cancel-in-progress: true
    if: ${{ inputs.shared_variant == '372021e48d4ce7bf' }}
  v_372021e48d4ce7bf__bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Move submodule to latest 16-dev
        id: bump
        run: "# Move to the branch tip via --remote (ignores the recorded pin, which may be unreachable\n# since 16-dev force-pushes; preserves submodule metadata). BEFORE is the committed\n# gitlink (read without a checkout); AFTER is the tip.\nBEFORE=$(git ls-tree HEAD upstream | awk '{print $3}')\ngit submodule update --init --recursive --remote --depth=1 upstream\nAFTER=$(git -C upstream rev-parse HEAD)\necho \"before=$BEFORE\" >> \"$GITHUB_OUTPUT\"\necho \"after=$AFTER\" >> \"$GITHUB_OUTPUT\"\nif [ \"$BEFORE\" = \"$AFTER\" ]; then\n  echo \"changed=false\" >> \"$GITHUB_OUTPUT\"\n  echo \"Already at latest ($AFTER) — nothing to do.\"\nelse\n  echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\n  echo \"Lawnchair $BEFORE -> $AFTER\"\nfi\n"
      - name: Set up JDK 21
        if: steps.bump.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        if: steps.bump.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v4
      - name: Verify overlay applies and builds
        if: steps.bump.outputs.changed == 'true'
        id: verify
        run: "set +e\noverlay/apply-overlay.sh > \"$GITHUB_WORKSPACE/apply.log\" 2>&1\nif [ $? -ne 0 ]; then\n  echo \"stage=apply-overlay\" >> \"$GITHUB_OUTPUT\"\n  echo \"ok=false\" >> \"$GITHUB_OUTPUT\"\n  cat \"$GITHUB_WORKSPACE/apply.log\"\n  exit 0\nfi\n( cd upstream && ./gradlew assembleLawnWithQuickstepGithubDebug --build-cache ) \\\n  > \"$GITHUB_WORKSPACE/build.log\" 2>&1\nif [ $? -ne 0 ]; then\n  echo \"stage=build\" >> \"$GITHUB_OUTPUT\"\n  echo \"ok=false\" >> \"$GITHUB_OUTPUT\"\n  tail -c 4000 \"$GITHUB_WORKSPACE/build.log\"\n  exit 0\nfi\necho \"ok=true\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Commit verified bump to main
        if: steps.bump.outputs.changed == 'true' && steps.verify.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: "# Verified green (overlay applied + GithubDebug built) -> push the bump straight to main.\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add upstream\ngit commit \\\n  -m \"chore(upstream): bump Lawnchair submodule to ${{ steps.bump.outputs.after }}\" \\\n  -m \"Auto-update from 16-dev. Overlay applied and GithubDebug built clean.\"\ngit push origin HEAD:main\n"
      - name: Task Jules with the drifted seam
        if: steps.bump.outputs.changed == 'true' && steps.verify.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: "STAGE=\"${{ steps.verify.outputs.stage }}\"\nif [ \"$STAGE\" = \"apply-overlay\" ]; then LOG=$(tail -c 4000 \"$GITHUB_WORKSPACE/apply.log\"); else LOG=$(tail -c 4000 \"$GITHUB_WORKSPACE/build.log\"); fi\n# Don't pile up duplicates while a bump is blocked.\nif gh issue list --state open --search \"in:title Upstream bump blocked\" | grep -q .; then\n  echo \"An open upstream-bump issue already exists; skipping.\"\n  exit 0\nfi\nTITLE=\"Upstream bump blocked: Lawnchair ${{ steps.bump.outputs.after }} ($STAGE failed)\"\nBODY=$(printf '@gemini-code-assist /jules re-author the drifted Lunch Heir overlay seam.\\n\\nAuto-update of the upstream submodule to `%s` (from `%s`) failed at **%s** — a Lawnchair change moved an exact-anchor patch in `overlay/apply_overlay.py` (or broke the GithubDebug build). Find the drifted anchor, re-author that one edit against the new upstream so the overlay applies and the GithubDebug flavor builds, then push the fix. A manual run of this workflow (or the next scheduled run) will retry the bump.\\n\\n```\\n%s\\n```' \"${{ steps.bump.outputs.after }}\" \"${{ steps.bump.outputs.before }}\" \"$STAGE\" \"$LOG\")\n# Mirror the original failure handler: assign Jules, falling back to an unassigned issue.\ngh issue create --title \"$TITLE\" --assignee gemini-code-assist --body \"$BODY\" \\\n  || gh issue create --title \"$TITLE\" --body \"$BODY\"\n"
    needs: v_372021e48d4ce7bf__central_check_start
    if: ${{ (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) && (inputs.shared_variant == '372021e48d4ce7bf') }}
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
    concurrency:
      group: upstream-autobump-${{ inputs.shared_variant }}
      cancel-in-progress: true
  v_372021e48d4ce7bf__central_check_finish:
    if: ${{ (always()) && (inputs.shared_variant == '372021e48d4ce7bf') }}
    needs:
      - v_372021e48d4ce7bf__central_check_start
      - v_372021e48d4ce7bf__bump
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
    concurrency:
      group: upstream-autobump-${{ inputs.shared_variant }}
      cancel-in-progress: true
