# workflow-policy: generalized-v1
# workflow-purpose: Build a target repository's .azp content packages and publish every built package to its tagged GitHub Release.
# required-secret: GH_TOKEN | Central GitHub token used to check out the target repository and publish its release assets.
# required-secret: GH_APP_ID | GitHub App that writes the Check Run mirroring this run onto the target commit.
# required-secret: GH_PRIVATE_KEY | Private key of that GitHub App, used to mint its installation token.
# Companion to azp-model-release.yml. That workflow releases ONE upstream model
# binary plus its wrapper package; this one releases MANY .azp packages built
# from sources already in the repository, so there is no upstream fetch and no
# manifest checksum injection. The only repository-specific value is the glob of
# built packages, which comes from the purpose profile.
name: AZP Package Release
run-name: ${{ inputs.target_repository_name }} · AZP Package Release
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
      target_repository_name:
        required: true
        type: string
      purpose_profile_json:
        required: false
        type: string
        default: '{}'
# Least privilege: jobs that need more declare it themselves.
permissions:
  contents: read

env:
  TARGET_REPOSITORY_NAME: ${{ inputs.target_repository_name }}
  TARGET_REF: ${{ inputs.target_ref }}

jobs:
  policy_secret_preflight:
    runs-on: ubuntu-latest
    env:
      REQUIRED_GH_TOKEN: ${{ secrets.GH_TOKEN }}
      REQUIRED_GH_APP_ID: ${{ secrets.GH_APP_ID }}
      REQUIRED_GH_PRIVATE_KEY: ${{ secrets.GH_PRIVATE_KEY }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${REQUIRED_GH_TOKEN:-}" || {
            echo "::error::Missing required secret GH_TOKEN — Central GitHub token used to check out the target repository and publish its release assets."
            exit 1
          }
          test -n "${REQUIRED_GH_APP_ID:-}" || {
            echo "::error::Missing required secret GH_APP_ID — GitHub App that writes the Check Run mirroring this run onto the target commit."
            exit 1
          }
          test -n "${REQUIRED_GH_PRIVATE_KEY:-}" || {
            echo "::error::Missing required secret GH_PRIVATE_KEY — Private key of that GitHub App, used to mint its installation token."
            exit 1
          }

  central_check_start:
    needs: policy_secret_preflight
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
      - name: Mint target check token
        id: target-check-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz
      - name: Post target check run
        if: ${{ always() && steps.target-check-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.target-check-token.outputs.token }}
          RUN_READ_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_PHASE: start
          CHECK_NAME: ${{ inputs.target_workflow_name || inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set +e\nwarn() { echo \"::warning::Target check run skipped: $1\"; exit 0; }\n[[ -n \"${TARGET_REPOSITORY:-}\" && -n \"${TARGET_CHECK_SHA:-}\" ]] || warn \"no target commit\"\ntitle=\"$CHECK_NAME\"\ntext=\"\"\nif [[ \"$CHECK_PHASE\" == \"start\" ]]; then\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$url,external_id:$ext,output:{title:$name,summary:(\"Running in HereLiesAz/workflows: \" + $url)}}')\"\nelse\n  if [[ \"$FAILED\" == \"true\" ]]; then\n    conclusion=\"failure\"\n    jobs=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api --paginate \"repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs\" --jq '.jobs[]' 2>/dev/null | jq -s '.')\"\n    [[ -n \"$jobs\" ]] || jobs=\"[]\"\n    failed=\"$(jq -r '[.[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\")\n      | \"- **\\(.name)** (\\(.conclusion)): \" + ([.steps[]? | select(.conclusion == \"failure\") | .name] | join(\", \") | if . == \"\" then \"no failed step reported\" else . end)\n      + \" — [log](\\(.html_url))\"] | join(\"\\n\")' <<<\"$jobs\")\"\n    first_id=\"$(jq -r '[.[] | select(.conclusion == \"failure\")][0].id // empty' <<<\"$jobs\")\"\n    if [[ -n \"$first_id\" ]]; then\n      tail_log=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api \"repos/${GITHUB_REPOSITORY}/actions/jobs/${first_id}/logs\" 2>/dev/null \\\n        | sed -E 's/^[0-9T:.-]+Z //' | grep -v '^##\\[group\\]\\|^##\\[endgroup\\]' | tail -n 60)\"\n      [[ -n \"$tail_log\" ]] && text=\"$(printf 'Last lines of the first failed job:\\n\\n~~~text\\n%s\\n~~~\\n' \"${tail_log:0:60000}\")\"\n    fi\n    summary=\"$(printf 'Central run failed: %s\\n\\n%s\\n' \"$DETAILS_URL\" \"${failed:-No failed job reported.}\")\"\n    title=\"$CHECK_NAME failed\"\n  else\n    conclusion=\"success\"\n    summary=\"Central run succeeded: $DETAILS_URL\"\n  fi\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    --arg conclusion \"$conclusion\" --arg title \"$title\" --arg summary \"${summary:0:65000}\" --arg text \"$text\" \\\n    '{name:$name,head_sha:$sha,status:\"completed\",conclusion:$conclusion,details_url:$url,external_id:$ext,output:({title:$title,summary:$summary} + (if $text == \"\" then {} else {text:$text} end))}')\"\nfi\n# Each phase posts its own Check Run under the same name; GitHub shows the latest one,\n# so the finish phase needs no id handed over from the start job.\ngh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$body\" >/dev/null \\\n  || echo \"::warning::Target check run skipped: GitHub refused the check run\"\n\n# Release/deploy failures also go to one open issue per workflow: opened on the\n# first failure, commented on each repeat. Successes never touch issues.\n[[ \"$CHECK_PHASE\" == \"finish\" && \"${FILE_ISSUES:-}\" == \"true\" && \"${conclusion:-}\" == \"failure\" ]] || exit 0\nlabel=\"central-run-failure\"\nissue_title=\"Central run failing: $CHECK_NAME\"\nissue=\"$(gh api \"repos/${TARGET_REPOSITORY}/issues?state=open&labels=${label}&per_page=100\" 2>/dev/null \\\n  | jq -r --arg t \"$issue_title\" '[.[] | select(.title == $t)][0].number // empty')\"\nreport=\"$(printf '%s\\n\\nCommit: %s\\n\\n%s\\n' \"$summary\" \"$TARGET_CHECK_SHA\" \"$text\")\"\nif [[ -n \"$issue\" ]]; then\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"$report\" >/dev/null \\\n    || warn \"could not comment on issue #$issue\"\nelse\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/labels\" -f name=\"$label\" -f color=\"000000\" \\\n    -f description=\"A release or deploy run in HereLiesAz/workflows failed for this repository.\" >/dev/null 2>&1\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues\" -f title=\"$issue_title\" -f body=\"$report\" -f \"labels[]=$label\" >/dev/null \\\n    || warn \"could not open a failure issue\"\nfi\n"
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
  release:
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: ${{ inputs.target_repository_name }}
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
    steps:
      # Before any target code (npm install / build scripts) runs.
      - name: Validate target release ref
        if: ${{ inputs.target_ref_type != 'tag' }}
        shell: bash
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          echo "::error::AZP package release requires a tag ref; got ${TARGET_REF}" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Resolve package profile
        env:
          PROFILE_JSON: ${{ inputs.purpose_profile_json }}
        shell: bash
        run: |
          set -euo pipefail
          glob="$(jq -r '.packages_glob // "*.azp"' <<<"$PROFILE_JSON")"
          test -n "$glob" || { echo "::error::AZP package profile has an empty packages_glob" >&2; exit 1; }
          {
            echo "PACKAGES_GLOB<<AZPEOF"
            printf '%s\n' "$glob"
            echo "AZPEOF"
          } >> "$GITHUB_ENV"
      - name: Pack AZP packages
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          count=0
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            for f in $pattern; do [ -e "$f" ] && count=$((count + 1)); done
          done <<< "$PACKAGES_GLOB"
          test "$count" -gt 0 || { echo "::error::no .azp packages matched $PACKAGES_GLOB" >&2; exit 1; }
          echo "packed $count .azp package(s)"
      - name: Validate target release ref
        if: ${{ inputs.target_ref_type != 'tag' }}
        shell: bash
        env:
          # Passed through the environment: a branch name can contain $( ), backticks and
          # quotes, and ${{ }} is substituted into the script text before the shell parses it.
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          echo "::error::AZP package release requires a tag ref; got ${TARGET_REF}" >&2
          exit 1
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ env.PACKAGES_GLOB }}
          repository: ${{ inputs.target_repository }}
          token: ${{ secrets.GH_TOKEN }}
          tag_name: ${{ inputs.target_ref_name }}
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
      - name: Mint target check token
        id: target-check-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz
      - name: Post target check run
        if: ${{ always() && steps.target-check-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.target-check-token.outputs.token }}
          RUN_READ_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_PHASE: finish
          CHECK_NAME: ${{ inputs.target_workflow_name || inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          FILE_ISSUES: 'true'
        shell: bash
        run: "set +e\nwarn() { echo \"::warning::Target check run skipped: $1\"; exit 0; }\n[[ -n \"${TARGET_REPOSITORY:-}\" && -n \"${TARGET_CHECK_SHA:-}\" ]] || warn \"no target commit\"\ntitle=\"$CHECK_NAME\"\ntext=\"\"\nif [[ \"$CHECK_PHASE\" == \"start\" ]]; then\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$url,external_id:$ext,output:{title:$name,summary:(\"Running in HereLiesAz/workflows: \" + $url)}}')\"\nelse\n  if [[ \"$FAILED\" == \"true\" ]]; then\n    conclusion=\"failure\"\n    jobs=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api --paginate \"repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs\" --jq '.jobs[]' 2>/dev/null | jq -s '.')\"\n    [[ -n \"$jobs\" ]] || jobs=\"[]\"\n    failed=\"$(jq -r '[.[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\")\n      | \"- **\\(.name)** (\\(.conclusion)): \" + ([.steps[]? | select(.conclusion == \"failure\") | .name] | join(\", \") | if . == \"\" then \"no failed step reported\" else . end)\n      + \" — [log](\\(.html_url))\"] | join(\"\\n\")' <<<\"$jobs\")\"\n    first_id=\"$(jq -r '[.[] | select(.conclusion == \"failure\")][0].id // empty' <<<\"$jobs\")\"\n    if [[ -n \"$first_id\" ]]; then\n      tail_log=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api \"repos/${GITHUB_REPOSITORY}/actions/jobs/${first_id}/logs\" 2>/dev/null \\\n        | sed -E 's/^[0-9T:.-]+Z //' | grep -v '^##\\[group\\]\\|^##\\[endgroup\\]' | tail -n 60)\"\n      [[ -n \"$tail_log\" ]] && text=\"$(printf 'Last lines of the first failed job:\\n\\n~~~text\\n%s\\n~~~\\n' \"${tail_log:0:60000}\")\"\n    fi\n    summary=\"$(printf 'Central run failed: %s\\n\\n%s\\n' \"$DETAILS_URL\" \"${failed:-No failed job reported.}\")\"\n    title=\"$CHECK_NAME failed\"\n  else\n    conclusion=\"success\"\n    summary=\"Central run succeeded: $DETAILS_URL\"\n  fi\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    --arg conclusion \"$conclusion\" --arg title \"$title\" --arg summary \"${summary:0:65000}\" --arg text \"$text\" \\\n    '{name:$name,head_sha:$sha,status:\"completed\",conclusion:$conclusion,details_url:$url,external_id:$ext,output:({title:$title,summary:$summary} + (if $text == \"\" then {} else {text:$text} end))}')\"\nfi\n# Each phase posts its own Check Run under the same name; GitHub shows the latest one,\n# so the finish phase needs no id handed over from the start job.\ngh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$body\" >/dev/null \\\n  || echo \"::warning::Target check run skipped: GitHub refused the check run\"\n\n# Release/deploy failures also go to one open issue per workflow: opened on the\n# first failure, commented on each repeat. Successes never touch issues.\n[[ \"$CHECK_PHASE\" == \"finish\" && \"${FILE_ISSUES:-}\" == \"true\" && \"${conclusion:-}\" == \"failure\" ]] || exit 0\nlabel=\"central-run-failure\"\nissue_title=\"Central run failing: $CHECK_NAME\"\nissue=\"$(gh api \"repos/${TARGET_REPOSITORY}/issues?state=open&labels=${label}&per_page=100\" 2>/dev/null \\\n  | jq -r --arg t \"$issue_title\" '[.[] | select(.title == $t)][0].number // empty')\"\nreport=\"$(printf '%s\\n\\nCommit: %s\\n\\n%s\\n' \"$summary\" \"$TARGET_CHECK_SHA\" \"$text\")\"\nif [[ -n \"$issue\" ]]; then\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"$report\" >/dev/null \\\n    || warn \"could not comment on issue #$issue\"\nelse\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/labels\" -f name=\"$label\" -f color=\"000000\" \\\n    -f description=\"A release or deploy run in HereLiesAz/workflows failed for this repository.\" >/dev/null 2>&1\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues\" -f title=\"$issue_title\" -f body=\"$report\" -f \"labels[]=$label\" >/dev/null \\\n    || warn \"could not open a failure issue\"\nfi\n"
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
