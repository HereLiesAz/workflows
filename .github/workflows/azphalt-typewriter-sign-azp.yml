  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sign released .azp assets
        env:
          AZP_PRIVATE_KEY: ${{ secrets.AZP_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ fromJSON(inputs.target_event_json).release.tag_name }}
        run: "if [ -z \"$AZP_PRIVATE_KEY\" ]; then echo \"AZP_PRIVATE_KEY not set - skipping\"; exit 0; fi\nTAG=\"${TAG:-$(gh release view -R \"$TARGET_REPOSITORY\" --json tagName -q .tagName 2>/dev/null)}\"\nif [ -z \"$TAG\" ]; then echo \"no release to sign\"; exit 0; fi\nnpm install --no-audit --no-fund @azphalt/azp\nmkdir sign && cd sign\nif ! gh release download \"$TAG\" -R \"$TARGET_REPOSITORY\" -p '*.azp'; then echo \"no .azp assets\"; exit 0; fi\nnode -e '\n  const fs = require(\"fs\");\n  const { signAzp } = require(\"@azphalt/azp\");\n  const pk = process.env.AZP_PRIVATE_KEY;\n  let n = 0;\n  for (const f of fs.readdirSync(\".\").filter((x) => x.endsWith(\".azp\"))) {\n    fs.writeFileSync(f, signAzp(fs.readFileSync(f), { privateKey: pk }));\n    console.log(\"signed \" + f);\n    n++;\n  }\n  if (!n) console.log(\"no .azp files downloaded\");\n'\ngh release upload \"$TAG\" *.azp --clobber -R \"$TARGET_REPOSITORY\" || true\n"
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
    environment: azphalt-typewriter
  central_check_finish:
