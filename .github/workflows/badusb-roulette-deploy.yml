jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from HereLiesAz/workflows.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.target_head_ref }}
          repository: ${{ inputs.target_repository }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v1
      - name: Install Digispark Core
        run: "arduino-cli config init\narduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/digistump/arduino-boards-index/master/package_digistump_index.json\narduino-cli core update-index\narduino-cli core install digistump:avr\n"
      - name: Compile Firmware
        run: "# 1. Clean Inventory\n# ONLY delete hex files. Preserve the JS driver.\nrm -f firmware/*.hex\necho \"Hex inventory cleared. Driver preserved.\"\n\n# 2. Verify Driver Exists\nif [ -s \"firmware/micronucleus.js\" ]; then\n  echo \"Driver Check: OK\"\nelse\n  echo \"CRITICAL: firmware/micronucleus.js is missing!\"\n  echo \"You must commit the driver file to the repository.\"\n  exit 1\nfi\n\n# 3. Compile SINGLE LED\necho \">>> COMPILING SINGLE LED...\"\nmkdir -p build/single_env/Sketch\ncp TheRevolver.ino build/single_env/Sketch/Sketch.ino\ncp roulette_cfg.h build/single_env/Sketch/roulette_cfg.h\n\n# Regex replacement to force MODE 0 regardless of current state\nsed -i 's/#define DUAL_LED_MODE .*/#define DUAL_LED_MODE 0/' build/single_env/Sketch/roulette_cfg.h\n\narduino-cli compile --fqbn digistump:avr:digispark-tiny --output-dir ./build/single build/single_env/Sketch\n\nif [ -f \"./build/single/Sketch.ino.hex\" ]; then\n  cp \"./build/single/Sketch.ino.hex\" \"./firmware/roulette_single.hex\"\nelse\n  echo \"CRITICAL: Single Hex Failed to Build\"\n  exit 1\nfi\n\n# 4. Compile DUAL LED\necho \">>> COMPILING DUAL LED...\"\nmkdir -p build/dual_env/Sketch\ncp TheRevolver.ino build/dual_env/Sketch/Sketch.ino\ncp roulette_cfg.h build/dual_env/Sketch/roulette_cfg.h\n\n# Regex replacement to force MODE 1 regardless of current state\nsed -i 's/#define DUAL_LED_MODE .*/#define DUAL_LED_MODE 1/' build/dual_env/Sketch/roulette_cfg.h\n\narduino-cli compile --fqbn digistump:avr:digispark-tiny --output-dir ./build/dual build/dual_env/Sketch\n\nif [ -f \"./build/dual/Sketch.ino.hex\" ]; then\n  cp \"./build/dual/Sketch.ino.hex\" \"./firmware/roulette_dual.hex\"\nelse\n  echo \"CRITICAL: Dual Hex Failed to Build\"\n  exit 1\nfi\n"
      - name: Commit Artifacts
        run: "git config --global user.name \"GitHub Actions\"\ngit config --global user.email \"actions@github.com\"\ngit add firmware/*.hex\ngit diff --quiet && git diff --staged --quiet || (git commit -m \"Reload: Updated Firmware [skip ci]\" && git push)\n"
      - name: Stage & Deploy Website
        run: "mkdir -p public\ncp index.html public/index.html\n# Copy the firmware folder (containing .hex AND .js)\ncp -r firmware public/firmware\n# EXPOSE SOURCE CODE FOR GENERATOR\ncp TheRevolver.ino public/firmware/TheRevolver.ino\ncp roulette_cfg.h public/firmware/roulette_cfg.h\n\ntouch public/.nojekyll\n"
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./public
          commit_message: 'Deploy: Unified Release'
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    permissions:
      contents: write
    environment: BadUSB-Roulette
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Central workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Central workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
run-name: BadUSB-Roulette · Deploy System (Unified)
