name: Cancel Selected Workflow Runs

on:
  push:
    branches: [main]
    paths:
      - '.github/cancel-runs.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4

      - name: Cancel requested runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t run_ids < <(jq -r '.run_ids[]' .github/cancel-runs.json)
          for run_id in "${run_ids[@]}"; do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq .status)"
            if [[ "$status" == "completed" ]]; then
              echo "Run $run_id already completed; nothing to cancel."
              continue
            fi
            echo "Cancelling run $run_id (status=$status)"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null
          done
