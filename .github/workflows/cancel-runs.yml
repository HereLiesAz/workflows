name: Cancel Selected Workflow Runs

on:
  push:
    branches: [main]
    paths:
      - '.github/cancel-runs.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mint organization-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz
          permission-actions: write
          permission-contents: read

      - name: Cancel and force-cancel requested runs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_repository="$(jq -r '.target_repository // env.GITHUB_REPOSITORY' .github/cancel-runs.json)"
          mapfile -t run_ids < <(jq -r '.run_ids[]? | tostring' .github/cancel-runs.json)

          echo "Target repository: $target_repository"
          echo "Runs requested: ${#run_ids[@]}"

          for run_id in "${run_ids[@]}"; do
            status="$(gh api "repos/${target_repository}/actions/runs/${run_id}" --jq .status 2>/dev/null || echo missing)"
            echo "Run ${run_id}: ${status}"
            if [[ "$status" == "missing" || "$status" == "completed" ]]; then
              continue
            fi

            gh api --method POST "repos/${target_repository}/actions/runs/${run_id}/cancel" >/dev/null || true
            sleep 1

            status="$(gh api "repos/${target_repository}/actions/runs/${run_id}" --jq .status 2>/dev/null || echo missing)"
            if [[ "$status" != "completed" && "$status" != "missing" ]]; then
              gh api --method POST "repos/${target_repository}/actions/runs/${run_id}/force-cancel" >/dev/null || true
            fi
          done

      - name: Verify requested runs stopped
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          target_repository="$(jq -r '.target_repository // env.GITHUB_REPOSITORY' .github/cancel-runs.json)"
          failed=0
          mapfile -t run_ids < <(jq -r '.run_ids[]? | tostring' .github/cancel-runs.json)
          for run_id in "${run_ids[@]}"; do
            status="$(gh api "repos/${target_repository}/actions/runs/${run_id}" --jq .status 2>/dev/null || echo missing)"
            conclusion="$(gh api "repos/${target_repository}/actions/runs/${run_id}" --jq '.conclusion // ""' 2>/dev/null || true)"
            echo "Final: ${run_id} status=${status} conclusion=${conclusion}"
            if [[ "$status" != "completed" && "$status" != "missing" ]]; then
              failed=1
            fi
          done
          exit "$failed"
