# Generated shared catalog workflow. Do not edit by hand.
# catalog-source: catalog/3eb95a15ee831bf79f96ce87a415c1ceae9172acd87167de421fa48cafc6f978
name: Publish to Google Play [shared catalog]
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: read
env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
  TARGET_BASE_REF: ${{ inputs.target_base_ref }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
  TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
  TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
  TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Inject Google Services
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: "if [ -n \"$GOOGLE_SERVICES\" ]; then\n  echo \"Google Services secret found. Creating google-services.json...\"\n  cat <<< \"$GOOGLE_SERVICES\" > app/google-services.json\nelse\n  echo \"Warning: GOOGLE_SERVICES secret not found. Skipping injection.\"\nfi\n"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Prepare Keystore from Secrets
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_RSA: ${{ secrets.KEYSTORE_RSA }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: "set -e\nPRIVATE_KEY=\"${KEYSTORE_PRIVATE:-$KEYSTORE_RSA}\"\n\nif [ -n \"$PRIVATE_KEY\" ] && [ -n \"$KEYSTORE_CHAIN\" ]; then\n   echo \"Reconstructing Keystore from Secrets...\"\n   echo \"$PRIVATE_KEY\" > private.key\n   echo \"$KEYSTORE_CHAIN\" > chain.crt\n\n   PASSIN_ARG=\"\"\n   if [ -n \"$KEY_PASSWORD\" ]; then\n      PASSIN_ARG=\"-passin env:KEY_PASSWORD\"\n   fi\n\n   openssl pkcs12 -export -in chain.crt -inkey private.key -out release.keystore \\\n     -name \"$KEY_ALIAS\" -passout pass:\"$KEYSTORE_PASSWORD\" $PASSIN_ARG -legacy\n\n   rm -f private.key chain.crt\n\n   echo \"Verifying generated keystore...\"\n   keytool -list -keystore release.keystore -storepass \"$KEYSTORE_PASSWORD\" -v\n\n   echo \"KEYSTORE_FILE=$(pwd)/release.keystore\" >> $GITHUB_ENV\n   # Gradle's release signingConfig reads KEY_PASSWORD; OpenSSL uses the store password.\n   echo \"KEY_PASSWORD<<EOF\" >> $GITHUB_ENV\n   echo \"$KEYSTORE_PASSWORD\" >> $GITHUB_ENV\n   echo \"EOF\" >> $GITHUB_ENV\nelse\n   echo \"::error::KEYSTORE_PRIVATE/KEYSTORE_RSA or KEYSTORE_CHAIN secret is missing — cannot sign the bundle.\"\n   exit 1\nfi\n"
      - name: Build signed App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: "set -e\n# Strictly-increasing versionCode for Play: the commit count only ever grows.\nVERSION_BUILD=$(git rev-list --count HEAD)\necho \"versionBuild (versionCode source) = $VERSION_BUILD\"\n./gradlew bundleRelease -PversionBuild=\"$VERSION_BUILD\" --build-cache\n"
      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Verify bundle declares no AD_ID permission
        run: "set -euo pipefail\nBT_VERSION=1.17.2\ncurl -fsSL -o bundletool.jar \\\n  \"https://github.com/google/bundletool/releases/download/${BT_VERSION}/bundletool-all-${BT_VERSION}.jar\"\n\nAAB=$(find app/build/outputs/bundle -name \"*.aab\" | head -n 1)\nif [ -z \"$AAB\" ]; then echo \"::error::no .aab produced!\"; exit 1; fi\necho \"Bundle: $AAB\"\n\n# Every top-level directory holding manifest/AndroidManifest.xml is a bundle module\n# (base, feature:stats, feature:github, ...). Check all of them, not just base.\nMODULES=$(unzip -Z1 \"$AAB\" | sed -n 's#^\\([^/]*\\)/manifest/AndroidManifest\\.xml$#\\1#p' | sort -u)\nif [ -z \"$MODULES\" ]; then echo \"::error::no module manifests found in $AAB\"; exit 1; fi\necho \"Modules: $(echo \"$MODULES\" | tr '\\n' ' ')\"\n\nDIRTY=0\nfor M in $MODULES; do\n  # bundletool decodes the proto-encoded manifest back to XML, so this reads the exact\n  # permission set Play will see for that module.\n  MANIFEST=$(java -jar bundletool.jar dump manifest --bundle=\"$AAB\" --module=\"$M\")\n  if echo \"$MANIFEST\" | grep -q \"com.google.android.gms.permission.AD_ID\"; then\n    echo \"::error::module '$M' declares com.google.android.gms.permission.AD_ID\"\n    echo \"$MANIFEST\" | grep -n \"uses-permission\" || true\n    DIRTY=1\n  else\n    echo \"module '$M': clean\"\n  fi\ndone\n\nif [ \"$DIRTY\" -ne 0 ]; then\n  echo \"::error::Bundle carries AD_ID. Either remove the dependency that merges it in, or\"\n  echo \"::error::change the Play Console advertising-ID declaration to \\\"Yes\\\".\"\n  exit 1\nfi\necho \"No module declares AD_ID — the advertising-ID declaration may stay \\\"No\\\".\"\n"
      - name: Publish to Google Play
        if: ${{ fromJSON(inputs.target_inputs_json).publish }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hereliesaz.logkitty
          releaseFiles: app/build/outputs/bundle/release/*.aab
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          track: ${{ fromJSON(inputs.target_inputs_json).track }}
          status: ${{ fromJSON(inputs.target_inputs_json).status }}
      - name: Build universal APK from bundle
        if: ${{ fromJSON(inputs.target_inputs_json).publish && success() }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: "set -e\n# Already fetched by the AD_ID verification step; re-fetch only if that changed.\nBT_VERSION=1.17.2\nif [ ! -f bundletool.jar ]; then\n  curl -fsSL -o bundletool.jar \\\n    \"https://github.com/google/bundletool/releases/download/${BT_VERSION}/bundletool-all-${BT_VERSION}.jar\"\nfi\n\nAAB=$(find app/build/outputs/bundle -name \"*.aab\" | head -n 1)\nif [ -z \"$AAB\" ]; then echo \"Error: no .aab produced!\"; exit 1; fi\necho \"Bundle: $AAB\"\n\njava -jar bundletool.jar build-apks --bundle=\"$AAB\" --output=universal.apks \\\n  --mode=universal --overwrite \\\n  --ks=\"$KEYSTORE_FILE\" --ks-pass=pass:\"$KEYSTORE_PASSWORD\" \\\n  --ks-key-alias=\"$KEY_ALIAS\" --key-pass=pass:\"$KEY_PASSWORD\"\n\nunzip -o -p universal.apks universal.apk > app-universal.apk\nls -la app-universal.apk\necho \"UNIVERSAL_APK=$(pwd)/app-universal.apk\" >> $GITHUB_ENV\n"
      - name: Publish APK to GitHub Releases
        if: ${{ fromJSON(inputs.target_inputs_json).publish && success() }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: "set -e\nBUILD_NUMBER=$(git rev-list --count HEAD)\n\nMAJOR=$(grep 'major=' version.properties | cut -d'=' -f2)\nMINOR=$(grep 'minor=' version.properties | cut -d'=' -f2)\n# Patch = commits since the minor= line last changed (matches build-and-release.yml).\nMINOR_COMMIT=$(git blame -L '/minor=/',+1 version.properties | awk '{print $1}' | tr -d '^')\nif [ -n \"$MINOR_COMMIT\" ]; then\n  PATCH=$(git rev-list --count \"$MINOR_COMMIT\"..HEAD)\nelse\n  PATCH=$(grep 'patch=' version.properties | cut -d'=' -f2)\nfi\nVERSION_NAME=\"$MAJOR.$MINOR.$PATCH.$BUILD_NUMBER\"\nTAG_NAME=\"v${VERSION_NAME}\"\n\nif [ -z \"$UNIVERSAL_APK\" ] || [ ! -f \"$UNIVERSAL_APK\" ]; then\n  echo \"Error: universal APK not found!\"; exit 1\nfi\nAPK_FILE=\"LogKitty-${VERSION_NAME}.apk\"\ncp \"$UNIVERSAL_APK\" \"$APK_FILE\"\n\n# A finished production rollout is a real release; everything else (internal/alpha/beta or\n# a draft) is a prerelease.\nPRERELEASE_FLAG=\"--prerelease\"\nif [ \"${{ fromJSON(inputs.target_inputs_json).track }}\" = \"production\" ] && [ \"${{ fromJSON(inputs.target_inputs_json).status }}\" = \"completed\" ]; then\n  PRERELEASE_FLAG=\"\"\nfi\n\nNOTES=\"Signed APK for the build published to Google Play (track: ${{ fromJSON(inputs.target_inputs_json).track }}, status: ${{ fromJSON(inputs.target_inputs_json).status }}).\n\nBuilt from commit ${TARGET_SHA}.\"\n\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit tag -fa \"$TAG_NAME\" -m \"Play release $VERSION_NAME\"\ngit push origin \"$TAG_NAME\" --force\n\nif gh release view \"$TAG_NAME\" > /dev/null 2>&1; then\n  echo \"Updating existing release...\"\n  gh release edit \"$TAG_NAME\" $PRERELEASE_FLAG \\\n    --title \"LogKitty ${VERSION_NAME}\" \\\n    --notes \"$NOTES\" \\\n    --target \"$TARGET_SHA\"\n  gh release upload \"$TAG_NAME\" \"$APK_FILE\" --clobber\nelse\n  echo \"Creating new release...\"\n  gh release create \"$TAG_NAME\" \"$APK_FILE\" $PRERELEASE_FLAG \\\n    --title \"LogKitty ${VERSION_NAME}\" \\\n    --notes \"$NOTES\" \\\n    --target \"$TARGET_SHA\"\nfi\n"
      - name: Destroy Keystore
        if: always()
        run: rm -f release.keystore
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
