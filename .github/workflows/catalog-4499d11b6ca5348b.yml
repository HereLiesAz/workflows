          QUICLOC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          QUICLOC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          QUICLOC_REQUIRE_SIGNING: 'true'
        run: ./gradlew bundleRelease
      - name: Collect signed AAB
        if: inputs.target_event_name == 'push'
        id: collect-aab
        run: "set -euo pipefail\nmkdir -p signed\naab=$(find app/build/outputs/bundle/release -name \"*.aab\" | head -n1)\nif [ -z \"$aab\" ]; then\n  echo \"::error::Expected a signed AAB. Found none.\"\n  exit 1\nfi\nversion=$(./gradlew -q :app:printVersionName)\ncp \"$aab\" \"signed/QuicLoc-v${version}.aab\"\necho \"SIGNED_AAB=signed/QuicLoc-v${version}.aab\" >> \"$GITHUB_ENV\"\necho \"VERSION_NAME=$version\" >> \"$GITHUB_ENV\"\n"
