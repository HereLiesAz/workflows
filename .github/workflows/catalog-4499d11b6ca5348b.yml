    permissions:
      contents: write
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v4
        with:
          name: signed-release
          path: signed
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: signed/*
