      - name: Resolve the versionCode
        if: true
        run: "set -euo pipefail\ncommitted=$(grep -E '^VERSION_D=' app/version.properties | cut -d= -f2 | tr -d '[:space:]')\nplay_max=${PLAY_MAX_VERSION_CODE:-0}\nnext=$((committed + 1))\necho \"version.properties VERSION_D=$committed -> would build $next\"\necho \"Play's highest versionCode: $play_max\"\n\nif [ \"$next\" -gt \"$play_max\" ]; then\n  echo \"$next clears Play. Building that.\"\n  exit 0\nfi\n\nif [ \"auto\" = \"strict\" ]; then\n  echo \"::error::versionCode $next would not clear Play, which already has $play_max. Set VERSION_D=$play_max in app/version.properties and commit (the build adds 1), or re-run in auto mode.\"\n  exit 1\nfi\n\n# Play is ahead of the file — take the next code after Play's.\nsed -i \"s/^VERSION_D=.*/VERSION_D=$play_max/\" app/version.properties\necho \"::notice::version.properties was behind Play ($committed vs $play_max). Building versionCode $((play_max + 1)) instead; it will be committed back after publishing.\"\n"
      - name: Build signed release bundle
        env:
          QUICLOC_KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore-path }}
          QUICLOC_KEYSTORE_TYPE: ${{ steps.keystore.outputs.store-type }}
          QUICLOC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          QUICLOC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          QUICLOC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          QUICLOC_REQUIRE_SIGNING: 'true'
        run: ./gradlew bundleRelease
      - name: Verify the bundle is signed by the expected key
        run: "set -euo pipefail\naab=$(find app/build/outputs/bundle/release -name \"*.aab\" | head -n1)\n[ -n \"$aab\" ] || { echo \"::error::No .aab was produced.\"; exit 1; }\necho \"AAB_PATH=$aab\" >> \"$GITHUB_ENV\"\n"
      - name: Check bundle signature
        uses: ./.github/actions/verify-android-signature
        with:
          artifact: ${{ env.AAB_PATH }}
          expected-sha256: ${{ steps.keystore.outputs.sha256 }}
      - name: Get app version
        run: "echo \"VERSION_NAME=$(./gradlew -q :app:printVersionName)\" >> \"$GITHUB_ENV\"\necho \"VERSION_CODE=$(./gradlew -q :app:printVersionCode)\" >> \"$GITHUB_ENV\"\n"
      - name: Confirm the built versionCode clears Play
        if: true
        run: "set -euo pipefail\nplay_max=${PLAY_MAX_VERSION_CODE:-0}\necho \"Built versionCode $VERSION_CODE; Play's highest is $play_max.\"\nif [ \"$VERSION_CODE\" -le \"$play_max\" ]; then\n  echo \"::error::The built bundle is versionCode $VERSION_CODE but Play already has $play_max. Refusing to upload — it could not be rolled out to any existing user. Set VERSION_D=$play_max in app/version.properties and commit.\"\n  exit 1\nfi\n"
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicloc-release-aab-${{ env.VERSION_NAME }}
          path: "app/build/outputs/bundle/release/*.aab\napp/version.properties\n"
          if-no-files-found: error
      - name: Upload R8 mapping (deobfuscation key)
        uses: actions/upload-artifact@v4
        with:
          name: quicloc-mapping-${{ env.VERSION_NAME }}-vc${{ env.VERSION_CODE }}
          path: "app/build/outputs/mapping/release/mapping.txt\napp/build/outputs/mapping/release/missingRules.txt\n**/build/outputs/mapping/release/mapping.txt\n"
          if-no-files-found: error
          retention-days: 90
      - name: Mint a Play API token (publish)
        id: publish-token
        if: true
        uses: ./.github/actions/play-api-token
        with:
          service-account-json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      - name: Publish to Google Play
        id: play
        if: true
        uses: ./.github/actions/play-publish
        with:
          package-name: ${{ env.APP_ID }}
          aab: ${{ env.AAB_PATH }}
          token-file: ${{ steps.publish-token.outputs.token-file }}
          expected-version-code: ${{ env.VERSION_CODE }}
          completed-tracks: internal
          draft-tracks: alpha beta production
          release-name: ${{ env.VERSION_NAME }}
          release-notes: ''
      - name: Say what landed where
        if: true
        env:
          VC: ${{ steps.play.outputs.version-code }}
          ROLLED: ${{ steps.play.outputs.rolled-out }}
          DRAFTED: ${{ steps.play.outputs.drafted }}
          REQUESTED_DRAFTS: alpha beta production
        run: "set -uo pipefail\necho \"versionCode $VC rolled out on: ${ROLLED:-none}\"\nif [ -n \"$DRAFTED\" ]; then\n  echo \"Drafts staged (same bundle) on: $DRAFTED\"\n  echo \"Promote one in the console when you're ready — no rebuild needed.\"\n  echo \"A draft is not a release: nobody on those tracks receives it until it is promoted.\"\nelif [ -n \"$REQUESTED_DRAFTS\" ]; then\n  echo \"::warning::Draft tracks were requested ($REQUESTED_DRAFTS) but none were staged. Check the warnings above for which ones Play refused.\"\nfi\n{\n  echo \"### Play release\"\n  echo \"\"\n  echo \"- versionCode: \\`$VC\\`\"\n  echo \"- Rolled out: ${ROLLED:-none}\"\n  echo \"- Staged as draft: ${DRAFTED:-none}\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
      - name: Commit the versionCode that shipped
        if: ${{ fromJSON(inputs.target_inputs_json).publish && steps.play.outputs.version-code != '' }}
        continue-on-error: true
        run: "set -uo pipefail\npublished=\"${{ steps.play.outputs.version-code }}\"\nfor attempt in 1 2 3; do\n  git fetch origin main --quiet || true\n  # The build mutated version.properties on disk; start from main.\n  git reset --hard origin/main --quiet\n  current=$(grep -E '^VERSION_D=' app/version.properties | cut -d= -f2 | tr -d '[:space:]')\n  if [ \"$current\" -ge \"$published\" ]; then\n    echo \"main already has VERSION_D=$current (>= $published) — nothing to commit.\"\n    exit 0\n  fi\n  sed -i \"s/^VERSION_D=.*/VERSION_D=$published/\" app/version.properties\n  git -c user.name=\"github-actions[bot]\" \\\n      -c user.email=\"41898282+github-actions[bot]@users.noreply.github.com\" \\\n      commit -q -am \"chore: versionCode $published shipped to Play [skip ci]\"\n  if git push --quiet origin HEAD:main; then\n    echo \"Committed VERSION_D=$published to main.\"\n    exit 0\n  fi\n  echo \"Push attempt $attempt failed (main probably moved) — retrying.\"\n  sleep $((attempt * 3))\ndone\necho \"::warning::Published versionCode $published but could not commit the bump to main. Set VERSION_D=$published in app/version.properties by hand. Releases still work without it — auto mode reads the next code from Play.\"\n{\n  echo \"### Commit this by hand\"\n  echo \"\"\n  echo \"versionCode **$published** shipped, but the bump could not be pushed to \\`main\\`.\"\n  echo \"Set \\`VERSION_D=$published\\` in \\`app/version.properties\\`.\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
    if: ${{ (startsWith(inputs.target_ref, 'refs/tags/v')) && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}
    needs:
      - central_check_start
      - build
      - release
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - test
      - build
      - release
      - publish-play-main__build-publish
      - publish-play-tag__build-publish
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
