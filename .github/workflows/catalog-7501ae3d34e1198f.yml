# Generated shared catalog workflow. Do not edit by hand.
# catalog-source: catalog/7501ae3d34e1198f9ae2febda6de93161a4db82d54d840f65b9fb38b66f25729
name: Build Desktop Executables [shared catalog]
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: read
env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
  TARGET_BASE_REF: ${{ inputs.target_base_ref }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
  TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
  TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
  TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
concurrency:
  group: ${{ inputs.target_workflow_name }}-${{ inputs.target_ref }}
  cancel-in-progress: true
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  build:
    name: Package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: disabled
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils rpm
      - name: Resolve installer version
        id: ver
        shell: bash
        run: "if [[ \"${TARGET_REF_TYPE}\" == \"tag\" && \"${TARGET_REF_NAME}\" == desktop-v* ]]; then\n  V=\"${TARGET_REF_NAME#desktop-v}\"\nelif [[ -n \"${{ fromJSON(inputs.target_event_json).fromJSON(inputs.target_inputs_json).version }}\" ]]; then\n  V=\"${{ fromJSON(inputs.target_event_json).fromJSON(inputs.target_inputs_json).version }}\"\nelse\n  MAJOR=$(grep '^versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\n  MINOR=$(grep '^versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\n  PATCH=$(grep '^versionPatch=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\n  MINOR_LAST=$(grep '^versionMinorLast=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\n  [[ \"$MAJOR\" == \"0\" || -z \"$MAJOR\" ]] && MAJOR=1\n  # Mirror app/build.gradle.kts's own reset rule, which this script otherwise has\n  # no idea about: a minor bump always starts its patch at 0, even though the\n  # committed versionPatch here still holds the previous minor's value until an\n  # Android build run (a separate workflow) rewrites and commits it back.\n  if [[ \"$MINOR\" != \"$MINOR_LAST\" ]]; then\n    PATCH=0\n  fi\n  V=\"${MAJOR}.${MINOR:-0}.${PATCH:-0}\"\nfi\necho \"version=$V\" >> \"$GITHUB_OUTPUT\"\necho \"Installer version: $V\"\n"
      - name: Build native distributables
        shell: bash
        run: "chmod +x ./gradlew || true\n./gradlew :desktop:packageDistributionForCurrentOS \\\n  -PdesktopPackageVersion=${{ steps.ver.outputs.version }} \\\n  --stacktrace\n"
      - name: Collect installers
        shell: bash
        run: "mkdir -p dist\nfind desktop/build/compose/binaries/main -type f \\\n  \\( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \\) \\\n  -exec cp {} dist/ \\; || true\nls -la dist\n"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcpserved-desktop-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
  release:
    name: Attach installers to release
    needs:
      - central_check_start
      - build
    if: ${{ (inputs.target_event_name == 'push' && (inputs.target_ref == 'refs/heads/main' || startsWith(inputs.target_ref, 'refs/tags/desktop-v'))) && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Resolve release tag
        id: tag
        shell: bash
        run: "if [[ \"${TARGET_REF_TYPE}\" == \"tag\" ]]; then\n  echo \"tag=${TARGET_REF_NAME}\" >> \"$GITHUB_OUTPUT\"\n  echo \"standalone=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  MAJOR=$(grep '^versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\n  MINOR=$(grep '^versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\n  echo \"tag=latest-debug-v${MAJOR}.${MINOR}\" >> \"$GITHUB_OUTPUT\"\n  echo \"standalone=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
      - name: Publish installers
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          STANDALONE: ${{ steps.tag.outputs.standalone }}
        shell: bash
        run: "# download-artifact unpacks each OS's artifact into its own\n# subdirectory, so a recursive glob would also match those directories\n# and `gh release upload` fails with \"is a directory\". Collect only the\n# regular installer files.\nmapfile -t FILES < <(find artifacts -type f)\nif [ ${#FILES[@]} -eq 0 ]; then\n  echo \"No installers to publish.\"; exit 0\nfi\necho \"Publishing ${#FILES[@]} installers to $TAG\"\nif gh release view \"$TAG\" --repo \"$TARGET_REPOSITORY\" > /dev/null 2>&1; then\n  # The release already exists (the APK job on main, or a prior run) —\n  # add/replace only the desktop installers, leaving the APK untouched.\n  gh release upload \"$TAG\" \"${FILES[@]}\" --repo \"$TARGET_REPOSITORY\" --clobber\nelif [ \"$STANDALONE\" = \"true\" ]; then\n  gh release create \"$TAG\" \"${FILES[@]}\" \\\n    --repo \"$TARGET_REPOSITORY\" \\\n    --title \"MCPserved Desktop $TAG\" \\\n    --notes \"Native desktop installers for Windows, macOS, and Linux.\"\nelse\n  # Main-branch run that raced ahead of the APK release job. Create the\n  # shared prerelease tag; the APK job's `gh release edit`/upload later\n  # coexists (different asset names).\n  gh release create \"$TAG\" \"${FILES[@]}\" \\\n    --repo \"$TARGET_REPOSITORY\" \\\n    --prerelease \\\n    --target \"$TARGET_SHA\" \\\n    --title \"Latest Debug Build ($TAG)\" \\\n    --notes \"Auto-build from commit $TARGET_SHA\"\nfi\n"
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - build
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
