# Generated shared catalog workflow. Do not edit by hand.
# catalog-source: catalog/c72c89a9e8b5e1d3e7fd23265c3d9740e790ffa0c09bea464b4b92efa30e70f8
name: Sync platform parity [shared catalog]
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: read
env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
  TARGET_BASE_REF: ${{ inputs.target_base_ref }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
  TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
  TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
  TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/platform-parity-scroll-visibility
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Seed migration fixture
        run: "mkdir -p aznavrail/src/test/java/com/hereliesaz/aznavrail\ncp aznavrail-cmp/src/commonTest/kotlin/com/hereliesaz/aznavrail/AzUnattachedRailTest.kt \\\n   aznavrail/src/test/java/com/hereliesaz/aznavrail/AzUnattachedRailTest.kt\nsed -i \"s/react \\/ 'index.ts'/react \\/ 'index.tsx'/\" .github/scripts/sync_platform_parity.py\n"
      - name: Apply parity sync
        run: python .github/scripts/sync_platform_parity.py
      - name: Synchronize documentation
        run: python .github/scripts/update_platform_parity_docs.py
      - name: Normalize cross-platform API use
        run: "grep -q '^import com.hereliesaz.aznavrail.azUnattachedHostItem$' SampleApp/src/main/java/com/hereliesaz/sampleapp/MainApp.kt || \\\n  sed -i '/^import com.hereliesaz.aznavrail.AzHostActivityLayout$/a import com.hereliesaz.aznavrail.azUnattachedHostItem' SampleApp/src/main/java/com/hereliesaz/sampleapp/MainApp.kt\ngrep -q '^import com.hereliesaz.aznavrail.azUnattachedHostItem$' aznavrail-cmp-demo/src/commonMain/kotlin/com/hereliesaz/aznavrail/demo/App.kt || \\\n  sed -i '/^package com.hereliesaz.aznavrail.demo$/a import com.hereliesaz.aznavrail.azUnattachedHostItem' aznavrail-cmp-demo/src/commonMain/kotlin/com/hereliesaz/aznavrail/demo/App.kt\ngrep -q '^import androidx.compose.ui.unit.dp$' aznavrail-cmp-demo/src/commonMain/kotlin/com/hereliesaz/aznavrail/demo/App.kt || \\\n  sed -i '/^package com.hereliesaz.aznavrail.demo$/a import androidx.compose.ui.unit.dp' aznavrail-cmp-demo/src/commonMain/kotlin/com/hereliesaz/aznavrail/demo/App.kt\npython - <<'PY'\nfrom pathlib import Path\np = Path('aznavrail-cmp/src/commonMain/kotlin/com/hereliesaz/aznavrail/internal/AzUnattachedRail.kt')\ns = p.read_text()\ns = s.replace(\n    '    val configuration = LocalConfiguration.current\\n    val safeViewportHeight = (configuration.screenHeightDp * 0.8f).dp\\n',\n    '    val density = LocalDensity.current\\n    val windowInfo = LocalWindowInfo.current\\n    val safeViewportHeight = with(density) { windowInfo.containerSize.height.toDp() } * 0.8f\\n'\n)\nif 'import androidx.compose.ui.platform.LocalDensity' not in s:\n    s = s.replace('import androidx.compose.ui.platform.LocalConfiguration\\n', 'import androidx.compose.ui.platform.LocalDensity\\nimport androidx.compose.ui.platform.LocalWindowInfo\\n')\nelse:\n    s = s.replace('import androidx.compose.ui.platform.LocalConfiguration\\n', 'import androidx.compose.ui.platform.LocalWindowInfo\\n')\np.write_text(s)\nPY\n"
      - name: Verify CMP library and demo
        run: ./gradlew :aznavrail-cmp:compileCommonMainKotlinMetadata :aznavrail-cmp:compileDebugKotlinAndroid :aznavrail-cmp:desktopMainClasses :aznavrail-cmp:compileKotlinWasmJs :aznavrail-cmp-demo:desktopMainClasses :aznavrail-cmp-demo:compileKotlinWasmJs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify React library
        working-directory: aznavrail-react
        run: "corepack enable\nyarn install --immutable\nyarn typecheck\nyarn test --runInBand\n"
      - name: Verify PWA sample
        working-directory: sample-pwa
        run: "corepack enable\nyarn install --immutable\nyarn build\n"
      - name: Verify Android library and sample
        run: ./gradlew :aznavrail:compileDebugKotlin :SampleApp:assembleDebug
      - name: Commit verified parity sources
        run: "rm -f aznavrail/src/test/java/com/hereliesaz/aznavrail/AzUnattachedRailTest.kt\ngit config user.name 'AzNavRail CI'\ngit config user.email 'actions@users.noreply.github.com'\ngit add aznavrail aznavrail-cmp aznavrail-react SampleApp aznavrail-cmp-demo sample-pwa README.md docs .github/scripts/update_platform_parity_docs.py\ngit diff --cached --quiet && exit 0\ngit commit -m 'Sync platform libraries samples and documentation'\ngit push origin HEAD:feature/platform-parity-scroll-visibility\n"
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - sync-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
