name: Shared · Clear Gradle Cache

on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string

permissions:
  contents: read

env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
  TARGET_BASE_REF: ${{ inputs.target_base_ref }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_EVENT_JSON: ${{ inputs.target_event_json }}

jobs:
  central_check_start:
    runs-on: ubuntu-latest
    outputs:
      check_id: ${{ steps.create.outputs.check_id }}
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo_json="$(gh api "repos/${TARGET_REPOSITORY}")"
          [[ "$(jq -r '.id' <<<"$repo_json")" == "$TARGET_REPOSITORY_ID" ]] || exit 1
          [[ "$(jq -r '.owner.id' <<<"$repo_json")" == "103241502" ]] || exit 1
          [[ "$(jq -r '.owner.login' <<<"$repo_json" | tr '[:upper:]' '[:lower:]')" == "hereliesaz" ]] || exit 1

      - name: Create target check
        id: create
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_NAME: ${{ inputs.target_workflow_name }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg name "$CHECK_NAME" --arg sha "$TARGET_CHECK_SHA" --arg details "$DETAILS_URL" '{name:$name,head_sha:$sha,status:"in_progress",details_url:$details,output:{title:$name,summary:"Running from the shared HereLiesAz/workflows catalog."}}')"
          response="$(gh api --method POST "repos/${TARGET_REPOSITORY}/check-runs" --input - <<<"$payload")"
          echo "check_id=$(jq -r '.id' <<<"$response")" >> "$GITHUB_OUTPUT"

  clear-cache:
    needs: central_check_start
    runs-on: ubuntu-latest
    steps:
      - name: Delete target repository Actions caches
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ids="$(gh api --paginate "repos/${TARGET_REPOSITORY}/actions/caches?per_page=100" --jq '.actions_caches[].id')"
          if [[ -z "$ids" ]]; then
            echo "No caches found for $TARGET_REPOSITORY."
            exit 0
          fi
          while IFS= read -r cache_id; do
            [[ -n "$cache_id" ]] || continue
            gh api --method DELETE "repos/${TARGET_REPOSITORY}/actions/caches/${cache_id}"
            echo "Deleted cache $cache_id"
          done <<<"$ids"

  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - clear-cache
    runs-on: ubuntu-latest
    steps:
      - name: Complete target check
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_ID: ${{ needs.central_check_start.outputs.check_id }}
          CHECK_NAME: ${{ inputs.target_workflow_name }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CHECK_ID:-}" ]] || exit 0
          if [[ "$FAILED" == "true" ]]; then
            conclusion="failure"
            summary="Shared catalog workflow failed. Open the linked central run for details."
          else
            conclusion="success"
            summary="Shared catalog workflow completed successfully."
          fi
          payload="$(jq -n --arg conclusion "$conclusion" --arg title "$CHECK_NAME" --arg summary "$summary" --arg details "$DETAILS_URL" '{status:"completed",conclusion:$conclusion,details_url:$details,output:{title:$title,summary:$summary}}')"
          gh api --method PATCH "repos/${TARGET_REPOSITORY}/check-runs/${CHECK_ID}" --input - <<<"$payload"
