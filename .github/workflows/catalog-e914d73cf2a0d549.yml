# Generated shared catalog workflow. Do not edit by hand.
# catalog-source: catalog/e914d73cf2a0d549818a47278bc6b98a895ffce65647a987b669e6d51af86d30
name: App Release [shared catalog]
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: read
env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
  TARGET_BASE_REF: ${{ inputs.target_base_ref }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
  TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
  TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
  TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump the version
        id: bump
        run: "version=\"$(node tools/version.mjs bump)\"\necho \"version=$version\" >> \"$GITHUB_OUTPUT\"\necho \"Releasing $version\"\n"
      - name: Commit and tag
        id: commit
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: "git config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add version.properties\nif git diff --cached --quiet; then\n  echo \"::error::version.properties did not change — the bump did not happen\" >&2\n  exit 1\nfi\ngit commit -m \"chore(version): $VERSION [skip ci]\"\n# Another workflow or a person can land on main between the checkout and this push. Rebasing\n# keeps their commit; the retry covers a second push arriving during the rebase itself.\npushed=\"\"\nfor attempt in 1 2 3 4 5; do\n  if git push origin HEAD:main; then\n    pushed=\"yes\"\n    echo \"pushed on attempt $attempt\"\n    break\n  fi\n  echo \"push rejected, rebasing (attempt $attempt)\"\n  git pull --rebase origin main\n  sleep $((attempt * 3))\ndone\nif [ -z \"$pushed\" ]; then\n  echo \"::error::could not push the version commit after 5 attempts\" >&2\n  exit 1\nfi\ngit tag \"v$VERSION\"\ngit push origin \"v$VERSION\"\n# The sha every build job checks out. Read after the rebase loop, so it is the commit that\n# actually landed rather than the one we hoped would.\necho \"sha=$(git rev-parse HEAD)\" >> \"$GITHUB_OUTPUT\"\n"
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
  android:
    needs:
      - central_check_start
      - version
    runs-on: ubuntu-latest
    env:
      AZPHALT_VERSION_FROZEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          repository: ${{ inputs.target_repository }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write google-services.json when Firebase is configured
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: node .github/scripts/write-google-services.mjs
      - name: Assemble the debug APK
        working-directory: apps/storefront-cmp
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Name the APK for its version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node .github/scripts/name-debug-apk.mjs "$VERSION" "azphalt-store-$VERSION-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: azphalt-store-*.apk
          if-no-files-found: error
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
  desktop:
    needs:
      - central_check_start
      - version
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    env:
      AZPHALT_VERSION_FROZEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          repository: ${{ inputs.target_repository }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the desktop distribution
        working-directory: apps/storefront-cmp
        run: ./gradlew packageReleaseDistributionForCurrentOS
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/storefront-cmp/build/compose/binaries/main-release/
          if-no-files-found: error
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
  release:
    needs:
      - central_check_start
      - version
      - android
      - desktop
    if: ${{ always() && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true
      - name: List what arrived
        run: "find ./artifacts -type f \\( -name '*.apk' -o -name '*.msi' -o -name '*.dmg' -o -name '*.deb' \\) -print\ntotal=0\nfor kind in apk msi dmg deb; do\n  count=$(find ./artifacts -type f -name \"*.$kind\" | wc -l)\n  total=$((total + count))\n  [ \"$count\" -gt 0 ] || echo \"::warning::no .$kind in this release — that platform's build did not produce one\"\ndone\n# A release with no assets is worse than no release: the tag exists, so it looks shipped.\nif [ \"$total\" -eq 0 ]; then\n  echo \"::error::every build job failed — refusing to publish an empty release for a tag that already exists\" >&2\n  exit 1\nfi\n"
      - name: Publish the versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Azphalt ${{ needs.version.outputs.version }}
          prerelease: true
          body: "Every artifact built from commit ${{ needs.version.outputs.sha }}, all at version\n`${{ needs.version.outputs.version }}` (`versionCode` = the fourth number).\n\n- **Android** — `azphalt-store-*-debug.apk`. Debug-signed: uninstall any other build of\n  `store.azphalt.storefront` first, because Android refuses an install whose signing key\n  differs from the installed app's. Not for distribution; the Play build is separate and\n  release-signed.\n- **Desktop** — `.msi` (Windows), `.dmg` (macOS), `.deb` (Linux).\n"
          files: "./artifacts/**/*.apk\n./artifacts/**/*.msi\n./artifacts/**/*.dmg\n./artifacts/**/*.deb\n"
      - name: Update the rolling 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ needs.version.outputs.sha }}
          name: Azphalt (Latest)
          body: "Rolling release — the newest build of everything, currently version\n`${{ needs.version.outputs.version }}`.\n\nDesktop installers for Windows, macOS and Linux, plus the debug Android APK. Permanent\nper-version links live on the versioned releases.\n"
          files: "./artifacts/**/*.apk\n./artifacts/**/*.msi\n./artifacts/**/*.dmg\n./artifacts/**/*.deb\n"
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - version
      - android
      - desktop
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
