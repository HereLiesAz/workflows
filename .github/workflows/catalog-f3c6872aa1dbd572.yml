# Generated shared catalog workflow. Do not edit by hand.
# catalog-source: catalog/f3c6872aa1dbd5726f8892ab503ed9ed8a60bb1077314526f431e79f4bbdc90c
name: Release AAB to Play [shared catalog]
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: read
env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
  TARGET_BASE_REF: ${{ inputs.target_base_ref }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
  TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
  TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
  TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
concurrency:
  group: google-play-publish
  cancel-in-progress: false
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: "if [ -n \"$GOOGLE_SERVICES\" ]; then\n  echo \"$GOOGLE_SERVICES\" > app/google-services.json\nfi\n"
      - name: Generate keystore from secrets
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: "echo \"$KEYSTORE_PRIVATE\" > private_key.pem\necho \"$KEYSTORE_CHAIN\" > certificate_chain.crt\nopenssl pkcs12 -export -in certificate_chain.crt -inkey private_key.pem \\\n  -name \"$KEY_ALIAS\" -out keystore.p12 \\\n  -password pass:\"$KEYSTORE_PASSWORD\"\nkeytool -importkeystore -srckeystore keystore.p12 -srcstoretype PKCS12 \\\n  -destkeystore app/keystore.jks -deststoretype JKS \\\n  -srcstorepass \"$KEYSTORE_PASSWORD\" \\\n  -deststorepass \"$KEYSTORE_PASSWORD\" \\\n  -alias \"$KEY_ALIAS\" -noprompt\nrm private_key.pem certificate_chain.crt keystore.p12\n"
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          dependency-graph: disabled
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: "# versionCode is computed here (see the module docstring above and root build.gradle.kts).\n# The Play AAB is the `play` flavor: AdMob enabled, no self-updater (Play delivers updates).\n./gradlew bundlePlayRelease \\\n  -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \\\n  -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \\\n  -Pandroid.injected.signing.key.alias=$KEY_ALIAS \\\n  -Pandroid.injected.signing.key.password=$KEY_PASSWORD\n"
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
      - name: Upload mapping.txt artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-aab-mapping
          path: app/build/outputs/mapping/playRelease/mapping.txt
          if-no-files-found: warn
      - name: Set up Python
        if: ${{ fromJSON(inputs.target_inputs_json).publish != 'false' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Publish to Google Play (internal + alpha/beta/production drafts; roll out in console)
        id: publish
        if: ${{ fromJSON(inputs.target_inputs_json).publish != 'false' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: "python -m pip install --quiet \\\n  google-auth==2.35.0 \\\n  requests==2.32.3\n# Keep the service-account JSON off disk except while the script needs it.\nSA_JSON=\"$(mktemp)\"\nprintf '%s' \"$PLAY_SERVICE_ACCOUNT_JSON\" > \"$SA_JSON\"\ntrap 'rm -f \"$SA_JSON\"' EXIT\nAAB=\"$(ls app/build/outputs/bundle/playRelease/*.aab | head -n1)\"\nset +e\npython .github/scripts/publish_play.py \\\n  --package com.hereliesaz.guillotine \\\n  --aab \"$AAB\" \\\n  --sa-json \"$SA_JSON\"\nCODE=$?\nset -e\necho \"exit_code=$CODE\" >> \"$GITHUB_OUTPUT\"\nif [ \"$CODE\" = \"1\" ]; then\n  exit 1\nfi\n"
      - name: Fail the job if any track was not staged
        if: steps.publish.outputs.exit_code == '2'
        run: "echo \"::error::Play publish completed for internal but at least one draft track failed. See the earlier warning for which tracks need to be initialised in the Play Console.\"\nexit 1\n"
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
