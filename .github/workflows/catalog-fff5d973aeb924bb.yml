# Generated shared catalog workflow. Do not edit by hand.
# catalog-source: catalog/fff5d973aeb924bb5cedd22a06284d5afc1c5fa81b01d98acb394ffe1d2b5dac
name: Publish Release APK [shared catalog]
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: read
env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
  TARGET_BASE_REF: ${{ inputs.target_base_ref }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
  TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
  TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
  TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
concurrency:
  group: release-apk-${{ inputs.target_ref }}
  cancel-in-progress: true
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Init upstream submodule (rebase-resilient)
        uses: ./.github/actions/init-upstream
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Inject ARCore key (if provided)
        env:
          ARCORE_API_KEY: ${{ secrets.ARCORE_API_KEY }}
        run: echo "ARCORE_API_KEY=$ARCORE_API_KEY" >> upstream/local.properties
      - name: Decode signing keystore (required)
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
        run: "if [ -z \"$KEYSTORE_RAW\" ]; then\n  echo \"::error::KEYSTORE_RAW is not set — a release APK must be signed.\"\n  exit 1\nfi\necho \"$KEYSTORE_RAW\" | base64 -d > \"$GITHUB_WORKSPACE/keystore.jks\"\nif [ ! -s \"$GITHUB_WORKSPACE/keystore.jks\" ]; then\n  echo \"::error::Decoded keystore is empty — KEYSTORE_RAW is not valid base64.\"\n  exit 1\nfi\n"
      - name: Apply Lunch Heir source overlay
        run: overlay/apply-overlay.sh
      - name: Build signed release APK
        working-directory: upstream
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleLawnWithQuickstepGithubRelease --build-cache
      - name: Verify release signing certificate
        env:
          EXPECTED_SHA256: ${{ secrets.KEYSTORE_SHA256 }}
        run: "APK=$(find upstream/build/outputs/apk -name \"*.apk\" ! -name \"*unsigned*\" | head -n 1)\nif [ -z \"$APK\" ]; then echo \"::error::No signed APK found.\"; exit 1; fi\nif [ -z \"$EXPECTED_SHA256\" ]; then\n  echo \"::warning::KEYSTORE_SHA256 not set — skipping signature verification.\"\n  exit 0\nfi\nAPKSIGNER=$(find \"$ANDROID_SDK_ROOT/build-tools\" -name apksigner | sort -V | tail -n 1)\nACTUAL=$(\"$APKSIGNER\" verify --print-certs \"$APK\" | grep -i \"SHA-256 digest\" | head -n 1 | grep -oiE '[0-9a-fA-F]{64}')\nNORM_EXP=$(printf '%s' \"$EXPECTED_SHA256\" | tr -d ': \\r\\n' | tr 'A-F' 'a-f')\nNORM_ACT=$(printf '%s' \"$ACTUAL\" | tr -d ': \\r\\n' | tr 'A-F' 'a-f')\necho \"expected: $NORM_EXP\"\necho \"actual:   $NORM_ACT\"\nif [ \"$NORM_EXP\" != \"$NORM_ACT\" ]; then\n  echo \"::error::APK signing certificate SHA-256 does not match KEYSTORE_SHA256.\"\n  exit 1\nfi\necho \"✅ Signature verified against KEYSTORE_SHA256.\"\n"
      - name: Prepare release variables
        id: vars
        run: "MAJOR=$(grep '^versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nMINOR=$(grep '^versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nPATCH=$(grep '^versionPatch=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nBUILD=$(grep '^versionBuild=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nVERSION_NAME=\"${MAJOR}.${MINOR}.${PATCH}.${BUILD}\"\n\n# Tag: the pushed v* tag when triggered that way, else a version tag from version.properties.\nif [ \"${TARGET_REF_TYPE}\" = \"tag\" ]; then\n  TAG=\"${TARGET_REF_NAME}\"\nelse\n  TAG=\"v${VERSION_NAME}\"\nfi\n\nAPK=$(find upstream/build/outputs/apk -name \"*.apk\" ! -name \"*unsigned*\" | head -n 1)\nTARGET=\"LunchHeir-${VERSION_NAME}-release.apk\"\nmv \"$APK\" \"$TARGET\"\n\necho \"tag=$TAG\" >> \"$GITHUB_OUTPUT\"\necho \"apk=$TARGET\" >> \"$GITHUB_OUTPUT\"\necho \"version=$VERSION_NAME\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: "TAG=\"${{ steps.vars.outputs.tag }}\"\nif gh release view \"$TAG\" > /dev/null 2>&1; then\n  gh release upload \"$TAG\" \"${{ steps.vars.outputs.apk }}\" --clobber\nelse\n  gh release create \"$TAG\" \"${{ steps.vars.outputs.apk }}\" --latest \\\n    --title \"Lunch Heir ${{ steps.vars.outputs.version }}\" \\\n    --notes \"Signed release build from commit $TARGET_SHA\" \\\n    --target \"$TARGET_SHA\"\nfi\n"
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - release-apk
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
