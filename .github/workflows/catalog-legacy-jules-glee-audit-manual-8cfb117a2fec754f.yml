# Generated shared catalog workflow. Do not edit by hand.
# catalog-source: catalog/8cfb117a2fec754fea3679a554e54dd7d2d2685a82e0cc7b75efcf3c6fc31412
name: Legacy Jules Glee Audit (manual) [shared catalog]
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: read
env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
  TARGET_BASE_REF: ${{ inputs.target_base_ref }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
  TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
  TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
  TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
concurrency:
  group: legacy-glee-${{ fromJSON(inputs.target_inputs_json).pr_number || inputs.target_run_id }}
  cancel-in-progress: true
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  audit-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
      - name: Run Jules Glee audit
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: ${{ inputs.target_repository }}
          PR_NUMBER: ${{ fromJSON(inputs.target_inputs_json).pr_number }}
        shell: bash
        run: "set -euo pipefail\ntest -n \"${JULES_API_KEY:-}\" || { echo 'JULES_API_KEY secret is not configured'; exit 1; }\n\nPR_JSON=$(gh pr view \"$PR_NUMBER\" --repo \"$REPO\" --json headRefName,baseRefName)\nHEAD_BRANCH=$(jq -r '.headRefName' <<<\"$PR_JSON\")\nBASE_BRANCH=$(jq -r '.baseRefName' <<<\"$PR_JSON\")\n\nOWNER=\"${REPO%%/*}\"\nNAME=\"${REPO##*/}\"\nSOURCE=''\nSTARTING_BRANCH=''\nPAGE_TOKEN=''\nwhile :; do\n  URL='https://jules.googleapis.com/v1alpha/sources?pageSize=100'\n  [ -z \"$PAGE_TOKEN\" ] || URL=\"$URL&pageToken=$(jq -rn --arg v \"$PAGE_TOKEN\" '$v|@uri')\"\n  PAGE=$(curl -fsS -H \"x-goog-api-key: $JULES_API_KEY\" \"$URL\")\n  SOURCE_JSON=$(jq -c --arg owner \"$OWNER\" --arg repo \"$NAME\" '[.sources[]? | select((.githubRepo.owner|ascii_downcase)==($owner|ascii_downcase) and (.githubRepo.repo|ascii_downcase)==($repo|ascii_downcase))][0] // empty' <<<\"$PAGE\")\n  if [ -n \"$SOURCE_JSON\" ]; then\n    SOURCE=$(jq -r '.name // empty' <<<\"$SOURCE_JSON\")\n    STARTING_BRANCH=$(jq -r --arg base \"$BASE_BRANCH\" '[.githubRepo.branches[]?.displayName | select(. == $base)][0] // .githubRepo.defaultBranch.displayName // empty' <<<\"$SOURCE_JSON\")\n    break\n  fi\n  PAGE_TOKEN=$(jq -r '.nextPageToken // empty' <<<\"$PAGE\")\n  [ -n \"$PAGE_TOKEN\" ] || break\ndone\ntest -n \"$SOURCE\" || { echo \"Jules source not found for $REPO\"; exit 1; }\ntest -n \"$STARTING_BRANCH\" || { echo 'Jules source has no usable branch'; exit 1; }\n\ngit diff --no-ext-diff --unified=30 \"origin/$BASE_BRANCH...origin/$HEAD_BRANCH\" > /tmp/pr.diff\ntest -s /tmp/pr.diff || { echo 'PR diff is empty'; exit 1; }\n\n{\n  echo \"Audit pull request #$PR_NUMBER from $HEAD_BRANCH into $BASE_BRANCH as Glee.\"\n  echo 'Find concrete production-impacting defects only. Trace callers and surrounding code before reporting.'\n  echo 'Return a concise report with severity, file/symbol, failure scenario, cause, and smallest sensible fix. If no finding survives scrutiny, say so plainly.'\n  echo\n  echo '--- BEGIN AUTHORITATIVE PR DIFF ---'\n  cat /tmp/pr.diff\n  echo '--- END AUTHORITATIVE PR DIFF ---'\n} > /tmp/prompt.txt\n\njq -n \\\n  --rawfile prompt /tmp/prompt.txt \\\n  --arg title \"Glee PR audit — #$PR_NUMBER — ${TARGET_SHA:0:12}\" \\\n  --arg source \"$SOURCE\" \\\n  --arg branch \"$STARTING_BRANCH\" \\\n  '{prompt:$prompt,title:$title,sourceContext:{source:$source,githubRepoContext:{startingBranch:$branch}},requirePlanApproval:false,automationMode:\"AUTOMATION_MODE_UNSPECIFIED\"}' \\\n  > /tmp/session.json\n\nRESPONSE=$(curl -fsS -X POST \\\n  -H \"x-goog-api-key: $JULES_API_KEY\" \\\n  -H 'Content-Type: application/json' \\\n  --data-binary @/tmp/session.json \\\n  'https://jules.googleapis.com/v1alpha/sessions')\nSESSION_ID=$(jq -r '.name' <<<\"$RESPONSE\" | sed 's#^sessions/##')\ntest -n \"$SESSION_ID\" || { echo \"$RESPONSE\"; exit 1; }\n\nSTATE=''\nfor _ in $(seq 1 120); do\n  STATUS=$(curl -fsS -H \"x-goog-api-key: $JULES_API_KEY\" \"https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID\")\n  STATE=$(jq -r '.state' <<<\"$STATUS\")\n  case \"$STATE\" in\n    COMPLETED) break ;;\n    FAILED|AWAITING_USER_FEEDBACK) echo \"$STATUS\"; exit 1 ;;\n  esac\n  sleep 15\ndone\ntest \"$STATE\" = COMPLETED || { echo \"Jules audit timed out in state ${STATE:-unknown}\"; exit 1; }\n\nACTIVITIES=$(curl -fsS -H \"x-goog-api-key: $JULES_API_KEY\" \"https://jules.googleapis.com/v1alpha/sessions/$SESSION_ID/activities?pageSize=100\")\nREPORT=$(jq -r '[.activities[] | .agentMessaged.agentMessage? // empty] | map(select(length>0)) | last // empty' <<<\"$ACTIVITIES\")\ntest -n \"$REPORT\" || { echo 'Jules completed without an audit report'; exit 1; }\n\n{\n  echo \"## Glee audit — PR #$PR_NUMBER\"\n  echo\n  echo \"$REPORT\"\n} > /tmp/glee.md\ngh pr comment \"$PR_NUMBER\" --repo \"$REPO\" --body-file /tmp/glee.md\ncat /tmp/glee.md >> \"$GITHUB_STEP_SUMMARY\"\n"
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - audit-pr
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
