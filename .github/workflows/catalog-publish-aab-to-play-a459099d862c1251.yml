# Generated shared catalog workflow. Do not edit by hand.
# catalog-source: catalog/a459099d862c1251ef802a8fbe54f5bd64b65c1d5a663b6c58bda5da6742f826
name: Publish AAB to Play [shared catalog]
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: read
env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
  TARGET_BASE_REF: ${{ inputs.target_base_ref }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
  TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
  TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
  TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
concurrency:
  group: ${{ inputs.target_workflow_name }}-${{ inputs.target_ref }}
  cancel-in-progress: false
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  bundle-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Guard publish against non-default branch
        if: ${{ fromJSON(inputs.target_inputs_json).publish && inputs.target_ref_name != fromJSON(inputs.target_event_json).repository.default_branch }}
        run: "echo \"Error: publish=true is only allowed when dispatched from the default branch (got '${{ inputs.target_ref_name }}').\" >&2\nexit 1\n"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Inject Google Services
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: "TEMPLATE=$(find . -name 'google-services.json.template' -print -quit)\nif [ -n \"$TEMPLATE\" ]; then\n  sed -e 's/{{\\([^}]*\\)}}/${\\1}/g' \"$TEMPLATE\" | envsubst > \"${TEMPLATE%.template}\"\nfi\n"
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Read package name from build config
        id: pkg
        env:
          ANDROID_BUILD_FILE_VAR: ${{ fromJSON(inputs.target_vars_json).ANDROID_BUILD_FILE }}
        run: "BUILD_FILE=\"${ANDROID_BUILD_FILE_VAR:-app/build.gradle.kts}\"\nAPPLICATION_ID=$(grep -m1 'applicationId *=' \"$BUILD_FILE\" | sed -E 's/.*\"(.*)\".*/\\1/')\nif [ -z \"$APPLICATION_ID\" ]; then\n  echo \"Could not read applicationId from configured Android build file\" >&2\n  exit 1\nfi\necho \"Resolved package name: $APPLICATION_ID\"\necho \"application_id=$APPLICATION_ID\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Prepare Keystore from Secrets
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: "set -e\nif [ -z \"$KEYSTORE_PRIVATE\" ] || [ -z \"$KEYSTORE_CHAIN\" ]; then\n  echo \"Error: KEYSTORE_PRIVATE / KEYSTORE_CHAIN are required to sign a release bundle.\" >&2\n  exit 1\nfi\necho \"Reconstructing Keystore from Secrets...\"\necho \"$KEYSTORE_PRIVATE\" > private.key\necho \"$KEYSTORE_CHAIN\" > chain.crt\n\nopenssl pkcs12 -export -in chain.crt -inkey private.key -out release.keystore \\\n  -name \"$KEY_ALIAS\" -passout env:KEYSTORE_PASSWORD\n\necho \"Verifying generated keystore...\"\nkeytool -list -keystore release.keystore -storepass \"$KEYSTORE_PASSWORD\" > /dev/null\n\necho \"KEYSTORE_FILE=$(pwd)/release.keystore\" >> \"$GITHUB_ENV\"\nDELIM=\"DELIMITER_${{ inputs.target_run_id }}_${{ inputs.target_run_attempt }}\"\n{\n  printf '%s\\n' \"KEY_PASSWORD<<${DELIM}\"\n  printf '%s\\n' \"$KEYSTORE_PASSWORD\"\n  printf '%s\\n' \"${DELIM}\"\n} >> \"$GITHUB_ENV\"\n"
      - name: Build signed Play AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUILD_NUMBER_OVERRIDE_VAR: ${{ fromJSON(inputs.target_vars_json).BUILD_NUMBER_OVERRIDE }}
          PLAY_BUNDLE_COMMAND_VAR: ${{ fromJSON(inputs.target_vars_json).PLAY_BUNDLE_COMMAND }}
          BUNDLE_COMMAND_VAR: ${{ fromJSON(inputs.target_vars_json).BUNDLE_COMMAND }}
        run: "set -e\ntest -f version.properties || { echo \"version.properties is required\" >&2; exit 1; }\nBUILD_NUMBER=\"${BUILD_NUMBER_OVERRIDE_VAR:-$(git rev-list --count HEAD)}\"\n[[ \"$BUILD_NUMBER\" =~ ^[0-9]+$ ]] || { echo \"Invalid build component\" >&2; exit 1; }\nBUNDLE_COMMAND=\"${PLAY_BUNDLE_COMMAND_VAR:-${BUNDLE_COMMAND_VAR:-./gradlew bundlePlay}}\"\n$BUNDLE_COMMAND -PversionBuild=$BUILD_NUMBER --build-cache\n"
      - name: Locate Play AAB
        id: aab
        run: "AAB=$(find app/build/outputs/bundle/play -name '*.aab' -print | sort | head -n 1)\nif [ -z \"$AAB\" ]; then\n  echo \"No Play .aab produced!\" >&2\n  exit 1\nfi\necho \"Found Play bundle: $AAB\"\necho \"path=$AAB\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Upload Play AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: ideaz-play-aab
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
      - name: Publish to Google Play
        if: ${{ fromJSON(inputs.target_inputs_json).publish }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.pkg.outputs.application_id }}
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: ${{ fromJSON(inputs.target_inputs_json).track }}
          status: ${{ fromJSON(inputs.target_inputs_json).status }}
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - bundle-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
