# Generated shared catalog workflow. Do not edit by hand.
# catalog-source: catalog/1003b8ff1ea31195c0791d67f319ed18fc0c293138e6914003a5653ec72b5cdf
name: Release AAB to Play [shared catalog]
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: read
env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
  TARGET_BASE_REF: ${{ inputs.target_base_ref }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
  TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
  TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
  TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
concurrency:
  group: google-play-publish
  cancel-in-progress: false
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: "if [ -n \"$GOOGLE_SERVICES\" ]; then\n  echo \"$GOOGLE_SERVICES\" > app/google-services.json\nfi\n"
      - name: Generate keystore from secrets
        shell: bash
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: "# Cleanup runs on ANY exit, not just the happy path — without a trap, a failure in\n# openssl/keytool below (mismatched chain/key, bad password) aborts the step under\n# bash's `-e` before the old plain `rm` line, leaving the private key on disk for\n# whatever post-job steps run afterward.\ntrap 'rm -f private_key.pem certificate_chain.crt keystore.p12' EXIT\necho \"$KEYSTORE_PRIVATE\" > private_key.pem\necho \"$KEYSTORE_CHAIN\" > certificate_chain.crt\nopenssl pkcs12 -export -in certificate_chain.crt -inkey private_key.pem \\\n  -name \"$KEY_ALIAS\" -out keystore.p12 \\\n  -password pass:\"$KEYSTORE_PASSWORD\"\n# -destkeypass is load-bearing, not cosmetic: without it, keytool defaults the\n# imported key's password to -deststorepass (KEYSTORE_PASSWORD), NOT KEY_PASSWORD —\n# so the build step below, which opens the key with KEY_PASSWORD, only ever worked\n# because that secret happened to hold the same value as KEYSTORE_PASSWORD. Rotate\n# either one alone and every release build would die at signing with\n# UnrecoverableKeyException. Setting it explicitly here makes the two secrets\n# actually independent, matching what SETUP above documents them as.\nkeytool -importkeystore -srckeystore keystore.p12 -srcstoretype PKCS12 \\\n  -destkeystore app/keystore.jks -deststoretype JKS \\\n  -srcstorepass \"$KEYSTORE_PASSWORD\" \\\n  -deststorepass \"$KEYSTORE_PASSWORD\" \\\n  -destkeypass \"$KEY_PASSWORD\" \\\n  -alias \"$KEY_ALIAS\" -noprompt\n"
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: false
          dependency-graph: disabled
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Set up Python
        if: ${{ fromJSON(inputs.target_inputs_json).publish != 'false' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Play API client
        if: ${{ fromJSON(inputs.target_inputs_json).publish != 'false' }}
        run: "python -m pip install --quiet \\\n  google-auth==2.35.0 \\\n  google-api-python-client==2.149.0 \\\n  google-auth-httplib2==0.2.0 \\\n  httplib2==0.22.0\n"
      - name: Determine next versionCode
        id: nextcode
        if: ${{ fromJSON(inputs.target_inputs_json).publish != 'false' }}
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: "if [ -z \"${PLAY_SERVICE_ACCOUNT_JSON//[[:space:]]/}\" ]; then\n  echo \"::error::Repository secret PLAY_SERVICE_ACCOUNT_JSON is empty or not set. Add it under Settings > Secrets and variables > Actions with the full service-account key JSON.\"\n  exit 1\nfi\n# Mirrors app/build.gradle.kts' own `versionBuild + 1`. Kept in sync by the assertion in\n# the build step below, which fails the run if Gradle ends up building something else.\nFLOOR=\"$(awk -F= '/^versionBuild/ {gsub(/[^0-9]/, \"\", $2); print $2 + 1}' version.properties)\"\nif [ -z \"$FLOOR\" ]; then\n  echo \"::error::Could not read versionBuild out of version.properties.\"\n  exit 1\nfi\n# Keep the service-account JSON off disk except while the script needs it.\nSA_JSON=\"$(mktemp)\"\nprintf '%s' \"$PLAY_SERVICE_ACCOUNT_JSON\" > \"$SA_JSON\"\ntrap 'rm -f \"$SA_JSON\"' EXIT\n# stdout is the integer and nothing else in this mode; the ::notice:: lines go to stderr.\nCODE=\"$(python .github/scripts/publish_play.py \\\n  --package com.hereliesaz.graffux \\\n  --sa-json \"$SA_JSON\" \\\n  --floor \"$FLOOR\" \\\n  --print-next-version-code)\"\ncase \"$CODE\" in\n  ''|*[!0-9]*)\n    echo \"::error::Expected an integer versionCode, got '$CODE'.\"\n    exit 1\n    ;;\nesac\necho \"Building versionCode $CODE (floor $FLOOR)\"\necho \"version_code=$CODE\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Build signed AAB
        id: build
        shell: bash
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          NEXT_VERSION_CODE: ${{ steps.nextcode.outputs.version_code }}
        run: "OVERRIDE=\"\"\nif [ -n \"$NEXT_VERSION_CODE\" ]; then\n  OVERRIDE=\"-PversionCodeOverride=$NEXT_VERSION_CODE\"\nfi\n# $OVERRIDE is deliberately unquoted so an empty value expands to no argument at all;\n# it is a single shell word by construction, so there is nothing to split badly.\n./gradlew bundleRelease $OVERRIDE | tee build.log\n# app/build.gradle.kts prints this at configuration time for exactly this purpose — see\n# its comment. Feeds publish_play.py's pre-publish versionCode check below.\nCODE=\"$(grep -o 'GRAFFUX_VERSION_CODE=[0-9]*' build.log | tail -n1 | cut -d= -f2)\"\nif [ -z \"$CODE\" ]; then\n  echo \"::error::Could not read GRAFFUX_VERSION_CODE out of the build log.\"\n  exit 1\nfi\n# The override is only useful if AGP actually honoured it. Gradle's configuration cache\n# would skip the println above (see app/build.gradle.kts) and leave a stale number here,\n# so assert rather than trust: publishing a versionCode the AAB does not contain would\n# be a far more confusing failure than this one.\nif [ -n \"$NEXT_VERSION_CODE\" ] && [ \"$CODE\" != \"$NEXT_VERSION_CODE\" ]; then\n  echo \"::error::Asked Gradle for versionCode $NEXT_VERSION_CODE but it built $CODE.\"\n  exit 1\nfi\necho \"version_code=$CODE\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Publish to Google Play (internal + alpha draft; roll out in console)
        id: publish
        if: ${{ fromJSON(inputs.target_inputs_json).publish != 'false' }}
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: "# Dependencies are installed by the \"Install Play API client\" step above, which the\n# versionCode query also depends on.\n#\n# An unset secret reaches the script as an empty file and surfaces as a JSON parse\n# error, which reads like a corrupt key rather than a missing one. Distinguish them\n# here: this branch means the secret does not exist (or is not exposed to this run),\n# not that its contents are wrong.\nif [ -z \"${PLAY_SERVICE_ACCOUNT_JSON//[[:space:]]/}\" ]; then\n  echo \"::error::Repository secret PLAY_SERVICE_ACCOUNT_JSON is empty or not set. Add it under Settings > Secrets and variables > Actions with the full service-account key JSON.\"\n  exit 1\nfi\nSCRIPT=.github/scripts/publish_play.py\n# Fail loudly on a missing script. Python exits 2 for \"can't open file\", which is the\n# same code this workflow reads as \"internal published, drafts failed\" — so without\n# this guard a rename or a typo reports a successful publish that never happened.\nif [ ! -f \"$SCRIPT\" ]; then\n  echo \"::error::$SCRIPT is missing — nothing was published.\"\n  exit 1\nfi\n# Keep the service-account JSON off disk except while the script needs it.\nSA_JSON=\"$(mktemp)\"\nprintf '%s' \"$PLAY_SERVICE_ACCOUNT_JSON\" > \"$SA_JSON\"\ntrap 'rm -f \"$SA_JSON\"' EXIT\nAAB=\"$(ls app/build/outputs/bundle/release/*.aab | head -n1)\"\nset +e\npython \"$SCRIPT\" \\\n  --package com.hereliesaz.graffux \\\n  --aab \"$AAB\" \\\n  --sa-json \"$SA_JSON\" \\\n  --version-code \"${{ steps.build.outputs.version_code }}\"\nCODE=$?\nset -e\necho \"exit_code=$CODE\" >> \"$GITHUB_OUTPUT\"\n# Only 0 (all tracks) and 2 (internal live, some drafts missing) are outcomes the\n# script means. Anything else is the script failing to run at all, and must not be\n# mistaken for one of them.\nif [ \"$CODE\" != \"0\" ] && [ \"$CODE\" != \"2\" ]; then\n  echo \"::error::Play publish exited $CODE — nothing was published.\"\n  exit 1\nfi\n"
      - name: Fail the job if any track was not staged
        if: steps.publish.outputs.exit_code == '2'
        run: "echo \"::error::Play publish completed for internal but at least one draft track failed. See the earlier warning for which tracks need to be initialised in the Play Console.\"\nexit 1\n"
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
