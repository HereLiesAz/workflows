# catalog-source: catalog/1dce34c08abc5f8e7378dd7a884ab01df00b46278e534f36e82f0fb580e5404b
name: Release APK [shared catalog]
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: read
env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
  TARGET_BASE_REF: ${{ inputs.target_base_ref }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
  TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
  TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
  TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
      - name: Generate keystore
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: "if [ -n \"$KEYSTORE_PRIVATE\" ] && [ -n \"$KEYSTORE_CHAIN\" ]; then\n  echo \"$KEYSTORE_PRIVATE\" > private_key.pem\n  echo \"$KEYSTORE_CHAIN\" > cert_chain.pem\n  openssl pkcs12 -export \\\n    -inkey private_key.pem \\\n    -in cert_chain.pem \\\n    -out keystore.p12 \\\n    -name \"$KEY_ALIAS\" \\\n    -passout pass:\"$KEYSTORE_PASSWORD\"\n  keytool -importkeystore \\\n    -srckeystore keystore.p12 \\\n    -srcstoretype PKCS12 \\\n    -srcstorepass \"$KEYSTORE_PASSWORD\" \\\n    -destkeystore app/keystore.jks \\\n    -deststoretype JKS \\\n    -deststorepass \"$KEYSTORE_PASSWORD\"\n  rm -f private_key.pem cert_chain.pem keystore.p12\n  echo \"SIGNING_READY=true\" >> $GITHUB_ENV\nelse\n  echo \"::warning::Keystore secrets not configured. Building unsigned release.\"\n  echo \"SIGNING_READY=false\" >> $GITHUB_ENV\nfi\n"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build release APK
        run: "if [ \"$SIGNING_READY\" = \"true\" ]; then\n  ./gradlew assembleRelease \\\n    -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \\\n    -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \\\n    -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \\\n    -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}\nelse\n  ./gradlew assembleRelease\nfi\n"
      - name: Read version
        id: version
        run: "source <(grep = version.properties | tr -d ' ')\necho \"major=$versionMajor\" >> $GITHUB_OUTPUT\necho \"minor=$versionMinor\" >> $GITHUB_OUTPUT\necho \"patch=$versionPatch\" >> $GITHUB_OUTPUT\necho \"build=$versionBuild\" >> $GITHUB_OUTPUT\necho \"full=$versionMajor.$versionMinor.$versionPatch.$versionBuild\" >> $GITHUB_OUTPUT\n"
      - name: Commit version bump
        run: "git config user.name \"github-actions[bot]\"\ngit config user.email \"github-actions[bot]@users.noreply.github.com\"\ngit add version.properties\ngit commit -m \"chore: bump version to ${{ steps.version.outputs.full }}\" || echo \"No version change to commit\"\ngit push\n"
      - name: Find APK
        id: apk
        run: "APK_PATH=$(find app/build/outputs/apk/release -name \"*.apk\" | head -1)\nAPK_NAME=\"MadeMeDance-${{ steps.version.outputs.full }}-release.apk\"\nmv \"$APK_PATH\" \"$APK_NAME\"\necho \"path=$APK_NAME\" >> $GITHUB_OUTPUT\necho \"name=$APK_NAME\" >> $GITHUB_OUTPUT\n"
      - name: Create/Update release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: "TAG=\"latest-release-v${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}\"\n# Delete existing release and tag if they exist\ngh release delete \"$TAG\" --yes 2>/dev/null || true\ngit tag -f \"$TAG\"\ngit push origin \"$TAG\" --force\n# Create new release with the APK\ngh release create \"$TAG\" \\\n  \"${{ steps.apk.outputs.path }}\" \\\n  --title \"Release v${{ steps.version.outputs.full }}\" \\\n  --notes \"Release build v${{ steps.version.outputs.full }}\" \\\n  --latest\n"
      - name: Cleanup keystore
        if: always()
        run: rm -f app/keystore.jks
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
