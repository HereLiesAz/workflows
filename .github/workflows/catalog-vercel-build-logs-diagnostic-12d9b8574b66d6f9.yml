name: Vercel Build Logs (diagnostic) [shared catalog]
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
permissions:
  contents: read
env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
  TARGET_BASE_REF: ${{ inputs.target_base_ref }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
  TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
  TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
  TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Vercel deployment build logs
        env:
          TOKEN: ${{ secrets.VERCEL_API_KEY }}
          DEP_INPUT: ${{ fromJSON(inputs.target_inputs_json).deployment }}
        run: "set -uo pipefail\nAPI=https://api.vercel.com\nauth=(-H \"Authorization: Bearer $TOKEN\")\n\necho \"token length: ${#TOKEN} (should be ~24 for a Vercel token)\"\necho \"=== whoami (/v2/user) ===\"\ncode=$(curl -s -o /tmp/u.json -w \"%{http_code}\" \"${auth[@]}\" \"$API/v2/user\")\necho \"/v2/user -> HTTP $code\"\nhead -c 600 /tmp/u.json; echo\n\necho \"=== teams (/v2/teams) ===\"\nteamsRaw=$(curl -s \"${auth[@]}\" \"$API/v2/teams\")\necho \"$teamsRaw\" | jq -r '.teams[]? | \"\\(.id)  \\(.slug)  \\(.name)\"' 2>/dev/null || echo \"$teamsRaw\" | head -c 800\n\n# Try each known scope: personal, then every team, then the slug from the deploy URL.\nslugFromUrl=\"azs-projects-e393a284\"\nscopes=$(echo \"$teamsRaw\" | jq -r '.teams[]?.id' 2>/dev/null)\necho \"=== searching for the storefront project across scopes ===\"\npid=\"\"; teamId=\"\"\nfor tid in \"\" $scopes; do\n  q=\"limit=100\"; [ -n \"$tid\" ] && q=\"$q&teamId=$tid\"\n  resp=$(curl -s \"${auth[@]}\" \"$API/v9/projects?$q\")\n  names=$(echo \"$resp\" | jq -r '.projects[]?.name' 2>/dev/null | tr '\\n' ' ')\n  echo \"scope [${tid:-personal}]: ${names:-<none/err>}\"\n  hit=$(echo \"$resp\" | jq -r '.projects[]? | select(.name|test(\"storefront|azphalt\";\"i\")) | .id' 2>/dev/null | head -1)\n  if [ -n \"$hit\" ]; then pid=\"$hit\"; teamId=\"$tid\"; break; fi\ndone\n# Fallback: resolve the team by the slug embedded in the deploy URL.\nif [ -z \"$pid\" ]; then\n  resp=$(curl -s \"${auth[@]}\" \"$API/v9/projects?limit=100&slug=$slugFromUrl\")\n  pid=$(echo \"$resp\" | jq -r '.projects[]? | select(.name|test(\"storefront|azphalt\";\"i\")) | .id' 2>/dev/null | head -1)\n  tid2=$(curl -s \"${auth[@]}\" \"$API/v2/teams?slug=$slugFromUrl\" | jq -r '.id // .teams[0].id // empty' 2>/dev/null)\n  [ -n \"$tid2\" ] && teamId=\"$tid2\"\nfi\ntq=\"\"; [ -n \"$teamId\" ] && tq=\"&teamId=$teamId\"\nif [ -z \"$pid\" ]; then echo \"Could not find the storefront project in any accessible scope.\"; exit 1; fi\necho \"project: $pid   team: ${teamId:-<personal>}\"\n\nif [ -n \"$DEP_INPUT\" ]; then\n  did=\"$DEP_INPUT\"\nelse\n  deps=$(curl -s \"${auth[@]}\" \"$API/v6/deployments?projectId=$pid&limit=1$tq\")\n  did=$(echo \"$deps\" | jq -r '.deployments[0].uid // empty')\n  echo \"state:  $(echo \"$deps\" | jq -r '.deployments[0].state // .deployments[0].readyState // \"?\"')\"\n  echo \"url:    https://$(echo \"$deps\" | jq -r '.deployments[0].url // \"?\"')\"\n  echo \"commit: $(echo \"$deps\" | jq -r '.deployments[0].meta.githubCommitSha // \"?\"' | cut -c1-7)\"\nfi\necho \"deployment: $did\"\necho \"=================== BUILD LOGS ===================\"\nlogs=$(curl -s \"${auth[@]}\" \"$API/v3/deployments/$did/events?builds=1&limit=1000$tq\")\nout=$(echo \"$logs\" | jq -r '.[]? | (.payload.text // .text // empty)' 2>/dev/null || true)\nif [ -n \"$out\" ]; then echo \"$out\"; else echo \"(no parsed text — raw payload:)\"; echo \"$logs\" | head -c 4000; fi\necho \"\"\necho \"=================================================\"\n"
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - logs
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
