# Generalized purpose workflow: CI Validation.
# Language, toolchain, commands, service requirements, and diagnostics are profiles instead of duplicate workflows.
name: CI Validation
run-name: ${{ inputs.target_repository_name }} · ${{ inputs.target_workflow_name }} · ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
      target_repository_name:
        required: true
        type: string
      purpose_profile_json:
        required: false
        type: string
        default: '{}'

permissions:
  contents: read

# The event name is part of the group: a branch with an open pull request delivers a push and a
# pull_request event for the same commit, and without it the second run cancelled the first and
# left a cancelled status on the commit. A newer push still cancels the older push run, and a newer
# pull_request update the older one. The repository ID keeps renamed or same-named repositories apart.
concurrency:
  group: ci-validation-${{ inputs.target_repository_id }}-${{ fromJSON(inputs.purpose_profile_json).kind == 'kaggle' && inputs.target_sha || inputs.target_ref_name || inputs.target_sha }}-${{ inputs.source_workflow_path }}-${{ inputs.target_event_name }}
  cancel-in-progress: true

jobs:
  central_check_start:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo_owner="${TARGET_REPOSITORY%%/*}"
          [[ -n "$TARGET_REPOSITORY_ID" ]] || { echo "Missing repository ID" >&2; exit 1; }
          [[ "${repo_owner,,}" == "hereliesaz" ]] || { echo "Repository owner mismatch" >&2; exit 1; }
          [[ "$TARGET_REPOSITORY_OWNER_ID" == "103241502" ]] || { echo "OIDC owner ID mismatch" >&2; exit 1; }

      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n             --arg state "pending"             --arg context "$STATUS_CONTEXT"             --arg description "Running shared CI validation."             --arg target_url "$DETAILS_URL"             '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          # Retry transient API failures: a missing pending status reads as a skipped event.
          for attempt in 1 2 3; do
            if output="$(gh api --method POST "repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}" --input - <<<"$payload" 2>&1)"; then
              exit 0
            fi
            sleep $(( attempt * 5 ))
          done
          echo "::warning::Could not post target status after 3 attempts: $output"

      - name: Mint target check token
        id: target-check-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz
      - name: Post target check run
        if: ${{ always() && steps.target-check-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.target-check-token.outputs.token }}
          RUN_READ_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_PHASE: start
          CHECK_NAME: ${{ inputs.target_workflow_name || inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set +e\nwarn() { echo \"::warning::Target check run skipped: $1\"; exit 0; }\n[[ -n \"${TARGET_REPOSITORY:-}\" && -n \"${TARGET_CHECK_SHA:-}\" ]] || warn \"no target commit\"\ntitle=\"$CHECK_NAME\"\ntext=\"\"\nif [[ \"$CHECK_PHASE\" == \"start\" ]]; then\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$url,external_id:$ext,output:{title:$name,summary:(\"Running in HereLiesAz/workflows: \" + $url)}}')\"\nelse\n  if [[ \"$FAILED\" == \"true\" ]]; then\n    conclusion=\"failure\"\n    jobs=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api --paginate \"repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs\" --jq '.jobs[]' 2>/dev/null | jq -s '.')\"\n    [[ -n \"$jobs\" ]] || jobs=\"[]\"\n    failed=\"$(jq -r '[.[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\")\n      | \"- **\\(.name)** (\\(.conclusion)): \" + ([.steps[]? | select(.conclusion == \"failure\") | .name] | join(\", \") | if . == \"\" then \"no failed step reported\" else . end)\n      + \" — [log](\\(.html_url))\"] | join(\"\\n\")' <<<\"$jobs\")\"\n    first_id=\"$(jq -r '[.[] | select(.conclusion == \"failure\")][0].id // empty' <<<\"$jobs\")\"\n    if [[ -n \"$first_id\" ]]; then\n      tail_log=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api \"repos/${GITHUB_REPOSITORY}/actions/jobs/${first_id}/logs\" 2>/dev/null \\\n        | sed -E 's/^[0-9T:.-]+Z //' | grep -v '^##\\[group\\]\\|^##\\[endgroup\\]' | tail -n 60)\"\n      [[ -n \"$tail_log\" ]] && text=\"$(printf 'Last lines of the first failed job:\\n\\n~~~text\\n%s\\n~~~\\n' \"${tail_log:0:60000}\")\"\n    fi\n    summary=\"$(printf 'Central run failed: %s\\n\\n%s\\n' \"$DETAILS_URL\" \"${failed:-No failed job reported.}\")\"\n    title=\"$CHECK_NAME failed\"\n  else\n    conclusion=\"success\"\n    summary=\"Central run succeeded: $DETAILS_URL\"\n  fi\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    --arg conclusion \"$conclusion\" --arg title \"$title\" --arg summary \"${summary:0:65000}\" --arg text \"$text\" \\\n    '{name:$name,head_sha:$sha,status:\"completed\",conclusion:$conclusion,details_url:$url,external_id:$ext,output:({title:$title,summary:$summary} + (if $text == \"\" then {} else {text:$text} end))}')\"\nfi\n# Each phase posts its own Check Run under the same name; GitHub shows the latest one,\n# so the finish phase needs no id handed over from the start job.\ngh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$body\" >/dev/null \\\n  || echo \"::warning::Target check run skipped: GitHub refused the check run\"\n\n# Release/deploy failures also go to one open issue per workflow: opened on the\n# first failure, commented on each repeat. Successes never touch issues.\n[[ \"$CHECK_PHASE\" == \"finish\" && \"${FILE_ISSUES:-}\" == \"true\" && \"${conclusion:-}\" == \"failure\" ]] || exit 0\nlabel=\"central-run-failure\"\nissue_title=\"Central run failing: $CHECK_NAME\"\nissue=\"$(gh api \"repos/${TARGET_REPOSITORY}/issues?state=open&labels=${label}&per_page=100\" 2>/dev/null \\\n  | jq -r --arg t \"$issue_title\" '[.[] | select(.title == $t)][0].number // empty')\"\nreport=\"$(printf '%s\\n\\nCommit: %s\\n\\n%s\\n' \"$summary\" \"$TARGET_CHECK_SHA\" \"$text\")\"\nif [[ -n \"$issue\" ]]; then\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"$report\" >/dev/null \\\n    || warn \"could not comment on issue #$issue\"\nelse\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/labels\" -f name=\"$label\" -f color=\"000000\" \\\n    -f description=\"A release or deploy run in HereLiesAz/workflows failed for this repository.\" >/dev/null 2>&1\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues\" -f title=\"$issue_title\" -f body=\"$report\" -f \"labels[]=$label\" >/dev/null \\\n    || warn \"could not open a failure issue\"\nfi\n"
  validate_python:
    needs: central_check_start
    if: ${{ fromJSON(inputs.purpose_profile_json).kind == 'python' && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.purpose_profile_json).os || fromJSON('["ubuntu-latest"]') }}
        python-version: ${{ fromJSON(inputs.purpose_profile_json).python_versions || fromJSON('["3.12"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ fromJSON(inputs.purpose_profile_json).timeout_minutes || 360 }}
    permissions:
      contents: read
    steps:
      - name: Check out target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Python project
        env:
          WORKING_DIRECTORY: ${{ fromJSON(inputs.purpose_profile_json).working_directory || '.' }}
          INSTALL_COMMAND: ${{ fromJSON(inputs.purpose_profile_json).install_command || '' }}
          VALIDATE_COMMAND: ${{ fromJSON(inputs.purpose_profile_json).command }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          if [ -n "$INSTALL_COMMAND" ]; then
            bash -eo pipefail -c "$INSTALL_COMMAND"
          fi
          bash -eo pipefail -c "$VALIDATE_COMMAND"

      - name: Upload Python validation artifacts
        if: ${{ always() && fromJSON(inputs.purpose_profile_json).report_path != null && fromJSON(inputs.purpose_profile_json).report_path != '' && (fromJSON(inputs.purpose_profile_json).report_when != 'failure' || failure()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-reports-${{ inputs.target_repository_name }}-${{ github.run_id }}
          path: ${{ fromJSON(inputs.purpose_profile_json).report_path }}
          retention-days: ${{ fromJSON(inputs.purpose_profile_json).retention_days || 7 }}
          if-no-files-found: warn

  validate_node:
    needs: central_check_start
    if: ${{ fromJSON(inputs.purpose_profile_json).kind == 'node' && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pricepilot
          POSTGRES_PASSWORD: pricepilot
          POSTGRES_DB: pricepilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pricepilot -d pricepilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    environment: ${{ inputs.target_repository_name }}
    env:
      DATABASE_URL: ${{ fromJSON(inputs.purpose_profile_json).database_url || '' }}
      GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
      AZPHALT_VERSION_FROZEN: ${{ fromJSON(inputs.purpose_profile_json).version_frozen || '' }}
    steps:
      - name: Check out target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Set up Java
        if: ${{ fromJSON(inputs.purpose_profile_json).java_version != null && fromJSON(inputs.purpose_profile_json).java_version != '' }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ fromJSON(inputs.purpose_profile_json).java_version }}

      - name: Set up pnpm
        if: ${{ fromJSON(inputs.purpose_profile_json).package_manager == 'pnpm' }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ fromJSON(inputs.purpose_profile_json).package_manager_version || '10' }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ fromJSON(inputs.purpose_profile_json).node_version || '22' }}

      - name: Validate Node project
        env:
          WORKING_DIRECTORY: ${{ fromJSON(inputs.purpose_profile_json).working_directory || '.' }}
          VALIDATE_COMMAND: ${{ fromJSON(inputs.purpose_profile_json).command }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          bash -eo pipefail -c "$VALIDATE_COMMAND"

      - name: Run optional Snyk security checks
        if: ${{ fromJSON(inputs.purpose_profile_json).snyk == true }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          TARGET_VARS_JSON: ${{ inputs.target_vars_json }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::notice::SNYK_TOKEN is not configured; skipping Snyk checks."
            exit 0
          fi
          npm install -g snyk
          if [ "$(jq -r '.SNYK_CODE_ENABLED // false' <<<"$TARGET_VARS_JSON")" = true ]; then
            snyk code test --severity-threshold=high
          fi
          snyk monitor --all-sub-projects

      - name: Upload validation diagnostics
        if: ${{ always() && fromJSON(inputs.purpose_profile_json).report_path != null && fromJSON(inputs.purpose_profile_json).report_path != '' && (fromJSON(inputs.purpose_profile_json).report_when != 'failure' || failure()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-reports-${{ inputs.target_repository_name }}
          path: ${{ fromJSON(inputs.purpose_profile_json).report_path }}
          retention-days: ${{ fromJSON(inputs.purpose_profile_json).retention_days || 7 }}
          if-no-files-found: ignore

  validate_gradle:
    needs: central_check_start
    if: ${{ fromJSON(inputs.purpose_profile_json).kind == 'gradle' && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.purpose_profile_json).timeout_minutes || 45 }}
    permissions:
      contents: read
      packages: read
    environment: ${{ inputs.target_repository_name }}
    steps:
      - name: Check out target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Restore validation dependency cache
        id: validation-cache
        if: ${{ fromJSON(inputs.purpose_profile_json).cache_path != null && fromJSON(inputs.purpose_profile_json).cache_path != '' && fromJSON(inputs.purpose_profile_json).cache_key != null && fromJSON(inputs.purpose_profile_json).cache_key != '' }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ fromJSON(inputs.purpose_profile_json).cache_path }}
          key: ${{ fromJSON(inputs.purpose_profile_json).cache_key }}

      - name: Inject Google Services template
        if: ${{ fromJSON(inputs.purpose_profile_json).inject_google_services == true }}
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE="$(find . -name 'google-services.json.template' -print -quit)"
          if [ -n "$TEMPLATE" ]; then
            TARGET="${TEMPLATE%.template}"
            echo "Injecting ${TEMPLATE} into ${TARGET}"
            sed -e 's/{{\([^}]*\)}}/${\1}/g' "$TEMPLATE" | envsubst > "$TARGET"
          fi

      - name: Check out extra dependency repository
        if: ${{ fromJSON(inputs.purpose_profile_json).extra_checkout_repository != null && fromJSON(inputs.purpose_profile_json).extra_checkout_repository != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ fromJSON(inputs.purpose_profile_json).extra_checkout_repository }}
          ref: ${{ fromJSON(inputs.purpose_profile_json).extra_checkout_ref }}
          path: ${{ fromJSON(inputs.purpose_profile_json).extra_checkout_path }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        if: ${{ fromJSON(inputs.purpose_profile_json).validate_wrapper == true }}
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ fromJSON(inputs.purpose_profile_json).java_version || '21' }}

      - name: Set up Android SDK
        if: ${{ fromJSON(inputs.purpose_profile_json).setup_android == true }}
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ${{ fromJSON(inputs.purpose_profile_json).android_packages || '' }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Validate Gradle project
        env:
          WORKING_DIRECTORY: ${{ fromJSON(inputs.purpose_profile_json).working_directory || '.' }}
          PRE_COMMAND: ${{ fromJSON(inputs.purpose_profile_json).pre_command || '' }}
          VALIDATE_COMMAND: ${{ fromJSON(inputs.purpose_profile_json).command }}
          GITHUB_ACTOR: ${{ inputs.target_actor }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORKING_DIRECTORY"
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
          if [ -n "$PRE_COMMAND" ]; then
            bash -eo pipefail -c "$PRE_COMMAND"
          fi
          bash -eo pipefail -c "$VALIDATE_COMMAND"

      - name: Upload validation diagnostics
        if: ${{ always() && fromJSON(inputs.purpose_profile_json).report_path != null && fromJSON(inputs.purpose_profile_json).report_path != '' && (fromJSON(inputs.purpose_profile_json).report_when != 'failure' || failure()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-reports-${{ inputs.target_repository_name }}
          path: ${{ fromJSON(inputs.purpose_profile_json).report_path }}
          retention-days: ${{ fromJSON(inputs.purpose_profile_json).retention_days || 7 }}
          if-no-files-found: ignore

  validate_flutter:
    needs: central_check_start
    if: ${{ fromJSON(inputs.purpose_profile_json).kind == 'flutter' && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ fromJSON(inputs.purpose_profile_json).java_version || '17' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ fromJSON(inputs.purpose_profile_json).flutter_version || '3.16.0' }}
          channel: stable

      - name: Validate Flutter project
        env:
          VALIDATE_COMMAND: ${{ fromJSON(inputs.purpose_profile_json).command }}
        shell: bash
        run: |
          set -euo pipefail
          bash -eo pipefail -c "$VALIDATE_COMMAND"

      - name: Upload validation artifact
        if: ${{ always() && fromJSON(inputs.purpose_profile_json).report_path != null && fromJSON(inputs.purpose_profile_json).report_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-reports-${{ inputs.target_repository_name }}
          path: ${{ fromJSON(inputs.purpose_profile_json).report_path }}
          retention-days: ${{ fromJSON(inputs.purpose_profile_json).retention_days || 7 }}
          if-no-files-found: ignore
  validate_docker:
    needs: central_check_start
    if: ${{ fromJSON(inputs.purpose_profile_json).kind == 'docker' && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Validate container build
        env:
          VALIDATE_COMMAND: ${{ fromJSON(inputs.purpose_profile_json).command }}
        shell: bash
        run: |
          set -euo pipefail
          bash -eo pipefail -c "$VALIDATE_COMMAND"



  validate_kaggle:
    needs: central_check_start
    if: ${{ fromJSON(inputs.purpose_profile_json).kind == 'kaggle' && (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30  # submits the kernel and exits; Kaggle reports the result (remote-run-result.yml)
    environment: ${{ inputs.target_repository_name }}
    permissions:
      contents: read
      id-token: write
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      SOURCE_WORKFLOW_PATH: ${{ inputs.source_workflow_path }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      PURPOSE_PROFILE_JSON: ${{ inputs.purpose_profile_json }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || vars.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip kaggle

      - name: Configure Kaggle credentials
        id: kaggle-auth
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KAGGLE_JSON:-}" ]; then
            mkdir -p "$HOME/.kaggle"
            printf '%s' "$KAGGLE_JSON" > "$HOME/.kaggle/kaggle.json"
            chmod 600 "$HOME/.kaggle/kaggle.json"
            if [ -z "${KAGGLE_USERNAME:-}" ]; then
              KAGGLE_USERNAME="$(jq -r '.username // empty' "$HOME/.kaggle/kaggle.json")"
              echo "KAGGLE_USERNAME=$KAGGLE_USERNAME" >> "$GITHUB_ENV"
            fi
          fi

          if [ -z "${KAGGLE_API_TOKEN:-}" ] && { [ -z "${KAGGLE_USERNAME:-}" ] || [ -z "${KAGGLE_KEY:-}" ]; } && [ ! -f "$HOME/.kaggle/kaggle.json" ]; then
            echo "::error::No Kaggle credentials are available to the central workflow."
            exit 1
          fi

          owner="${KAGGLE_USERNAME:-}"
          if [ -z "$owner" ]; then
            config="$(kaggle config view 2>/dev/null || true)"
            owner="$(awk -F: 'tolower($1) ~ /username/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2; exit}' <<<"$config")"
          fi
          if [ -z "$owner" ]; then
            owned="$(kaggle kernels list -m -v --page-size 1 2>/dev/null || true)"
            owner="$(awk -F, 'NR==2 {split($1,a,"/"); print a[1]}' <<<"$owned")"
          fi
          if [ -z "$owner" ]; then
            echo "::error::Kaggle token is present, but the account slug could not be inferred. Add KAGGLE_USERNAME as a workflows secret or variable."
            exit 1
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          kaggle kernels list -m --page-size 1 >/dev/null

      - name: Build Kaggle kernel package
        id: package
        env:
          KAGGLE_OWNER: ${{ steps.kaggle-auth.outputs.owner }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kaggle-kernel kaggle-output
          mkdir -p kaggle-kernel kaggle-output

          python - <<'PY'
          import json
          import os
          import textwrap
          from pathlib import Path

          profile = json.loads(os.environ["PURPOSE_PROFILE_JSON"])
          repo = os.environ["TARGET_REPOSITORY"]
          sha = os.environ["TARGET_SHA"]
          owner = os.environ["KAGGLE_OWNER"]

          slug = profile.get("kernel_slug", "central-experiment")
          title = profile.get("title", "Central Kaggle Experiment")
          if profile.get("unique_kernel_per_run", False):
              suffix = sha[:8]
              slug = f"{slug}-{suffix}"
              title = f"{title} {suffix}"
          accelerator = profile.get("accelerator", "NvidiaTeslaT4")
          setup_command = profile.get("setup_command", "")
          command = profile["command"]

          script = f"""\
          from __future__ import annotations
          import shutil
          import subprocess
          from pathlib import Path

          working = Path("/kaggle/working")
          target = working / "target-repository"
          if target.exists():
              shutil.rmtree(target)

          try:
              subprocess.run(
                  ["git", "clone", "--quiet", "https://github.com/{repo}.git", str(target)],
                  check=True,
              )
              subprocess.run(["git", "-C", str(target), "checkout", "--quiet", "{sha}"], check=True)
              setup = {setup_command!r}
              if setup:
                  subprocess.run(setup, cwd=target, shell=True, executable="/bin/bash", check=True)
              subprocess.run({command!r}, cwd=target, shell=True, executable="/bin/bash", check=True)
          finally:
              if target.exists():
                  shutil.rmtree(target)
          """
          Path("kaggle-kernel/experiment.py").write_text(textwrap.dedent(script), encoding="utf-8")

          metadata = {
              "id": f"{owner}/{slug}",
              "title": title,
              "code_file": "experiment.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": accelerator,
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": [],
          }
          Path("kaggle-kernel/kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          kernel_ref="$(python -c 'import json; print(json.load(open("kaggle-kernel/kernel-metadata.json"))["id"])')"
          accelerator="$(jq -r '.accelerator // "NvidiaTeslaT4"' <<<"$PURPOSE_PROFILE_JSON")"
          timeout_seconds="$(jq -r '.kaggle_timeout_seconds // 21600' <<<"$PURPOSE_PROFILE_JSON")"
          echo "kernel_ref=$kernel_ref" >> "$GITHUB_OUTPUT"
          echo "accelerator=$accelerator" >> "$GITHUB_OUTPUT"
          echo "timeout_seconds=$timeout_seconds" >> "$GITHUB_OUTPUT"

      - name: Register asynchronous remote-run callback
        id: async-callback
        env:
          WORKER_URL: https://workflows.hereliesaz.workers.dev
          KERNEL_REF: ${{ steps.package.outputs.kernel_ref }}
          CALLBACK_TTL_SECONDS: ${{ fromJSON(inputs.purpose_profile_json).callback_ttl_seconds || 28800 }}
          # Release publishing happens in the finalizer once Kaggle reports success.
          PUBLISH_RELEASE: ${{ fromJSON(inputs.purpose_profile_json).release_tag != null && fromJSON(inputs.purpose_profile_json).release_tag != '' && (inputs.target_event_name == 'workflow_dispatch' || (inputs.target_event_name == 'push' && fromJSON(inputs.purpose_profile_json).release_publish_on_push == true)) }}
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail-with-body --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hereliesaz-workflows")"
          oidc_token="$(jq -er '.value' <<<"$oidc_json")"
          details_url="https://www.kaggle.com/code/$KERNEL_REF"
          payload="$(jq -n             --arg target_repository "$TARGET_REPOSITORY"             --arg target_sha "$TARGET_SHA"             --arg target_check_sha "$TARGET_CHECK_SHA"             --arg source_workflow_path "$SOURCE_WORKFLOW_PATH"             --arg provider "kaggle"             --arg run_ref "$KERNEL_REF"             --arg details_url "$details_url"             --arg central_run_id "$GITHUB_RUN_ID"             --arg ttl_seconds "$CALLBACK_TTL_SECONDS"             --argjson publish_release "$PUBLISH_RELEASE"             '{publish_release:$publish_release,target_repository:$target_repository,target_sha:$target_sha,target_check_sha:$target_check_sha,source_workflow_path:$source_workflow_path,provider:$provider,run_ref:$run_ref,details_url:$details_url,central_run_id:$central_run_id,ttl_seconds:($ttl_seconds|tonumber)}')"
          response="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $oidc_token"             -H "Content-Type: application/json"             --data "$payload"             "$WORKER_URL/remote-run/start")"
          callback_token="$(jq -er '.callback_token' <<<"$response")"
          echo "::add-mask::$callback_token"
          echo "callback_url=$(jq -er '.callback_url' <<<"$response")" >> "$GITHUB_OUTPUT"
          echo "callback_token=$callback_token" >> "$GITHUB_OUTPUT"
          echo "expires_at=$(jq -er '.expires_at' <<<"$response")" >> "$GITHUB_OUTPUT"

      - name: Wrap Kaggle payload with callback reporter
        env:
          CALLBACK_URL: ${{ steps.async-callback.outputs.callback_url }}
          CALLBACK_TOKEN: ${{ steps.async-callback.outputs.callback_token }}
          KERNEL_REF: ${{ steps.package.outputs.kernel_ref }}
        shell: bash
        run: |
          set -euo pipefail
          mv kaggle-kernel/experiment.py kaggle-kernel/payload.py
          python - <<'PY'
          import json
          import os
          import textwrap
          from pathlib import Path

          callback_url = os.environ["CALLBACK_URL"]
          callback_token = os.environ["CALLBACK_TOKEN"]
          kernel_ref = os.environ["KERNEL_REF"]

          wrapper = f"""
          from __future__ import annotations

          import json
          import runpy
          import time
          import traceback
          import urllib.request
          from pathlib import Path

          CALLBACK_URL = {callback_url!r}
          CALLBACK_TOKEN = {callback_token!r}
          KERNEL_REF = {kernel_ref!r}
          PAYLOAD = Path(__file__).with_name("payload.py")

          failure = None
          state = "success"
          description = f"Kaggle kernel {{KERNEL_REF}} completed."

          try:
              runpy.run_path(str(PAYLOAD), run_name="__main__")
          except BaseException as exc:
              failure = exc
              state = "failure"
              description = f"Kaggle kernel {{KERNEL_REF}} failed: {{type(exc).__name__}}"
              traceback.print_exc()
          finally:
              body = json.dumps({{"state": state, "description": description}}).encode("utf-8")
              last_error = None
              for delay in (0, 2, 5, 10, 20):
                  if delay:
                      time.sleep(delay)
                  request = urllib.request.Request(
                      CALLBACK_URL,
                      data=body,
                      method="POST",
                      headers={{
                          "Authorization": f"Bearer {{CALLBACK_TOKEN}}",
                          "Content-Type": "application/json",
                          "User-Agent": "onwordly-kaggle-remote-run",
                      }},
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          response.read()
                      last_error = None
                      break
                  except Exception as callback_error:
                      last_error = callback_error
                      print(f"Remote callback attempt failed: {{callback_error!r}}", flush=True)
              if last_error is not None:
                  print(f"Remote callback exhausted retries: {{last_error!r}}", flush=True)

          if failure is not None:
              raise failure
          """
          Path("kaggle-kernel/experiment.py").write_text(textwrap.dedent(wrapper), encoding="utf-8")
          PY

      - name: Submit Kaggle GPU run
        env:
          KERNEL_REF: ${{ steps.package.outputs.kernel_ref }}
          ACCELERATOR: ${{ steps.package.outputs.accelerator }}
          KAGGLE_TIMEOUT_SECONDS: ${{ steps.package.outputs.timeout_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Submitting $KERNEL_REF on $ACCELERATOR"

          set +e
          push_output="$(kaggle kernels push -p kaggle-kernel --accelerator "$ACCELERATOR" --timeout "$KAGGLE_TIMEOUT_SECONDS" 2>&1)"
          push_exit=$?
          set -e
          printf '%s\n' "$push_output"

          lower="$(tr '[:upper:]' '[:lower:]' <<<"$push_output")"
          if (( push_exit != 0 )) || [[ "$lower" == *"kernel push error:"* ]] || [[ "$lower" != *"successfully pushed"* ]]; then
            mkdir -p kaggle-control
            printf '%s\n' "$push_output" > kaggle-control/submission-error.txt
            echo "::error::Kaggle submission did not create a runnable kernel."
            exit 1
          fi

          submitted_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          kaggle_url="https://www.kaggle.com/code/$KERNEL_REF"
          mkdir -p kaggle-control
          jq -n             --arg kernel_ref "$KERNEL_REF"             --arg kaggle_url "$kaggle_url"             --arg target_repository "$TARGET_REPOSITORY"             --arg target_sha "$TARGET_SHA"             --arg accelerator "$ACCELERATOR"             --arg submitted_at "$submitted_at"             --arg submission_output "$push_output"             --arg timeout_seconds "$KAGGLE_TIMEOUT_SECONDS"             '{kernel_ref:$kernel_ref,kaggle_url:$kaggle_url,target_repository:$target_repository,target_sha:$target_sha,accelerator:$accelerator,submitted_at:$submitted_at,submission_output:$submission_output,timeout_seconds:($timeout_seconds|tonumber)}'             > kaggle-control/run.json

          {
            echo "### Kaggle submission"
            echo
            echo "- Kernel: $kaggle_url"
            echo "- Kernel ref: `$KERNEL_REF`"
            echo "- Target: `$TARGET_REPOSITORY@$TARGET_SHA`"
            echo "- Accelerator: `$ACCELERATOR`"
            echo "- Submitted: `$submitted_at`"
            echo "- Submission confirmed by Kaggle CLI."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Kaggle kernel::$KERNEL_REF — $kaggle_url"

          if [[ -n "${GH_TOKEN:-}" && -n "${TARGET_CHECK_SHA:-}" ]]; then
            payload="$(jq -n               --arg state "pending"               --arg context "$SOURCE_WORKFLOW_PATH"               --arg description "Kaggle kernel $KERNEL_REF submitted."               --arg target_url "$kaggle_url"               '{state:$state,context:$context,description:$description,target_url:$target_url}')"
            gh api --method POST "repos/$TARGET_REPOSITORY/statuses/$TARGET_CHECK_SHA" --input - <<<"$payload" >/dev/null || true
          fi

      - name: Upload Kaggle run metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kaggle-control-${{ inputs.target_repository_name }}-${{ github.run_id }}
          path: |
            kaggle-control/run.json
            kaggle-control/submission-error.txt
          retention-days: ${{ fromJSON(inputs.purpose_profile_json).retention_days || 30 }}
          if-no-files-found: warn

  central_check_finish:
    # A workflow cancellation must terminate immediately. Running an `always()` cleanup job
    # after cancellation can leave the run queued for a runner, which keeps its concurrency
    # slot and target workflow status alive indefinitely. A newer run will supersede the
    # pending status for the same source workflow.
    if: ${{ always() && !cancelled() }}
    needs:
      - central_check_start
      - validate_python
      - validate_node
      - validate_gradle
      - validate_flutter
      - validate_docker
      - validate_kaggle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          PURPOSE_PROFILE_JSON: ${{ inputs.purpose_profile_json }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          async_remote="$(jq -r '.kind == "kaggle"' <<<"$PURPOSE_PROFILE_JSON")"
          # Skipped jobs are neither failed nor cancelled; success needs a validation job that ran.
          validated="$(jq -r '[to_entries[] | select(.key | startswith("validate_")) | select(.value.result == "success")] | length > 0' <<<"$NEEDS_JSON")"
          if [[ "$FAILED" == "true" ]]; then
            state="failure"
            description="CI validation failed before remote execution completed."
          elif [[ "$validated" != "true" ]]; then
            state="error"
            description="No validation ran for this event (fork pull request or unmatched profile)."
          elif [[ "$async_remote" == "true" ]]; then
            echo "Remote compute was dispatched successfully; the remote job owns the terminal commit status."
            exit 0
          else
            state="success"
            description="CI validation completed successfully."
          fi
          payload="$(jq -n             --arg state "$state"             --arg context "$STATUS_CONTEXT"             --arg description "$description"             --arg target_url "$DETAILS_URL"             '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          gh api --method POST "repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}" --input - <<<"$payload"
      - name: Mint target check token
        id: target-check-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz
      - name: Post target check run
        if: ${{ always() && steps.target-check-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.target-check-token.outputs.token }}
          RUN_READ_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_PHASE: finish
          CHECK_NAME: ${{ inputs.target_workflow_name || inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        shell: bash
        run: "set +e\nwarn() { echo \"::warning::Target check run skipped: $1\"; exit 0; }\n[[ -n \"${TARGET_REPOSITORY:-}\" && -n \"${TARGET_CHECK_SHA:-}\" ]] || warn \"no target commit\"\ntitle=\"$CHECK_NAME\"\ntext=\"\"\nif [[ \"$CHECK_PHASE\" == \"start\" ]]; then\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$url,external_id:$ext,output:{title:$name,summary:(\"Running in HereLiesAz/workflows: \" + $url)}}')\"\nelse\n  if [[ \"$FAILED\" == \"true\" ]]; then\n    conclusion=\"failure\"\n    jobs=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api --paginate \"repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs\" --jq '.jobs[]' 2>/dev/null | jq -s '.')\"\n    [[ -n \"$jobs\" ]] || jobs=\"[]\"\n    failed=\"$(jq -r '[.[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\")\n      | \"- **\\(.name)** (\\(.conclusion)): \" + ([.steps[]? | select(.conclusion == \"failure\") | .name] | join(\", \") | if . == \"\" then \"no failed step reported\" else . end)\n      + \" — [log](\\(.html_url))\"] | join(\"\\n\")' <<<\"$jobs\")\"\n    first_id=\"$(jq -r '[.[] | select(.conclusion == \"failure\")][0].id // empty' <<<\"$jobs\")\"\n    if [[ -n \"$first_id\" ]]; then\n      tail_log=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api \"repos/${GITHUB_REPOSITORY}/actions/jobs/${first_id}/logs\" 2>/dev/null \\\n        | sed -E 's/^[0-9T:.-]+Z //' | grep -v '^##\\[group\\]\\|^##\\[endgroup\\]' | tail -n 60)\"\n      [[ -n \"$tail_log\" ]] && text=\"$(printf 'Last lines of the first failed job:\\n\\n~~~text\\n%s\\n~~~\\n' \"${tail_log:0:60000}\")\"\n    fi\n    summary=\"$(printf 'Central run failed: %s\\n\\n%s\\n' \"$DETAILS_URL\" \"${failed:-No failed job reported.}\")\"\n    title=\"$CHECK_NAME failed\"\n  else\n    conclusion=\"success\"\n    summary=\"Central run succeeded: $DETAILS_URL\"\n  fi\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    --arg conclusion \"$conclusion\" --arg title \"$title\" --arg summary \"${summary:0:65000}\" --arg text \"$text\" \\\n    '{name:$name,head_sha:$sha,status:\"completed\",conclusion:$conclusion,details_url:$url,external_id:$ext,output:({title:$title,summary:$summary} + (if $text == \"\" then {} else {text:$text} end))}')\"\nfi\n# Each phase posts its own Check Run under the same name; GitHub shows the latest one,\n# so the finish phase needs no id handed over from the start job.\ngh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$body\" >/dev/null \\\n  || echo \"::warning::Target check run skipped: GitHub refused the check run\"\n\n# Release/deploy failures also go to one open issue per workflow: opened on the\n# first failure, commented on each repeat. Successes never touch issues.\n[[ \"$CHECK_PHASE\" == \"finish\" && \"${FILE_ISSUES:-}\" == \"true\" && \"${conclusion:-}\" == \"failure\" ]] || exit 0\nlabel=\"central-run-failure\"\nissue_title=\"Central run failing: $CHECK_NAME\"\nissue=\"$(gh api \"repos/${TARGET_REPOSITORY}/issues?state=open&labels=${label}&per_page=100\" 2>/dev/null \\\n  | jq -r --arg t \"$issue_title\" '[.[] | select(.title == $t)][0].number // empty')\"\nreport=\"$(printf '%s\\n\\nCommit: %s\\n\\n%s\\n' \"$summary\" \"$TARGET_CHECK_SHA\" \"$text\")\"\nif [[ -n \"$issue\" ]]; then\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"$report\" >/dev/null \\\n    || warn \"could not comment on issue #$issue\"\nelse\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/labels\" -f name=\"$label\" -f color=\"000000\" \\\n    -f description=\"A release or deploy run in HereLiesAz/workflows failed for this repository.\" >/dev/null 2>&1\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues\" -f title=\"$issue_title\" -f body=\"$report\" -f \"labels[]=$label\" >/dev/null \\\n    || warn \"could not open a failure issue\"\nfi\n"
