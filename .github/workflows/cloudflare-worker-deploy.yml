# workflow-policy: generalized-v1
# workflow-purpose: Test a target repository's Cloudflare Worker and deploy it with Wrangler on pushes to its default branch.
# required-secret: GH_TOKEN | Central GitHub token used to check out the target repository and report its commit status.
# required-secret: CLOUDFLARE_API_TOKEN | Authorizes Wrangler to deploy the target repository's Worker to Cloudflare.
# required-secret: CLOUDFLARE_ACCOUNT_ID | Identifies the Cloudflare account that hosts the target repository's Worker.
# required-secret: TRAKT_CLIENT_ID | Trakt OAuth client id, set on Workers whose profile lists it in worker_secrets.
# required-secret: TRAKT_CLIENT_SECRET | Trakt OAuth client secret, set on Workers whose profile lists it in worker_secrets.
# required-secret: BLS_KEY | U.S. Bureau of Labor Statistics API key, set on Workers whose profile lists it in worker_secrets.
# required-secret: GH_APP_ID | GitHub App that writes the Check Run mirroring this run onto the target commit.
# required-secret: GH_PRIVATE_KEY | Private key of that GitHub App, used to mint its installation token.
# The repository supplies wrangler.toml/wrangler.jsonc; nothing Worker-specific lives here.
# Optional purpose-profile keys: working_directory (default "."), node_version
# (default "22"), install_command (default: npm ci / npm install in working_directory; run in a
# subshell, so a `cd` in it does not carry over), test_command (default "npm test --if-present"),
# worker_secrets (names of central secrets to set on the Worker after deploying; only those
# forwarded below are allowed), verify_command (run last, with DEPLOYMENT_URL set to Wrangler's
# deployment URL; a failure fails the run).
name: Cloudflare Worker Deploy
run-name: ${{ inputs.target_repository_name }} · Cloudflare Worker Deploy
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
      target_repository_name:
        required: true
        type: string
      purpose_profile_json:
        required: false
        type: string
        default: '{}'
jobs:
  policy_secret_preflight:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_repository_name }}
    env:
      REQUIRED_GH_TOKEN: ${{ secrets.GH_TOKEN }}
      REQUIRED_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      REQUIRED_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REQUIRED_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      REQUIRED_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      REQUIRED_BLS_KEY: ${{ secrets.BLS_KEY }}
      PROFILE_JSON: ${{ inputs.purpose_profile_json }}
      REQUIRED_GH_APP_ID: ${{ secrets.GH_APP_ID }}
      REQUIRED_GH_PRIVATE_KEY: ${{ secrets.GH_PRIVATE_KEY }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${REQUIRED_GH_TOKEN:-}" || {
            echo "::error::Missing required secret GH_TOKEN — Central GitHub token used to check out the target repository and report its commit status."
            exit 1
          }
          test -n "${REQUIRED_CLOUDFLARE_API_TOKEN:-}" || {
            echo "::error::Missing required secret CLOUDFLARE_API_TOKEN — Authorizes Wrangler to deploy the target repository's Worker to Cloudflare."
            exit 1
          }
          test -n "${REQUIRED_CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "::error::Missing required secret CLOUDFLARE_ACCOUNT_ID — Identifies the Cloudflare account that hosts the target repository's Worker."
            exit 1
          }
          # Forwarded secrets are required only by Workers whose profile lists them.
          profile="${PROFILE_JSON:-}"; [[ -n "$profile" ]] || profile='{}'
          wants() { jq -e --arg n "$1" '(.worker_secrets // []) | index($n)' <<<"$profile" >/dev/null; }
          if wants TRAKT_CLIENT_ID; then
            test -n "${REQUIRED_TRAKT_CLIENT_ID:-}" || {
              echo "::error::Missing required secret TRAKT_CLIENT_ID — Trakt OAuth client id, set on Workers whose profile lists it in worker_secrets."
              exit 1
            }
          fi
          if wants TRAKT_CLIENT_SECRET; then
            test -n "${REQUIRED_TRAKT_CLIENT_SECRET:-}" || {
              echo "::error::Missing required secret TRAKT_CLIENT_SECRET — Trakt OAuth client secret, set on Workers whose profile lists it in worker_secrets."
              exit 1
            }
          fi
          if wants BLS_KEY; then
            test -n "${REQUIRED_BLS_KEY:-}" || {
              echo "::error::Missing required secret BLS_KEY — U.S. Bureau of Labor Statistics API key, set on Workers whose profile lists it in worker_secrets."
              exit 1
            }
          fi
          test -n "${REQUIRED_GH_APP_ID:-}" || {
            echo "::error::Missing required secret GH_APP_ID — GitHub App that writes the Check Run mirroring this run onto the target commit."
            exit 1
          }
          test -n "${REQUIRED_GH_PRIVATE_KEY:-}" || {
            echo "::error::Missing required secret GH_PRIVATE_KEY — Private key of that GitHub App, used to mint its installation token."
            exit 1
          }

  central_check_start:
    needs: policy_secret_preflight
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
      - name: Mint target check token
        id: target-check-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz
      - name: Post target check run
        if: ${{ always() && steps.target-check-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.target-check-token.outputs.token }}
          RUN_READ_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_PHASE: start
          CHECK_NAME: ${{ inputs.target_workflow_name || inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set +e\nwarn() { echo \"::warning::Target check run skipped: $1\"; exit 0; }\n[[ -n \"${TARGET_REPOSITORY:-}\" && -n \"${TARGET_CHECK_SHA:-}\" ]] || warn \"no target commit\"\ntitle=\"$CHECK_NAME\"\ntext=\"\"\nif [[ \"$CHECK_PHASE\" == \"start\" ]]; then\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$url,external_id:$ext,output:{title:$name,summary:(\"Running in HereLiesAz/workflows: \" + $url)}}')\"\nelse\n  if [[ \"$FAILED\" == \"true\" ]]; then\n    conclusion=\"failure\"\n    jobs=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api --paginate \"repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs\" --jq '.jobs[]' 2>/dev/null | jq -s '.')\"\n    [[ -n \"$jobs\" ]] || jobs=\"[]\"\n    failed=\"$(jq -r '[.[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\")\n      | \"- **\\(.name)** (\\(.conclusion)): \" + ([.steps[]? | select(.conclusion == \"failure\") | .name] | join(\", \") | if . == \"\" then \"no failed step reported\" else . end)\n      + \" — [log](\\(.html_url))\"] | join(\"\\n\")' <<<\"$jobs\")\"\n    first_id=\"$(jq -r '[.[] | select(.conclusion == \"failure\")][0].id // empty' <<<\"$jobs\")\"\n    if [[ -n \"$first_id\" ]]; then\n      tail_log=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api \"repos/${GITHUB_REPOSITORY}/actions/jobs/${first_id}/logs\" 2>/dev/null \\\n        | sed -E 's/^[0-9T:.-]+Z //' | grep -v '^##\\[group\\]\\|^##\\[endgroup\\]' | tail -n 60)\"\n      [[ -n \"$tail_log\" ]] && text=\"$(printf 'Last lines of the first failed job:\\n\\n~~~text\\n%s\\n~~~\\n' \"${tail_log:0:60000}\")\"\n    fi\n    summary=\"$(printf 'Central run failed: %s\\n\\n%s\\n' \"$DETAILS_URL\" \"${failed:-No failed job reported.}\")\"\n    title=\"$CHECK_NAME failed\"\n  else\n    conclusion=\"success\"\n    summary=\"Central run succeeded: $DETAILS_URL\"\n  fi\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    --arg conclusion \"$conclusion\" --arg title \"$title\" --arg summary \"${summary:0:65000}\" --arg text \"$text\" \\\n    '{name:$name,head_sha:$sha,status:\"completed\",conclusion:$conclusion,details_url:$url,external_id:$ext,output:({title:$title,summary:$summary} + (if $text == \"\" then {} else {text:$text} end))}')\"\nfi\n# Each phase posts its own Check Run under the same name; GitHub shows the latest one,\n# so the finish phase needs no id handed over from the start job.\ngh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$body\" >/dev/null \\\n  || echo \"::warning::Target check run skipped: GitHub refused the check run\"\n\n# Release/deploy workflows also keep one open issue per workflow while it fails:\n# opened on the first failure, commented on each repeat, closed by the next success.\n[[ \"$CHECK_PHASE\" == \"finish\" && \"${FILE_ISSUES:-}\" == \"true\" ]] || exit 0\nlabel=\"central-run-failure\"\nissue_title=\"Central run failing: $CHECK_NAME\"\nissue=\"$(gh api \"repos/${TARGET_REPOSITORY}/issues?state=open&labels=${label}&per_page=100\" 2>/dev/null \\\n  | jq -r --arg t \"$issue_title\" '[.[] | select(.title == $t)][0].number // empty')\"\nif [[ \"$conclusion\" == \"failure\" ]]; then\n  report=\"$(printf '%s\\n\\nCommit: %s\\n\\n%s\\n' \"$summary\" \"$TARGET_CHECK_SHA\" \"$text\")\"\n  if [[ -n \"$issue\" ]]; then\n    gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"$report\" >/dev/null \\\n      || warn \"could not comment on issue #$issue\"\n  else\n    gh api --method POST \"repos/${TARGET_REPOSITORY}/labels\" -f name=\"$label\" -f color=\"000000\" \\\n      -f description=\"A release or deploy run in HereLiesAz/workflows failed for this repository.\" >/dev/null 2>&1\n    gh api --method POST \"repos/${TARGET_REPOSITORY}/issues\" -f title=\"$issue_title\" -f body=\"$report\" -f \"labels[]=$label\" >/dev/null \\\n      || warn \"could
          not open a failure issue\"\n  fi\nelif [[ -n \"$issue\" ]]; then\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"Fixed: $summary (commit $TARGET_CHECK_SHA).\" >/dev/null\n  gh api --method PATCH \"repos/${TARGET_REPOSITORY}/issues/${issue}\" -f state=closed -f state_reason=completed >/dev/null \\\n    || warn \"could not close issue #$issue\"\nfi\n"
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}

  test_and_deploy:
    needs: central_check_start
    # Deploy only from the default branch (push or manual run); never from pull requests.
    if: ${{ inputs.target_event_name == 'push' || inputs.target_event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_repository_name }}
    permissions:
      contents: read
    concurrency:
      group: worker-deploy-${{ inputs.target_repository_name }}
      cancel-in-progress: false
    steps:
      - name: Check out target
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Resolve profile
        env:
          PROFILE_JSON: ${{ inputs.purpose_profile_json }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "WORKER_DIR=$(jq -r '.working_directory // "."' <<<"$PROFILE_JSON")"
            echo "NODE_VERSION=$(jq -r '.node_version // "22"' <<<"$PROFILE_JSON")"
            echo "TEST_COMMAND=$(jq -r '.test_command // "npm test --if-present"' <<<"$PROFILE_JSON")"
            echo "WORKER_SECRETS=$(jq -r '(.worker_secrets // []) | join(" ")' <<<"$PROFILE_JSON")"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install and test
        working-directory: ${{ env.WORKER_DIR }}
        env:
          PROFILE_JSON: ${{ inputs.purpose_profile_json }}
        shell: bash
        run: |
          set -euo pipefail
          profile="${PROFILE_JSON:-}"; [[ -n "$profile" ]] || profile='{}'
          install_command="$(jq -r '.install_command // ""' <<<"$profile")"
          if [[ -n "$install_command" ]]; then
            ( eval "$install_command" )
          elif [[ -f package-lock.json ]]; then npm ci
          elif [[ -f package.json ]]; then npm install --no-audit --no-fund
          fi
          eval "$TEST_COMMAND"

      - name: Deploy with Wrangler
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.WORKER_DIR }}

      # Central secrets a Worker needs at runtime, named by its profile. Each forwardable
      # secret is mapped here explicitly; a name the profile lists without a mapping fails.
      - name: Set Worker secrets
        if: ${{ env.WORKER_SECRETS != '' }}
        working-directory: ${{ env.WORKER_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORWARD_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          FORWARD_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          FORWARD_BLS_KEY: ${{ secrets.BLS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{}'
          for name in $WORKER_SECRETS; do
            var="FORWARD_$name"
            if [[ -z "${!var+x}" ]]; then
              echo "::error::worker_secrets names $name, which this workflow doesn't forward"
              exit 1
            fi
            if [[ -z "${!var}" ]]; then
              echo "::warning::$name is not set in the central secrets; the Worker won't get it"
              continue
            fi
            payload="$(jq --arg k "$name" --arg v "${!var}" '. + {($k): $v}' <<<"$payload")"
          done
          if [[ "$payload" == '{}' ]]; then exit 0; fi
          printf '%s' "$payload" > "$RUNNER_TEMP/worker-env.json"
          npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/worker-env.json"
          rm -f "$RUNNER_TEMP/worker-env.json"

      # A Worker whose profile names a verify_command proves the new version is serving before the
      # run reports success. DEPLOYMENT_URL is the version's own address (workers.dev), so the check
      # does not depend on where the public domain points.
      - name: Verify deployment
        working-directory: ${{ env.WORKER_DIR }}
        env:
          PROFILE_JSON: ${{ inputs.purpose_profile_json }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          profile="${PROFILE_JSON:-}"; [[ -n "$profile" ]] || profile='{}'
          verify_command="$(jq -r '.verify_command // ""' <<<"$profile")"
          if [[ -z "$verify_command" ]]; then exit 0; fi
          test -n "${DEPLOYMENT_URL:-}" || { echo "::error::Wrangler reported no deployment URL to verify"; exit 1; }
          eval "$verify_command"

  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - test_and_deploy
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Shared catalog workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Shared catalog workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
      - name: Mint target check token
        id: target-check-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz
      - name: Post target check run
        if: ${{ always() && steps.target-check-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.target-check-token.outputs.token }}
          RUN_READ_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_PHASE: finish
          CHECK_NAME: ${{ inputs.target_workflow_name || inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          FILE_ISSUES: 'true'
        shell: bash
        run: "set +e\nwarn() { echo \"::warning::Target check run skipped: $1\"; exit 0; }\n[[ -n \"${TARGET_REPOSITORY:-}\" && -n \"${TARGET_CHECK_SHA:-}\" ]] || warn \"no target commit\"\ntitle=\"$CHECK_NAME\"\ntext=\"\"\nif [[ \"$CHECK_PHASE\" == \"start\" ]]; then\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$url,external_id:$ext,output:{title:$name,summary:(\"Running in HereLiesAz/workflows: \" + $url)}}')\"\nelse\n  if [[ \"$FAILED\" == \"true\" ]]; then\n    conclusion=\"failure\"\n    jobs=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api --paginate \"repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs\" --jq '.jobs[]' 2>/dev/null | jq -s '.')\"\n    [[ -n \"$jobs\" ]] || jobs=\"[]\"\n    failed=\"$(jq -r '[.[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\")\n      | \"- **\\(.name)** (\\(.conclusion)): \" + ([.steps[]? | select(.conclusion == \"failure\") | .name] | join(\", \") | if . == \"\" then \"no failed step reported\" else . end)\n      + \" — [log](\\(.html_url))\"] | join(\"\\n\")' <<<\"$jobs\")\"\n    first_id=\"$(jq -r '[.[] | select(.conclusion == \"failure\")][0].id // empty' <<<\"$jobs\")\"\n    if [[ -n \"$first_id\" ]]; then\n      tail_log=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api \"repos/${GITHUB_REPOSITORY}/actions/jobs/${first_id}/logs\" 2>/dev/null \\\n        | sed -E 's/^[0-9T:.-]+Z //' | grep -v '^##\\[group\\]\\|^##\\[endgroup\\]' | tail -n 60)\"\n      [[ -n \"$tail_log\" ]] && text=\"$(printf 'Last lines of the first failed job:\\n\\n~~~text\\n%s\\n~~~\\n' \"${tail_log:0:60000}\")\"\n    fi\n    summary=\"$(printf 'Central run failed: %s\\n\\n%s\\n' \"$DETAILS_URL\" \"${failed:-No failed job reported.}\")\"\n    title=\"$CHECK_NAME failed\"\n  else\n    conclusion=\"success\"\n    summary=\"Central run succeeded: $DETAILS_URL\"\n  fi\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    --arg conclusion \"$conclusion\" --arg title \"$title\" --arg summary \"${summary:0:65000}\" --arg text \"$text\" \\\n    '{name:$name,head_sha:$sha,status:\"completed\",conclusion:$conclusion,details_url:$url,external_id:$ext,output:({title:$title,summary:$summary} + (if $text == \"\" then {} else {text:$text} end))}')\"\nfi\n# Each phase posts its own Check Run under the same name; GitHub shows the latest one,\n# so the finish phase needs no id handed over from the start job.\ngh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$body\" >/dev/null \\\n  || echo \"::warning::Target check run skipped: GitHub refused the check run\"\n\n# Release/deploy workflows also keep one open issue per workflow while it fails:\n# opened on the first failure, commented on each repeat, closed by the next success.\n[[ \"$CHECK_PHASE\" == \"finish\" && \"${FILE_ISSUES:-}\" == \"true\" ]] || exit 0\nlabel=\"central-run-failure\"\nissue_title=\"Central run failing: $CHECK_NAME\"\nissue=\"$(gh api \"repos/${TARGET_REPOSITORY}/issues?state=open&labels=${label}&per_page=100\" 2>/dev/null \\\n  | jq -r --arg t \"$issue_title\" '[.[] | select(.title == $t)][0].number // empty')\"\nif [[ \"$conclusion\" == \"failure\" ]]; then\n  report=\"$(printf '%s\\n\\nCommit: %s\\n\\n%s\\n' \"$summary\" \"$TARGET_CHECK_SHA\" \"$text\")\"\n  if [[ -n \"$issue\" ]]; then\n    gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"$report\" >/dev/null \\\n      || warn \"could not comment on issue #$issue\"\n  else\n    gh api --method POST \"repos/${TARGET_REPOSITORY}/labels\" -f name=\"$label\" -f color=\"000000\" \\\n      -f description=\"A release or deploy run in HereLiesAz/workflows failed for this repository.\" >/dev/null 2>&1\n    gh api --method POST \"repos/${TARGET_REPOSITORY}/issues\" -f title=\"$issue_title\" -f body=\"$report\" -f \"labels[]=$label\" >/dev/null \\\n      || warn \"could
          not open a failure issue\"\n  fi\nelif [[ -n \"$issue\" ]]; then\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"Fixed: $summary (commit $TARGET_CHECK_SHA).\" >/dev/null\n  gh api --method PATCH \"repos/${TARGET_REPOSITORY}/issues/${issue}\" -f state=closed -f state_reason=completed >/dev/null \\\n    || warn \"could not close issue #$issue\"\nfi\n"
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
