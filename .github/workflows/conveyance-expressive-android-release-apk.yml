  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Inject Google Services
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: "if [ -f \"app/google-services.json.template\" ]; then\n  echo \"Template found. Injecting secrets...\"\n  sed -e 's/{{\\([^}]*\\)}}/${\\1}/g' app/google-services.json.template | envsubst > app/google-services.json\nelse\n  echo \"Warning: google-services.json.template not found. Skipping injection.\"\nfi\n# Add any extra local.properties keys below:\n# echo \"CUSTOM_API_KEY=$CUSTOM_API_KEY\" >> local.properties\n"
      - name: Decode signing keystore
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
        run: "if [ -z \"$KEYSTORE_RAW\" ]; then\n  echo \"::error::KEYSTORE_RAW secret is empty — cannot produce a signed build.\"\n  exit 1\nfi\necho \"$KEYSTORE_RAW\" | base64 -d > app/keystore.jks\nif [ ! -s app/keystore.jks ]; then\n  echo \"::error::Decoded keystore is empty — KEYSTORE_RAW is not valid base64.\"\n  exit 1\nfi\necho \"Keystore decoded to app/keystore.jks ($(stat -c%s app/keystore.jks) bytes)\"\n"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          cache-read-only: false
          dependency-graph: disabled
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Prepare Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: "MAJOR=$(grep '^versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nMINOR=$(grep '^versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nPATCH=$(grep '^versionPatch=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nBUILD_NUMBER=$(grep '^versionBuild=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nVERSION_NAME=\"${MAJOR}.${MINOR}.${PATCH}.${BUILD_NUMBER}\"\nTAG_NAME=\"latest-release-v${MAJOR}.${MINOR}\"\n\nif [ -f \"settings.gradle.kts\" ]; then\n  APP_NAME=$(grep 'rootProject.name' settings.gradle.kts | sed -E \"s/.*=.*[\\\"'](.*)[\\\"']/\\1/\")\nelif [ -f \"settings.gradle\" ]; then\n  APP_NAME=$(grep 'rootProject.name' settings.gradle | sed -E \"s/.*=.*[\\\"'](.*)[\\\"']/\\1/\")\nelse\n  APP_NAME=\"App\"\nfi\n\nAPK_ORIGINAL=$(find app/build/outputs/apk/release -name \"*.apk\" | head -n 1)\nif [ -z \"$APK_ORIGINAL\" ]; then\n  echo \"Error: No APK found in app/build/outputs/apk/release/\"\n  find app/build/outputs/ -name \"*.apk\"\n  exit 1\nfi\n\nTARGET_NAME=\"${APP_NAME}-${VERSION_NAME}-release.apk\"\nmv \"$APK_ORIGINAL\" \"$TARGET_NAME\"\n\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n\ngit tag -fa \"$TAG_NAME\" -m \"Latest Release Build\"\ngit push origin \"$TAG_NAME\" --force\n\nif gh release view \"$TAG_NAME\" > /dev/null 2>&1; then\n  echo \"Updating existing release...\"\n  gh release edit \"$TAG_NAME\" \\\n    --title \"Latest Release v${MAJOR}.${MINOR} (${VERSION_NAME})\" \\\n    --notes \"Release build from commit $TARGET_SHA\"\n  gh release upload \"$TAG_NAME\" \"$TARGET_NAME\" --clobber\nelse\n  echo \"Creating new release...\"\n  gh release create \"$TAG_NAME\" \"$TARGET_NAME\" \\\n    --title \"Latest Release v${MAJOR}.${MINOR} (${VERSION_NAME})\" \\\n    --notes \"Release build from commit $TARGET_SHA\"\nfi\n"
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
