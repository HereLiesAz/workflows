concurrency:
  group: ${{ inputs.target_workflow_name }}-${{ inputs.target_ref }}-CueDetat
  cancel-in-progress: false
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from HereLiesAz/workflows.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Inject Google Services
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
        run: "if [ -f \"app/google-services.json.template\" ]; then\n  echo \"Template found. Injecting secrets...\"\n  sed -e 's/{{\\([^}]*\\)}}/${\\1}/g' app/google-services.json.template | envsubst > app/google-services.json\nelse\n  echo \"Warning: google-services.json.template not found. Skipping injection.\"\nfi\n"
      - name: Generate Keystore from Secrets
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: "echo \"Generating keystore from certificate chain and private key...\"\necho \"$KEYSTORE_PRIVATE\" > private_key.pem\necho \"$KEYSTORE_CHAIN\" > certificate_chain.crt\n\nopenssl pkcs12 -export -in certificate_chain.crt -inkey private_key.pem \\\n  -name \"$KEY_ALIAS\" -out keystore.p12 \\\n  -password pass:\"$KEYSTORE_PASSWORD\"\n\nkeytool -importkeystore -srckeystore keystore.p12 -srcstoretype PKCS12 \\\n  -destkeystore app/keystore.jks -deststoretype JKS \\\n  -srcstorepass \"$KEYSTORE_PASSWORD\" \\\n  -deststorepass \"$KEYSTORE_PASSWORD\" \\\n  -alias \"$KEY_ALIAS\" -noprompt\n\nrm private_key.pem certificate_chain.crt keystore.p12\necho \"Keystore generated at app/keystore.jks\"\n"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: disabled
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Resolve package name
        id: pkg
        run: "# Read applicationId from the version catalog (single source of truth),\n# falling back to the namespace in app/build.gradle.kts.\nPKG=$(grep -E '^[[:space:]]*applicationId[[:space:]]*=' gradle/libs.versions.toml | head -1 | sed -E 's/.*\"([^\"]+)\".*/\\1/')\nif [ -z \"$PKG\" ]; then\n  PKG=$(grep -E 'applicationId[[:space:]]*=' app/build.gradle.kts | head -1 | sed -E 's/.*\"([^\"]+)\".*/\\1/')\nfi\necho \"Resolved packageName: $PKG\"\necho \"package_name=$PKG\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Build signed Play AAB
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_ACTOR: ${{ secrets.GH_ACTOR }}
          GG_LINK: ${{ secrets.GG_LINK }}
          GG_SESSION: ${{ secrets.GG_SESSION }}
        run: "BUILD_NUMBER=$(git rev-list --count HEAD)\necho \"versionCode (commit count) = $BUILD_NUMBER\"\necho \"version_code=$BUILD_NUMBER\" >> \"$GITHUB_OUTPUT\"\n\n./gradlew bundleRelease -PversionBuild=\"$BUILD_NUMBER\" --build-cache \\\n  -Pandroid.injected.signing.store.file=\"$(pwd)/app/keystore.jks\" \\\n  -Pandroid.injected.signing.store.password=\"$KEYSTORE_PASSWORD\" \\\n  -Pandroid.injected.signing.key.alias=\"$KEY_ALIAS\" \\\n  -Pandroid.injected.signing.key.password=\"$KEY_PASSWORD\"\n"
      - name: Locate AAB
        id: aab
        run: "AAB=$(find app/build/outputs/bundle/release -name \"*.aab\" | head -n 1)\nif [ -z \"$AAB\" ]; then\n  echo \"Error: no release AAB found.\"\n  exit 1\nfi\necho \"Found AAB: $AAB\"\necho \"aab_path=$AAB\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Resolve required mapping.txt
        id: mapping
        shell: bash
        run: |
          set -euo pipefail
          mapping="app/build/outputs/mapping/release/mapping.txt"
          test -s "$mapping" || {
            echo "::error::Google Play publishing requires a nonempty mapping.txt at $mapping" >&2
            exit 1
          }
          cp "$mapping" "$RUNNER_TEMP/mapping.txt"
          echo "path=$RUNNER_TEMP/mapping.txt" >> "$GITHUB_OUTPUT"

      - name: Upload mapping.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuedetat-${{ steps.build.outputs.version_code }}-mapping
          path: ${{ steps.mapping.outputs.path }}
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-release-aab
          path: ${{ steps.aab.outputs.aab_path }}
          if-no-files-found: error
      - name: Set up Python
        if: ${{ inputs.target_event_name == 'push' || fromJSON(inputs.target_event_json).inputs.dry_run != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Play publishing dependencies
        if: ${{ inputs.target_event_name == 'push' || fromJSON(inputs.target_event_json).inputs.dry_run != 'true' }}
        run: pip install --disable-pip-version-check google-api-python-client google-auth
      - name: Publish to Google Play
        if: ${{ inputs.target_event_name == 'push' || fromJSON(inputs.target_event_json).inputs.dry_run != 'true' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE_NAME: ${{ steps.pkg.outputs.package_name }}
          PLAY_AAB_PATH: ${{ steps.aab.outputs.aab_path }}
          PLAY_MAPPING_PATH: ${{ steps.mapping.outputs.path }}
          PLAY_RELEASE_NAME: ${{ steps.build.outputs.version_code }}
        run: python .github/scripts/play_publish.py
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    environment: CueDetat
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - bundle
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Central workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Central workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
run-name: CueDetat · Play Publish (AAB)
