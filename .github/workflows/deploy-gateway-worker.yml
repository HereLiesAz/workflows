name: Deploy gateway worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-gateway-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflows-gateway-worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controller
        uses: actions/checkout@v4

      - name: Deploy gateway Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
