# Generalized purpose workflow: Desktop Package.
# OS matrix, build commands, artifact paths, versioning, and optional release behavior are profiles.
name: Desktop Package
run-name: ${{ inputs.target_repository_name }} · Desktop Package
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
      target_repository_name:
        required: true
        type: string
      purpose_profile_json:
        required: true
        type: string
permissions:
  contents: read
env:
  TARGET_REPOSITORY_NAME: ${{ inputs.target_repository_name }}
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
  TARGET_BASE_REF: ${{ inputs.target_base_ref }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_RUN_ID: ${{ inputs.target_run_id }}
  TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
  TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
  TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
concurrency:
  group: desktop-${{ inputs.target_repository_name }}-${{ inputs.source_workflow_path }}-${{ inputs.target_ref }}
  cancel-in-progress: false
jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from HereLiesAz/workflows.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""

      - name: Mint target check token
        id: target-check-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz
      - name: Post target check run
        if: ${{ always() && steps.target-check-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.target-check-token.outputs.token }}
          RUN_READ_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_PHASE: start
          CHECK_NAME: ${{ inputs.target_workflow_name || inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set +e\nwarn() { echo \"::warning::Target check run skipped: $1\"; exit 0; }\n[[ -n \"${TARGET_REPOSITORY:-}\" && -n \"${TARGET_CHECK_SHA:-}\" ]] || warn \"no target commit\"\ntitle=\"$CHECK_NAME\"\ntext=\"\"\nif [[ \"$CHECK_PHASE\" == \"start\" ]]; then\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$url,external_id:$ext,output:{title:$name,summary:(\"Running in HereLiesAz/workflows: \" + $url)}}')\"\nelse\n  if [[ \"$FAILED\" == \"true\" ]]; then\n    conclusion=\"failure\"\n    jobs=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api --paginate \"repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs\" --jq '.jobs[]' 2>/dev/null | jq -s '.')\"\n    [[ -n \"$jobs\" ]] || jobs=\"[]\"\n    failed=\"$(jq -r '[.[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\")\n      | \"- **\\(.name)** (\\(.conclusion)): \" + ([.steps[]? | select(.conclusion == \"failure\") | .name] | join(\", \") | if . == \"\" then \"no failed step reported\" else . end)\n      + \" — [log](\\(.html_url))\"] | join(\"\\n\")' <<<\"$jobs\")\"\n    first_id=\"$(jq -r '[.[] | select(.conclusion == \"failure\")][0].id // empty' <<<\"$jobs\")\"\n    if [[ -n \"$first_id\" ]]; then\n      tail_log=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api \"repos/${GITHUB_REPOSITORY}/actions/jobs/${first_id}/logs\" 2>/dev/null \\\n        | sed -E 's/^[0-9T:.-]+Z //' | grep -v '^##\\[group\\]\\|^##\\[endgroup\\]' | tail -n 60)\"\n      [[ -n \"$tail_log\" ]] && text=\"$(printf 'Last lines of the first failed job:\\n\\n~~~text\\n%s\\n~~~\\n' \"${tail_log:0:60000}\")\"\n    fi\n    summary=\"$(printf 'Central run failed: %s\\n\\n%s\\n' \"$DETAILS_URL\" \"${failed:-No failed job reported.}\")\"\n    title=\"$CHECK_NAME failed\"\n  else\n    conclusion=\"success\"\n    summary=\"Central run succeeded: $DETAILS_URL\"\n  fi\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    --arg conclusion \"$conclusion\" --arg title \"$title\" --arg summary \"${summary:0:65000}\" --arg text \"$text\" \\\n    '{name:$name,head_sha:$sha,status:\"completed\",conclusion:$conclusion,details_url:$url,external_id:$ext,output:({title:$title,summary:$summary} + (if $text == \"\" then {} else {text:$text} end))}')\"\nfi\n# Each phase posts its own Check Run under the same name; GitHub shows the latest one,\n# so the finish phase needs no id handed over from the start job.\ngh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$body\" >/dev/null \\\n  || echo \"::warning::Target check run skipped: GitHub refused the check run\"\n\n# Release/deploy failures also go to one open issue per workflow: opened on the\n# first failure, commented on each repeat. Successes never touch issues.\n[[ \"$CHECK_PHASE\" == \"finish\" && \"${FILE_ISSUES:-}\" == \"true\" && \"${conclusion:-}\" == \"failure\" ]] || exit 0\nlabel=\"central-run-failure\"\nissue_title=\"Central run failing: $CHECK_NAME\"\nissue=\"$(gh api \"repos/${TARGET_REPOSITORY}/issues?state=open&labels=${label}&per_page=100\" 2>/dev/null \\\n  | jq -r --arg t \"$issue_title\" '[.[] | select(.title == $t)][0].number // empty')\"\nreport=\"$(printf '%s\\n\\nCommit: %s\\n\\n%s\\n' \"$summary\" \"$TARGET_CHECK_SHA\" \"$text\")\"\nif [[ -n \"$issue\" ]]; then\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"$report\" >/dev/null \\\n    || warn \"could not comment on issue #$issue\"\nelse\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/labels\" -f name=\"$label\" -f color=\"000000\" \\\n    -f description=\"A release or deploy run in HereLiesAz/workflows failed for this repository.\" >/dev/null 2>&1\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues\" -f title=\"$issue_title\" -f body=\"$report\" -f \"labels[]=$label\" >/dev/null \\\n    || warn \"could not open a failure issue\"\nfi\n"
  package:
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.purpose_profile_json).matrix }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    environment: ${{ inputs.target_repository_name }}
    env:
      PROFILE_JSON: ${{ inputs.purpose_profile_json }}
      TARGET_INPUTS_JSON: ${{ inputs.target_inputs_json }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ fromJSON(inputs.purpose_profile_json).java_version || '21' }}
          distribution: temurin

      - name: Setup Gradle
        if: ${{ fromJSON(inputs.purpose_profile_json).use_gradle_setup != false }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Resolve desktop package version
        shell: bash
        run: |
          set -euo pipefail
          mode="$(jq -r '.version_mode // "none"' <<<"$PROFILE_JSON")"
          case "$mode" in
            none)
              version=""
              ;;
            fixed)
              version="$(jq -r '.fixed_version // empty' <<<"$PROFILE_JSON")"
              ;;
            mcpserved)
              if [ "$TARGET_REF_TYPE" = "tag" ] && [[ "$TARGET_REF_NAME" == desktop-v* ]]; then
                version="${TARGET_REF_NAME#desktop-v}"
              else
                requested="$(jq -r '.version // empty' <<<"$TARGET_INPUTS_JSON")"
                if [ -n "$requested" ]; then
                  version="$requested"
                else
                  major="$(grep '^versionMajor=' version.properties | cut -d= -f2 | tr -d '\r ')"
                  minor="$(grep '^versionMinor=' version.properties | cut -d= -f2 | tr -d '\r ')"
                  patch="$(grep '^versionPatch=' version.properties | cut -d= -f2 | tr -d '\r ')"
                  minor_last="$(grep '^versionMinorLast=' version.properties | cut -d= -f2 | tr -d '\r ' || true)"
                  build="$(grep '^versionBuild=' version.properties | cut -d= -f2 | tr -d '\r ')"
                  # Match the Android build's checked-in baseline and one compile increment.
                  # Major zero is a real product version, never a native installer workaround.
                  for component in "$major" "$minor" "$patch" "$build"; do
                    [[ "$component" =~ ^(0|[1-9][0-9]*)$ ]] || { echo "::error::Invalid MCPserved version baseline"; exit 1; }
                  done
                  if [ "$minor" = "$minor_last" ]; then
                    patch=$((patch + 1))
                  else
                    patch=0
                  fi
                  version="${major}.${minor}.${patch}.$((build + 1))"
                fi
              fi
              [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*))?$ ]] || {
                echo "::error::Invalid MCPserved desktop product version"; exit 1;
              }
              ;;
            *)
              echo "::error::Unknown desktop version mode: $mode" >&2
              exit 1
              ;;
          esac
          echo "DESKTOP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Prepare packaging environment
        if: ${{ matrix.prepare != '' }}
        shell: bash
        env:
          PREPARE_COMMAND: ${{ matrix.prepare }}
        run: bash -eo pipefail -c "$PREPARE_COMMAND"

      - name: Build desktop package
        shell: bash
        env:
          BUILD_COMMAND: ${{ matrix.build }}
        run: bash -eo pipefail -c "$BUILD_COMMAND"

      - name: Name MCPserved installers by public product version
        if: ${{ fromJSON(inputs.purpose_profile_json).version_mode == 'mcpserved' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          case "$RUNNER_OS" in
            Linux) extensions=(deb rpm); platform=linux ;;
            macOS) extensions=(dmg); platform=macos ;;
            Windows) extensions=(msi); platform=windows ;;
            *) echo "::error::Unsupported MCPserved desktop runner"; exit 1 ;;
          esac
          for ext in "${extensions[@]}"; do
            packages=(dist/*."$ext")
            [ "${#packages[@]}" -eq 1 ] && [ -s "${packages[0]}" ] || {
              echo "::error::Expected exactly one nonempty $ext package"; exit 1;
            }
            destination="dist/MCPserved-${DESKTOP_VERSION}-${platform}.${ext}"
            [ "${packages[0]}" = "$destination" ] || mv -- "${packages[0]}" "$destination"
          done

      - name: Upload package artifact
        id: upload1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          overwrite: true

      - name: Retry artifact upload
        if: ${{ steps.upload1.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          overwrite: true

  release:
    needs: [central_check_start, package]
    if: ${{ always() && needs.central_check_start.result == 'success' && needs.package.result == 'success' && fromJSON(inputs.purpose_profile_json).release_mode != 'none' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: ${{ inputs.target_repository_name }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      PROFILE_JSON: ${{ inputs.purpose_profile_json }}
      TARGET_INPUTS_JSON: ${{ inputs.target_inputs_json }}
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          mode="$(jq -r '.release_mode' <<<"$PROFILE_JSON")"
          should=true
          standalone=false
          prerelease=false
          case "$mode" in
            extrusion-preview)
              # Only this registered app may use the dedicated release contract.
              [[ "$TARGET_REPOSITORY" == "HereLiesAz/ExtrusionExtraction" && "$TARGET_REPOSITORY_ID" == "1471718709" ]] || {
                echo "::error::Extrusion preview profile used for wrong repository"; exit 1;
              }
              if [[ "$TARGET_REF_TYPE" != branch || "$TARGET_REF_NAME" != main || ( "$TARGET_EVENT_NAME" != push && "$TARGET_EVENT_NAME" != workflow_dispatch ) ]]; then
                should=false
                tag=""
              else
                [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$TARGET_SHA" ]] || exit 1
                major="$(grep '^versionMajor=' version.properties | cut -d= -f2 | tr -d '\r ')"
                minor="$(grep '^versionMinor=' version.properties | cut -d= -f2 | tr -d '\r ')"
                patch="$(grep '^versionPatch=' version.properties | cut -d= -f2 | tr -d '\r ')"
                for part in "$major" "$minor" "$patch"; do
                  [[ "$part" =~ ^(0|[1-9][0-9]*)$ ]] || { echo "::error::Invalid version.properties"; exit 1; }
                done
                tag="v${major}.${minor}.${patch}-preview.${TARGET_SHA:0:12}"
                prerelease=true
                standalone=true
              fi
              ;;
            guillotine)
              input_tag="$(jq -r '.tag // empty' <<<"$TARGET_INPUTS_JSON")"
              if [ -n "$input_tag" ]; then
                tag="$input_tag"
              elif [ "$TARGET_REF_TYPE" = "tag" ]; then
                tag="$TARGET_REF_NAME"
              else
                major="$(grep '^versionMajor=' version.properties | cut -d= -f2 | tr -d '\r ')"
                minor="$(grep '^versionMinor=' version.properties | cut -d= -f2 | tr -d '\r ')"
                tag="latest-release-v${major}.${minor}"
              fi
              ;;
            mcpserved)
              if [ "$TARGET_EVENT_NAME" != "push" ]; then
                should=false
                tag=""
              elif [ "$TARGET_REF_TYPE" = "tag" ]; then
                tag="$TARGET_REF_NAME"
                standalone=true
              elif [ "$TARGET_REF_NAME" = "main" ]; then
                major="$(grep '^versionMajor=' version.properties | cut -d= -f2 | tr -d '\r ')"
                minor="$(grep '^versionMinor=' version.properties | cut -d= -f2 | tr -d '\r ')"
                tag="latest-debug-v${major}.${minor}"
                prerelease=true
              else
                should=false
                tag=""
              fi
              ;;
            *)
              echo "::error::Unknown desktop release mode: $mode" >&2
              exit 1
              ;;
          esac
          echo "should=$should" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "standalone=$standalone" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Download all desktop artifacts
        if: ${{ steps.target.outputs.should == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      # Sign only after every build and the real-model Linux tests have passed.
      # The build matrix never receives the signing key in its command environment.
      - name: Stage and sign ExtrusionExtraction prerelease
        if: ${{ steps.target.outputs.should == 'true' && fromJSON(inputs.purpose_profile_json).release_mode == 'extrusion-preview' }}
        shell: bash
        env:
          TAG: ${{ steps.target.outputs.tag }}
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[a-f0-9]{12}$ ]] || exit 1
          mkdir -p release-files
          stage_one() {
            local artifact="$1" ext="$2" suffix="$3"
            local files=(artifacts/"$artifact"/*."$ext")
            [[ "${#files[@]}" -eq 1 && -s "${files[0]}" ]] || {
              echo "::error::Expected exactly one nonempty $artifact package"; exit 1;
            }
            cp -- "${files[0]}" "release-files/ExtrusionExtraction-$TAG-$suffix.$ext"
          }
          stage_one native-linux-deb deb linux-x86_64
          stage_one native-windows-msi msi windows-x86_64
          stage_one native-macos-arm64-dmg dmg macos-arm64
          stage_one native-macos-x86_64-dmg dmg macos-x86_64
          apk=(artifacts/native-android-release-unsigned-apk/*-unsigned.apk)
          [[ "${#apk[@]}" -eq 1 && -s "${apk[0]}" ]] || { echo "::error::Missing unsigned Android release APK"; exit 1; }
          for name in KEYSTORE_RAW KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Missing required Android signing secret $name in the target environment"; exit 1; }
          done
          # Keep private key material outside the checked-out repository and artifact paths.
          umask 077
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          printf '%s' "$KEYSTORE_RAW" | base64 --decode > "$tmp/release.keystore"
          test -s "$tmp/release.keystore"
          unset KEYSTORE_RAW
          keytool -exportcert -keystore "$tmp/release.keystore" -alias "$KEY_ALIAS" \
            -storepass:env KEYSTORE_PASSWORD -file "$tmp/cert.der" >/dev/null
          expected="$(sha256sum "$tmp/cert.der" | cut -d' ' -f1)"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/apksigner" || ! -x "$tools/zipalign" || ! -x "$tools/aapt" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;35.0.0'
          fi
          # No pre-signed or debug APKs can enter this release lane.
          if "$tools/apksigner" verify "${apk[0]}" >/dev/null 2>&1; then
            echo "::error::Expected unsigned Android release input"; exit 1
          fi
          "$tools/zipalign" -P 16 -f 4 "${apk[0]}" "$tmp/aligned.apk"
          signed="release-files/ExtrusionExtraction-$TAG-android-arm64-x86_64.apk"
          "$tools/apksigner" sign --ks "$tmp/release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$signed" "$tmp/aligned.apk"
          "$tools/zipalign" -c -P 16 4 "$signed"
          verify="$("$tools/apksigner" verify --verbose --print-certs "$signed")"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<<"$verify")"
          [[ "$actual" == "$expected" ]] || { echo "::error::Unexpected APK signing certificate"; exit 1; }
          [[ "$(grep -c '^Signer #[0-9][0-9]* certificate SHA-256 digest:' <<<"$verify")" -eq 1 ]] || exit 1
          badging="$("$tools/aapt" dump badging "$signed")"
          grep -F "package: name='com.hereliesaz.extrusionextraction' versionCode='$GITHUB_RUN_NUMBER'" <<<"$badging" >/dev/null
          python3 - "$signed" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              names = set(apk.namelist())
              for abi in ("arm64-v8a", "x86_64"):
                  for lib in ("ee_skintokens", "skintokens"):
                      assert f"lib/{abi}/lib{lib}.so" in names, (abi, lib)
          PY
          # The v4 signing sidecar is not needed for sideloading.
          rm -f "$signed.idsig"
          (cd release-files && sha256sum *.deb *.msi *.dmg *.apk > SHA256SUMS.txt)
          [[ "$(find release-files -maxdepth 1 -type f | wc -l)" -eq 6 ]] || exit 1

      - name: Publish immutable ExtrusionExtraction prerelease
        if: ${{ steps.target.outputs.should == 'true' && fromJSON(inputs.purpose_profile_json).release_mode == 'extrusion-preview' }}
        shell: bash
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$TARGET_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" != "$TARGET_SHA" ]]; then
            echo "Superseded main build; not publishing stale prerelease."
            exit 0
          fi
          assets=(release-files/*)
          [[ "${#assets[@]}" -eq 6 ]] || exit 1
          # Reserve the exact lightweight tag without force. A pre-existing tag
          # is accepted only if it already points at this immutable source SHA.
          # Even if another actor creates the tag between calls, verify the result.
          tag_target() {
            gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$TAG" --jq 'select(.object.type=="commit") | .object.sha'
          }
          if ! target="$(tag_target 2>/dev/null)"; then
            gh api --method POST "repos/$TARGET_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$TARGET_SHA" >/dev/null || true
            target="$(tag_target)"
          fi
          [[ "$target" == "$TARGET_SHA" ]] || { echo "::error::Conflicting immutable release tag"; exit 1; }
          # No clobber of published assets or moving of tags. Interrupted uploads
          # can resume in a draft; only the complete verified set becomes public.
          if existing="$(gh release view "$TAG" --repo "$TARGET_REPOSITORY" --json isDraft,isPrerelease,targetCommitish,assets 2>/dev/null)"; then
            [[ "$(jq -r '.isPrerelease' <<<"$existing")" == true ]] || exit 1
            if [[ "$(jq -r '.isDraft' <<<"$existing")" == false ]]; then
              target="$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$TAG" --jq 'select(.object.type=="commit") | .object.sha')"
              [[ "$target" == "$TARGET_SHA" ]] || exit 1
              expected_names="$(printf '%s\n' "${assets[@]##*/}" | sort)"
              actual_names="$(jq -r '.assets[].name' <<<"$existing" | sort)"
              [[ "$actual_names" == "$expected_names" ]] || { echo "::error::Published release asset set differs"; exit 1; }
              echo "Immutable prerelease already published."
              exit 0
            fi
            # The existing verified tag is authoritative; GitHub ignores targetCommitish
            # when that tag already exists. Never move the tag for a draft.
          else
            body="Experimental local-generation build from $TARGET_SHA. Android APK is release-signed; Windows and macOS installers are unsigned/unnotarized. Native packaging and Linux model-backed smoke tests passed. Physical-device compatibility, performance and deformation quality are not production-validated. Verify SHA256SUMS.txt before installation."
            gh release create "$TAG" --repo "$TARGET_REPOSITORY" --verify-tag --target "$TARGET_SHA" \
              --title "ExtrusionExtraction $TAG" --notes "$body" --draft --prerelease --latest=false
          fi
          gh release upload "$TAG" "${assets[@]}" --repo "$TARGET_REPOSITORY" --clobber
          # The REST release response supplies per-asset SHA256 digests. Reject
          # a partial, corrupt or unexpected set before changing draft visibility.
          release="$(gh api "repos/$TARGET_REPOSITORY/releases" --paginate --jq '.[] | select(.tag_name=="'"$TAG"'")' | jq -s 'if length==1 then .[0] else error("expected one release") end')"
          [[ "$(jq '.assets | length' <<<"$release")" -eq 6 && "$(jq -r '.draft' <<<"$release")" == true ]] || exit 1
          for file in "${assets[@]}"; do
            name="${file##*/}"
            digest="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            jq -e --arg name "$name" --arg digest "$digest" \
              '[.assets[] | select(.name==$name and .state=="uploaded" and .digest==$digest)] | length==1' <<<"$release" >/dev/null
          done
          # Check again immediately before publishing to avoid stale queued builds.
          [[ "$(gh api "repos/$TARGET_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$TARGET_SHA" ]] || {
            echo "Superseded while staging; leaving verified draft unpublished."
            exit 0
          }
          [[ "$(tag_target)" == "$TARGET_SHA" ]] || { echo "::error::Release tag changed during staging"; exit 1; }
          gh release edit "$TAG" --repo "$TARGET_REPOSITORY" --draft=false --prerelease --latest=false
          [[ "$(gh release view "$TAG" --repo "$TARGET_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == true')" == true ]]
          [[ "$(gh api "repos/$TARGET_REPOSITORY/git/ref/tags/$TAG" --jq 'select(.object.type=="commit") | .object.sha')" == "$TARGET_SHA" ]]

      - name: Publish desktop installers
        if: ${{ steps.target.outputs.should == 'true' && fromJSON(inputs.purpose_profile_json).release_mode != 'extrusion-preview' }}
        shell: bash
        env:
          TARGET_REPOSITORY_NAME: ${{ inputs.target_repository_name }}
          TAG: ${{ steps.target.outputs.tag }}
          STANDALONE: ${{ steps.target.outputs.standalone }}
          PRERELEASE: ${{ steps.target.outputs.prerelease }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f)
          [ ${#files[@]} -gt 0 ] || { echo "::error::No desktop packages were downloaded" >&2; exit 1; }
          mode="$(jq -r '.release_mode' <<<"$PROFILE_JSON")"
          if [ "$mode" = "mcpserved" ]; then
            [ "${#files[@]}" -eq 4 ] || { echo "::error::Expected four MCPserved installers"; exit 1; }
            version=""
            for file in "${files[@]}"; do
              name="${file##*/}"
              [[ "$name" =~ ^MCPserved-([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)-(linux\.(deb|rpm)|macos\.dmg|windows\.msi)$ ]] || {
                echo "::error::Unexpected MCPserved asset: $name"; exit 1;
              }
              [ -n "$version" ] || version="${BASH_REMATCH[1]}"
              [ "$version" = "${BASH_REMATCH[1]}" ] || { echo "::error::Mixed desktop versions"; exit 1; }
            done
            for suffix in linux.deb linux.rpm macos.dmg windows.msi; do
              matches=0
              for file in "${files[@]}"; do
                if [ "${file##*/}" = "MCPserved-$version-$suffix" ]; then matches=$((matches + 1)); fi
              done
              [ "$matches" -eq 1 ] || { echo "::error::Missing or duplicate $suffix"; exit 1; }
            done
            if [ "$TARGET_REF_NAME" = main ]; then
              current="$(gh api "repos/$TARGET_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
              if [ "$current" != "$TARGET_SHA" ]; then
                echo "Superseded main build; not modifying rolling release."
                exit 0
              fi
            fi
          fi
          title="$(jq -r '.release_title // empty' <<<"$PROFILE_JSON")"
          body="$(jq -r '.release_body // "Native desktop installers."' <<<"$PROFILE_JSON")"
          [ -n "$title" ] || title="${TARGET_REPOSITORY_NAME} Desktop $TAG"
          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then prerelease_flag=(--prerelease); fi
          if gh release view "$TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$TARGET_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" --repo "$TARGET_REPOSITORY" --target "$TARGET_SHA" --title "$title" --notes "$body" "${prerelease_flag[@]}"
          fi
          # Rolling releases retain only the current desktop set. Remove obsolete
          # legacy (including mislabeled 1.x) installers only after successful upload.
          # The Android APK, build-tools archive and standalone release tags are untouched.
          if [ "$mode" = "mcpserved" ] && [ "$STANDALONE" = "false" ]; then
            while IFS= read -r old; do
              if [[ "$old" =~ ^(MCPserved-[0-9][0-9.]*\.(msi|dmg)|mcpserved_[0-9][0-9.]*_[A-Za-z0-9_]+\.deb|mcpserved-[0-9][0-9.]*-[0-9]+\.[A-Za-z0-9_]+\.rpm|MCPserved-[0-9][0-9.]*-(linux\.(deb|rpm)|macos\.dmg|windows\.msi))$ ]]; then
                case "$old" in
                  "MCPserved-$version-linux.deb"|"MCPserved-$version-linux.rpm"|"MCPserved-$version-macos.dmg"|"MCPserved-$version-windows.msi") continue ;;
                esac
                gh release delete-asset "$TAG" "$old" --repo "$TARGET_REPOSITORY" --yes
              fi
            done < <(gh release view "$TAG" --repo "$TARGET_REPOSITORY" --json assets --jq '.assets[].name')
          fi

  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - package
      - release
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Central workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Central workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
      - name: Mint target check token
        id: target-check-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz
      - name: Post target check run
        if: ${{ always() && steps.target-check-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.target-check-token.outputs.token }}
          RUN_READ_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_PHASE: finish
          CHECK_NAME: ${{ inputs.target_workflow_name || inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        shell: bash
        run: "set +e\nwarn() { echo \"::warning::Target check run skipped: $1\"; exit 0; }\n[[ -n \"${TARGET_REPOSITORY:-}\" && -n \"${TARGET_CHECK_SHA:-}\" ]] || warn \"no target commit\"\ntitle=\"$CHECK_NAME\"\ntext=\"\"\nif [[ \"$CHECK_PHASE\" == \"start\" ]]; then\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$url,external_id:$ext,output:{title:$name,summary:(\"Running in HereLiesAz/workflows: \" + $url)}}')\"\nelse\n  if [[ \"$FAILED\" == \"true\" ]]; then\n    conclusion=\"failure\"\n    jobs=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api --paginate \"repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs\" --jq '.jobs[]' 2>/dev/null | jq -s '.')\"\n    [[ -n \"$jobs\" ]] || jobs=\"[]\"\n    failed=\"$(jq -r '[.[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\")\n      | \"- **\\(.name)** (\\(.conclusion)): \" + ([.steps[]? | select(.conclusion == \"failure\") | .name] | join(\", \") | if . == \"\" then \"no failed step reported\" else . end)\n      + \" — [log](\\(.html_url))\"] | join(\"\\n\")' <<<\"$jobs\")\"\n    first_id=\"$(jq -r '[.[] | select(.conclusion == \"failure\")][0].id // empty' <<<\"$jobs\")\"\n    if [[ -n \"$first_id\" ]]; then\n      tail_log=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api \"repos/${GITHUB_REPOSITORY}/actions/jobs/${first_id}/logs\" 2>/dev/null \\\n        | sed -E 's/^[0-9T:.-]+Z //' | grep -v '^##\\[group\\]\\|^##\\[endgroup\\]' | tail -n 60)\"\n      [[ -n \"$tail_log\" ]] && text=\"$(printf 'Last lines of the first failed job:\\n\\n~~~text\\n%s\\n~~~\\n' \"${tail_log:0:60000}\")\"\n    fi\n    summary=\"$(printf 'Central run failed: %s\\n\\n%s\\n' \"$DETAILS_URL\" \"${failed:-No failed job reported.}\")\"\n    title=\"$CHECK_NAME failed\"\n  else\n    conclusion=\"success\"\n    summary=\"Central run succeeded: $DETAILS_URL\"\n  fi\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    --arg conclusion \"$conclusion\" --arg title \"$title\" --arg summary \"${summary:0:65000}\" --arg text \"$text\" \\\n    '{name:$name,head_sha:$sha,status:\"completed\",conclusion:$conclusion,details_url:$url,external_id:$ext,output:({title:$title,summary:$summary} + (if $text == \"\" then {} else {text:$text} end))}')\"\nfi\n# Each phase posts its own Check Run under the same name; GitHub shows the latest one,\n# so the finish phase needs no id handed over from the start job.\ngh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$body\" >/dev/null \\\n  || echo \"::warning::Target check run skipped: GitHub refused the check run\"\n\n# Release/deploy failures also go to one open issue per workflow: opened on the\n# first failure, commented on each repeat. Successes never touch issues.\n[[ \"$CHECK_PHASE\" == \"finish\" && \"${FILE_ISSUES:-}\" == \"true\" && \"${conclusion:-}\" == \"failure\" ]] || exit 0\nlabel=\"central-run-failure\"\nissue_title=\"Central run failing: $CHECK_NAME\"\nissue=\"$(gh api \"repos/${TARGET_REPOSITORY}/issues?state=open&labels=${label}&per_page=100\" 2>/dev/null \\\n  | jq -r --arg t \"$issue_title\" '[.[] | select(.title == $t)][0].number // empty')\"\nreport=\"$(printf '%s\\n\\nCommit: %s\\n\\n%s\\n' \"$summary\" \"$TARGET_CHECK_SHA\" \"$text\")\"\nif [[ -n \"$issue\" ]]; then\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"$report\" >/dev/null \\\n    || warn \"could not comment on issue #$issue\"\nelse\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/labels\" -f name=\"$label\" -f color=\"000000\" \\\n    -f description=\"A release or deploy run in HereLiesAz/workflows failed for this repository.\" >/dev/null 2>&1\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues\" -f title=\"$issue_title\" -f body=\"$report\" -f \"labels[]=$label\" >/dev/null \\\n    || warn \"could not open a failure issue\"\nfi\n"
