name: Fix cross-repository concurrency

on:
  push:
    paths:
      - .github/workflows/emergency-concurrency-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Scope every generated concurrency group to the target repository
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          target_expr = '$' + '{{ inputs.target_repository }}'
          changed = []

          for path in Path('.github/workflows').glob('*.y*ml'):
              if path.name == 'emergency-concurrency-fix.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              if 'shared_variant:' not in text:
                  continue

              new = re.sub(
                  r'(^\s*group:\s*[^\n]*?)\$\{\{\s*inputs\.shared_variant\s*\}\}',
                  lambda m: m.group(1) + target_expr,
                  text,
                  flags=re.MULTILINE,
              )
              new = re.sub(
                  r'(^\s*group:\s*[^\n]*-)\s*$',
                  lambda m: m.group(1) + target_expr,
                  new,
                  flags=re.MULTILINE,
              )
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          library = Path('scripts/shared_workflow_library.py')
          text = library.read_text(encoding='utf-8')
          new = re.sub(
              r'^\s*suffix = "-(?:\$\{\{ inputs\.shared_variant \}\})?"\s*$',
              '    suffix = "-' + target_expr + '"',
              text,
              flags=re.MULTILINE,
          )
          if new != text:
              library.write_text(new, encoding='utf-8')
              changed.append(str(library))

          if not changed:
              raise SystemExit('No concurrency changes were needed')
          print('\n'.join(changed))
          PY

      - name: Verify no shared-variant concurrency remains
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --exclude=emergency-concurrency-fix.yml --line-number --fixed-strings 'inputs.shared_variant }}' .github/workflows | grep 'group:'; then
            echo '::error::A concurrency group still uses shared_variant.' >&2
            exit 1
          fi
          if grep -R --exclude=emergency-concurrency-fix.yml --line-number -E '^\s*group:.*-$' .github/workflows; then
            echo '::error::A concurrency group is missing its repository scope.' >&2
            exit 1
          fi

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows scripts/shared_workflow_library.py
          git commit -m "fix: scope central workflow concurrency by repository"
          git push origin HEAD:main
