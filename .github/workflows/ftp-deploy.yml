# Central semantic shared-workflow family.
# Public identity is the filename; implementation hashes are internal registry metadata only.
# Do not edit generated variant jobs by hand; update the source workflow or synchronizer.
name: Shared · Ftp Deploy
run-name: ${{ inputs.target_repository }} · ${{ inputs.source_workflow_path }}
on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_vars_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_ref:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
      shared_variant:
        required: true
        type: string
        description: Internal implementation selector from the central registry.
jobs:
  shared_variant_guard:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      SHARED_VARIANT: ${{ inputs.shared_variant }}
    steps:
      - name: Validate registered shared workflow variant
        shell: bash
        run: "set -euo pipefail\ncase \"$SHARED_VARIANT\" in\n  30c44d6ebde49bfd|33ddda4618f95db0|3c4ec11ce5f01ca4|47d17d9b512ae715|4cd8d3970e7d0676|4e7374555b800ee8|5af4d77ffaaa7d9a|5b5a9f68e3f954a8|639ae422fb03f55e|6d878bef8f6f2aed|76003b81d57267b9|80d8fad11e5c7edc|876df587d460e683|939addfd7c9b4682|cc11f4dcc7f24069|e3e6cccf74eb6245|e531b4457e126d6d|e914d73cf2a0d549|ec9f486829e491d3|edfd8a134a5bcad5|ef07dc39403cac0a|f7038e95c02b85fe|fa69fd31183e6fb6|fc11202c1668de1e|feac497562854267) ;;\n  *) echo \"Unknown shared workflow variant: $SHARED_VARIANT\" >&2; exit 1 ;;\nesac\n"
  v_30c44d6ebde49bfd__central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${TARGET_REPOSITORY}\")\"\nactual_repo_id=\"$(jq -r '.id' <<<\"$repo_json\")\"\nactual_owner_id=\"$(jq -r '.owner.id' <<<\"$repo_json\")\"\nactual_owner=\"$(jq -r '.owner.login' <<<\"$repo_json\")\"\n[[ \"$actual_repo_id\" == \"$TARGET_REPOSITORY_ID\" ]] || { echo \"Repository ID mismatch\" >&2; exit 1; }\n[[ \"$actual_owner_id\" == \"103241502\" ]] || { echo \"Repository is not owned by HereLiesAz\" >&2; exit 1; }\n[[ \"${actual_owner,,}\" == \"hereliesaz\" ]] || { echo \"Repository owner mismatch\" >&2; exit 1; }\n[[ \"$TARGET_REPOSITORY_OWNER_ID\" == \"103241502\" ]] || { echo \"OIDC owner ID mismatch\" >&2; exit 1; }"
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from the shared HereLiesAz/workflows catalog.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
    if: ${{ inputs.shared_variant == '30c44d6ebde49bfd' }}
  v_30c44d6ebde49bfd__release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch mobilenetv3.onnx
        run: "curl -fL \"${{ fromJSON(inputs.target_vars_json).MODEL_URL || 'https://huggingface.co/onnx-community/mobilenetv3_small_100/resolve/main/onnx/model.onnx' }}\" -o \"mobilenetv3.onnx\"\necho \"mobilenetv3_onnx_sha=$(sha256sum 'mobilenetv3.onnx' | cut -d' ' -f1)\" >> \"$GITHUB_ENV\"\necho \"mobilenetv3_onnx_size=$(stat -c%s 'mobilenetv3.onnx')\" >> \"$GITHUB_ENV\"\n"
      - name: Inject checksum + byteSize into manifest
        run: "node -e '\n  const fs=require(\"fs\");\n  const m=JSON.parse(fs.readFileSync(\"manifest.json\",\"utf8\"));\n  for (const a of m.assets) {\n    const fn=a.remoteUrl.split(\"/\").pop().replace(/\\./g,\"_\");\n    a.checksum=\"sha256-\"+process.env[fn+\"_sha\"];\n    a.byteSize=Number(process.env[fn+\"_size\"]);\n  }\n  fs.writeFileSync(\"manifest.json\",JSON.stringify(m,null,2));\n'\n"
      - name: Pack .azp
        run: "npm install --no-audit --no-fund\nnpm run build\n"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.azp\nmobilenetv3.onnx\n"
    needs: v_30c44d6ebde49bfd__central_check_start
    if: ${{ (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) && (inputs.shared_variant == '30c44d6ebde49bfd') }}
    permissions:
      contents: read
    env:
      TARGET_REPOSITORY: ${{ inputs.target_repository }}
      TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
      TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
      TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
      TARGET_REF: ${{ inputs.target_ref }}
      TARGET_REF_NAME: ${{ inputs.target_ref_name }}
      TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
      TARGET_HEAD_REF: ${{ inputs.target_head_ref }}
      TARGET_BASE_REF: ${{ inputs.target_base_ref }}
      TARGET_ACTOR: ${{ inputs.target_actor }}
      TARGET_ACTOR_ID: ${{ inputs.target_actor_id }}
      TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
      TARGET_RUN_ID: ${{ inputs.target_run_id }}
      TARGET_RUN_NUMBER: ${{ inputs.target_run_number }}
      TARGET_RUN_ATTEMPT: ${{ inputs.target_run_attempt }}
      TARGET_WORKFLOW_REF: ${{ inputs.target_workflow_ref }}
      TARGET_WORKFLOW_NAME: ${{ inputs.target_workflow_name }}
  v_30c44d6ebde49bfd__central_check_finish:
    if: ${{ (always()) && (inputs.shared_variant == '30c44d6ebde49bfd') }}
    needs:
      - v_30c44d6ebde49bfd__central_check_start
      - v_30c44d6ebde49bfd__release
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
