name: Central workflow gateway

on:
  # Exact union of schedules currently present in registered workflow sources.
  # One central tick fans out to every registered workflow whose original cron
  # matches this expression. New cron expressions must be added here when the
  # corresponding generalized workflow is admitted to the catalog.
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 * * * *'
    - cron: '0 0 * * *'
    - cron: '30 0 * * *'
    - cron: '0 2 * * *'
    - cron: '42 4 * * 5'
    - cron: '0 6 * * 1'
    - cron: '17 6 * * *'
    - cron: '0 */6 * * *'
    - cron: '0 8 * * *'
    - cron: '34 8 * * 4'
    - cron: '19 11 * * 4'
    - cron: '32 11 * * 6'

  workflow_dispatch:
    inputs:
      # Worker/webhook transport uses repository + repository_id + request_b64.
      # Human manual dispatch uses repository + source_workflow_path and may
      # optionally provide target_ref/inputs_json.
      repository:
        description: Target repository, e.g. HereLiesAz/HG2Gui
        required: false
        type: string
      repository_id:
        description: Internal immutable repository ID supplied by the Worker
        required: false
        type: string
      request_b64:
        description: Internal verified Worker request; leave empty for a human manual run
        required: false
        type: string
      source_workflow_path:
        description: Registered workflow path for a human manual run, e.g. .github/workflows/release-play.yml
        required: false
        type: string
      target_ref:
        description: Branch, tag, or SHA for a human manual run; blank means the default branch
        required: false
        default: ''
        type: string
      inputs_json:
        description: JSON object containing the original workflow_dispatch inputs
        required: false
        default: '{}'
        type: string

run-name: gateway · ${{ inputs.repository || github.event.schedule || 'manual' }}

permissions:
  contents: read
  actions: write

# The gateway itself is intentionally unconstrained. It validates/routes events
# and then exits; resource-specific serialization belongs in the destination
# workflow (for example one Google Play edit per app), never at account scope.

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz

      - name: Check out central controller
        uses: actions/checkout@v4

      - name: Install dispatcher dependency
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Decode and cross-check verified Worker request
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.request_b64 != '' }}
        env:
          REQUEST_B64: ${{ inputs.request_b64 }}
          ASSERTED_REPOSITORY: ${{ inputs.repository }}
          ASSERTED_REPOSITORY_ID: ${{ inputs.repository_id }}
        run: |
          python - <<'PY'
          import base64
          import gzip
          import json
          import os
          from pathlib import Path

          encoded = base64.b64decode(os.environ["REQUEST_B64"], validate=True)
          raw = gzip.decompress(encoded) if encoded.startswith(b"\x1f\x8b") else encoded
          request = json.loads(raw)
          if request.get("repository") != os.environ["ASSERTED_REPOSITORY"]:
              raise SystemExit("Worker repository input does not match request payload")
          if str(request.get("repository_id")) != os.environ["ASSERTED_REPOSITORY_ID"]:
              raise SystemExit("Worker repository_id input does not match request payload")
          Path("request.json").write_text(json.dumps(request), encoding="utf-8")
          print(f"repository={request['repository']}")
          print(f"event={request['event_name']}")
          PY

      - name: Route verified repository webhook event
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.request_b64 != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CENTRAL_GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/dispatch_request.py --request request.json

      - name: Route exact registered schedule
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/dispatch_schedule.py --schedule "${{ github.event.schedule }}"

      - name: Route human manual invocation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.request_b64 == '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ inputs.repository }}" ]] || {
            echo "::error::Manual dispatch requires repository."
            exit 1
          }
          [[ -n "${{ inputs.source_workflow_path }}" ]] || {
            echo "::error::Manual dispatch requires source_workflow_path."
            exit 1
          }
          python scripts/dispatch_manual.py \
            --repository "${{ inputs.repository }}" \
            --source-workflow-path "${{ inputs.source_workflow_path }}" \
            --target-ref "${{ inputs.target_ref }}" \
            --inputs-json "${{ inputs.inputs_json }}"
