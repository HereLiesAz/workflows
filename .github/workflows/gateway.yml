name: Central workflow gateway

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Target repository asserted by the verified Worker request
        required: true
        type: string
      repository_id:
        description: Immutable target repository ID asserted by the verified Worker request
        required: true
        type: string
      request_b64:
        description: Base64-encoded verified Worker request, gzip-compressed when sent by current Workers
        required: true
        type: string

run-name: gateway · ${{ inputs.repository }}

permissions:
  contents: read

concurrency:
  group: central-gateway-${{ inputs.repository_id }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out central controller
        uses: actions/checkout@v4

      - name: Install dispatcher dependency
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Decode and cross-check request
        env:
          REQUEST_B64: ${{ inputs.request_b64 }}
          ASSERTED_REPOSITORY: ${{ inputs.repository }}
          ASSERTED_REPOSITORY_ID: ${{ inputs.repository_id }}
        run: |
          python - <<'PY'
          import base64
          import gzip
          import json
          import os
          from pathlib import Path

          encoded = base64.b64decode(os.environ["REQUEST_B64"], validate=True)
          # Backward compatible during rollout: old Workers sent raw JSON bytes;
          # current Workers send gzip-compressed JSON to stay well below GitHub's
          # workflow_dispatch input-size ceiling.
          raw = gzip.decompress(encoded) if encoded.startswith(b"\x1f\x8b") else encoded
          request = json.loads(raw)
          if request.get("repository") != os.environ["ASSERTED_REPOSITORY"]:
              raise SystemExit("Worker repository input does not match request payload")
          if str(request.get("repository_id")) != os.environ["ASSERTED_REPOSITORY_ID"]:
              raise SystemExit("Worker repository_id input does not match request payload")
          Path("request.json").write_text(json.dumps(request), encoding="utf-8")
          print(f"repository={request['repository']}")
          print(f"workflow={request['source_workflow_path']}")
          PY

      - name: Dispatch registered catalog workflow
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/dispatch_request.py --request request.json
