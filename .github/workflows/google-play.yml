        run: rm -f release.keystore
      - name: Prepare release artifacts
        id: artifacts
        working-directory: illumera
        run: "set -euo pipefail\nAPK=$(find app/build/outputs/apk/release -maxdepth 1 -name \"*.apk\" | head -1)\nAAB=$(find app/build/outputs/bundle/play -maxdepth 1 -name \"*.aab\" | head -1)\ntest -n \"$APK\" || { echo \"No release APK produced\" >&2; exit 1; }\ntest -n \"$AAB\" || { echo \"No Play AAB produced\" >&2; exit 1; }\ntest -s \"$APK\" || { echo \"Release APK is empty\" >&2; exit 1; }\ntest -s \"$AAB\" || { echo \"Play AAB is empty\" >&2; exit 1; }\nAPK_NAME=\"illumera-${{ steps.version.outputs.name }}.apk\"\ncp \"$APK\" \"$APK_NAME\"\nprintf 'apk=illumera/%s\\n' \"$APK_NAME\" >> \"$GITHUB_OUTPUT\"\nprintf 'aab=%s\\n' \"$AAB\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Compute APK SHA-256
