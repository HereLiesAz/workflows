        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: illumera ${{ steps.version.outputs.name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ${{ steps.artifacts.outputs.apk }}
          body_path: illumera/release-notes.md
          repository: ${{ inputs.target_repository }}
          token: ${{ secrets.GH_TOKEN }}
    needs: v_9ac5706db1ce1f8d__central_check_start
    if: ${{ (inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true) && (inputs.shared_variant == '9ac5706db1ce1f8d') }}
