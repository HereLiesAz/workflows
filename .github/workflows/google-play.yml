      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: false
          dependency-graph: disabled
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Set up Python
        if: ${{ fromJSON(inputs.target_inputs_json).publish != 'false' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Play API client
        if: ${{ fromJSON(inputs.target_inputs_json).publish != 'false' }}
        run: "python -m pip install --quiet \\\n  google-auth==2.35.0 \\\n  google-api-python-client==2.149.0 \\\n  google-auth-httplib2==0.2.0 \\\n  httplib2==0.22.0\n"
