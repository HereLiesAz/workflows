          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\npayload=\"$(jq -n --arg state \"pending\" --arg context \"$STATUS_CONTEXT\" --arg description \"Running from HereLiesAz/workflows.\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: "if [ -n \"$GOOGLE_SERVICES\" ]; then\n  echo \"$GOOGLE_SERVICES\" > app/google-services.json\nfi\n"
      - name: Generate Keystore from Secrets
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: "echo \"Generating keystore from certificate chain and private key...\"\n\n# Write the private key and certificate chain to temporary files\necho \"$KEYSTORE_PRIVATE\" > private_key.pem\necho \"$KEYSTORE_CHAIN\" > certificate_chain.crt\n\n# Create a PKCS12 file from the key and certificate chain\nopenssl pkcs12 -export -in certificate_chain.crt -inkey private_key.pem \\\n  -name \"$KEY_ALIAS\" -out keystore.p12 \\\n  -password pass:\"$KEYSTORE_PASSWORD\"\n\n# Convert the PKCS12 file to a JKS keystore\nkeytool -importkeystore -srckeystore keystore.p12 -srcstoretype PKCS12 \\\n  -destkeystore app/keystore.jks -deststoretype JKS \\\n  -srcstorepass \"$KEYSTORE_PASSWORD\" \\\n  -deststorepass \"$KEYSTORE_PASSWORD\" \\\n  -alias \"$KEY_ALIAS\" -noprompt\n\necho \"Keystore generated successfully at app/keystore.jks\"\n\n# Clean up temporary files\nrm private_key.pem certificate_chain.crt keystore.p12\n"
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          cache-read-only: false
          dependency-graph: disabled
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: "# version.properties auto-increments inside the build — no version override is passed.\n# The GitHub-distributed APK is the `github` flavor: no ads, self-updates from Releases.\n./gradlew assembleGithubRelease \\\n  -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \\\n  -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \\\n  -Pandroid.injected.signing.key.alias=$KEY_ALIAS \\\n  -Pandroid.injected.signing.key.password=$KEY_PASSWORD\n"
      - name: Prepare Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: "# Read Patch/Build straight from version.properties — the Gradle build that just ran\n# (assembleGithubRelease, above) already computed them at configuration time and wrote\n# the result back to this exact file (see build.gradle.kts's versioning block), and that\n# write is what's actually baked into the APK's versionCode/versionName. This step used\n# to re-derive its own PATCH/BUILD_NUMBER independently via `git rev-list`/`git blame` —\n# a separate, stale approximation that ignored the file Gradle had just written and\n# didn't match it: BUILD_NUMBER was raw `git rev-list --count HEAD` (a small number),\n# while the real versionBuild is offset by a monotonic floor (205920500+) and\n# auto-incremented, so the GitHub Release's title/tag/filename showed a version like\n# \"1.1.5.1502\" for an APK whose actual embedded versionCode was ~205921443. Reading the\n# file directly guarantees the release name matches what's actually inside the APK.\nMAJOR=$(grep 'versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nMINOR=$(grep 'versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nPATCH=$(grep 'versionPatch=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nBUILD_NUMBER=$(grep 'versionBuild=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\n\nVERSION_NAME=\"${MAJOR}.${MINOR}.${PATCH}.${BUILD_NUMBER}\"\nTAG_NAME=\"latest-release-v${MAJOR}.${MINOR}\"\n\n# Locate built APK (github flavor → app/build/outputs/apk/github/release)\nAPK_ORIGINAL=$(find app/build/outputs/apk/github/release -name \"*.apk\" | head -n 1)\nif [ -z \"$APK_ORIGINAL\" ]; then\n  echo \"Error: No APK found in app/build/outputs/apk/github/release/\"\n  find app/build/outputs/ -name \"*.apk\"\n  exit 1\nfi\n\nAPP_NAME=$(grep 'rootProject.name' settings.gradle.kts | sed -E \"s/.*=.*[\\\"'](.*)[\\\"']/\\1/\")\n[ -z \"$APP_NAME\" ] && APP_NAME=\"Guillotine\"\nTARGET_NAME=\"${APP_NAME}-${VERSION_NAME}-release.apk\"\nmv \"$APK_ORIGINAL\" \"$TARGET_NAME\"\n\n# R8's mapping.txt is the only way to deobfuscate a crash stack trace from this APK\n# (minifyEnabled/shrinkResources are on for release — see app/build.gradle.kts). Unlike\n# the play flavor's AAB (release-aab.yml), which Play Console deobfuscates automatically\n# from bundle metadata, this github-flavor APK has no such backend — so the mapping file\n# has to be captured here or a real-device crash like \"fi3.a\" is unreadable. Uploaded to\n# the same release tag as the APK (clobbered on every run, same as the APK itself) so the\n# mapping always matches whatever build is currently live for self-updating installs.\nMAPPING_ORIGINAL=\"app/build/outputs/mapping/githubRelease/mapping.txt\"\nMAPPING_TARGET=\"\"\nif [ -f \"$MAPPING_ORIGINAL\" ]; then\n  MAPPING_TARGET=\"${APP_NAME}-${VERSION_NAME}-mapping.txt\"\n  cp \"$MAPPING_ORIGINAL\" \"$MAPPING_TARGET\"\nelse\n  echo \"::warning::No mapping.txt found at $MAPPING_ORIGINAL — release APK crashes won't be deobfuscatable.\"\nfi\n\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n\n# Force update tag to current commit\ngit tag -fa \"$TAG_NAME\" -m \"Latest Release Build\"\ngit push origin \"$TAG_NAME\" --force\n\n# Create or update release\nif gh release view \"$TAG_NAME\" > /dev/null 2>&1; then\n  echo \"Updating existing release...\"\n  gh release edit \"$TAG_NAME\" \\\n    --title \"Latest Release v${MAJOR}.${MINOR} (${VERSION_NAME})\" \\\n    --notes \"Release build from commit $TARGET_SHA\"\n  gh release upload \"$TAG_NAME\" \"$TARGET_NAME\" --clobber\nelse\n  echo \"Creating new release...\"\n  gh release create \"$TAG_NAME\" \"$TARGET_NAME\" \\\n    --title \"Latest Release v${MAJOR}.${MINOR} (${VERSION_NAME})\" \\\n    --notes \"Release build from commit $TARGET_SHA\"\nfi\n\nif [ -n \"$MAPPING_TARGET\" ]; then\n  gh release upload \"$TAG_NAME\" \"$MAPPING_TARGET\" --clobber\nfi\n"
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    environment: Guillotine
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - build-and-release
    runs-on: ubuntu-latest
    steps:
