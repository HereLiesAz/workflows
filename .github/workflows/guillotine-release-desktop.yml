  resolve_tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Resolve or create the release tag
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          INPUT_TAG: ${{ fromJSON(inputs.target_event_json).inputs.tag }}
        run: "if [ -n \"$INPUT_TAG\" ]; then\n  TAG_NAME=\"$INPUT_TAG\"\nelif [ \"${{ inputs.target_ref_type }}\" = \"tag\" ]; then\n  TAG_NAME=\"${{ inputs.target_ref_name }}\"\nelse\n  MAJOR=$(grep 'versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\n  MINOR=$(grep 'versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\n  TAG_NAME=\"latest-release-v${MAJOR}.${MINOR}\"\nfi\n\nif git ls-remote --exit-code --tags origin \"refs/tags/$TAG_NAME\" > /dev/null 2>&1; then\n  echo \"Using existing tag $TAG_NAME\"\nelse\n  echo \"Tag $TAG_NAME doesn't exist yet — creating it at $TARGET_SHA\"\n  git config user.name \"github-actions[bot]\"\n  git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n  git tag -a \"$TAG_NAME\" -m \"Desktop release\" \"$TARGET_SHA\"\n  git push origin \"$TAG_NAME\"\nfi\n\necho \"tag=$TAG_NAME\" >> \"$GITHUB_OUTPUT\"\n"
    needs: central_check_start
