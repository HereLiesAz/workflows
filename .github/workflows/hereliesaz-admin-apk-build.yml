name: HereLiesAz Admin APK Build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      request_id:
        required: true
        type: string
      release_signed:
        required: true
        type: boolean
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve build metadata
        id: meta
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          SAFE_VERSION="$(printf '%s' "$VERSION" | tr -c '0-9A-Za-z._-' '-')"
          [[ -n "$SAFE_VERSION" ]] || { echo "::error::Version is empty after sanitizing."; exit 1; }
          [[ -n "$REQUEST_ID" ]] || { echo "::error::request_id is required."; exit 1; }
          echo "safe_version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Require stable Android signing material
        if: ${{ inputs.release_signed }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${KEYSTORE_B64:-}" ]] || { echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."; exit 1; }
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || { echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured."; exit 1; }
          [[ -n "${KEY_ALIAS:-}" ]] || { echo "::error::ANDROID_KEY_ALIAS is not configured."; exit 1; }
          [[ -n "${KEY_PASSWORD:-}" ]] || { echo "::error::ANDROID_KEY_PASSWORD is not configured."; exit 1; }

      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: disabled

      - name: Decode release keystore
        if: ${{ inputs.release_signed }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/hereliesaz-admin-release.jks"
          test -s "$RUNNER_TEMP/hereliesaz-admin-release.jks" || { echo "::error::Decoded Android keystore is empty."; exit 1; }

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --build-cache --no-daemon --stacktrace

      - name: Build automatic debug APK
        if: ${{ !inputs.release_signed }}
        shell: bash
        run: ./gradlew assembleDebug --build-cache --no-daemon --stacktrace

      - name: Build stable signed release APK
        if: ${{ inputs.release_signed }}
        env:
          VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/hereliesaz-admin-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(( $(date +%s) - 1577836800 ))
          ./gradlew assembleRelease             -PreleaseVersionName="$VERSION"             -PreleaseVersionCode="$VERSION_CODE"             --build-cache --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        env:
          SAFE_VERSION: ${{ steps.meta.outputs.safe_version }}
          RELEASE_SIGNED: ${{ inputs.release_signed }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_SIGNED" == "true" ]]; then
            SOURCE="app/build/outputs/apk/release/app-release.apk"
          else
            SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$SOURCE" || { echo "::error::Expected APK not found at $SOURCE"; exit 1; }
          cp "$SOURCE" "HereLiesAz-Admin-$SAFE_VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-apk-${{ inputs.request_id }}
          path: HereLiesAz-Admin-*.apk
          if-no-files-found: error
          retention-days: 7
