name: HereLiesAz Admin APK Build & Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      request_id:
        required: true
        type: string
      notes:
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false
    secrets:
      GH_TOKEN:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          SAFE_VERSION="$(printf '%s' "$VERSION" | tr -c '0-9A-Za-z._-' '-')"
          [[ -n "$SAFE_VERSION" ]] || { echo "::error::Version is empty after sanitizing."; exit 1; }
          [[ -n "$REQUEST_ID" ]] || { echo "::error::request_id is required."; exit 1; }
          echo "safe_version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=admin-v$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=HereLiesAz-Admin-$SAFE_VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Require publish and signing credentials
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || { echo "::error::GH_TOKEN is not configured. Automatic GitHub Release publishing is blocked."; exit 1; }
          [[ -n "${KEYSTORE_B64:-}" ]] || { echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."; exit 1; }
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || { echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured."; exit 1; }
          [[ -n "${KEY_ALIAS:-}" ]] || { echo "::error::ANDROID_KEY_ALIAS is not configured."; exit 1; }
          [[ -n "${KEY_PASSWORD:-}" ]] || { echo "::error::ANDROID_KEY_PASSWORD is not configured."; exit 1; }

      - name: Checkout caller repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          dependency-graph: disabled

      - name: Decode stable release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/hereliesaz-admin-release.jks"
          test -s "$RUNNER_TEMP/hereliesaz-admin-release.jks" || { echo "::error::Decoded Android keystore is empty."; exit 1; }

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --build-cache --no-daemon --stacktrace

      - name: Build stable signed release APK
        env:
          VERSION: ${{ inputs.version }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/hereliesaz-admin-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(( $(date +%s) - 1577836800 ))
          ./gradlew assembleRelease \
            -PreleaseVersionName="$VERSION" \
            -PreleaseVersionCode="$VERSION_CODE" \
            --build-cache --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        env:
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -euo pipefail
          SOURCE="app/build/outputs/apk/release/app-release.apk"
          test -s "$SOURCE" || { echo "::error::Expected APK not found at $SOURCE"; exit 1; }
          cp "$SOURCE" "$ASSET"

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-apk-${{ inputs.request_id }}
          path: ${{ steps.meta.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

      - name: Verify GH_TOKEN can publish target repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          push="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push // false')"
          [[ "$push" == "true" ]] || { echo "::error::GH_TOKEN cannot write to $GITHUB_REPOSITORY."; exit 1; }

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Every Android build must publish a new immutable release."
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            release create "$TAG"
            "$ASSET#HereLiesAz Admin APK $VERSION"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "HereLiesAz Admin $VERSION"
          )
          if [[ -n "$NOTES" ]]; then
            args+=(--notes "$NOTES")
          else
            args+=(--notes "Automatic HereLiesAz Admin Android release for $GITHUB_SHA.")
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
