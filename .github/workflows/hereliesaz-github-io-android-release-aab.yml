          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true
      - name: Verify native Android project exists
        shell: bash
        run: "set -euo pipefail\nmissing=0\nfor path in gradlew app; do\n  if [[ ! -e \"$path\" ]]; then\n    echo \"::error file=$path::Required Android project path '$path' is not present.\"\n    missing=1\n  fi\ndone\nif [[ ! -f settings.gradle && ! -f settings.gradle.kts ]]; then\n  echo \"::error::Neither settings.gradle nor settings.gradle.kts is present.\"\n  missing=1\nfi\nif [[ \"$missing\" -ne 0 ]]; then\n  echo \"AAB publishing is unavailable until the native project is checked in or generated reproducibly.\"\n  exit 1\nfi\n"
      - name: Inject Google Services
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: "if [ -f \"app/google-services.json.template\" ]; then\n  echo \"Template found. Injecting secrets...\"\n  sed -e 's/{{\\([^}]*\\)}}/${\\1}/g' app/google-services.json.template | envsubst > app/google-services.json\nelse\n  echo \"Warning: google-services.json.template not found. Skipping injection.\"\nfi\n# Add any extra local.properties keys below:\n# echo \"CUSTOM_API_KEY=$CUSTOM_API_KEY\" >> local.properties\n"
      - name: Decode signing keystore
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
        run: "if [ -z \"$KEYSTORE_RAW\" ]; then\n  echo \"::error::KEYSTORE_RAW secret is empty — cannot produce a signed bundle.\"\n  exit 1\nfi\necho \"$KEYSTORE_RAW\" | base64 -d > app/keystore.jks\nif [ ! -s app/keystore.jks ]; then\n  echo \"::error::Decoded keystore is empty — KEYSTORE_RAW is not valid base64.\"\n  exit 1\nfi\necho \"Keystore decoded to app/keystore.jks ($(stat -c%s app/keystore.jks) bytes)\"\n"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          cache-read-only: false
          dependency-graph: disabled
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Resolve package name
        id: meta
        run: "PKG=$(grep -E 'applicationId\\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*\"([^\"]+)\".*/\\1/')\necho \"package_name=$PKG\" >> \"$GITHUB_OUTPUT\"\n\nif [ -f \"settings.gradle.kts\" ]; then\n  APP_NAME=$(grep 'rootProject.name' settings.gradle.kts | sed -E \"s/.*=.*[\\\"'](.*)[\\\"']/\\1/\")\nelif [ -f \"settings.gradle\" ]; then\n  APP_NAME=$(grep 'rootProject.name' settings.gradle | sed -E \"s/.*=.*[\\\"'](.*)[\\\"']/\\1/\")\nelse\n  APP_NAME=\"app\"\nfi\necho \"app_name=${APP_NAME,,}\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Build Release AAB (signed)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.app_name }}-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Publish to Google Play (internal completed + alpha/beta/prod draft)
        id: play-upload
        if: ${{ fromJSON(inputs.target_inputs_json).publish }}
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          AAB_GLOB: app/build/outputs/bundle/release/*.aab
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: "pip install --quiet google-api-python-client google-auth google-auth-httplib2 httplib2==0.15.0\npython .github/scripts/play_multitrack_publish.py\n"
      - name: Persist auto-incremented versionCode without clobbering newer versions
        if: ${{ always() && fromJSON(inputs.target_inputs_json).publish }}
        run: "set -euo pipefail\ngit config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n\nif git diff --quiet -- version.properties; then\n  echo \"version.properties unchanged — nothing to persist\"\n  exit 0\nfi\n\nNEW_BUILD=$(grep -E '^versionBuild=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nNEW_MAJOR=$(grep -E '^versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nNEW_MINOR=$(grep -E '^versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nNEW_MINOR_LAST=$(grep -E '^versionMinorLast=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nNEW_PATCH=$(grep -E '^versionPatch=' version.properties | cut -d'=' -f2 | tr -d '\\r ')\nBRANCH=\"${{ inputs.target_ref_name }}\"\n\nfor attempt in 1 2 3 4 5; do\n  git fetch origin \"${BRANCH}\"\n  REMOTE_BUILD=$(git show \"origin/${BRANCH}:version.properties\" 2>/dev/null | grep -E '^versionBuild=' | cut -d'=' -f2 | tr -d '\\r ' || echo 0)\n\n  if [ \"$REMOTE_BUILD\" -ge \"$NEW_BUILD\" ]; then\n    echo \"Remote versionBuild=${REMOTE_BUILD} is already >= this build's ${NEW_BUILD}; refusing to overwrite it.\"\n    exit 0\n  fi\n\n  git reset --hard \"origin/${BRANCH}\"\n  cat > version.properties <<EOF\n# Version source of truth\nversionBuild=${NEW_BUILD}\nversionMajor=${NEW_MAJOR}\nversionMinor=${NEW_MINOR}\nversionMinorLast=${NEW_MINOR_LAST}\nversionPatch=${NEW_PATCH}\nEOF\n  git add version.properties\n  git commit -m \"ci: versionBuild=${NEW_BUILD} [skip ci]\"\n\n  if git push origin \"HEAD:${BRANCH}\"; then\n    echo \"Pushed versionBuild=${NEW_BUILD} on attempt ${attempt}\"\n    exit 0\n  fi\n  echo \"::warning::Push raced with a newer main commit; checking the remote version again\"\ndone\n\necho \"::error::Could not safely persist versionBuild=${NEW_BUILD} after 5 attempts\"\nexit 1\n"
      - name: Fail loudly if Play upload didn't succeed
