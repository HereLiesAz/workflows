  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Check for Art Data Branch
        id: check-branch
        run: "if git ls-remote --exit-code --heads origin art-data; then\n  echo \"exists=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"exists=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
      - name: Checkout Art Data
        if: steps.check-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/heads/art-data
          path: public/data
          fetch-tags: false
          repository: ${{ inputs.target_repository }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Verify art data is usable
        run: "if [ ! -s public/data/theater/_manifest.json ]; then\n  echo \"::error::public/data/theater/_manifest.json is missing or empty after the art-data checkout — refusing to deploy hereliesaz.com without theater data.\"\n  exit 1\nfi\necho \"art-data verified: $(find public/data -type f | wc -l) files staged\"\n"
      - name: Rebuild integrated painting records from scratch
        run: "rm -rf public/data/integrated\npython3 scripts/integrate_painting_bakes.py --public-root public --strict\n"
      - name: Install verification dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/verification-requirements.txt
      - name: Validate canonical painting records
        run: python3 scripts/validate_integrated_records.py --public-root public
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify repository and build Vite site
        run: npm run verify
      - name: Deploy dist via lftp (SFTP)
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PORT: ${{ fromJSON(inputs.target_vars_json).SFTP_PORT || '22' }}
          REMOTE_DIR: ${{ fromJSON(inputs.target_vars_json).FTP_SERVER_DIR || '/app' }}
        run: "set -euo pipefail\nsudo apt-get update\nsudo apt-get install -y lftp\n\nUSER_TRIMMED=$(printf '%s' \"$USERNAME\" | tr -d ' \\t\\r\\n')\nPW_TRIMMED=$(printf '%s' \"$PASSWORD\" | tr -d '\\r\\n')\n\nif [ -z \"$HOST\" ] || [ -z \"$USER_TRIMMED\" ] || [ -z \"$PW_TRIMMED\" ]; then\n  echo \"::error::SFTP deployment credentials are incomplete. Check FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD.\"\n  exit 1\nfi\n\necho \"Testing SFTP connection to $HOST:$PORT ...\"\ntimeout 45s lftp -u \"$USER_TRIMMED\",\"$PW_TRIMMED\" \\\n  -p \"$PORT\" \\\n  -e \"set net:timeout 15; set net:max-retries 2; set net:reconnect-interval-base 2; set net:reconnect-interval-max 5; set sftp:auto-confirm yes; cls -1 $REMOTE_DIR >/dev/null; quit\" \\\n  sftp://\"$HOST\" || {\n    code=$?\n    if [ \"$code\" -eq 124 ]; then\n      echo \"::error::SFTP connection test timed out after 45 seconds.\"\n    else\n      echo \"::error::SFTP connection/authentication test failed with exit code $code.\"\n    fi\n    exit \"$code\"\n  }\n\necho \"Deploying dist/ to $REMOTE_DIR ...\"\ntimeout 15m lftp -u \"$USER_TRIMMED\",\"$PW_TRIMMED\" \\\n  -p \"$PORT\" \\\n  -e \"set net:timeout 20; set net:max-retries 3; set net:reconnect-interval-base 2; set net:reconnect-interval-max 10; set sftp:auto-confirm yes; mirror -R --only-newer --delete --verbose=1 ./dist/ $REMOTE_DIR; quit\" \\\n  sftp://\"$HOST\" || {\n    code=$?\n    if [ \"$code\" -eq 124 ]; then\n      echo \"::error::SFTP upload timed out after 15 minutes.\"\n    else\n      echo \"::error::SFTP upload failed with exit code $code.\"\n    fi\n    exit \"$code\"\n  }\n\necho \"SFTP deployment completed.\"\n"
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    permissions:
      contents: read
    environment: hereliesaz.github.io
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Central workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Central workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
