      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Inventory source images and build visual audit
        shell: bash
        run: "python - <<'PY'\nfrom pathlib import Path\nfrom PIL import Image, ImageDraw\nimport json, math, shutil\n\nexts={'.png','.jpg','.jpeg','.webp'}\nskip_parts={'.git','build','.gradle','node_modules'}\nrows=[]\ncandidates=[]\nfor p in sorted(Path('.').rglob('*')):\n    if not p.is_file() or p.suffix.lower() not in exts:\n        continue\n    if any(part in skip_parts for part in p.parts):\n        continue\n    if p.as_posix().startswith('docs/guide/'):\n        continue\n    try:\n        with Image.open(p) as im:\n            w,h=im.size\n            row={'path':p.as_posix(),'width':w,'height':h,'ratio':round(w/h,4),'bytes':p.stat().st_size}\n            rows.append(row)\n            if w >= 900 and h >= 500:\n                candidates.append((p,w,h))\n    except Exception as e:\n        rows.append({'path':p.as_posix(),'error':str(e)})\nprint('STORYBOARD_IMAGE_AUDIT_BEGIN')\nprint(json.dumps(rows,indent=2))\nprint('STORYBOARD_IMAGE_AUDIT_END')\n\nout=Path('/tmp/storyboard-audit')\noriginals=out/'candidates'\noriginals.mkdir(parents=True, exist_ok=True)\ntile_w,tile_h=360,320\ncols=3\nrows_n=max(1,math.ceil(len(candidates)/cols))\nsheet=Image.new('RGB',(cols*tile_w,rows_n*tile_h),'white')\ndraw=ImageDraw.Draw(sheet)\nfor i,(p,w,h) in enumerate(candidates):\n    safe=f'{i:03d}_{p.name}'\n    shutil.copy2(p, originals/safe)\n    with Image.open(p) as im:\n        im=im.convert('RGB')\n        im.thumbnail((tile_w-20,tile_h-70))\n        x=(i%cols)*tile_w+(tile_w-im.width)//2\n        y=(i//cols)*tile_h+10\n        sheet.paste(im,(x,y))\n        label=f'{i:03d} {p.as_posix()}'\n        if len(label)>52: label=label[:49]+'...'\n        draw.text(((i%cols)*tile_w+8,(i//cols)*tile_h+tile_h-55),label,fill='black')\n        draw.text(((i%cols)*tile_w+8,(i//cols)*tile_h+tile_h-35),f'{w}x{h}',fill='black')\nsheet.save(out/'contact-sheet.jpg',quality=90)\n(out/'inventory.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')\nPY\n"
      - name: Upload visual audit
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-visual-audit
          path: /tmp/storyboard-audit
          if-no-files-found: error
