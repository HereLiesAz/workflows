name: Kaggle Session Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/kaggle-diagnostic-request'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-slim
    environment: onwordly
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || vars.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_JSON: ${{ secrets.KAGGLE_JSON }}
    steps:
      - name: Install Kaggle CLI
        run: python -m pip install --quiet --upgrade kaggle

      - name: Configure credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KAGGLE_JSON:-}" ]; then
            mkdir -p "$HOME/.kaggle"
            printf '%s' "$KAGGLE_JSON" > "$HOME/.kaggle/kaggle.json"
            chmod 600 "$HOME/.kaggle/kaggle.json"
          fi
          kaggle kernels list -m --page-size 1 >/dev/null

      - name: Inspect Onwordly sessions
        shell: bash
        run: |
          set -u
          echo "## Current Onwordly Kaggle state" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"

          echo "### Latest known shared-slug kernel"
          status="$(kaggle kernels status azwashere/onwordly-experiment-001 2>&1)"
          status_exit=$?
          printf '%s\n' "$status"
          {
            echo "### azwashere/onwordly-experiment-001"
            echo '~~~text'
            printf '%s\n' "$status"
            echo '~~~'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          echo "### Owned kernels"
          listing="$(kaggle kernels list -m -v --page-size 50 2>&1)"
          list_exit=$?
          printf '%s\n' "$listing"
          {
            echo "### Owned-kernel inventory"
            echo '~~~text'
            printf '%s\n' "$listing"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

          if (( status_exit != 0 || list_exit != 0 )); then
            exit 1
          fi
