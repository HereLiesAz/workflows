# Generalized purpose workflow: Maven Package Publish.
# Build tool, repository destination, signing, and credentials are profiles rather than separate executors.
name: Maven Package Publish
run-name: ${{ inputs.target_repository_name }} · Maven Package Publish

on:
  workflow_dispatch:
    inputs:
      target_repository: {required: true, type: string}
      target_repository_id: {required: true, type: string}
      target_repository_owner: {required: true, type: string}
      target_repository_owner_id: {required: true, type: string}
      target_sha: {required: true, type: string}
      target_check_sha: {required: true, type: string}
      target_ref: {required: true, type: string}
      target_ref_name: {required: false, type: string}
      target_ref_type: {required: false, type: string}
      target_head_ref: {required: false, type: string}
      target_base_ref: {required: false, type: string}
      target_actor: {required: true, type: string}
      target_actor_id: {required: false, type: string}
      target_event_name: {required: true, type: string}
      target_event_json: {required: true, type: string}
      target_inputs_json: {required: true, type: string}
      target_vars_json: {required: true, type: string}
      target_run_id: {required: true, type: string}
      target_run_number: {required: false, type: string}
      target_run_attempt: {required: false, type: string}
      target_workflow_name: {required: true, type: string}
      source_workflow_path: {required: true, type: string}
      source_sha256: {required: true, type: string}
      target_repository_name: {required: true, type: string}
      purpose_profile_json: {required: true, type: string}

permissions:
  contents: read

env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_ACTOR: ${{ inputs.target_actor }}
  PROFILE_JSON: ${{ inputs.purpose_profile_json }}

jobs:
  central_check_start:
    runs-on: ubuntu-latest
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo_json="$(gh api "repos/$TARGET_REPOSITORY")"
          [[ "$(jq -r '.id' <<<"$repo_json")" == "$TARGET_REPOSITORY_ID" ]] || { echo "Repository ID mismatch" >&2; exit 1; }
          [[ "$(jq -r '.owner.id' <<<"$repo_json")" == "103241502" ]] || { echo "Repository is not owned by HereLiesAz" >&2; exit 1; }
          [[ "$TARGET_REPOSITORY_OWNER_ID" == "103241502" ]] || { echo "OIDC owner ID mismatch" >&2; exit 1; }
      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state pending --arg context "$STATUS_CONTEXT" --arg description "Publishing Maven package from HereLiesAz/workflows." --arg target_url "$DETAILS_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          gh api --method POST "repos/$TARGET_REPOSITORY/statuses/$TARGET_CHECK_SHA" --input - <<<"$payload"

      - name: Mint target check token
        id: target-check-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz
      - name: Post target check run
        if: ${{ always() && steps.target-check-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.target-check-token.outputs.token }}
          RUN_READ_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_PHASE: start
          CHECK_NAME: ${{ inputs.target_workflow_name || inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set +e\nwarn() { echo \"::warning::Target check run skipped: $1\"; exit 0; }\n[[ -n \"${TARGET_REPOSITORY:-}\" && -n \"${TARGET_CHECK_SHA:-}\" ]] || warn \"no target commit\"\ntitle=\"$CHECK_NAME\"\ntext=\"\"\nif [[ \"$CHECK_PHASE\" == \"start\" ]]; then\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$url,external_id:$ext,output:{title:$name,summary:(\"Running in HereLiesAz/workflows: \" + $url)}}')\"\nelse\n  if [[ \"$FAILED\" == \"true\" ]]; then\n    conclusion=\"failure\"\n    jobs=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api --paginate \"repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs\" --jq '.jobs[]' 2>/dev/null | jq -s '.')\"\n    [[ -n \"$jobs\" ]] || jobs=\"[]\"\n    failed=\"$(jq -r '[.[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\")\n      | \"- **\\(.name)** (\\(.conclusion)): \" + ([.steps[]? | select(.conclusion == \"failure\") | .name] | join(\", \") | if . == \"\" then \"no failed step reported\" else . end)\n      + \" — [log](\\(.html_url))\"] | join(\"\\n\")' <<<\"$jobs\")\"\n    first_id=\"$(jq -r '[.[] | select(.conclusion == \"failure\")][0].id // empty' <<<\"$jobs\")\"\n    if [[ -n \"$first_id\" ]]; then\n      tail_log=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api \"repos/${GITHUB_REPOSITORY}/actions/jobs/${first_id}/logs\" 2>/dev/null \\\n        | sed -E 's/^[0-9T:.-]+Z //' | grep -v '^##\\[group\\]\\|^##\\[endgroup\\]' | tail -n 60)\"\n      [[ -n \"$tail_log\" ]] && text=\"$(printf 'Last lines of the first failed job:\\n\\n~~~text\\n%s\\n~~~\\n' \"${tail_log:0:60000}\")\"\n    fi\n    summary=\"$(printf 'Central run failed: %s\\n\\n%s\\n' \"$DETAILS_URL\" \"${failed:-No failed job reported.}\")\"\n    title=\"$CHECK_NAME failed\"\n  else\n    conclusion=\"success\"\n    summary=\"Central run succeeded: $DETAILS_URL\"\n  fi\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    --arg conclusion \"$conclusion\" --arg title \"$title\" --arg summary \"${summary:0:65000}\" --arg text \"$text\" \\\n    '{name:$name,head_sha:$sha,status:\"completed\",conclusion:$conclusion,details_url:$url,external_id:$ext,output:({title:$title,summary:$summary} + (if $text == \"\" then {} else {text:$text} end))}')\"\nfi\n# Each phase posts its own Check Run under the same name; GitHub shows the latest one,\n# so the finish phase needs no id handed over from the start job.\ngh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$body\" >/dev/null \\\n  || echo \"::warning::Target check run skipped: GitHub refused the check run\"\n\n# Release/deploy failures also go to one open issue per workflow: opened on the\n# first failure, commented on each repeat. Successes never touch issues.\n[[ \"$CHECK_PHASE\" == \"finish\" && \"${FILE_ISSUES:-}\" == \"true\" && \"${conclusion:-}\" == \"failure\" ]] || exit 0\nlabel=\"central-run-failure\"\nissue_title=\"Central run failing: $CHECK_NAME\"\nissue=\"$(gh api \"repos/${TARGET_REPOSITORY}/issues?state=open&labels=${label}&per_page=100\" 2>/dev/null \\\n  | jq -r --arg t \"$issue_title\" '[.[] | select(.title == $t)][0].number // empty')\"\nreport=\"$(printf '%s\\n\\nCommit: %s\\n\\n%s\\n' \"$summary\" \"$TARGET_CHECK_SHA\" \"$text\")\"\nif [[ -n \"$issue\" ]]; then\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"$report\" >/dev/null \\\n    || warn \"could not comment on issue #$issue\"\nelse\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/labels\" -f name=\"$label\" -f color=\"000000\" \\\n    -f description=\"A release or deploy run in HereLiesAz/workflows failed for this repository.\" >/dev/null 2>&1\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues\" -f title=\"$issue_title\" -f body=\"$report\" -f \"labels[]=$label\" >/dev/null \\\n    || warn \"could not open a failure issue\"\nfi\n"
  publish:
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    environment: ${{ inputs.target_repository_name }}
    steps:
      - name: Wait for earlier package publication for this repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CURRENT_RUN: ${{ github.run_id }}
          QUEUE_TITLE: ${{ inputs.target_repository_name }} · Maven Package Publish
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 360); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/maven-package-publish.yml/runs?per_page=100" > "$RUNNER_TEMP/maven-runs.json"
            blockers="$(jq --argjson current "$CURRENT_RUN" --arg title "$QUEUE_TITLE" '[.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and .id < $current and .display_title == $title)] | length' "$RUNNER_TEMP/maven-runs.json")"
            [ "$blockers" -eq 0 ] && exit 0
            echo "Waiting behind $blockers earlier Maven publication run(s) for this repository..."
            sleep 10
          done
          echo "::error::Timed out waiting for Maven publication queue" >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false

      - name: Set up Java for Gradle/GitHub Packages
        if: ${{ fromJSON(inputs.purpose_profile_json).tool == 'gradle' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ fromJSON(inputs.purpose_profile_json).java_version || '21' }}
          distribution: temurin
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Set up Java for Maven Central
        if: ${{ fromJSON(inputs.purpose_profile_json).tool == 'maven' }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ fromJSON(inputs.purpose_profile_json).java_version || '17' }}
          distribution: temurin
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set up Gradle
        if: ${{ fromJSON(inputs.purpose_profile_json).tool == 'gradle' }}
        uses: gradle/actions/setup-gradle@v4

      - name: Build before publish
        if: ${{ fromJSON(inputs.purpose_profile_json).build_command != null && fromJSON(inputs.purpose_profile_json).build_command != '' }}
        env:
          JITPACK: ${{ fromJSON(inputs.purpose_profile_json).jitpack && 'true' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          bash -eo pipefail -c "$(jq -r '.build_command' <<<"$PROFILE_JSON")"

      - name: Publish package
        env:
          JITPACK: ${{ fromJSON(inputs.purpose_profile_json).jitpack && 'true' || '' }}
          USERNAME: ${{ inputs.target_actor }}
          TOKEN: ${{ secrets.GH_TOKEN }}
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          bash -eo pipefail -c "$(jq -r '.publish_command' <<<"$PROFILE_JSON")"

  central_check_finish:
    if: ${{ always() }}
    needs: [central_check_start, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$FAILED" = true ]; then state=failure; description="Maven package publication failed."; else state=success; description="Maven package publication completed successfully."; fi
          payload="$(jq -n --arg state "$state" --arg context "$STATUS_CONTEXT" --arg description "$description" --arg target_url "$DETAILS_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          gh api --method POST "repos/$TARGET_REPOSITORY/statuses/$TARGET_CHECK_SHA" --input - <<<"$payload"
      - name: Mint target check token
        id: target-check-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz
      - name: Post target check run
        if: ${{ always() && steps.target-check-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.target-check-token.outputs.token }}
          RUN_READ_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_PHASE: finish
          CHECK_NAME: ${{ inputs.target_workflow_name || inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        shell: bash
        run: "set +e\nwarn() { echo \"::warning::Target check run skipped: $1\"; exit 0; }\n[[ -n \"${TARGET_REPOSITORY:-}\" && -n \"${TARGET_CHECK_SHA:-}\" ]] || warn \"no target commit\"\ntitle=\"$CHECK_NAME\"\ntext=\"\"\nif [[ \"$CHECK_PHASE\" == \"start\" ]]; then\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$url,external_id:$ext,output:{title:$name,summary:(\"Running in HereLiesAz/workflows: \" + $url)}}')\"\nelse\n  if [[ \"$FAILED\" == \"true\" ]]; then\n    conclusion=\"failure\"\n    jobs=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api --paginate \"repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs\" --jq '.jobs[]' 2>/dev/null | jq -s '.')\"\n    [[ -n \"$jobs\" ]] || jobs=\"[]\"\n    failed=\"$(jq -r '[.[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\")\n      | \"- **\\(.name)** (\\(.conclusion)): \" + ([.steps[]? | select(.conclusion == \"failure\") | .name] | join(\", \") | if . == \"\" then \"no failed step reported\" else . end)\n      + \" — [log](\\(.html_url))\"] | join(\"\\n\")' <<<\"$jobs\")\"\n    first_id=\"$(jq -r '[.[] | select(.conclusion == \"failure\")][0].id // empty' <<<\"$jobs\")\"\n    if [[ -n \"$first_id\" ]]; then\n      tail_log=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api \"repos/${GITHUB_REPOSITORY}/actions/jobs/${first_id}/logs\" 2>/dev/null \\\n        | sed -E 's/^[0-9T:.-]+Z //' | grep -v '^##\\[group\\]\\|^##\\[endgroup\\]' | tail -n 60)\"\n      [[ -n \"$tail_log\" ]] && text=\"$(printf 'Last lines of the first failed job:\\n\\n~~~text\\n%s\\n~~~\\n' \"${tail_log:0:60000}\")\"\n    fi\n    summary=\"$(printf 'Central run failed: %s\\n\\n%s\\n' \"$DETAILS_URL\" \"${failed:-No failed job reported.}\")\"\n    title=\"$CHECK_NAME failed\"\n  else\n    conclusion=\"success\"\n    summary=\"Central run succeeded: $DETAILS_URL\"\n  fi\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    --arg conclusion \"$conclusion\" --arg title \"$title\" --arg summary \"${summary:0:65000}\" --arg text \"$text\" \\\n    '{name:$name,head_sha:$sha,status:\"completed\",conclusion:$conclusion,details_url:$url,external_id:$ext,output:({title:$title,summary:$summary} + (if $text == \"\" then {} else {text:$text} end))}')\"\nfi\n# Each phase posts its own Check Run under the same name; GitHub shows the latest one,\n# so the finish phase needs no id handed over from the start job.\ngh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$body\" >/dev/null \\\n  || echo \"::warning::Target check run skipped: GitHub refused the check run\"\n\n# Release/deploy failures also go to one open issue per workflow: opened on the\n# first failure, commented on each repeat. Successes never touch issues.\n[[ \"$CHECK_PHASE\" == \"finish\" && \"${FILE_ISSUES:-}\" == \"true\" && \"${conclusion:-}\" == \"failure\" ]] || exit 0\nlabel=\"central-run-failure\"\nissue_title=\"Central run failing: $CHECK_NAME\"\nissue=\"$(gh api \"repos/${TARGET_REPOSITORY}/issues?state=open&labels=${label}&per_page=100\" 2>/dev/null \\\n  | jq -r --arg t \"$issue_title\" '[.[] | select(.title == $t)][0].number // empty')\"\nreport=\"$(printf '%s\\n\\nCommit: %s\\n\\n%s\\n' \"$summary\" \"$TARGET_CHECK_SHA\" \"$text\")\"\nif [[ -n \"$issue\" ]]; then\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"$report\" >/dev/null \\\n    || warn \"could not comment on issue #$issue\"\nelse\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/labels\" -f name=\"$label\" -f color=\"000000\" \\\n    -f description=\"A release or deploy run in HereLiesAz/workflows failed for this repository.\" >/dev/null 2>&1\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues\" -f title=\"$issue_title\" -f body=\"$report\" -f \"labels[]=$label\" >/dev/null \\\n    || warn \"could not open a failure issue\"\nfi\n"
