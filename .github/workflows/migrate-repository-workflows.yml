name: Migrate to repository workflows

on:
  push:
    paths:
      - .github/workflows/migrate-repository-workflows.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Split shared variants into repository workflows
        run: python scripts/migrate_to_repository_workflows.py

      - name: Validate migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from ruamel.yaml import YAML

          yaml = YAML(typ='safe')
          broken = []
          central_paths = set()

          for manifest_path in Path('registry').glob('*/manifest.json'):
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              for source_path, entry in (manifest.get('workflows') or {}).items():
                  if not isinstance(entry, dict) or entry.get('status') != 'active':
                      continue
                  if entry.get('binding') == 'shared-variant':
                      broken.append(f'{manifest_path}:{source_path}: shared-variant binding remains')
                  if entry.get('shared_variant'):
                      broken.append(f'{manifest_path}:{source_path}: shared_variant remains')
                  central = entry.get('central_workflow')
                  if central:
                      central_paths.add(str(central))

          for path in Path('.github/workflows').glob('*.y*ml'):
              text = path.read_text(encoding='utf-8')
              if text.startswith('# Central semantic shared-workflow family.'):
                  broken.append(f'{path}: old shared-family file remains')
              if re.search(r'^\s+v_[0-9a-f]{16}__', text, flags=re.MULTILINE):
                  broken.append(f'{path}: hash-prefixed job remains')
              doc = yaml.load(text)
              if not isinstance(doc, dict) or not isinstance(doc.get('jobs'), dict):
                  broken.append(f'{path}: invalid workflow')

          missing = [path for path in central_paths if not Path(path).is_file()]
          broken.extend(f'missing central workflow: {path}' for path in missing)

          if broken:
              raise SystemExit('\n'.join(broken))
          print(f'validated {len(central_paths)} active central workflow paths')
          PY

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows registry
          git commit -m "refactor: replace shared variants with repository workflows"
          git push origin HEAD:main
