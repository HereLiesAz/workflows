name: Migrate semantic shared workflow library

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-semantic-library.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out central controller
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Install migration dependency
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Distinguish ref-scoped cache cleanup from canonical cache cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/shared_workflow_library.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    lowered = (workflow_name + "\\n" + source_path + "\\n" + compiled_text).casefold()\n\n'
          insert = '''    lowered = (workflow_name + "\\n" + source_path + "\\n" + compiled_text).casefold()\n\n    if name_slug == "clear-cache" and "gh cache list --ref" in lowered:\n        return "ref-cache-cleanup"\n'''
          if 'return "ref-cache-cleanup"' not in text:
              if anchor not in text:
                  raise SystemExit('shared library classifier anchor changed')
              text = text.replace(anchor, insert, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Compile migration code
        run: |
          python -m py_compile \
            scripts/shared_workflow_library.py \
            scripts/migrate_to_semantic_library.py \
            scripts/dispatch_request.py

      - name: Consolidate workflows and registry bindings
        run: python scripts/migrate_to_semantic_library.py

      - name: Validate migrated repository
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          if find .github/workflows -maxdepth 1 -type f -name 'catalog-*.yml' -o -name 'catalog-*.yaml' | grep -q .; then
            echo '::error::catalog-prefixed workflow files remain'
            find .github/workflows -maxdepth 1 -type f -name 'catalog-*.yml' -o -name 'catalog-*.yaml'
            exit 1
          fi

          if find .github/workflows -maxdepth 1 -type f | grep -E -- '-[0-9a-f]{16}\.ya?ml$'; then
            echo '::error::hash-suffixed workflow filenames remain'
            exit 1
          fi

          python -m py_compile \
            scripts/shared_workflow_library.py \
            scripts/sync_repository_catalog.py \
            scripts/sync_repository.py \
            scripts/retry_repository_sync.py \
            scripts/dispatch_request.py

          python - <<'PY'
          from pathlib import Path
          from ruamel.yaml import YAML

          yaml = YAML(typ='safe')
          for path in Path('.github/workflows').glob('*.y*ml'):
              with path.open(encoding='utf-8') as handle:
                  doc = yaml.load(handle)
              if not isinstance(doc, dict) or 'jobs' not in doc:
                  raise SystemExit(f'invalid workflow: {path}')
          print('all workflow YAML parsed')
          PY

          git status --short

      - name: Commit semantic library migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Az'
          git config user.email '103241502+HereLiesAz@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate workflows into semantic shared library'
          git push origin HEAD:main
