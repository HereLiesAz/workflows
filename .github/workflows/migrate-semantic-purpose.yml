name: Semantic workflow cleanup

on:
  push:
    branches: [main]
    paths:
      - 'scripts/semantic_catalog.py'
      - 'scripts/migrate_semantic_catalog.py'
      - '.github/workflows/migrate-semantic-purpose.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Collapse duplicate workflows by purpose
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/migrate_semantic_catalog.py --delete-target-proxies

      - name: Validate migrated controller
        run: |
          python -m py_compile scripts/*.py
          python scripts/audit_workflow_collection.py
          node --check worker/src/index.js

      - name: Commit semantic catalog
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Collapse duplicate workflows by purpose'
          git push origin HEAD:main

      - name: Migration summary
        if: ${{ always() }}
        run: |
          if [ -f /tmp/semantic-migration-report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/semantic-migration-report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
