name: Morphont release request

on:
  push:
    branches:
      - main
    paths:
      - release-requests/morphont.json

permissions:
  contents: read

concurrency:
  group: morphont-release-request
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out central controller
        uses: actions/checkout@v4

      - name: Validate request and dispatch hardened Morphont publisher
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          request="release-requests/morphont.json"
          version="$(jq -r '.version // empty' "$request")"
          target_sha="$(jq -r '.target_sha // empty' "$request")"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid Morphont release version: $version" >&2
            exit 1
          }
          [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Invalid Morphont target SHA: $target_sha" >&2
            exit 1
          }

          current_main="$(gh api repos/HereLiesAz/morphont/git/ref/heads/main --jq '.object.sha')"
          [[ "$target_sha" == "$current_main" ]] || {
            echo "Release request must target current Morphont main ($current_main), got $target_sha" >&2
            exit 1
          }

          tag="$version"
          source_path=".github/workflows/morphont-publish.yml"
          source_hash="$(jq -r --arg path "$source_path" '.workflows[$path].source_sha256 // empty' registry/1356357185/manifest.json)"
          central_workflow="$(jq -r --arg path "$source_path" '.workflows[$path].central_workflow // empty' registry/1356357185/manifest.json)"
          [[ -n "$source_hash" && "$central_workflow" == ".github/workflows/android-play-release.yml" ]] || {
            echo "Morphont publisher is not registered to the canonical Android publisher." >&2
            exit 1
          }
          profile_json="$(SOURCE_HASH="$source_hash" python -c 'import json, os, sys; sys.path.insert(0, "scripts"); from semantic_catalog import purpose_profile_for_source; profile=purpose_profile_for_source(os.environ["SOURCE_HASH"]); assert profile, "Morphont release profile is missing"; print(json.dumps(profile, separators=(",", ":")))' )"

          event_json="$(jq -nc --arg ref "refs/tags/$tag" --arg ref_name "$tag" '{ref:$ref,ref_name:$ref_name,ref_type:"tag"}')"

          gh workflow run android-play-release.yml \
            --repo HereLiesAz/workflows \
            --ref main \
            -f target_repository=HereLiesAz/morphont \
            -f target_repository_id=1356357185 \
            -f target_repository_owner=HereLiesAz \
            -f target_repository_owner_id=103241502 \
            -f target_sha="$target_sha" \
            -f target_check_sha="$target_sha" \
            -f target_ref="refs/tags/$tag" \
            -f target_ref_name="$tag" \
            -f target_ref_type=tag \
            -f target_actor="$GITHUB_ACTOR" \
            -f target_event_name=push \
            -f target_event_json="$event_json" \
            -f target_inputs_json='{}' \
            -f target_vars_json='{}' \
            -f target_run_id="$GITHUB_RUN_ID" \
            -f target_run_number="$GITHUB_RUN_NUMBER" \
            -f target_run_attempt="$GITHUB_RUN_ATTEMPT" \
            -f target_workflow_name='Publish Android' \
            -f source_workflow_path="$source_path" \
            -f source_sha256="$source_hash" \
            -f target_repository_name=morphont \
            -f purpose_profile_json="$profile_json"

          echo "Dispatched Morphont $tag from $target_sha through the centralized publisher."
