# Generalized purpose workflow: Node Package Publish.
# Registry, package manager, release strategy, and retry/staging policy are profiles.
name: Node Package Publish
run-name: ${{ inputs.target_repository_name }} · Node Package Publish

on:
  workflow_dispatch:
    inputs:
      target_repository:
        required: true
        type: string
      target_repository_id:
        required: true
        type: string
      target_repository_owner:
        required: true
        type: string
      target_repository_owner_id:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      target_check_sha:
        required: true
        type: string
      target_ref:
        required: true
        type: string
      target_ref_name:
        required: false
        type: string
      target_ref_type:
        required: false
        type: string
      target_head_ref:
        required: false
        type: string
      target_base_ref:
        required: false
        type: string
      target_actor:
        required: true
        type: string
      target_actor_id:
        required: false
        type: string
      target_event_name:
        required: true
        type: string
      target_event_json:
        required: true
        type: string
      target_inputs_json:
        required: true
        type: string
      target_run_id:
        required: true
        type: string
      target_run_number:
        required: false
        type: string
      target_run_attempt:
        required: false
        type: string
      target_workflow_name:
        required: true
        type: string
      source_workflow_path:
        required: true
        type: string
      source_sha256:
        required: true
        type: string
      target_repository_name:
        required: true
        type: string
      purpose_profile_json:
        required: true
        type: string

permissions:
  contents: read

env:
  TARGET_REPOSITORY: ${{ inputs.target_repository }}
  TARGET_REPOSITORY_ID: ${{ inputs.target_repository_id }}
  TARGET_REPOSITORY_OWNER: ${{ inputs.target_repository_owner }}
  TARGET_REPOSITORY_OWNER_ID: ${{ inputs.target_repository_owner_id }}
  TARGET_SHA: ${{ inputs.target_sha }}
  TARGET_CHECK_SHA: ${{ inputs.target_check_sha }}
  TARGET_REF: ${{ inputs.target_ref }}
  TARGET_REF_NAME: ${{ inputs.target_ref_name }}
  TARGET_REF_TYPE: ${{ inputs.target_ref_type }}
  TARGET_EVENT_NAME: ${{ inputs.target_event_name }}
  TARGET_INPUTS_JSON: ${{ inputs.target_inputs_json }}
  PROFILE_JSON: ${{ inputs.purpose_profile_json }}

jobs:
  central_check_start:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate immutable target identity
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo_json="$(gh api "repos/$TARGET_REPOSITORY")"
          actual_repo_id="$(jq -r '.id' <<<"$repo_json")"
          actual_owner_id="$(jq -r '.owner.id' <<<"$repo_json")"
          actual_owner="$(jq -r '.owner.login' <<<"$repo_json")"
          [[ "$actual_repo_id" == "$TARGET_REPOSITORY_ID" ]] || { echo "Repository ID mismatch" >&2; exit 1; }
          [[ "$actual_owner_id" == "103241502" ]] || { echo "Repository is not owned by HereLiesAz" >&2; exit 1; }
          [[ "${actual_owner,,}" == "hereliesaz" ]] || { echo "Repository owner mismatch" >&2; exit 1; }
          [[ "$TARGET_REPOSITORY_OWNER_ID" == "103241502" ]] || { echo "OIDC owner ID mismatch" >&2; exit 1; }

      - name: Set target status pending
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state pending --arg context "$STATUS_CONTEXT" --arg description "Running Node package publication from HereLiesAz/workflows." --arg target_url "$DETAILS_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          gh api --method POST "repos/$TARGET_REPOSITORY/statuses/$TARGET_CHECK_SHA" --input - <<<"$payload"

      - name: Mint target check token
        id: target-check-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz
      - name: Post target check run
        if: ${{ always() && steps.target-check-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.target-check-token.outputs.token }}
          RUN_READ_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_PHASE: start
          CHECK_NAME: ${{ inputs.target_workflow_name || inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set +e\nwarn() { echo \"::warning::Target check run skipped: $1\"; exit 0; }\n[[ -n \"${TARGET_REPOSITORY:-}\" && -n \"${TARGET_CHECK_SHA:-}\" ]] || warn \"no target commit\"\ntitle=\"$CHECK_NAME\"\ntext=\"\"\nif [[ \"$CHECK_PHASE\" == \"start\" ]]; then\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$url,external_id:$ext,output:{title:$name,summary:(\"Running in HereLiesAz/workflows: \" + $url)}}')\"\nelse\n  if [[ \"$FAILED\" == \"true\" ]]; then\n    conclusion=\"failure\"\n    jobs=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api --paginate \"repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs\" --jq '.jobs[]' 2>/dev/null | jq -s '.')\"\n    [[ -n \"$jobs\" ]] || jobs=\"[]\"\n    failed=\"$(jq -r '[.[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\")\n      | \"- **\\(.name)** (\\(.conclusion)): \" + ([.steps[]? | select(.conclusion == \"failure\") | .name] | join(\", \") | if . == \"\" then \"no failed step reported\" else . end)\n      + \" — [log](\\(.html_url))\"] | join(\"\\n\")' <<<\"$jobs\")\"\n    first_id=\"$(jq -r '[.[] | select(.conclusion == \"failure\")][0].id // empty' <<<\"$jobs\")\"\n    if [[ -n \"$first_id\" ]]; then\n      tail_log=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api \"repos/${GITHUB_REPOSITORY}/actions/jobs/${first_id}/logs\" 2>/dev/null \\\n        | sed -E 's/^[0-9T:.-]+Z //' | grep -v '^##\\[group\\]\\|^##\\[endgroup\\]' | tail -n 60)\"\n      [[ -n \"$tail_log\" ]] && text=\"$(printf 'Last lines of the first failed job:\\n\\n~~~text\\n%s\\n~~~\\n' \"${tail_log:0:60000}\")\"\n    fi\n    summary=\"$(printf 'Central run failed: %s\\n\\n%s\\n' \"$DETAILS_URL\" \"${failed:-No failed job reported.}\")\"\n    title=\"$CHECK_NAME failed\"\n  else\n    conclusion=\"success\"\n    summary=\"Central run succeeded: $DETAILS_URL\"\n  fi\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    --arg conclusion \"$conclusion\" --arg title \"$title\" --arg summary \"${summary:0:65000}\" --arg text \"$text\" \\\n    '{name:$name,head_sha:$sha,status:\"completed\",conclusion:$conclusion,details_url:$url,external_id:$ext,output:({title:$title,summary:$summary} + (if $text == \"\" then {} else {text:$text} end))}')\"\nfi\n# Each phase posts its own Check Run under the same name; GitHub shows the latest one,\n# so the finish phase needs no id handed over from the start job.\ngh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$body\" >/dev/null \\\n  || echo \"::warning::Target check run skipped: GitHub refused the check run\"\n\n# Release/deploy workflows also keep one open issue per workflow while it fails:\n# opened on the first failure, commented on each repeat, closed by the next success.\n[[ \"$CHECK_PHASE\" == \"finish\" && \"${FILE_ISSUES:-}\" == \"true\" ]] || exit 0\nlabel=\"central-run-failure\"\nissue_title=\"Central run failing: $CHECK_NAME\"\nissue=\"$(gh api \"repos/${TARGET_REPOSITORY}/issues?state=open&labels=${label}&per_page=100\" 2>/dev/null \\\n  | jq -r --arg t \"$issue_title\" '[.[] | select(.title == $t)][0].number // empty')\"\nif [[ \"$conclusion\" == \"failure\" ]]; then\n  report=\"$(printf '%s\\n\\nCommit: %s\\n\\n%s\\n' \"$summary\" \"$TARGET_CHECK_SHA\" \"$text\")\"\n  if [[ -n \"$issue\" ]]; then\n    gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"$report\" >/dev/null \\\n      || warn \"could not comment on issue #$issue\"\n  else\n    gh api --method POST \"repos/${TARGET_REPOSITORY}/labels\" -f name=\"$label\" -f color=\"000000\" \\\n      -f description=\"A release or deploy run in HereLiesAz/workflows failed for this repository.\" >/dev/null 2>&1\n    gh api --method POST \"repos/${TARGET_REPOSITORY}/issues\" -f title=\"$issue_title\" -f body=\"$report\" -f \"labels[]=$label\" >/dev/null \\\n      || warn \"could
          not open a failure issue\"\n  fi\nelif [[ -n \"$issue\" ]]; then\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"Fixed: $summary (commit $TARGET_CHECK_SHA).\" >/dev/null\n  gh api --method PATCH \"repos/${TARGET_REPOSITORY}/issues/${issue}\" -f state=closed -f state_reason=completed >/dev/null \\\n    || warn \"could not close issue #$issue\"\nfi\n"
  publish:
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    environment: ${{ inputs.target_repository_name }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      NODE_AUTH_TOKEN: ${{ fromJSON(inputs.purpose_profile_json).token == 'github' && secrets.GH_TOKEN || secrets.NPM_AUTH_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
    steps:
      - name: Wait for earlier package publication for this repository
        env:
          CURRENT_RUN: ${{ github.run_id }}
          QUEUE_TITLE: ${{ inputs.target_repository_name }} · Node Package Publish
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 720); do
            gh api "repos/${{ github.repository }}/actions/workflows/node-package-publish.yml/runs?per_page=100" > "$RUNNER_TEMP/node-package-runs.json"
            blockers="$(jq --argjson current "$CURRENT_RUN" --arg title "$QUEUE_TITLE" '[.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and .id < $current and .display_title == $title)] | length' "$RUNNER_TEMP/node-package-runs.json")"
            if [ "$blockers" -eq 0 ]; then
              echo "Package publication slot acquired."
              exit 0
            fi
            echo "Waiting behind $blockers earlier package publication run(s) for this repository..."
            sleep 10
          done
          echo "::error::Timed out waiting for the package publication queue" >&2
          exit 1

      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ fromJSON(inputs.purpose_profile_json).node_version || '22' }}
          registry-url: ${{ fromJSON(inputs.purpose_profile_json).registry_url }}
          scope: ${{ fromJSON(inputs.purpose_profile_json).scope || '' }}

      - name: Prepare package workspace
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(jq -r '.working_directory // "."' <<<"$PROFILE_JSON")"
          cd "$workdir"
          prepare="$(jq -r '.prepare_command // empty' <<<"$PROFILE_JSON")"
          if [ -n "$prepare" ]; then
            bash -eo pipefail -c "$prepare"
          fi

      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(jq -r '.working_directory // "."' <<<"$PROFILE_JSON")"
          cd "$workdir"
          mode="$(jq -r '.mode' <<<"$PROFILE_JSON")"

          case "$mode" in
            simple)
              build="$(jq -r '.build_command // empty' <<<"$PROFILE_JSON")"
              publish="$(jq -r '.publish_command // "npm publish"' <<<"$PROFILE_JSON")"
              if [ -n "$build" ]; then bash -eo pipefail -c "$build"; fi
              bash -eo pipefail -c "$publish"
              ;;

            single-retry)
              package="$(jq -r --arg fallback "$(jq -r '.default_package // empty' <<<"$PROFILE_JSON")" '.package // $fallback' <<<"$TARGET_INPUTS_JSON")"
              test -n "$package" || { echo "::error::A package name is required" >&2; exit 1; }
              build="$(jq -r '.build_command // empty' <<<"$PROFILE_JSON")"
              if [ -n "$build" ]; then
                PACKAGE="$package" bash -eo pipefail -c "$build"
              fi
              script="$(jq -r '.publish_script' <<<"$PROFILE_JSON")"
              bash "$script" "$package"
              ;;

            staged)
              build="$(jq -r '.build_command // empty' <<<"$PROFILE_JSON")"
              if [ -n "$build" ]; then bash -eo pipefail -c "$build"; fi
              export STAGE_SIZE="$(jq -r --arg d "$(jq -r '.stage_size // "5"' <<<"$PROFILE_JSON")" '.stageSize // $d' <<<"$TARGET_INPUTS_JSON")"
              export STAGE_COOLDOWN="$(jq -r --arg d "$(jq -r '.stage_cooldown // "120"' <<<"$PROFILE_JSON")" '.stageCooldown // $d' <<<"$TARGET_INPUTS_JSON")"
              export PUBLISH_COOLDOWN="$(jq -r --arg d "$(jq -r '.call_cooldown // "30"' <<<"$PROFILE_JSON")" '.callCooldown // $d' <<<"$TARGET_INPUTS_JSON")"
              export PUBLISH_TAG="$(jq -r --arg d "$(jq -r '.staging_tag // "staging"' <<<"$PROFILE_JSON")" '.stagingTag // $d' <<<"$TARGET_INPUTS_JSON")"
              bash "$(jq -r '.publish_script' <<<"$PROFILE_JSON")"
              promote="$(jq -r '.promote // false' <<<"$TARGET_INPUTS_JSON")"
              if [ "$promote" = true ]; then
                bash "$(jq -r '.promote_script' <<<"$PROFILE_JSON")"
              fi
              ;;

            changesets)
              if who="$(npm whoami --registry=https://registry.npmjs.org 2>/dev/null)"; then
                echo "::notice::NPM token authenticates as $who"
              else
                echo "::warning::NPM token authentication check failed; publication will fail if publishing is required."
              fi

              version_cmd="$(jq -r '.version_command // "pnpm run version"' <<<"$PROFILE_JSON")"
              publish_cmd="$(jq -r '.publish_command // "pnpm run release"' <<<"$PROFILE_JSON")"
              bash -eo pipefail -c "$version_cmd"

              if ! git diff --quiet || ! git diff --cached --quiet; then
                branch="$(jq -r '.version_branch // "changeset-release/main"' <<<"$PROFILE_JSON")"
                title="$(jq -r '.version_pr_title // "chore: version packages"' <<<"$PROFILE_JSON")"
                gh auth setup-git
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git fetch origin "$branch:refs/remotes/origin/$branch" 2>/dev/null || true
                git checkout -B "$branch"
                git add -A
                git commit -m "$title"
                git push --force-with-lease origin "HEAD:$branch"
                existing="$(gh pr list --repo "$TARGET_REPOSITORY" --state open --head "$branch" --json number --jq '.[0].number // empty')"
                if [ -z "$existing" ]; then
                  gh pr create --repo "$TARGET_REPOSITORY" --head "$branch" --base "$TARGET_REF_NAME" --title "$title" --body "Automated Changesets version update."
                else
                  echo "Updated existing version PR #$existing."
                fi
              else
                if bash -eo pipefail -c "$publish_cmd"; then
                  echo "Primary package publication completed."
                else
                  fallback="$(jq -r '.fallback_publish_script // empty' <<<"$PROFILE_JSON")"
                  if [ -z "$fallback" ]; then
                    echo "::error::Primary package publication failed and no resilient fallback is configured." >&2
                    exit 1
                  fi
                  echo "::warning::Primary package publication failed; switching to the idempotent staged/backoff publisher."
                  export STAGE_SIZE="$(jq -r '.fallback_stage_size // "5"' <<<"$PROFILE_JSON")"
                  export STAGE_COOLDOWN="$(jq -r '.fallback_stage_cooldown // "120"' <<<"$PROFILE_JSON")"
                  export PUBLISH_COOLDOWN="$(jq -r '.fallback_call_cooldown // "30"' <<<"$PROFILE_JSON")"
                  export PUBLISH_TAG="$(jq -r '.fallback_staging_tag // "staging"' <<<"$PROFILE_JSON")"
                  bash "$fallback"
                  promote="$(jq -r '.fallback_promote // true' <<<"$PROFILE_JSON")"
                  promote_script="$(jq -r '.fallback_promote_script // empty' <<<"$PROFILE_JSON")"
                  if [ "$promote" = true ] && [ -n "$promote_script" ]; then
                    bash "$promote_script"
                  fi
                fi
              fi
              ;;

            *)
              echo "::error::Unknown Node package publish mode: $mode" >&2
              exit 1
              ;;
          esac

  central_check_finish:
    if: ${{ always() }}
    needs: [central_check_start, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$FAILED" = true ]; then
            state=failure
            description="Node package publication failed."
          else
            state=success
            description="Node package publication completed successfully."
          fi
          payload="$(jq -n --arg state "$state" --arg context "$STATUS_CONTEXT" --arg description "$description" --arg target_url "$DETAILS_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          gh api --method POST "repos/$TARGET_REPOSITORY/statuses/$TARGET_CHECK_SHA" --input - <<<"$payload"
      - name: Mint target check token
        id: target-check-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: HereLiesAz
      - name: Post target check run
        if: ${{ always() && steps.target-check-token.outputs.token != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.target-check-token.outputs.token }}
          RUN_READ_TOKEN: ${{ secrets.GH_TOKEN }}
          CHECK_PHASE: finish
          CHECK_NAME: ${{ inputs.target_workflow_name || inputs.source_workflow_path }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        shell: bash
        run: "set +e\nwarn() { echo \"::warning::Target check run skipped: $1\"; exit 0; }\n[[ -n \"${TARGET_REPOSITORY:-}\" && -n \"${TARGET_CHECK_SHA:-}\" ]] || warn \"no target commit\"\ntitle=\"$CHECK_NAME\"\ntext=\"\"\nif [[ \"$CHECK_PHASE\" == \"start\" ]]; then\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    '{name:$name,head_sha:$sha,status:\"in_progress\",details_url:$url,external_id:$ext,output:{title:$name,summary:(\"Running in HereLiesAz/workflows: \" + $url)}}')\"\nelse\n  if [[ \"$FAILED\" == \"true\" ]]; then\n    conclusion=\"failure\"\n    jobs=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api --paginate \"repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs\" --jq '.jobs[]' 2>/dev/null | jq -s '.')\"\n    [[ -n \"$jobs\" ]] || jobs=\"[]\"\n    failed=\"$(jq -r '[.[] | select(.conclusion == \"failure\" or .conclusion == \"cancelled\")\n      | \"- **\\(.name)** (\\(.conclusion)): \" + ([.steps[]? | select(.conclusion == \"failure\") | .name] | join(\", \") | if . == \"\" then \"no failed step reported\" else . end)\n      + \" — [log](\\(.html_url))\"] | join(\"\\n\")' <<<\"$jobs\")\"\n    first_id=\"$(jq -r '[.[] | select(.conclusion == \"failure\")][0].id // empty' <<<\"$jobs\")\"\n    if [[ -n \"$first_id\" ]]; then\n      tail_log=\"$(GH_TOKEN=\"$RUN_READ_TOKEN\" gh api \"repos/${GITHUB_REPOSITORY}/actions/jobs/${first_id}/logs\" 2>/dev/null \\\n        | sed -E 's/^[0-9T:.-]+Z //' | grep -v '^##\\[group\\]\\|^##\\[endgroup\\]' | tail -n 60)\"\n      [[ -n \"$tail_log\" ]] && text=\"$(printf 'Last lines of the first failed job:\\n\\n~~~text\\n%s\\n~~~\\n' \"${tail_log:0:60000}\")\"\n    fi\n    summary=\"$(printf 'Central run failed: %s\\n\\n%s\\n' \"$DETAILS_URL\" \"${failed:-No failed job reported.}\")\"\n    title=\"$CHECK_NAME failed\"\n  else\n    conclusion=\"success\"\n    summary=\"Central run succeeded: $DETAILS_URL\"\n  fi\n  body=\"$(jq -n --arg name \"$CHECK_NAME\" --arg sha \"$TARGET_CHECK_SHA\" --arg url \"$DETAILS_URL\" --arg ext \"$GITHUB_RUN_ID\" \\\n    --arg conclusion \"$conclusion\" --arg title \"$title\" --arg summary \"${summary:0:65000}\" --arg text \"$text\" \\\n    '{name:$name,head_sha:$sha,status:\"completed\",conclusion:$conclusion,details_url:$url,external_id:$ext,output:({title:$title,summary:$summary} + (if $text == \"\" then {} else {text:$text} end))}')\"\nfi\n# Each phase posts its own Check Run under the same name; GitHub shows the latest one,\n# so the finish phase needs no id handed over from the start job.\ngh api --method POST \"repos/${TARGET_REPOSITORY}/check-runs\" --input - <<<\"$body\" >/dev/null \\\n  || echo \"::warning::Target check run skipped: GitHub refused the check run\"\n\n# Release/deploy workflows also keep one open issue per workflow while it fails:\n# opened on the first failure, commented on each repeat, closed by the next success.\n[[ \"$CHECK_PHASE\" == \"finish\" && \"${FILE_ISSUES:-}\" == \"true\" ]] || exit 0\nlabel=\"central-run-failure\"\nissue_title=\"Central run failing: $CHECK_NAME\"\nissue=\"$(gh api \"repos/${TARGET_REPOSITORY}/issues?state=open&labels=${label}&per_page=100\" 2>/dev/null \\\n  | jq -r --arg t \"$issue_title\" '[.[] | select(.title == $t)][0].number // empty')\"\nif [[ \"$conclusion\" == \"failure\" ]]; then\n  report=\"$(printf '%s\\n\\nCommit: %s\\n\\n%s\\n' \"$summary\" \"$TARGET_CHECK_SHA\" \"$text\")\"\n  if [[ -n \"$issue\" ]]; then\n    gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"$report\" >/dev/null \\\n      || warn \"could not comment on issue #$issue\"\n  else\n    gh api --method POST \"repos/${TARGET_REPOSITORY}/labels\" -f name=\"$label\" -f color=\"000000\" \\\n      -f description=\"A release or deploy run in HereLiesAz/workflows failed for this repository.\" >/dev/null 2>&1\n    gh api --method POST \"repos/${TARGET_REPOSITORY}/issues\" -f title=\"$issue_title\" -f body=\"$report\" -f \"labels[]=$label\" >/dev/null \\\n      || warn \"could
          not open a failure issue\"\n  fi\nelif [[ -n \"$issue\" ]]; then\n  gh api --method POST \"repos/${TARGET_REPOSITORY}/issues/${issue}/comments\" -f body=\"Fixed: $summary (commit $TARGET_CHECK_SHA).\" >/dev/null\n  gh api --method PATCH \"repos/${TARGET_REPOSITORY}/issues/${issue}\" -f state=closed -f state_reason=completed >/dev/null \\\n    || warn \"could not close issue #$issue\"\nfi\n"
