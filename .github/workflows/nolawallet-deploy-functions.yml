  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase CLI
        run: npm i -g firebase-tools
      - name: Authenticate to Google Cloud
        env:
          SA_JSON: ${{ secrets.FIREBASE_APP_DIST_ADMIN_JSON }}
        run: "if [ -z \"$SA_JSON\" ]; then\n  echo \"::error::FIREBASE_APP_DIST_ADMIN_JSON is not set.\"\n  exit 1\nfi\nprintf '%s' \"$SA_JSON\" > \"$RUNNER_TEMP/sa.json\"\necho \"GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json\" >> \"$GITHUB_ENV\"\n# The deploy target project id comes straight from the service account.\nPROJECT_ID=$(node -e \"process.stdout.write(String(require('$RUNNER_TEMP/sa.json').project_id || ''))\")\nif [ -z \"$PROJECT_ID\" ]; then\n  echo \"::error::Could not read project_id from the service account JSON.\"\n  exit 1\nfi\necho \"PROJECT_ID=$PROJECT_ID\" >> \"$GITHUB_ENV\"\necho \"Deploy target project: $PROJECT_ID\"\n"
      - name: Write functions runtime env
        env:
          GH_API_TOKEN: ${{ secrets.FUNCTIONS_GITHUB_TOKEN || secrets.GH_PAT }}
        run: "if [ -z \"$GH_API_TOKEN\" ]; then\n  echo \"::error::Set FUNCTIONS_GITHUB_TOKEN (or GH_PAT) to a classic GitHub PAT with repo scope.\"\n  exit 1\nfi\n# Firebase loads functions/.env at deploy and exposes these as\n# process.env in the running functions. .env is gitignored.\n{\n  echo \"GH_API_REPO=${TARGET_REPOSITORY}\"\n  echo \"GH_API_TOKEN=${GH_API_TOKEN}\"\n} > functions/.env\necho \"Wrote functions/.env (GH_API_REPO=${TARGET_REPOSITORY}, token hidden).\"\n"
      - name: Deploy functions
        run: firebase deploy --only functions --project "$PROJECT_ID" --non-interactive
    needs: central_check_start
    if: ${{ inputs.target_event_name != 'pull_request' || fromJSON(inputs.target_event_json).pull_request.head.repo.fork != true }}
    environment: NoLAWallet
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - deploy
    runs-on: ubuntu-latest
    steps:
      - name: Complete target status
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          STATUS_CONTEXT: ${{ inputs.source_workflow_path }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          DETAILS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: "set -euo pipefail\nif [[ \"$FAILED\" == \"true\" ]]; then\n  state=\"failure\"\n  description=\"Central workflow failed.\"\nelse\n  state=\"success\"\n  description=\"Central workflow completed successfully.\"\nfi\npayload=\"$(jq -n --arg state \"$state\" --arg context \"$STATUS_CONTEXT\" --arg description \"$description\" --arg target_url \"$DETAILS_URL\" '{state:$state,context:$context,description:$description,target_url:$target_url}')\"\ngh api --method POST \"repos/${TARGET_REPOSITORY}/statuses/${TARGET_CHECK_SHA}\" --input - <<<\"$payload\""
