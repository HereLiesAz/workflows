    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: List usernames + dispatch builds
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_APP_DIST_ADMIN_JSON || secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPO: ${{ inputs.target_repository }}
        run: "if [ -z \"$FIREBASE_SERVICE_ACCOUNT\" ] || [ -z \"$GH_PAT\" ]; then\n  echo \"::warning::Firebase service account (FIREBASE_APP_DIST_ADMIN_JSON / FIREBASE_SERVICE_ACCOUNT) or GH_PAT not set; nothing to fan out.\"\n  exit 0\nfi\nnpm i firebase-admin@^12 >/dev/null 2>&1\nnode <<'EOF'\nconst admin = require(\"firebase-admin\");\nadmin.initializeApp({\n  credential: admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)),\n});\n(async () => {\n  const snap = await admin.firestore().collection(\"usernames\").get();\n  const names = snap.docs.map((d) => d.id);\n  console.log(`Fanning out ${names.length} referral build(s).`);\n  for (const username of names) {\n    const res = await fetch(`https://api.github.com/repos/${process.env.REPO}/dispatches`, {\n      method: \"POST\",\n      headers: {\n        Authorization: `Bearer ${process.env.GH_PAT}`,\n        Accept: \"application/vnd.github+json\",\n        \"User-Agent\": \"nolawallet-fanout\",\n        \"Content-Type\": \"application/json\",\n      },\n      body: JSON.stringify({ event_type: \"build-referral-apk\", client_payload: { username } }),\n    });\n    if (!res.ok) {\n      console.error(`dispatch failed for ${username}: ${res.status} ${await res.text()}`);\n    } else {\n      console.log(`dispatched ${username}`);\n    }\n  }\n})().catch((e) => { console.error(e); process.exit(1); });\nEOF\n"
    needs: central_check_start
    environment: NoLAWallet
  central_check_finish:
    if: ${{ always() }}
    needs:
      - central_check_start
      - fanout
    runs-on: ubuntu-latest
