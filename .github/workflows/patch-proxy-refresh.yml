name: Patch proxy refresh behavior

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/patch-proxy-refresh.yml

run-name: patch-proxy-refresh · ${{ github.run_number }}

permissions:
  contents: read

concurrency:
  group: patch-proxy-refresh
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      WORKER_URL: https://workflows.hereliesaz.workers.dev
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Patch synchronizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/sync_repository_catalog.py')
          text = path.read_text(encoding='utf-8')

          old = '''    def put_file(self, full_name: str, path: str, content: str, message: str, branch: str | None = None) -> None:
        quoted = urllib.parse.quote(path, safe="/")
        existing_sha = None
        try:
            item = self.contents(full_name, path)
            if isinstance(item, dict):
                existing_sha = item.get("sha")
        except ApiError as exc:
            if "-> 404:" not in str(exc):
                raise

        body: dict[str, Any] = {
            "message": message,
            "content": base64.b64encode(content.encode()).decode(),
        }
        if existing_sha:
            body["sha"] = existing_sha
        if branch:
            body["branch"] = branch
        self.json("PUT", f"/repos/{full_name}/contents/{quoted}", body)

    def upsert_variable(self, full_name: str, name: str, value: str) -> None:
        quoted = urllib.parse.quote(name, safe="")
        try:
            self.json("GET", f"/repos/{full_name}/actions/variables/{quoted}")
            self.json("PATCH", f"/repos/{full_name}/actions/variables/{quoted}", {"name": name, "value": value})
        except ApiError as exc:
            if "-> 404:" not in str(exc):
                raise
            self.json("POST", f"/repos/{full_name}/actions/variables", {"name": name, "value": value})
'''
          new = '''    def put_file(self, full_name: str, path: str, content: str, message: str, branch: str | None = None) -> None:
        quoted = urllib.parse.quote(path, safe="/")
        existing_sha = None
        try:
            item = self.contents(full_name, path, ref=branch)
            if isinstance(item, dict):
                existing_sha = item.get("sha")
                encoded = item.get("content")
                if isinstance(encoded, str):
                    current = base64.b64decode(encoded).decode()
                    if current == content:
                        return
        except ApiError as exc:
            if "-> 404:" not in str(exc):
                raise

        body: dict[str, Any] = {
            "message": message,
            "content": base64.b64encode(content.encode()).decode(),
        }
        if existing_sha:
            body["sha"] = existing_sha
        if branch:
            body["branch"] = branch
        self.json("PUT", f"/repos/{full_name}/contents/{quoted}", body)

    def upsert_variable(self, full_name: str, name: str, value: str) -> None:
        quoted = urllib.parse.quote(name, safe="")
        try:
            existing = self.json("GET", f"/repos/{full_name}/actions/variables/{quoted}")
            if isinstance(existing, dict) and existing.get("value") == value:
                return
            self.json("PATCH", f"/repos/{full_name}/actions/variables/{quoted}", {"name": name, "value": value})
        except ApiError as exc:
            if "-> 404:" not in str(exc):
                raise
            self.json("POST", f"/repos/{full_name}/actions/variables", {"name": name, "value": value})
'''
          if old not in text:
              raise SystemExit('GitHub writer block did not match expected source')
          text = text.replace(old, new, 1)

          old = '''            if not dry_run:
                gh.put_file(CENTRAL_REPOSITORY, registry_source, source_text, f"Register {repo['full_name']}:{path}", branch="main")
                if not is_proxy:
                    proxy = build_proxy(source_text, path, source_hash, workflow_name)
                    gh.put_file(repo["full_name"], path, proxy, f"Bind {path} to shared catalog via {CENTRAL_REPOSITORY}", branch=default_branch)
'''
          new = '''            if not dry_run:
                gh.put_file(CENTRAL_REPOSITORY, registry_source, source_text, f"Register {repo['full_name']}:{path}", branch="main")
                proxy = build_proxy(source_text, path, source_hash, workflow_name)
                gh.put_file(repo["full_name"], path, proxy, f"Refresh {path} from shared catalog via {CENTRAL_REPOSITORY}", branch=default_branch)
'''
          if old not in text:
              raise SystemExit('Curated proxy write block did not match expected source')
          text = text.replace(old, new, 1)

          old = '''        if not dry_run:
            gh.put_file(CENTRAL_REPOSITORY, registry_source, source_text, f"Register {repo['full_name']}:{path}", branch="main")
            gh.put_file(CENTRAL_REPOSITORY, central_workflow, compiled, f"Update shared workflow catalog {c_hash[:16]}", branch="main")
            if not is_proxy:
                gh.put_file(repo["full_name"], path, proxy, f"Bind {path} to shared catalog via {CENTRAL_REPOSITORY}", branch=default_branch)
'''
          new = '''        if not dry_run:
            gh.put_file(CENTRAL_REPOSITORY, registry_source, source_text, f"Register {repo['full_name']}:{path}", branch="main")
            gh.put_file(CENTRAL_REPOSITORY, central_workflow, compiled, f"Update shared workflow catalog {c_hash[:16]}", branch="main")
            gh.put_file(repo["full_name"], path, proxy, f"Refresh {path} from shared catalog via {CENTRAL_REPOSITORY}", branch=default_branch)
'''
          if old not in text:
              raise SystemExit('Content-addressed proxy write block did not match expected source')
          text = text.replace(old, new, 1)

          if 'if not is_proxy:\n                    proxy = build_proxy' in text:
              raise SystemExit('Curated stale-proxy guard still present')

          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile scripts/sync_repository_catalog.py scripts/sync_repository.py scripts/retry_repository_sync.py

      - name: Commit core patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HereLiesAz workflow controller"
          git config user.email "103241502+HereLiesAz@users.noreply.github.com"
          git add scripts/sync_repository_catalog.py
          git commit -m "Refresh existing central proxies during sync"
          git push origin HEAD:main
          git pull --ff-only origin main

      - name: Refresh only Haive Jules Dispatch proxy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from scripts.retry_repository_sync import IdempotentGitHub
          from scripts import sync_repository as sync
          from scripts import sync_repository_catalog as core

          target = 'HereLiesAz/haive'
          path = '.github/workflows/jules-dispatch.yml'
          gh = IdempotentGitHub(os.environ['GH_TOKEN'])
          repo = gh.repo(target)
          manifest = core.load_manifest(gh, int(repo['id']))
          entry = (manifest.get('workflows') or {}).get(path)
          if not isinstance(entry, dict):
              raise SystemExit('Haive Jules Dispatch manifest entry is missing')
          source_path = entry.get('registry_source')
          if not source_path:
              raise SystemExit('Haive Jules Dispatch registry source is missing')
          source, _ = gh.get_file(core.CENTRAL_REPOSITORY, str(source_path))
          source_hash = core.sha256_text(source)
          parsed = core.load_yaml(source)
          name = str(parsed.get('name') or 'Jules Dispatch')
          desired = sync.build_proxy(source, path, source_hash, name)
          if 'DISPATCH_EVENT_JSON=' not in desired:
              raise SystemExit('Generated Jules Dispatch proxy is not compacting its event payload')
          gh.put_file(
              target,
              path,
              desired,
              'Refresh Jules Dispatch central proxy',
              branch=repo['default_branch'],
          )
          print(json.dumps({'repository': target, 'path': path, 'source_sha256': source_hash}, indent=2))
          PY

      - name: Verify live Haive proxy
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(gh api repos/HereLiesAz/haive/contents/.github/workflows/jules-dispatch.yml --jq .content)"
          content="$(printf '%s' "$encoded" | base64 --decode)"
          grep -q 'DISPATCH_EVENT_JSON=' <<<"$content"
          grep -q "startsWith(github.event.comment.body, '@jules')" <<<"$content"
          grep -q "startsWith(github.event.review.body, '@jules')" <<<"$content"
          if grep -q 'glee-runtime-smoke-test' <<<"$content"; then
            echo 'Temporary Glee smoke-test exclusion unexpectedly returned.' >&2
            exit 1
          fi
          echo 'Haive Jules Dispatch proxy is compact and production-gated.'