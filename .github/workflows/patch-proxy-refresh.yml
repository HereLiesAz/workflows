name: Patch proxy refresh behavior

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/patch-proxy-refresh.yml

run-name: patch-proxy-refresh · ${{ github.run_number }}

permissions:
  contents: read

concurrency:
  group: patch-proxy-refresh
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      WORKER_URL: https://workflows.hereliesaz.workers.dev
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Patch synchronizer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/sync_repository_catalog.py')
          lines = path.read_text(encoding='utf-8').splitlines()

          old_get = '            item = self.contents(full_name, path)'
          if lines.count(old_get) != 1:
              raise SystemExit(f'Expected one branch-unaware contents lookup, found {lines.count(old_get)}')
          lines[lines.index(old_get)] = '            item = self.contents(full_name, path, ref=branch)'

          sha_line = '                existing_sha = item.get("sha")'
          if lines.count(sha_line) != 1:
              raise SystemExit(f'Expected one existing SHA assignment, found {lines.count(sha_line)}')
          i = lines.index(sha_line)
          lines[i + 1:i + 1] = [
              '                encoded = item.get("content")',
              '                if isinstance(encoded, str):',
              '                    current = base64.b64decode(encoded).decode()',
              '                    if current == content:',
              '                        return',
          ]

          get_variable = '            self.json("GET", f"/repos/{full_name}/actions/variables/{quoted}")'
          if lines.count(get_variable) != 1:
              raise SystemExit(f'Expected one variable GET, found {lines.count(get_variable)}')
          i = lines.index(get_variable)
          lines[i:i + 1] = [
              '            existing = self.json("GET", f"/repos/{full_name}/actions/variables/{quoted}")',
              '            if isinstance(existing, dict) and existing.get("value") == value:',
              '                return',
          ]

          curated_guard = '                if not is_proxy:'
          curated_candidates = [
              i for i, line in enumerate(lines[:-2])
              if line == curated_guard and 'proxy = build_proxy(' in lines[i + 1]
          ]
          if len(curated_candidates) != 1:
              raise SystemExit(f'Expected one curated stale-proxy guard, found {len(curated_candidates)}')
          i = curated_candidates[0]
          proxy_line = lines[i + 1][4:]
          write_line = lines[i + 2][4:].replace('f"Bind {path} to shared catalog via {CENTRAL_REPOSITORY}"', 'f"Refresh {path} from shared catalog via {CENTRAL_REPOSITORY}"')
          lines[i:i + 3] = [proxy_line, write_line]

          content_guard = '            if not is_proxy:'
          content_candidates = [
              i for i, line in enumerate(lines[:-1])
              if line == content_guard and 'gh.put_file(repo["full_name"], path, proxy' in lines[i + 1]
          ]
          if len(content_candidates) != 1:
              raise SystemExit(f'Expected one content-addressed stale-proxy guard, found {len(content_candidates)}')
          i = content_candidates[0]
          write_line = lines[i + 1][4:].replace('f"Bind {path} to shared catalog via {CENTRAL_REPOSITORY}"', 'f"Refresh {path} from shared catalog via {CENTRAL_REPOSITORY}"')
          lines[i:i + 2] = [write_line]

          text = '\n'.join(lines) + '\n'
          if 'if not is_proxy:\n                    proxy = build_proxy' in text:
              raise SystemExit('Curated stale-proxy guard still present')
          path.write_text(text, encoding='utf-8')
          PY

          python -m py_compile scripts/sync_repository_catalog.py scripts/sync_repository.py scripts/retry_repository_sync.py

      - name: Commit core patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HereLiesAz workflow controller"
          git config user.email "103241502+HereLiesAz@users.noreply.github.com"
          git add scripts/sync_repository_catalog.py
          git commit -m "Refresh existing central proxies during sync"
          git push origin HEAD:main
          git pull --ff-only origin main

      - name: Refresh only Haive Jules Dispatch proxy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from scripts.retry_repository_sync import IdempotentGitHub
          from scripts import sync_repository as sync
          from scripts import sync_repository_catalog as core

          target = 'HereLiesAz/haive'
          workflow_path = '.github/workflows/jules-dispatch.yml'
          gh = IdempotentGitHub(os.environ['GH_TOKEN'])
          repo = gh.repo(target)
          manifest = core.load_manifest(gh, int(repo['id']))
          entry = (manifest.get('workflows') or {}).get(workflow_path)
          if not isinstance(entry, dict):
              raise SystemExit('Haive Jules Dispatch manifest entry is missing')
          source_path = entry.get('registry_source')
          if not source_path:
              raise SystemExit('Haive Jules Dispatch registry source is missing')
          source, _ = gh.get_file(core.CENTRAL_REPOSITORY, str(source_path))
          source_hash = core.sha256_text(source)
          parsed = core.load_yaml(source)
          name = str(parsed.get('name') or 'Jules Dispatch')
          desired = sync.build_proxy(source, workflow_path, source_hash, name)
          if 'DISPATCH_EVENT_JSON=' not in desired:
              raise SystemExit('Generated Jules Dispatch proxy is not compacting its event payload')
          gh.put_file(
              target,
              workflow_path,
              desired,
              'Refresh Jules Dispatch central proxy',
              branch=repo['default_branch'],
          )
          print(json.dumps({'repository': target, 'path': workflow_path, 'source_sha256': source_hash}, indent=2))
          PY

      - name: Verify live Haive proxy
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(gh api repos/HereLiesAz/haive/contents/.github/workflows/jules-dispatch.yml --jq .content)"
          content="$(printf '%s' "$encoded" | base64 --decode)"
          grep -q 'DISPATCH_EVENT_JSON=' <<<"$content"
          grep -q "startsWith(github.event.comment.body, '@jules')" <<<"$content"
          grep -q "startsWith(github.event.review.body, '@jules')" <<<"$content"
          if grep -q 'glee-runtime-smoke-test' <<<"$content"; then
            echo 'Temporary Glee smoke-test exclusion unexpectedly returned.' >&2
            exit 1
          fi
          echo 'Haive Jules Dispatch proxy is compact and production-gated.'