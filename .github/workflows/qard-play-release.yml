      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          cache-read-only: false
          dependency-graph: disabled
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: "echo \"Building bundlePlayRelease...\"\n./gradlew bundlePlayRelease --build-cache \\\n  -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \\\n  -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \\\n  -Pandroid.injected.signing.key.alias=$KEY_ALIAS \\\n  -Pandroid.injected.signing.key.password=$KEY_PASSWORD\n"
      - name: Commit version bump
        run: "git config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add version.properties\ngit commit -m \"Auto-increment version.properties from Play Release [skip ci]\" || echo \"No changes\"\n# Pull latest changes from main to avoid conflicts before pushing\ngit pull --rebase origin main || true\ngit push origin HEAD:main || echo \"Push failed\"\n"
      - name: Locate AAB
        id: aab
        run: "AAB=$(find app/build/outputs/bundle/playRelease -name \"*.aab\" | head -n 1)\nif [ -z \"$AAB\" ]; then\n  echo \"No .aab produced!\" >&2\n  exit 1\nfi\necho \"path=$AAB\" >> \"$GITHUB_OUTPUT\"\necho \"Found AAB: $AAB\"\n"
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: qard-play-release-aab
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error
      - name: Publish to Google Play
        if: ${{ fromJSON(inputs.target_inputs_json).publish }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hereliesaz.qard
          releaseFiles: ${{ steps.aab.outputs.path }}
          track: ${{ fromJSON(inputs.target_inputs_json).track }}
          status: ${{ fromJSON(inputs.target_inputs_json).status }}
    needs: central_check_start
