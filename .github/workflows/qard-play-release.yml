    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          repository: ${{ inputs.target_repository }}
          ref: ${{ inputs.target_sha }}
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true
      - name: Generate Keystore from Secrets
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: "echo \"Generating keystore from certificate chain and private key...\"\necho \"$KEYSTORE_PRIVATE\" > private_key.pem\necho \"$KEYSTORE_CHAIN\" > certificate_chain.crt\n\nopenssl pkcs12 -export -in certificate_chain.crt -inkey private_key.pem \\\n  -name \"$KEY_ALIAS\" -out keystore.p12 \\\n  -password pass:\"$KEYSTORE_PASSWORD\"\n\nkeytool -importkeystore -srckeystore keystore.p12 -srcstoretype PKCS12 \\\n  -destkeystore app/keystore.jks -deststoretype JKS \\\n  -srcstorepass \"$KEYSTORE_PASSWORD\" \\\n  -deststorepass \"$KEYSTORE_PASSWORD\" \\\n  -alias \"$KEY_ALIAS\" -noprompt\n\necho \"Keystore generated at app/keystore.jks\"\nrm private_key.pem certificate_chain.crt keystore.p12\n"
