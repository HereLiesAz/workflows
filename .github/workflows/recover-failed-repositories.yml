name: Recover seven repository migrations

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/recover-failed-repositories.yml

run-name: recover-seven · ${{ github.run_number }}

permissions:
  contents: read

concurrency:
  group: workflow-sync-recovery-seven
  cancel-in-progress: false

env:
  WORKER_URL: https://workflows.hereliesaz.workers.dev

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Check out central controller
        uses: actions/checkout@v4

      - name: Install controller dependency
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Revalidate and finalize only the seven residual repositories
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p recovery-results/dry-run recovery-results/applied
          : > recovery-results/failures.txt

          repos=(
            HereLiesAz/Conveyance
            HereLiesAz/GraffitiXR
            HereLiesAz/azphalt-terrain-puddle
            HereLiesAz/azphalt-word-stagger
            HereLiesAz/azphalt-yell-shake
            HereLiesAz/azphalt-zoom-punch
            HereLiesAz/conveyance-h2g2
          )

          run_with_rate_retry() {
            local repo="$1"
            local mode="$2"
            local out="$3"
            local err
            local attempt=1
            err="$(mktemp)"

            while (( attempt <= 12 )); do
              : > "$err"
              if [[ "$mode" == "dry" ]]; then
                python scripts/retry_repository_sync.py \
                  --repository "$repo" \
                  --worker-url "$WORKER_URL" \
                  --dry-run \
                  --json-output "$out" 2>"$err"
              else
                python scripts/retry_repository_sync.py \
                  --repository "$repo" \
                  --worker-url "$WORKER_URL" \
                  --json-output "$out" 2>"$err"
              fi
              status=$?

              if (( status == 0 )); then
                cat "$err" >&2
                rm -f "$err"
                return 0
              fi

              cat "$err" >&2
              if grep -Eqi 'API rate limit exceeded|secondary rate limit|exceeded a secondary rate limit' "$err"; then
                echo "::warning::GitHub rate-limited $repo ($mode), attempt $attempt/12; cooling down for 180 seconds."
                attempt=$((attempt + 1))
                sleep 180
                continue
              fi

              rm -f "$err"
              return "$status"
            done

            rm -f "$err"
            return 1
          }

          index=0
          total="${#repos[@]}"
          for repo in "${repos[@]}"; do
            index=$((index + 1))
            safe_name="$(printf '%s' "$repo" | tr '/:' '--')"

            echo "::group::[$index/$total] Revalidate $repo"
            if ! run_with_rate_retry "$repo" dry "recovery-results/dry-run/${safe_name}.json"; then
              echo "::error::Dry-run revalidation failed: $repo"
              printf '%s\n' "$repo" >> recovery-results/failures.txt
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"

            echo "::group::[$index/$total] Finalize $repo"
            if run_with_rate_retry "$repo" apply "recovery-results/applied/${safe_name}.json"; then
              echo "Recovery passed: $repo"
            else
              echo "::error::Recovery failed: $repo"
              printf '%s\n' "$repo" >> recovery-results/failures.txt
            fi
            echo "::endgroup::"

            # Deliberately pace write-heavy repository transitions to stay below
            # GitHub's secondary-abuse limits.
            sleep 20
          done

          if [[ -s recovery-results/failures.txt ]]; then
            {
              echo "## Residual migration failures"
              echo
              sed 's/^/- `/' recovery-results/failures.txt | sed 's/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## Recovery complete"
            echo
            echo "All seven residual repositories revalidated and finalized successfully."
            echo
            echo "The other 245 repositories were not retried."
            echo
            echo "NoLAWallet and NoLAWallet-id were not included."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload recovery results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow-sync-recovery-seven
          path: recovery-results/
          retention-days: 30
