name: Recover Illumera v0.6.132 release

on:
  push:
    paths:
      - '.github/workflows/recover-illumera-0.6.132.yml'

permissions:
  contents: read

jobs:
  recover-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Illumera release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HereLiesAz/illumera
          ref: 429b858d1d3d39c7bb8a978a926eb4b4288583b8
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
          path: illumera
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager='/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager'
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platform-tools' 'platforms;android-37' 'build-tools;37.0.0'

      - name: Restore trusted Stremio playback AAR cache
        id: stremio-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: stremio-aars
          key: stremio-media-${{ runner.os }}-95781597c8e3c30d6232e77bdadecc38ad35aa17-v2
          fail-on-cache-miss: true

      - name: Install Stremio playback modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p illumera/playbackcore/libs
          for aar in \
            lib-exoplayer-release.aar \
            lib-decoder-av1-release.aar \
            lib-decoder-ffmpeg-release.aar \
            lib-decoder-iamf-release.aar \
            lib-decoder-mpegh-release.aar; do
            test -s "stremio-aars/$aar"
            cp "stremio-aars/$aar" "illumera/playbackcore/libs/$aar"
          done

      - name: Decode release keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.KEYSTORE_RAW }}"
          printf '%s' "${{ secrets.KEYSTORE_RAW }}" | base64 --decode > illumera/release.keystore
          test -s illumera/release.keystore

      - name: Build signed release APK only
        working-directory: illumera
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PversionNameOverride="0.6.132" \
            -PversionCodeOverride="132"

      - name: Prepare recovered release asset
        id: asset
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find illumera/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" illumera-0.6.132.apk
          sha="$(sha256sum illumera-0.6.132.apk | awk '{print $1}')"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          cat > release-notes.md <<EOF
          Illumera 0.6.132

          Recovered GitHub release for the already-built and published version from commit 429b858d1d3d39c7bb8a978a926eb4b4288583b8.

          APK SHA-256: $sha
          EOF

      - name: Create or repair GitHub Release in target repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo='HereLiesAz/illumera'
          tag='v0.6.132'
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" illumera-0.6.132.apk --repo "$repo" --clobber
          else
            gh release create "$tag" illumera-0.6.132.apk \
              --repo "$repo" \
              --title 'illumera 0.6.132' \
              --notes-file release-notes.md \
              --verify-tag
          fi

      - name: Verify recovered release and asset
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repo='HereLiesAz/illumera'
          tag='v0.6.132'
          gh release view "$tag" --repo "$repo" --json tagName,isDraft,isPrerelease,assets \
            --jq 'select(.tagName == "v0.6.132" and .isDraft == false and .isPrerelease == false) | .assets[] | select(.name == "illumera-0.6.132.apk") | .name' \
            | grep -Fx 'illumera-0.6.132.apk'

      - name: Remove release keystore
        if: always()
        shell: bash
        run: rm -f illumera/release.keystore
