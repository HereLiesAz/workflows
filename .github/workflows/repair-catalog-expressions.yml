name: Repair central catalog expressions

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/repair-catalog-expressions.yml

run-name: repair-catalog-expressions · ${{ github.run_number }}

permissions:
  contents: read

concurrency:
  group: repair-central-catalog-expressions
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out central controller
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Repair generated catalogs and compiler regexes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          bad_event_inputs = "fromJSON(inputs.target_event_json).fromJSON(inputs.target_inputs_json)."
          good_event_inputs = "fromJSON(inputs.target_event_json).inputs."
          bad_event_vars = "fromJSON(inputs.target_event_json).fromJSON(inputs.target_vars_json)."
          good_event_vars = "fromJSON(inputs.target_event_json).vars."
          nested_inputs = re.compile(r"([A-Za-z_][A-Za-z0-9_-]*)\.fromJSON\(inputs\.target_inputs_json\)\.")
          nested_vars = re.compile(r"([A-Za-z_][A-Za-z0-9_-]*)\.fromJSON\(inputs\.target_vars_json\)\.")

          changed = []
          for path in sorted(Path('.github/workflows').glob('catalog-*.y*ml')):
              text = path.read_text(encoding='utf-8')
              repaired = text.replace(bad_event_inputs, good_event_inputs).replace(bad_event_vars, good_event_vars)
              repaired = nested_inputs.sub(r"\1.inputs.", repaired)
              repaired = nested_vars.sub(r"\1.vars.", repaired)
              if repaired != text:
                  path.write_text(repaired, encoding='utf-8')
                  changed.append(str(path))

          compiler_paths = [
              Path('scripts/sync_repository_catalog.py'),
              Path('scripts/sync_repository.py'),
          ]
          for path in compiler_paths:
              text = path.read_text(encoding='utf-8')
              repaired = text
              repaired = repaired.replace(
                  r'r"\binputs\.([A-Za-z_][A-Za-z0-9_-]*)"',
                  r'r"(?<![A-Za-z0-9_.-])inputs\.([A-Za-z_][A-Za-z0-9_-]*)"',
              )
              repaired = repaired.replace(
                  r'r"\bvars\.([A-Za-z_][A-Za-z0-9_-]*)"',
                  r'r"(?<![A-Za-z0-9_.-])vars\.([A-Za-z_][A-Za-z0-9_-]*)"',
              )
              repaired = repaired.replace(
                  r'r"(?<!github\.event\.)\binputs\.([A-Za-z_][A-Za-z0-9_-]*)"',
                  r'r"(?<![A-Za-z0-9_.-])inputs\.([A-Za-z_][A-Za-z0-9_-]*)"',
              )
              repaired = repaired.replace(
                  r'r"(?<!github\.event\.)\bvars\.([A-Za-z_][A-Za-z0-9_-]*)"',
                  r'r"(?<![A-Za-z0-9_.-])vars\.([A-Za-z_][A-Za-z0-9_-]*)"',
              )
              if repaired != text:
                  path.write_text(repaired, encoding='utf-8')
                  changed.append(str(path))

          remaining = []
          for path in sorted(Path('.github/workflows').glob('catalog-*.y*ml')):
              text = path.read_text(encoding='utf-8')
              if '.fromJSON(inputs.target_inputs_json).' in text or '.fromJSON(inputs.target_vars_json).' in text:
                  remaining.append(str(path))

          if remaining:
              raise SystemExit('Malformed nested catalog expressions remain: ' + ', '.join(remaining))

          core = Path('scripts/sync_repository_catalog.py').read_text(encoding='utf-8')
          wrapper = Path('scripts/sync_repository.py').read_text(encoding='utf-8')
          safe_inputs = r'(?<![A-Za-z0-9_.-])inputs\.'
          safe_vars = r'(?<![A-Za-z0-9_.-])vars\.'
          if safe_inputs not in core or safe_vars not in core or safe_inputs not in wrapper or safe_vars not in wrapper:
              raise SystemExit('Compiler root-context regex hardening did not apply cleanly')

          print(f'Repaired {len(changed)} file(s).')
          for path in changed:
              print(path)
          PY

      - name: Commit central repairs
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows/catalog-*.yml scripts/sync_repository.py scripts/sync_repository_catalog.py; then
            echo "No central repairs were necessary."
            exit 0
          fi

          git config user.name "HereLiesAz workflow controller"
          git config user.email "103241502+HereLiesAz@users.noreply.github.com"
          git add -- .github/workflows/catalog-*.yml scripts/sync_repository.py scripts/sync_repository_catalog.py
          git commit -m "Harden catalog expression rewriting"
          git push origin HEAD:main