name: Complete centralized GitHub release repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-release-centralization.yml'

permissions:
  contents: write
  actions: write

env:
  WORKER_URL: https://workflows.hereliesaz.workers.dev

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Make existing shared variants refreshable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/shared_workflow_library.py')
          text = path.read_text(encoding='utf-8')

          old = '''    current = family_variants(existing_text)\n    if variant in current:\n        return existing_text\n\n    # Reconstruct existing variants from the generated family is intentionally\n    # avoided: callers adding a new variant must use append_shared_variant so\n    # existing job bodies and comments remain untouched.\n    return append_shared_variant(existing_text, family_slug, variant, compiled_text)\n\n\ndef append_shared_variant'''
          new = '''    current = family_variants(existing_text)\n    if variant in current:\n        return replace_shared_variant(existing_text, family_slug, variant, compiled_text)\n\n    return append_shared_variant(existing_text, family_slug, variant, compiled_text)\n\n\ndef replace_shared_variant(existing_text: str, family_slug: str, variant: str, compiled_text: str) -> str:\n    \"\"\"Replace one registered variant with freshly compiled jobs.\n\n    The variant id identifies the target workflow implementation, not the\n    compiler version. Recompilation must therefore refresh an existing variant\n    when controller semantics change (permissions, target-repo rewrites, etc.).\n    \"\"\"\n    doc = load_yaml(existing_text)\n    if not isinstance(doc, dict):\n        raise ValueError(f\"existing shared family {family_slug} is invalid\")\n    jobs = doc.get(\"jobs\") or CommentedMap()\n\n    on_value = doc.get(\"on\") or {}\n    dispatch = on_value.get(\"workflow_dispatch\") or {}\n    existing_inputs = dispatch.get(\"inputs\") or {}\n    candidate_inputs = _dispatch_inputs(load_yaml(compiled_text))\n    for key in existing_inputs:\n        if key == \"shared_variant\":\n            continue\n        if key not in candidate_inputs:\n            raise ValueError(f\"refreshed variant is missing dispatch input {key!r} in family {family_slug}\")\n\n    prefix = f\"v_{variant}__\"\n    removed = False\n    for job_id in list(jobs):\n        if str(job_id).startswith(prefix):\n            del jobs[job_id]\n            removed = True\n    if not removed:\n        raise ValueError(f\"variant {variant} is not present in family {family_slug}\")\n\n    for job_id, job in compiled_variant_jobs(compiled_text, variant).items():\n        if job_id in jobs:\n            raise ValueError(f\"duplicate refreshed job id: {job_id}\")\n        jobs[job_id] = job\n    doc[\"jobs\"] = jobs\n\n    variants = sorted(family_variants(dump_yaml(doc)))\n    guard = jobs.get(\"shared_variant_guard\")\n    if not isinstance(guard, dict):\n        raise ValueError(f\"family {family_slug} has no shared_variant_guard\")\n    steps = guard.get(\"steps\") or []\n    if not steps or not isinstance(steps[0], dict):\n        raise ValueError(f\"family {family_slug} guard shape changed\")\n    steps[0][\"run\"] = _variant_guard_script(variants)\n\n    header = (\n        \"# Central semantic shared-workflow family.\\n\"\n        \"# Public identity is the filename; implementation hashes are internal registry metadata only.\\n\"\n        \"# Do not edit generated variant jobs by hand; update the source workflow or synchronizer.\\n\"\n    )\n    return header + dump_yaml(doc)\n\n\ndef append_shared_variant'''

          if 'def replace_shared_variant(' not in text:
              if old not in text:
                  raise SystemExit('shared variant refresh anchor changed')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('.github/workflows/validate-controller.yml')
          text = path.read_text(encoding='utf-8')
          if 'scripts/test_shared_variant_refresh.py' not in text:
              needle = '            scripts/prune_shared_workflow_library.py\n'
              replacement = '            scripts/prune_shared_workflow_library.py \\\n            scripts/test_shared_variant_refresh.py\n'
              if needle not in text:
                  raise SystemExit('validator compile-list anchor changed')
              text = text.replace(needle, replacement, 1)

              anchor = '      - name: Check Worker JavaScript\n'
              step = '      - name: Regression-test shared variant refresh\n        run: python scripts/test_shared_variant_refresh.py\n\n'
              if anchor not in text:
                  raise SystemExit('validator test insertion anchor changed')
              text = text.replace(anchor, step + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate refresh semantics
        run: |
          python -m py_compile \
            scripts/shared_workflow_library.py \
            scripts/test_shared_variant_refresh.py \
            scripts/test_release_centralization.py
          python scripts/test_shared_variant_refresh.py
          python scripts/test_release_centralization.py
          git diff --check

      - name: Commit shared variant refresh fix
        id: controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Az'
          git config user.email '103241502+HereLiesAz@users.noreply.github.com'
          git add scripts/shared_workflow_library.py scripts/test_shared_variant_refresh.py .github/workflows/validate-controller.yml
          git commit -m 'Refresh shared variants when compiler semantics change'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for controller validation
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          COMMIT_SHA: ${{ steps.controller.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 40); do
            run_id="$(gh run list --repo HereLiesAz/workflows --workflow validate-controller.yml --commit "$COMMIT_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "$run_id" ]] || { echo 'Controller validation run did not appear' >&2; exit 1; }
          gh run watch "$run_id" --repo HereLiesAz/workflows --exit-status

      - name: Recompile Illumera release through corrected compiler
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python scripts/sync_repository.py \
            --repository HereLiesAz/illumera \
            --worker-url "$WORKER_URL" \
            --json-output /tmp/illumera-sync.json
          cat /tmp/illumera-sync.json

      - name: Verify Illumera release binding
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from scripts.sync_repository_catalog import CENTRAL_REPOSITORY, GitHub, load_yaml

          def expression(body: str) -> str:
              return '${' + '{ ' + body + ' }}'

          gh = GitHub(os.environ['GH_TOKEN'])
          manifest_text, _ = gh.get_file(CENTRAL_REPOSITORY, 'registry/1345505866/manifest.json', ref='main')
          manifest = json.loads(manifest_text)
          entry = manifest['workflows']['.github/workflows/release.yml']
          central = entry['central_workflow']
          variant = entry['shared_variant']
          central_text, _ = gh.get_file(CENTRAL_REPOSITORY, central, ref='main')
          doc = load_yaml(central_text)
          release_steps = []
          release_jobs = []
          for job_id, job in (doc.get('jobs') or {}).items():
              if not str(job_id).startswith(f'v_{variant}__') or not isinstance(job, dict):
                  continue
              for step in job.get('steps') or []:
                  if isinstance(step, dict) and str(step.get('uses') or '').startswith('softprops/action-gh-release@'):
                      release_steps.append(step)
                      release_jobs.append(job)
          assert release_steps, f'no release step in {central}:{variant}'
          for job, step in zip(release_jobs, release_steps):
              values = step.get('with') or {}
              assert values.get('repository') == expression('inputs.target_repository'), values
              assert values.get('token') == expression('secrets.GH_TOKEN'), values
              assert job.get('permissions', {}).get('contents') == 'write', job.get('permissions')
          print(f'Illumera release variant {variant} verified in {central}')
          PY

      - name: Re-run Illumera v0.6.131 proxy and await central release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import time
          from scripts.sync_repository_catalog import GitHub

          repo = 'HereLiesAz/illumera'
          source_path = '.github/workflows/release.yml'
          tag = 'v0.6.131'
          gh = GitHub(os.environ['GH_TOKEN'])

          runs = gh.json('GET', f'/repos/{repo}/actions/runs?per_page=100')
          candidates = [
              run for run in (runs.get('workflow_runs') or [])
              if run.get('path') == source_path and run.get('head_branch') == tag
          ]
          if not candidates:
              raise SystemExit(f'No {repo} {source_path} run found for {tag}')
          candidates.sort(key=lambda run: run.get('created_at') or '')
          run = candidates[-1]
          run_id = int(run['id'])
          sha = str(run['head_sha'])

          combined = gh.json('GET', f'/repos/{repo}/commits/{sha}/status')
          old = [s for s in (combined.get('statuses') or []) if s.get('context') == source_path]
          old_id = max((int(s.get('id') or 0) for s in old), default=0)
          old_state = max(old, key=lambda s: int(s.get('id') or 0), default={}).get('state')
          print(f'previous central status: {old_state}; rerunning target proxy run {run_id}')
          gh.json('POST', f'/repos/{repo}/actions/runs/{run_id}/rerun')

          deadline = time.time() + 2700
          latest = None
          while time.time() < deadline:
              combined = gh.json('GET', f'/repos/{repo}/commits/{sha}/status')
              fresh = [
                  s for s in (combined.get('statuses') or [])
                  if s.get('context') == source_path and int(s.get('id') or 0) > old_id
              ]
              if fresh:
                  latest = max(fresh, key=lambda s: int(s.get('id') or 0))
                  if latest.get('state') in {'success', 'failure', 'error'}:
                      break
              time.sleep(10)

          if not latest or int(latest.get('id') or 0) <= old_id:
              raise SystemExit('Illumera rerun produced no new central release status')
          print(f"new central status: {latest.get('state')} {latest.get('target_url') or ''}")
          if latest.get('state') != 'success':
              raise SystemExit(f"Illumera central release failed: {latest.get('target_url') or ''}")
          PY

      - name: Remove one-time repair workflow
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api repos/HereLiesAz/workflows/contents/.github/workflows/repair-release-centralization.yml --jq .sha)"
          gh api --method DELETE repos/HereLiesAz/workflows/contents/.github/workflows/repair-release-centralization.yml \
            -f message='Remove completed release repair workflow' \
            -f sha="$sha" >/dev/null
