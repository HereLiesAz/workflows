name: Finish centralized GitHub release repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-release-centralization.yml'

permissions:
  contents: write
  actions: write

env:
  WORKER_URL: https://workflows.hereliesaz.workers.dev

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out controller
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Make semantic garbage collection part of every real sync
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/sync_repository.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = '''except ImportError:\n    import sync_repository_catalog as core\n    from sync_repository_catalog import *  # noqa: F401,F403\n\n\n'''
          import_block = '''except ImportError:\n    import sync_repository_catalog as core\n    from sync_repository_catalog import *  # noqa: F401,F403\n\ntry:\n    from .prune_shared_workflow_library import prune_shared_workflow_library\nexcept ImportError:\n    from prune_shared_workflow_library import prune_shared_workflow_library\n\n\n'''
          if 'from .prune_shared_workflow_library import prune_shared_workflow_library' not in text:
              if import_anchor not in text:
                  raise SystemExit('sync_repository import anchor changed')
              text = text.replace(import_anchor, import_block, 1)

          base_anchor = '_base_build_proxy = core.build_proxy\n'
          if '_base_sync_repository = core.sync_repository' not in text:
              if base_anchor not in text:
                  raise SystemExit('sync_repository base function anchor changed')
              text = text.replace(
                  base_anchor,
                  base_anchor + '_base_sync_repository = core.sync_repository\n',
                  1,
              )

          assignment_anchor = '''core.compile_central = compile_central\ncore.build_proxy = build_proxy\n'''
          wrapper = '''def sync_repository(gh, repository: str, worker_url: str, dry_run: bool):\n    result = _base_sync_repository(gh, repository, worker_url, dry_run)\n    if not dry_run:\n        result["shared_library_gc"] = prune_shared_workflow_library(gh, dry_run=False)\n    return result\n\n\ncore.compile_central = compile_central\ncore.build_proxy = build_proxy\ncore.sync_repository = sync_repository\n'''
          if 'core.sync_repository = sync_repository' not in text:
              if assignment_anchor not in text:
                  raise SystemExit('sync_repository assignment anchor changed')
              text = text.replace(assignment_anchor, wrapper, 1)

          path.write_text(text, encoding='utf-8')

          # Semantic shared files are global state. Different repositories must
          # not mutate that state concurrently.
          path = Path('.github/workflows/sync-repository.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          out = []
          for line in lines:
              if line.strip().startswith('group: workflow-sync-'):
                  out.append('  group: workflow-sync-controller')
              else:
                  out.append(line)
          path.write_text('\n'.join(out) + '\n', encoding='utf-8')

          path = Path('.github/workflows/validate-controller.yml')
          text = path.read_text(encoding='utf-8')
          if 'scripts/prune_shared_workflow_library.py' not in text:
              needle = '            scripts/dispatch_request.py\n'
              replacement = '            scripts/dispatch_request.py \\\n            scripts/prune_shared_workflow_library.py\n'
              if needle not in text:
                  raise SystemExit('validator compile list anchor changed')
              text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate garbage collection integration
        run: |
          python -m py_compile \
            scripts/sync_repository.py \
            scripts/sync_repository_catalog.py \
            scripts/shared_workflow_library.py \
            scripts/prune_shared_workflow_library.py \
            scripts/test_release_centralization.py
          python scripts/test_release_centralization.py
          git diff --check

      - name: Commit controller garbage collection
        id: controller
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Az'
          git config user.email '103241502+HereLiesAz@users.noreply.github.com'
          git add scripts/sync_repository.py scripts/prune_shared_workflow_library.py .github/workflows/sync-repository.yml .github/workflows/validate-controller.yml
          if git diff --cached --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Garbage collect semantic shared workflow variants'
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for controller validation
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          COMMIT_SHA: ${{ steps.controller.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for _ in $(seq 1 40); do
            run_id="$(gh run list --repo HereLiesAz/workflows --workflow validate-controller.yml --commit "$COMMIT_SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          [[ -n "$run_id" ]] || { echo 'Controller validation run did not appear' >&2; exit 1; }
          gh run watch "$run_id" --repo HereLiesAz/workflows --exit-status

      - name: Garbage collect stale semantic families
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/prune_shared_workflow_library.py --json-output /tmp/gc.json

      - name: Verify every active GitHub release binding
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from scripts.sync_repository_catalog import CENTRAL_REPOSITORY, GitHub, load_yaml

          def expression(body: str) -> str:
              return '${' + '{ ' + body + ' }}'

          gh = GitHub(__import__('os').environ['GH_TOKEN'])
          registry = gh.contents(CENTRAL_REPOSITORY, 'registry', ref='main')
          checked = 0
          failures = []

          for item in registry:
              if not isinstance(item, dict) or item.get('type') != 'dir':
                  continue
              manifest_path = f"{item['path']}/manifest.json"
              try:
                  manifest_text, _ = gh.get_file(CENTRAL_REPOSITORY, manifest_path, ref='main')
              except Exception:
                  continue
              manifest = json.loads(manifest_text)
              repo = (manifest.get('repository') or {}).get('full_name', '')
              if repo in {'HereLiesAz/NoLAWallet', 'HereLiesAz/NoLAWallet-id'}:
                  continue
              for source_path, entry in (manifest.get('workflows') or {}).items():
                  if not isinstance(entry, dict) or entry.get('status') != 'active':
                      continue
                  source_file = entry.get('registry_source')
                  if not source_file:
                      continue
                  source_text, _ = gh.get_file(CENTRAL_REPOSITORY, source_file, ref='main')
                  if 'softprops/action-gh-release@' not in source_text:
                      continue

                  checked += 1
                  central = str(entry.get('central_workflow') or '')
                  variant = str(entry.get('shared_variant') or '')
                  if central.endswith('/ftp-deploy.yml'):
                      failures.append(f'{repo}:{source_path} still points to ftp-deploy.yml')
                      continue
                  central_text, _ = gh.get_file(CENTRAL_REPOSITORY, central, ref='main')
                  doc = load_yaml(central_text)
                  prefix = f'v_{variant}__'
                  matching_jobs = [
                      job for job_id, job in (doc.get('jobs') or {}).items()
                      if str(job_id).startswith(prefix) and isinstance(job, dict)
                  ]
                  release_steps = []
                  for job in matching_jobs:
                      for step in job.get('steps') or []:
                          if isinstance(step, dict) and str(step.get('uses') or '').startswith('softprops/action-gh-release@'):
                              release_steps.append((job, step))
                  if not release_steps:
                      failures.append(f'{repo}:{source_path} has no softprops step in registered variant {variant}')
                      continue
                  for job, step in release_steps:
                      with_values = step.get('with') or {}
                      if with_values.get('repository') != expression('inputs.target_repository'):
                          failures.append(f'{repo}:{source_path} release repository is not target_repository')
                      if with_values.get('token') != expression('secrets.GH_TOKEN'):
                          failures.append(f'{repo}:{source_path} release token is not central GH_TOKEN')
                      if 'tag_name' not in with_values:
                          failures.append(f'{repo}:{source_path} release has no explicit target tag_name')

          print(f'validated {checked} active GitHub-release workflow binding(s)')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

          if gh api repos/HereLiesAz/workflows/contents/.github/workflows/ftp-deploy.yml >/tmp/ftp.json 2>/dev/null; then
            content="$(jq -r .content /tmp/ftp.json | tr -d '\n' | base64 -d)"
            if grep -q 'softprops/action-gh-release@' <<<"$content"; then
              echo 'GitHub release code remains in ftp-deploy.yml' >&2
              exit 1
            fi
          fi

      - name: Re-run failed v0.6.131 release proxies and await central result
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import time

          from scripts.sync_repository_catalog import CENTRAL_REPOSITORY, GitHub

          TAG = 'v0.6.131'
          gh = GitHub(os.environ['GH_TOKEN'])

          def cli(*args):
              return subprocess.check_output(['gh', *args], text=True)

          registry = gh.contents(CENTRAL_REPOSITORY, 'registry', ref='main')
          affected = set()
          for item in registry:
              if not isinstance(item, dict) or item.get('type') != 'dir':
                  continue
              try:
                  manifest_text, _ = gh.get_file(CENTRAL_REPOSITORY, f"{item['path']}/manifest.json", ref='main')
              except Exception:
                  continue
              manifest = json.loads(manifest_text)
              repo = (manifest.get('repository') or {}).get('full_name', '')
              if repo in {'HereLiesAz/NoLAWallet', 'HereLiesAz/NoLAWallet-id'}:
                  continue
              for source_path, entry in (manifest.get('workflows') or {}).items():
                  if not isinstance(entry, dict) or entry.get('status') != 'active':
                      continue
                  registry_source = entry.get('registry_source')
                  if not registry_source:
                      continue
                  source_text, _ = gh.get_file(CENTRAL_REPOSITORY, registry_source, ref='main')
                  if 'softprops/action-gh-release@' in source_text:
                      affected.add((repo, source_path))

          reruns = []
          for repo, source_path in sorted(affected):
              runs = gh.json('GET', f'/repos/{repo}/actions/runs?per_page=100')
              candidates = [
                  run for run in (runs.get('workflow_runs') or [])
                  if run.get('path') == source_path and run.get('head_branch') == TAG
              ]
              if not candidates:
                  continue
              candidates.sort(key=lambda run: run.get('created_at') or '')
              run = candidates[-1]
              sha = str(run.get('head_sha') or '')
              if not sha:
                  continue

              combined = gh.json('GET', f'/repos/{repo}/commits/{sha}/status')
              old_statuses = [
                  status for status in (combined.get('statuses') or [])
                  if status.get('context') == source_path
              ]
              old_latest = max(old_statuses, key=lambda status: int(status.get('id') or 0), default=None)
              if not old_latest or old_latest.get('state') != 'failure':
                  continue
              old_id = int(old_latest.get('id') or 0)
              run_id = int(run['id'])
              print(f'Re-running {repo} {source_path} run {run_id} for {TAG}; prior central status id={old_id}')
              gh.json('POST', f'/repos/{repo}/actions/runs/{run_id}/rerun')
              reruns.append((repo, source_path, run_id, sha, old_id))

          if not reruns:
              print(f'No failed {TAG} central release status found among active release workflows.')
              raise SystemExit(0)

          failures = []
          for repo, source_path, run_id, sha, old_id in reruns:
              deadline = time.time() + 2700
              latest = None
              while time.time() < deadline:
                  combined = gh.json('GET', f'/repos/{repo}/commits/{sha}/status')
                  fresh = [
                      status for status in (combined.get('statuses') or [])
                      if status.get('context') == source_path and int(status.get('id') or 0) > old_id
                  ]
                  if fresh:
                      latest = max(fresh, key=lambda status: int(status.get('id') or 0))
                      if latest.get('state') in {'success', 'failure', 'error'}:
                          break
                  time.sleep(10)

              if not latest or int(latest.get('id') or 0) <= old_id:
                  failures.append(f'{repo}:{source_path} produced no new central status after target run {run_id}')
                  continue
              state = latest.get('state')
              url = latest.get('target_url') or ''
              print(f'{repo}:{source_path} => {state} {url}')
              if state != 'success':
                  failures.append(f'{repo}:{source_path} central release ended {state}: {url}')

          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Remove one-time repair workflow
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(gh api repos/HereLiesAz/workflows/contents/.github/workflows/repair-release-centralization.yml --jq .sha)"
          gh api --method DELETE repos/HereLiesAz/workflows/contents/.github/workflows/repair-release-centralization.yml \
            -f message='Remove completed release repair workflow' \
            -f sha="$sha" >/dev/null
