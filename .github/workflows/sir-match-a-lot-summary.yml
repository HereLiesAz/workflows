          persist-credentials: false
      - name: Run AI inference
        id: inference
        uses: actions/ai-inference@v3
        with:
          prompt: "Summarize the following GitHub issue in one paragraph:\nTitle: ${{ fromJSON(inputs.target_event_json).issue.title }}\nBody: ${{ fromJSON(inputs.target_event_json).issue.body }}\n"
      - name: Comment with AI summary
        run: "gh issue comment \"$ISSUE_NUMBER\" --body \"$RESPONSE\"\n"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_NUMBER: ${{ fromJSON(inputs.target_event_json).issue.number }}
