name: Sync all owned repositories

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Enforce version contract everywhere
    types:
      - completed

run-name: sync-all · ${{ github.run_number }}

permissions:
  actions: read
  contents: read

concurrency:
  group: workflow-sync-all-repositories
  cancel-in-progress: false

env:
  WORKER_URL: https://workflows.hereliesaz.workers.dev

jobs:
  discover:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      repositories: ${{ steps.repos.outputs.repositories }}
      count: ${{ steps.repos.outputs.count }}
      archived: ${{ steps.repos.outputs.archived }}
    steps:
      - name: Enumerate every owned repository
        id: repos
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          all="$(gh api --paginate 'user/repos?affiliation=owner&per_page=100' --jq '.[] | select(.owner.login == "HereLiesAz") | [.full_name, (.archived|tostring)] | @tsv')"

          repositories="$(
            awk -F '\t' '$1 != "HereLiesAz/workflows" && $1 != "HereLiesAz/IDEaz" && $2 == "false" {print $1}' <<<"$all"               | sort -u               | jq -Rsc 'split("\n") | map(select(length > 0))'
          )"
          archived="$(
            awk -F '\t' '$2 == "true" {print $1}' <<<"$all"               | sort -u               | jq -Rsc 'split("\n") | map(select(length > 0))'
          )"

          count="$(jq 'length' <<<"$repositories")"
          archived_count="$(jq 'length' <<<"$archived")"
          test "$count" -le 256 || {
            echo "::error::Writable owned repository count $count exceeds GitHub's 256-job matrix ceiling." >&2
            exit 1
          }

          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "archived=$archived" >> "$GITHUB_OUTPUT"

          {
            echo "## Live repository inventory"
            echo
            echo "- Writable non-controller repositories: **$count**"
            echo "- Controller repository: **HereLiesAz/workflows** (versioned locally; never self-centralized)"
            echo "- Dormant repository skipped entirely: **HereLiesAz/IDEaz**"
            echo "- Archived repositories skipped from workflow mutation: **$archived_count**"
            if [ "$archived_count" -gt 0 ]; then
              jq -r '.[] | "- `" + . + "`"' <<<"$archived"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sync:
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        repository: ${{ fromJSON(needs.discover.outputs.repositories) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Check out central controller
        uses: actions/checkout@v4

      - name: Install controller dependency
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Synchronize repository
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/sync-result.json"
          python scripts/retry_repository_sync.py             --repository "${{ matrix.repository }}"             --worker-url "$WORKER_URL"             --json-output "$out"
          cat "$out"

      - name: Record repository
        if: ${{ always() }}
        run: echo "${{ matrix.repository }}" >> "$GITHUB_STEP_SUMMARY"
