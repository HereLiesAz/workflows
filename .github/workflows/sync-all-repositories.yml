name: Sync all owned repositories

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/sync-all-repositories.yml

run-name: sync-all · ${{ github.run_number }}

permissions:
  actions: read
  contents: read

concurrency:
  group: workflow-sync-all-repositories-v3
  cancel-in-progress: false

env:
  WORKER_URL: https://workflows.hereliesaz.workers.dev
  BASELINE_DRY_RUN_ID: "34791565740"

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repositories: ${{ steps.baseline.outputs.repositories }}
      count: ${{ steps.baseline.outputs.count }}
    steps:
      - name: Reuse the successful account-wide dry-run baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          : > /tmp/repos.txt
          : > /tmp/non_success.txt

          for page in 1 2 3; do
            jobs_json="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${BASELINE_DRY_RUN_ID}/jobs?per_page=100&page=${page}"
            )"

            jq -r '
              .jobs[]
              | select(.name | startswith("dry_run ("))
              | select(.conclusion != "success")
              | "\(.name): \(.conclusion)"
            ' <<<"$jobs_json" >> /tmp/non_success.txt

            jq -r '
              .jobs[]
              | select(.name | startswith("dry_run ("))
              | .name
              | sub("^dry_run \\("; "")
              | sub("\\)$"; "")
            ' <<<"$jobs_json" >> /tmp/repos.txt
          done

          sort -u -o /tmp/repos.txt /tmp/repos.txt

          if [[ -s /tmp/non_success.txt ]]; then
            echo "::error::The baseline contains a non-successful repository dry-run."
            cat /tmp/non_success.txt
            exit 1
          fi

          if grep -Eq '^HereLiesAz/(workflows|NoLAWallet|NoLAWallet-id)$' /tmp/repos.txt; then
            echo "::error::Excluded repository appeared in the dry-run baseline."
            exit 1
          fi

          count="$(grep -cve '^$' /tmp/repos.txt || true)"
          if [[ "$count" != "252" ]]; then
            echo "::error::Expected 252 successful baseline repositories; found $count."
            exit 1
          fi

          repositories="$(jq -Rsc 'split("\n") | map(select(length > 0))' /tmp/repos.txt)"
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

          {
            echo "## Migration baseline"
            echo
            echo "- Reusing **252/252 successful dry-runs** from run \`${BASELINE_DRY_RUN_ID}\`."
            echo "- NoLAWallet repositories remain excluded."
            echo "- This run performs only the apply phase; it does not repeat the API-heavy dry-run sweep."
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: baseline
    if: ${{ needs.baseline.outputs.count == '252' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      REPOSITORIES_JSON: ${{ needs.baseline.outputs.repositories }}
    steps:
      - name: Check out central controller
        uses: actions/checkout@v4

      - name: Install controller dependency
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Apply all baseline repositories with rate-limit throttling
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p migration-results/applied
          : > migration-results/apply-failures.txt

          total="$(jq 'length' <<<"$REPOSITORIES_JSON")"
          index=0

          wait_for_capacity() {
            local remaining reset now sleep_for
            while true; do
              remaining="$(gh api rate_limit --jq '.resources.core.remaining')"
              reset="$(gh api rate_limit --jq '.resources.core.reset')"
              if (( remaining >= 250 )); then
                echo "GitHub API capacity available: ${remaining} core requests remaining."
                return 0
              fi

              now="$(date +%s)"
              sleep_for=$((reset - now + 10))
              if (( sleep_for < 10 )); then
                sleep_for=10
              fi
              echo "GitHub API budget low (${remaining} remaining); pausing until the published reset."
              sleep "$sleep_for"
            done
          }

          wait_for_capacity

          while IFS= read -r repo; do
            [[ -n "$repo" ]] || continue
            index=$((index + 1))

            wait_for_capacity

            safe_name="$(printf '%s' "$repo" | tr '/:' '--')"
            out="migration-results/applied/${safe_name}.json"

            echo "::group::[$index/$total] Apply sync $repo"
            if python scripts/sync_repository.py \
              --repository "$repo" \
              --worker-url "$WORKER_URL" \
              --json-output "$out"; then
              echo "Apply passed: $repo"
            else
              echo "::error::Apply failed: $repo"
              printf '%s\n' "$repo" >> migration-results/apply-failures.txt
            fi
            echo "::endgroup::"
          done < <(jq -r '.[]' <<<"$REPOSITORIES_JSON")

          if [[ -s migration-results/apply-failures.txt ]]; then
            echo "## Apply failures" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- `/' migration-results/apply-failures.txt | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo "## Account-wide migration"
            echo
            echo "Successfully synchronized **$total** repositories from the verified dry-run baseline."
            echo
            echo "Excluded throughout: \`HereLiesAz/workflows\`, \`HereLiesAz/NoLAWallet\`, \`HereLiesAz/NoLAWallet-id\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload applied results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow-sync-applied-all
          path: migration-results/
          retention-days: 30
