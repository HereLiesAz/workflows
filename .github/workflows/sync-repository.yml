name: Sync repository workflows

on:
  # New public repositories register themselves: every hour, auto mode picks up
  # any repository without a registry entry and runs its push workflows once.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to sync, e.g. illumera. Leave blank to sync every new or unfinished repository.
        required: false
        default: ''
        type: string
      dry_run:
        description: Inspect without changing either repository
        required: false
        default: false
        type: boolean

run-name: "sync · ${{ inputs.repository != '' && inputs.repository || '(auto: unregistered repos)' }}"

permissions:
  contents: write
  id-token: write

concurrency:
  group: workflow-sync-${{ inputs.repository || 'auto' }}
  cancel-in-progress: false

env:
  WORKER_URL: https://workflows.hereliesaz.workers.dev

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out central controller
        uses: actions/checkout@v4

      - name: Install centralizer dependency
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Resolve target repositories
        id: targets
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          input="${{ inputs.repository }}"

          if [[ -z "$input" ]]; then
            # Auto-mode, part 1: registered repositories whose webhook isn't configured yet.
            mapfile -t targets < <(
              grep -rl '"worker_url_configured": false' registry/ 2>/dev/null \
                | xargs -r jq -r '.repository.full_name // empty' 2>/dev/null \
                | sort -u
            )

            # Part 2: public repositories created since the last full sync that have no
            # registry entry at all. Same public-only discovery and cursor as
            # sync-all-repositories, so private repositories are never picked up.
            cursor="$(tr -d '\r\n' < .controller/repository-scrape-cursor)"
            cursor_encoded="$(jq -rn --arg value "$cursor" '$value|@uri')"
            if scraped="$(curl --fail-with-body --silent --show-error "${WORKER_URL%/}/repositories?stop=${cursor_encoded}")" \
              && jq -e '.ok == true and (.repositories | type == "array")' <<<"$scraped" >/dev/null; then
              registered="$(jq -r '.repository.full_name // empty' registry/*/manifest.json 2>/dev/null | sort -u)"
              while IFS= read -r repository; do
                [[ -n "$repository" && "$repository" != "HereLiesAz/workflows" ]] || continue
                grep -qxF "$repository" <<<"$registered" || targets+=("$repository")
              done < <(jq -r '.repositories[]' <<<"$scraped")
            else
              echo "::warning::Repository discovery failed; only registered repositories are considered."
            fi
            mapfile -t targets < <(printf '%s\n' "${targets[@]}" | sed '/^$/d' | sort -u)

            if [[ ${#targets[@]} -eq 0 ]]; then
              echo "No unregistered or unconfigured repositories found. Nothing to do."
              echo "targets=[]" >> "$GITHUB_OUTPUT"
            else
              echo "Auto-mode: ${#targets[@]} unregistered repo(s) found."
              printf '  - %s\n' "${targets[@]}"
              json="$(printf '%s\n' "${targets[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
              echo "targets=${json}" >> "$GITHUB_OUTPUT"
            fi
          else
            # Normalize: strip owner prefix if bare name supplied, re-attach canonical owner
            if [[ "$input" != */* ]]; then
              input="HereLiesAz/${input// /}"
            fi
            echo "targets=[\"${input}\"]" >> "$GITHUB_OUTPUT"
          fi

      - name: Register webhooks and sync
        if: ${{ steps.targets.outputs.targets != '[]' && steps.targets.outputs.targets != '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGETS: ${{ steps.targets.outputs.targets }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t repositories < <(jq -r '.[]' <<<"$TARGETS")

          failures=()

          for repository in "${repositories[@]}"; do
            echo "::group::Registering ${repository}"

            repository_id="$(gh api "repos/${repository}" --jq '.id')"

            oidc_response="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=hereliesaz-workflows")"
            oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
            [[ -n "$oidc_token" ]] || { echo "::error::No OIDC token for ${repository}"; failures+=("$repository"); echo "::endgroup::"; continue; }

            payload="$(jq -nc \
              --arg repository "$repository" \
              --arg repository_id "$repository_id" \
              '{repository:$repository,repository_id:$repository_id}')"

            if [[ "${{ inputs.dry_run }}" == "true" ]]; then
              echo "[dry-run] Would POST to ${WORKER_URL}/register with payload: ${payload}"
            else
              curl --fail-with-body --silent --show-error \
                -X POST "${WORKER_URL%/}/register" \
                -H "Authorization: Bearer $oidc_token" \
                -H "Content-Type: application/json" \
                --data "$payload"
            fi

            out="${RUNNER_TEMP}/sync-result-${repository##*/}.json"
            sync_args=(--repository "$repository" --worker-url "$WORKER_URL")
            [[ "${{ inputs.dry_run }}" == "true" ]] && sync_args+=(--dry-run)

            # Remember whether this is the repository's first registration: its pushes so
            # far never reached the gateway, so its push workflows are run once afterwards.
            first_registration="false"
            [[ -f "registry/${repository_id}/manifest.json" ]] || first_registration="true"

            if python scripts/retry_repository_sync.py "${sync_args[@]}" --json-output "$out"; then
              [[ -f "$out" ]] && cat "$out"

              # The sync script does not set worker_url_configured; stamp it now.
              #
              # retry_repository_sync.py's own finalize_manifest() step can commit
              # to this exact same registry/<id>/manifest.json moments earlier (to
              # flip a workflow's binding to repository-scoped). This read-modify-
              # write races that one: observed live as a Contents API 409
              # ("is at <blob-sha> but expected <stale-blob-sha>") when this stamp
              # fetched the file just before that other commit landed. Retry with a
              # fresh GET each attempt instead of failing the whole sync on a
              # transient, self-inflicted race.
              if [[ "${{ inputs.dry_run }}" != "true" ]]; then
                manifest_path="registry/${repository_id}/manifest.json"
                stamped="false"
                for stamp_attempt in 1 2 3 4 5; do
                  file_info="$(gh api "repos/HereLiesAz/workflows/contents/${manifest_path}")"
                  current_sha="$(jq -r '.sha' <<<"$file_info")"
                  current_content="$(jq -r '.content' <<<"$file_info" | base64 -d)"
                  if [[ "$(jq '.worker_url_configured' <<<"$current_content")" == "true" ]]; then
                    echo "worker_url_configured already true for ${repository}"
                    stamped="true"
                    break
                  fi
                  updated_content="$(jq '.worker_url_configured = true' <<<"$current_content")"
                  encoded="$(echo -n "$updated_content" | base64 -w0)"
                  if gh api --method PUT "repos/HereLiesAz/workflows/contents/${manifest_path}" \
                    -f message="Mark worker_url_configured=true for ${repository}" \
                    -f content="$encoded" \
                    -f sha="$current_sha" \
                    --silent; then
                    echo "Stamped worker_url_configured=true in ${manifest_path}"
                    stamped="true"
                    break
                  fi
                  echo "::warning::Stamp attempt ${stamp_attempt} for ${repository} hit a conflict; retrying with a fresh sha"
                  sleep "$stamp_attempt"
                done
                if [[ "$stamped" != "true" ]]; then
                  echo "::error::Could not stamp worker_url_configured=true for ${repository} after 5 attempts"
                  failures+=("$repository")
                fi
              fi

              if [[ "$first_registration" == "true" && "${{ inputs.dry_run }}" != "true" ]]; then
                if python scripts/dispatch_manual.py --repository "$repository" --catch-up; then
                  echo "Started first run of ${repository}'s push workflows"
                else
                  echo "::warning::Registered ${repository}, but could not start its first run; push to it or run the gateway by hand."
                fi
              fi

              echo "- ✅ ${repository}" >> "$GITHUB_STEP_SUMMARY"
            else
              status=$?
              [[ -f "$out" ]] && cat "$out"
              echo "::error::Sync failed for ${repository} (exit ${status})"
              failures+=("$repository")
              echo "- ❌ ${repository}" >> "$GITHUB_STEP_SUMMARY"
            fi

            echo "::endgroup::"
          done

          if (( ${#failures[@]} > 0 )); then
            printf '::error::Sync failed for: %s\n' "$(IFS=', '; echo "${failures[*]}")"
            exit 1
          fi
