name: Sync repository workflows

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to bind to the shared workflow catalog, for example HereLiesAz/haive
        required: true
        type: string
      dry_run:
        description: Inspect without changing either repository
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'scripts/.run-haive-sync'

run-name: sync · ${{ github.event_name == 'workflow_dispatch' && inputs.repository || 'HereLiesAz/haive' }}

permissions:
  contents: read

concurrency:
  group: workflow-sync-${{ github.event_name == 'workflow_dispatch' && inputs.repository || 'HereLiesAz/haive' }}
  cancel-in-progress: false

env:
  WORKER_URL: https://workflows.hereliesaz.workers.dev
  TARGET_REPOSITORY: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || 'HereLiesAz/haive' }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out central controller
        uses: actions/checkout@v4

      - name: Install centralizer dependency
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Scan and centralize
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          args=(--repository "$TARGET_REPOSITORY" --worker-url "$WORKER_URL")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/sync_repository.py "${args[@]}" --json-output sync-result.json

      - name: Write summary
        if: ${{ always() && hashFiles('sync-result.json') != '' }}
        run: |
          {
            echo '## Workflow sync'
            echo
            echo '```json'
            cat sync-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
