name: Temporary illumera workflow resync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temp-sync-illumera.yml"
      - "registry/1345505866/release-16911b98.source.yml"

permissions:
  contents: read

concurrency:
  group: temp-sync-illumera
  cancel-in-progress: false

env:
  WORKER_URL: https://workflows.hereliesaz.workers.dev

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out central controller
        uses: actions/checkout@v4

      - name: Install centralizer dependency
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Resync illumera workflow catalog
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python scripts/retry_repository_sync.py \
            --repository HereLiesAz/illumera \
            --worker-url "$WORKER_URL" \
            --json-output sync-result.json

      - name: Write summary
        if: ${{ always() && hashFiles('sync-result.json') != '' }}
        run: |
          {
            echo '## illumera workflow resync'
            echo
            echo '```json'
            cat sync-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
