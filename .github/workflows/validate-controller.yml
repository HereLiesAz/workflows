name: Validate controller

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'worker/**'
      - 'registry/**/manifest.json'
      - 'wrangler.jsonc'
      - 'policy/**'
      - 'templates/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'worker/**'
      - 'registry/**/manifest.json'
      - 'wrangler.jsonc'
      - 'policy/**'
      - 'templates/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

# Keep validation meaningful without letting machine-generated controller commits
# consume every runner slot. Different branches/PRs still validate concurrently;
# within one ref, only the newest validation matters.
concurrency:
  group: validate-controller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Compile controller Python
        run: |
          python -m py_compile \
            scripts/shared_workflow_library.py \
            scripts/repository_workflow_mode.py \
            scripts/semantic_catalog.py \
            scripts/sync_repository_catalog.py \
            scripts/sync_repository.py \
            scripts/retry_repository_sync.py \
            scripts/dispatch_request.py \
            scripts/test_dispatch_input_contract.py \
            scripts/test_sync_on_setup_change.py \
            scripts/test_dispatch_manual.py \
            scripts/dispatch_manual.py \
            scripts/audit_workflow_collection.py \
            scripts/report_workflow_purposes.py \
            scripts/test_release_centralization.py \
            scripts/test_version_contract.py \
            scripts/test_workflow_policy.py \
            scripts/version_contract.py

      - name: Audit the complete workflow collection
        run: python scripts/audit_workflow_collection.py

      - name: Enforce generalized workflow policy
        run: python scripts/test_workflow_policy.py

      - name: Classify workflows by purpose
        if: ${{ always() }}
        run: python scripts/report_workflow_purposes.py

      - name: Upload workflow purpose audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow-purpose-audit
          path: |
            workflow-purpose-audit.json
            workflow-purpose-audit.md
          retention-days: 7

      - name: Validate embedded Bash and Python
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          from ruamel.yaml import YAML

          yaml = YAML(typ='safe')
          heredoc = re.compile(r"python(?:3)? - <<'PY'\n(.*?)\nPY(?:\n|$)", re.S)

          def steps_from(doc):
              for job in (doc.get('jobs') or {}).values():
                  if not isinstance(job, dict):
                      continue
                  for step in job.get('steps') or []:
                      if isinstance(step, dict):
                          yield step

          for path in Path('.github/workflows').glob('*.y*ml'):
              doc = yaml.load(path.read_text(encoding='utf-8'))
              if not isinstance(doc, dict):
                  continue
              for index, step in enumerate(steps_from(doc), start=1):
                  run = step.get('run')
                  if not isinstance(run, str):
                      continue
                  shell = str(step.get('shell') or '').strip().lower()
                  if shell.startswith('bash'):
                      result = subprocess.run(['bash', '-n'], input=run, text=True, capture_output=True)
                      if result.returncode:
                          raise RuntimeError(
                              f"invalid Bash in {path}: step {index} ({step.get('name', 'unnamed')}):\n{result.stderr}\n--- script ---\n{run}"
                          )
                  for match in heredoc.finditer(run):
                      compile(match.group(1), f'{path}:step-{index}', 'exec')
          PY

      - name: Smoke-test repository-scoped generation and webhook routing
        run: |
          python - <<'PY'
          from scripts import sync_repository_catalog as core
          from scripts.dispatch_request import _event_trigger
          from scripts.repository_workflow_mode import activate
          from scripts.sync_repository import compile_central, load_yaml

          source = '''
          name: Fixture
          on:
            push:
              branches: [main]
              paths-ignore:
                - '.github/workflows/**'
          jobs:
            test:
              runs-on: ubuntu-latest
              concurrency:
                group: fixture-build
                cancel-in-progress: false
              steps:
                - uses: actions/checkout@v4
                - run: echo ok
          '''
          source_doc = load_yaml(source)
          assert _event_trigger(
              source_doc,
              'push',
              {'ref': 'refs/heads/main'},
              ['src/App.kt'],
          ) == 'push'
          assert _event_trigger(
              source_doc,
              'push',
              {'ref': 'refs/heads/main'},
              ['.github/workflows/fixture.yml'],
          ) is None
          assert _event_trigger(
              source_doc,
              'push',
              {'ref': 'refs/heads/other'},
              ['src/App.kt'],
          ) is None

          pr_source = load_yaml('''
          name: PR fixture
          on:
            pull_request:
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - run: echo ok
          ''')
          for action in ('opened', 'synchronize', 'reopened'):
              assert _event_trigger(
                  pr_source,
                  'pull_request',
                  {'action': action, 'pull_request': {'base': {'ref': 'main'}}},
                  [],
              ) == 'pull_request'
          for action in ('edited', 'labeled', 'assigned'):
              assert _event_trigger(
                  pr_source,
                  'pull_request',
                  {'action': action, 'pull_request': {'base': {'ref': 'main'}}},
                  [],
              ) is None

          central = compile_central(source, {'full_name': 'HereLiesAz/fixture', 'private': False}, '.github/workflows/fixture.yml', 'Fixture')
          activate(core, 'HereLiesAz/fixture')
          path = core.shared_workflow_path('Fixture', '.github/workflows/fixture.yml', central)
          generated = core.add_shared_variant(None, 'fixture', '0123456789abcdef', central)
          doc = load_yaml(generated)
          assert path == '.github/workflows/fixture-fixture.yml'
          assert doc['name'] == 'fixture · Fixture'
          assert 'shared_variant' not in generated
          assert not any(str(job).startswith('v_') for job in doc['jobs'])
          group = doc['jobs']['test']['concurrency']['group']
          assert 'fixture' in group.casefold(), group
          PY

      - name: Regression-test release centralization
        run: python scripts/test_release_centralization.py

      - name: Regression-test dispatch input contracts
        run: python scripts/test_dispatch_input_contract.py

      - name: Regression-test sync requests from workflow-setup pushes
        run: python scripts/test_sync_on_setup_change.py

      - name: Regression-test manual dispatch matching
        run: python scripts/test_dispatch_manual.py

      - name: Regression-test canonical version contract
        run: python scripts/test_version_contract.py

      - name: Check Worker JavaScript
        run: node --check worker/src/index.js

      - name: Smoke test public repository scraper
        shell: bash
        run: |
          set -euo pipefail
          cursor="$(tr -d '\r\n' < .controller/repository-scrape-cursor)"
          cursor_encoded="$(jq -rn --arg value "$cursor" '$value|@uri')"
          response="$(curl --fail-with-body --silent --show-error "https://workflows.hereliesaz.workers.dev/repositories?stop=${cursor_encoded}")"
          jq -e --arg cursor "$cursor" '.ok == true and .stop_found == true and .stop_repository == $cursor and (.repositories | type == "array")' <<<"$response" >/dev/null
          echo "Scraper reached cursor $cursor after $(jq -r '.pages_scanned' <<<"$response") page(s)."

  deploy-gateway-worker:
    name: Deploy central gateway Worker
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Worker changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
            before="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -n "$before" ]] && git diff --name-only "$before" HEAD | grep -Eq '^(worker/|wrangler\.jsonc$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Cloudflare deployment credentials
        if: ${{ steps.changes.outputs.deploy == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::Missing required secret CLOUDFLARE_API_TOKEN — authorizes deployment of the central workflows Worker."; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "::error::Missing required secret CLOUDFLARE_ACCOUNT_ID — identifies the Cloudflare account that hosts the central workflows Worker."; exit 1; }

      - name: Deploy central workflows Worker
        if: ${{ steps.changes.outputs.deploy == 'true' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
