name: Enforce version contract everywhere

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/version-contract-sync.yml'
      - 'scripts/version_contract.py'
      - 'scripts/sync_version_contract.py'

run-name: version-contract-all · ${{ github.run_number }}

permissions:
  contents: read

concurrency:
  group: version-contract-account-wide
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.repos.outputs.batches }}
      count: ${{ steps.repos.outputs.count }}
    steps:
      - name: Enumerate every owned repository
        id: repos
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          repos="$(
            gh api --paginate 'user/repos?affiliation=owner&per_page=100' \
              --jq '.[] | select(.owner.login == "HereLiesAz" and (.archived|not) and (.private|not) and .full_name != "HereLiesAz/workflows") | .full_name' \
              | sort -u \
              | jq -Rsc 'split("\n") | map(select(length > 0))'
          )"
          count="$(jq 'length' <<<"$repos")"
          test "$count" -gt 0
          # Matrix entries are batches, not repositories. This includes *all*
          # public, unarchived owned repositories even beyond the 256-job cap.
          # Each job processes at most ten repositories and reports every failure.
          batches="$(jq -c '[range(0; length; 10) as $i | .[$i:($i+10)]]' <<<"$repos")"
          echo "batches=$batches" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Owned repositories: $count" >> "$GITHUB_STEP_SUMMARY"

  enforce:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: ${{ fromJSON(needs.discover.outputs.batches) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Check out version controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install controller dependency
        run: python -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.15'

      - name: Enforce major.minor.patch.build for every repository in batch
        env:
          MATRIX_BATCH: ${{ toJSON(matrix.batch) }}
        shell: bash
        run: |
          set -euo pipefail
          failed=()
          while IFS= read -r repository; do
            [ -n "$repository" ] || continue
            echo "::group::Version contract: $repository"
            if python scripts/sync_version_contract.py --repository "$repository"; then
              echo "Version contract applied: $repository"
            else
              failed+=("$repository")
            fi
            echo "::endgroup::"
          done < <(jq -r '.[]' <<<"$MATRIX_BATCH")
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::Version contract failed for: %s\n' "${failed[*]}"
            exit 1
          fi
