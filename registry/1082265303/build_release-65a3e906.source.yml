name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  build-raspi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pyinstaller websockets

      - name: Build Executable
        run: |
          cd pwnagotchi_raspi
          pyinstaller --onefile --name pwnagotchi_raspi main.py

      - name: Upload Executable
        uses: actions/upload-artifact@v4
        with:
          name: pwnagotchi_raspi
          path: pwnagotchi_raspi/dist/pwnagotchi_raspi

  release:
    needs: [build-android, build-raspi]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v3

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug

      - name: Download Raspi Executable
        uses: actions/download-artifact@v4
        with:
          name: pwnagotchi_raspi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app-debug.apk
            pwnagotchi_raspi
          prerelease: true
          generate_release_notes: true
