name: Jules Issue Handler

on:
  issues:
    types: [opened]

jobs:
  handle-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Invoke Jules
        uses: google-labs-code/jules-invoke@v1
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ github.event.repository.default_branch }}
          prompt: |
            You are an expert software engineer.
            Please address the following issue:
            Title: ${{ github.event.issue.title }}
            Body:
            ${{ github.event.issue.body }}

            If this is a bug, fix it. If it is a feature request, implement it.
            If you create a Pull Request, please ensure the description includes "Closes #${{ github.event.issue.number }}" to automatically close the issue when merged.
            If no code change is required, please comment on the issue and close it.
