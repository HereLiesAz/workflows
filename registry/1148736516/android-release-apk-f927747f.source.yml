name: Build & Publish Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string
      request_id:
        required: false
        type: string
      notes:
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  centralized:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Implemented by the centralized Android GitHub Release workflow."
