name: Theater Bake

# Bakes the paper-theater assets (painting + depth + hinge graph) for an
# explicit set of paintings and deploys them to the art-data branch.
#
# This is deliberately SEPARATE from process_art.yml: that workflow runs
# the 56-shard legacy stroke grinder before the theater step, which is far
# too heavy to re-run every time we just want to bake a few more dioramas.
# This one does only the theater chain (crop -> photorealize -> depth ->
# metadata -> hinge graph -> deploy).
#
# The bake calls a paid/quota'd HF image model (FLUX.1-Kontext) once per
# painting for the photorealize step, so it is dispatch-only and scoped by
# an explicit id list — never the whole 1184-image corpus in one go.
#
# Source photos may be .HEIC (iPhone); the baker registers a HEIF
# opener so those decode. Re-run fills any painting the prior run skipped (HEIC now discovered).
#
# Required secret: HF_TOKEN (Hugging Face inference token) for the
# optional photorealize step. Depth now runs locally (Depth-Anything via
# torch), so a batch no longer degrades to flat/synthetic maps when the
# hosted depth Space is rate-limited.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated painting ids (filename stems in public/assets) to bake. Blank = up to 20 paintings that are unbaked or whose crop box changed."
        required: false
        default: ""
  # Pushing a change to THIS file — or to the hand-authored crop boxes —
  # kicks off a bake of up to 20 pending paintings (unbaked, or whose crop box
  # changed). A crop-box change is picked up per-id by the baker's crop-change
  # detection, so only the moved crops re-photorealize.
  push:
    # Default branch only. A push to any other branch would otherwise run that
    # branch's own scripts with HF_TOKEN and the publish PAT.
    branches:
      - main
    paths:
      - '.github/workflows/theater_bake.yml'
      - 'scripts/crops.json'

concurrency:
  group: theater-bake
  cancel-in-progress: false

permissions:
  contents: write


jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Shared with bootstrap.yml's `bootstrap` job and process_art.yml's
    # `consolidate` job: all three push to the same art-data branch via a
    # plain, non-force git push (peaceiris/actions-gh-pages) with no
    # retry on rejection, so overlapping runs must queue rather than
    # race. (This is in addition to the workflow-level `theater-bake`
    # concurrency group above, which only serializes this workflow
    # against itself.)
    concurrency:
      group: art-data-publish
      cancel-in-progress: false
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # peaceiris/actions-gh-pages (the "Deploy to art-data" step below)
          # authenticates its own push via its `github_token:` input, not
          # git's persisted credential helper — so the untrusted work in
          # between (pip install, running the bake scripts) doesn't need a
          # live write-scoped credential sitting in the git config the
          # whole time.
          persist-credentials: false

      - name: Seed existing bakes from art-data (cache the expensive stages)
        id: seed
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: art-data
          path: _artdata
          persist-credentials: false
        continue-on-error: true

      # The seed is allowed to fail only when art-data does not exist yet (the
      # very first bake). If the branch exists and the seed still failed, baking
      # on would redo every painting from scratch at one paid call each and then
      # publish a manifest and graph built from only this run's paintings.
      - name: Require the seed when art-data exists
        if: steps.seed.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/branches/art-data" --silent 2>/dev/null; then
            echo "::error::art-data exists but could not be checked out; refusing to bake from scratch and overwrite it."
            exit 1
          fi
          echo "art-data does not exist yet; this is the first bake."

      - name: Stage cached bakes into public/data
        run: |
          mkdir -p public/data
          if [ -d _artdata ] && [ -n "$(ls -A _artdata 2>/dev/null | grep -v '^\.git$')" ]; then
            rsync -a --exclude='.git' _artdata/ public/data/
            echo "seeded $(find public/data/theater -type f 2>/dev/null | wc -l) cached files"
          else
            echo "no art-data seed; every painting bakes from scratch"
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Bake theater layers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Passed via env, not spliced directly into the script below as
          # `${{ github.event.inputs.ids }}` — GitHub Actions substitutes
          # `${{ }}` expressions into the run script's TEXT before the
          # shell ever parses it, so a filename-derived id containing shell
          # metacharacters (quotes, semicolons, backticks) would otherwise
          # be able to break out and run arbitrary commands in a job that
          # has contents:write and HF_TOKEN in scope. Referencing $IDS_INPUT
          # below is a normal bash variable expansion instead — no
          # pre-parse substitution, no injection.
          IDS_INPUT: ${{ github.event.inputs.ids }}
        run: |
          IDS="$IDS_INPUT"
          if [ -n "$IDS" ]; then
            echo "Baking: $IDS"
            python scripts/theater_baker.py \
              --input  public/assets/ \
              --output public/data/theater/ \
              --ids "$IDS"
          else
            # No ids (a crops.json push or a blank dispatch): bake up to 20
            # paintings that are unbaked or whose crop box changed. Bounded cost,
            # and a dispatch that was dropped by Actions' one-pending-run
            # concurrency limit is picked up by the next run.
            echo "No ids given: baking up to 20 pending paintings"
            python scripts/theater_baker.py \
              --input  public/assets/ \
              --output public/data/theater/ \
              --pending 20
          fi

      - name: Build hinge graph
        run: python scripts/pareidolia_index.py --data public/data/theater/

      # Gate: refuse to publish a bad bake to art-data. scripts/validate_output.py
      # is owned/maintained by a different agent (CLI contract:
      # `--dir <path>`, non-zero exit on any validation failure); no
      # continue-on-error here — a failing validation must fail this job.
      - name: Validate baked theater output
        run: python scripts/validate_output.py --dir public/data/theater

      - name: Refuse to shrink the published corpus
        run: python scripts/check_no_shrink.py --before _artdata/theater/_manifest.json --after public/data/theater/_manifest.json

      - name: Deploy to art-data
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3 (pinned commit for the v3 tag)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public/data
          publish_branch: art-data
          keep_files: true
          commit_message: "Theater bake: ${{ github.event.inputs.ids }}"
