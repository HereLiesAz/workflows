name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AZPHALT_VERSION_FROZEN: "1"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: generate-submit-and-upload

      - name: Run storefront unit tests
        working-directory: apps/storefront-cmp
        run: |
          chmod +x gradlew
          ./gradlew desktopTest --build-cache --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-unit-test-reports
          path: apps/storefront-cmp/build/reports/tests/

  android-debug:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Build storefront Android debug APK
        working-directory: apps/storefront-cmp
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --build-cache --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: azphalt-storefront-debug-apk
          path: apps/storefront-cmp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
