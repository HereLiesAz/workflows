name: Build & Deploy Storefront to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/storefront-react/**'
      - 'apps/storefront-worker/**'
      - 'apps/storefront/registry/**'
      - 'packages/azp/**'
      - 'packages/sdk/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-storefront.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/storefront-react/**'
      - 'apps/storefront-worker/**'
      - 'apps/storefront/registry/**'
      - 'packages/azp/**'
      - 'packages/sdk/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-storefront.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-storefront
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build @azphalt/azp and workspace dependencies
        run: pnpm --filter "@azphalt/azp..." build

      - name: Verify committed registry catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @azphalt/storefront build-catalog --check

      - name: Build static React storefront
        run: pnpm --filter @azphalt/storefront-react build

      - name: Bundle Worker without deploying
        run: npx --yes wrangler@4 deploy --dry-run --config apps/storefront-worker/wrangler.jsonc

      - name: Deploy Worker and static assets to Cloudflare
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/storefront-worker/wrangler.jsonc
