name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out pinned Conveyance
        uses: actions/checkout@v5
        with:
          repository: HereLiesAz/Conveyance
          ref: b3e13674df9dfbcc0b35f800b57d78a305d07b03
          path: vendor/Conveyance
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile and test all targets
        run: |
          ./gradlew \
            desktopTest \
            compileKotlinDesktop \
            compileKotlinJs \
            compileKotlinWasmJs \
            compileAndroidMain
