# This workflow triages pull requests using .github/labeler.yml.

name: Labeler
on: [pull_request]

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/labeler@v7
        with:
          repo-token: "${{ github.token }}"
          sync-labels: false
