name: Terrarium CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/haive-swarm-terrarium
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrarium-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout H2G2
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout pinned Conveyance
        uses: actions/checkout@v7
        with:
          repository: HereLiesAz/Conveyance
          ref: b3e13674df9dfbcc0b35f800b57d78a305d07b03
          path: vendor/Conveyance

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile and test terrarium targets
        run: |
          chmod +x gradlew
          ./gradlew desktopTest compileKotlinDesktop compileKotlinJs compileKotlinWasmJs compileAndroidMain
