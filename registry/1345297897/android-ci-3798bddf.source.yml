name: Android CI

# The only workflow in this repository that actually builds anything.
#
# This used to run `./gradlew test` and `./gradlew assembleDebug`, then build/sign/release a debug
# APK -- none of which exist in this project. `conveyance-space` is a Kotlin Multiplatform
# *library* module (`androidLibrary { ... }` + `jvm("desktop")` in build.gradle.kts, see
# settings.gradle.kts: there is no `com.android.application` module here, so there is no APK to
# assemble, sign, or release), not an Android app. Confirmed for real against
# `./gradlew tasks --all`: the real task names are `desktopTest` (this module's own tests, all of
# which live under `commonTest`), `allTests` (also pulls in Android instrumented/host tests, which
# need a device/emulator this runner doesn't have), and `assembleAndroidMain` (compiles the
# Android target without needing a device). Mirrors the identical fix in the sibling
# `conveyance-h2g2` repository, which hit and fixed this same defect first.
#
# This project's `commonMain` depends on `com.github.HereLiesAz.Conveyance:conveyance-core` and
# `:conveyance-compose` at `main-SNAPSHOT`, resolved through JitPack. A red build whose only error
# is a JitPack/Maven Central fetch is a resolution problem, not a code problem -- check
# build.gradle.kts's own comment on that dependency before chasing it as one.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run commonTest on the desktop target
        run: ./gradlew desktopTest --stacktrace

      - name: Compile the Android target
        run: ./gradlew assembleAndroidMain --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
