name: Android CI

# Runs unit tests on every push/PR. `convey/` is a Kotlin Multiplatform *library* with no `app/`
# module (see AGENTS.md's "About the other files at this repo root" and "Dev loop" sections —
# `dev-app`/`android-dev-app` are separate, unpublished iteration-only modules), so there is no
# APK to build or release here. A prior build-and-release job assumed an `app/` module (a
# copy-pasted org-wide Android-application CI template) and always failed at
# `app/build/outputs/apk/debug: No such file or directory` — removed rather than fixed, since
# there is nothing for it to release.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Google Services
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          if [ -f "app/google-services.json.template" ]; then
            sed -e 's/{{\([^}]*\)}}/${\1}/g' app/google-services.json.template | envsubst > app/google-services.json
          fi
          # Add any extra local.properties keys below:
          # echo "CUSTOM_API_KEY=$CUSTOM_API_KEY" >> local.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: generate-submit-and-upload

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew test --continue --build-cache --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
