name: Android CI

# Runs unit tests on every push/PR, then builds and releases a debug APK on push.
# Auto-detects app name from settings.gradle.kts / settings.gradle.
# Reads version from version.properties (Major.Minor.Patch.Build).
#
# Required secrets (all optional — build falls back to debug key / skips injection):
#   KEYSTORE_RAW             — base64-encoded release keystore (.jks)
#   KEYSTORE_PASSWORD        — keystore password
#   KEY_ALIAS                — key alias inside the keystore
#   KEY_PASSWORD             — key password
#   GH_TOKEN                 — GitHub token with write access (defaults to GITHUB_TOKEN)
#
# Optional secrets (Google Services injection — skipped if template absent):
#   GOOGLE_SERVICES_API_KEY  — Firebase/Google API key
#   PROJECT_ID               — Firebase project ID
#   CLIENT_ID                — OAuth client ID
#
# Optional secrets (add any extra project-specific API keys here):
#   CUSTOM_API_KEY           — placeholder; rename and replicate as needed

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Google Services
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          if [ -f "androidApp/google-services.json.template" ]; then
            sed -e 's/{{\([^}]*\)}}/${\1}/g' androidApp/google-services.json.template | envsubst > androidApp/google-services.json
          fi
          # Add any extra local.properties keys below:
          # echo "CUSTOM_API_KEY=$CUSTOM_API_KEY" >> local.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: generate-submit-and-upload

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew allTests --continue --build-cache --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'

  build-and-release:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      checks: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Google Services
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          if [ -f "androidApp/google-services.json.template" ]; then
            echo "Template found. Injecting secrets..."
            sed -e 's/{{\([^}]*\)}}/${\1}/g' androidApp/google-services.json.template | envsubst > androidApp/google-services.json
          else
            echo "Warning: google-services.json.template not found. Skipping injection."
          fi
          # echo "CUSTOM_API_KEY=$CUSTOM_API_KEY" >> local.properties

      - name: Decode signing keystore
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
        run: |
          if [ -z "$KEYSTORE_RAW" ]; then
            echo "::warning::KEYSTORE_RAW secret is empty — building with the default debug key."
            exit 0
          fi
          echo "$KEYSTORE_RAW" | base64 -d > androidApp/keystore.jks
          if [ ! -s androidApp/keystore.jks ]; then
            echo "::error::Decoded keystore is empty — KEYSTORE_RAW is not valid base64."
            exit 1
          fi
          echo "Keystore decoded to androidApp/keystore.jks ($(stat -c%s androidApp/keystore.jks) bytes)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        id: gradle-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEYSTORE_FILE: ${{ github.workspace }}/androidApp/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew assembleDebug --build-cache --no-daemon > build.log 2>&1
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat build.log
          exit $EXIT_CODE

      - name: Report Failure to Jules
        if: failure() && steps.gradle-build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let logTail = 'Log file not found.';
            try { logTail = fs.readFileSync('build.log', 'utf8').slice(-4000); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build Failure on ${context.eventName === 'pull_request' ? 'PR #' + context.issue.number : context.ref}`,
              body: `/jules debug this build error\n\n**Log:**\n\`\`\`\n${logTail}\n\`\`\``,
              labels: ['jules', 'bug']
            });

      # Verification only. Signed releases are built and published by the central
      # android-github-release / android-play-release workflows (HereLiesAz/workflows);
      # a debug-signed APK published from here could not upgrade installs of that release.
