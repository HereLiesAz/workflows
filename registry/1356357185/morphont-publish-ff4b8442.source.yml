name: Publish Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_play:
        description: Upload the signed AAB to Google Play?
        required: false
        default: false
        type: boolean
      track:
        description: Google Play track
        required: false
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: Google Play release status
        required: false
        default: draft
        type: choice
        options:
          - draft
          - completed

permissions:
  contents: write

concurrency:
  group: morphont-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Morphont
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_PRIVATE: ${{ secrets.KEYSTORE_PRIVATE }}
          KEYSTORE_CHAIN: ${{ secrets.KEYSTORE_CHAIN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_PRIVATE KEYSTORE_CHAIN KEYSTORE_PASSWORD KEY_ALIAS; do
            [[ -n "${!name:-}" ]] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          key_password="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          private_key="$RUNNER_TEMP/morphont-private-key.pem"
          certificate_chain="$RUNNER_TEMP/morphont-certificate-chain.crt"
          pkcs12="$RUNNER_TEMP/morphont-release.p12"
          keystore="$RUNNER_TEMP/morphont-release.jks"
          printf '%s\n' "$KEYSTORE_PRIVATE" > "$private_key"
          printf '%s\n' "$KEYSTORE_CHAIN" > "$certificate_chain"
          openssl pkcs12 -export \
            -in "$certificate_chain" \
            -inkey "$private_key" \
            -name "$KEY_ALIAS" \
            -out "$pkcs12" \
            -password pass:"$KEYSTORE_PASSWORD"
          keytool -importkeystore \
            -srckeystore "$pkcs12" \
            -srcstoretype PKCS12 \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -destkeystore "$keystore" \
            -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$key_password" \
            -alias "$KEY_ALIAS" \
            -noprompt
          {
            echo "MORPHONT_KEYSTORE_FILE=$keystore"
            echo "MORPHONT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "MORPHONT_KEY_ALIAS=$KEY_ALIAS"
            echo "MORPHONT_KEY_PASSWORD=$key_password"
          } >> "$GITHUB_ENV"
          rm -f "$private_key" "$certificate_chain" "$pkcs12"

      - name: Build signed release APK and AAB
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease --no-daemon

      - name: Locate release outputs
        id: outputs
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find androidApp/build/outputs/apk/release -name '*.apk' -print | sort | head -n 1)"
          aab="$(find androidApp/build/outputs/bundle/release -name '*.aab' -print | sort | head -n 1)"
          [[ -n "$apk" && -f "$apk" ]] || { echo "Release APK not found" >&2; exit 1; }
          [[ -n "$aab" && -f "$aab" ]] || { echo "Release AAB not found" >&2; exit 1; }
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: morphont-release
          path: |
            ${{ steps.outputs.outputs.apk }}
            ${{ steps.outputs.outputs.aab }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.outputs.outputs.apk }}" \
            "${{ steps.outputs.outputs.aab }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "Morphont $GITHUB_REF_NAME"

      - name: Publish to Google Play
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_play }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hereliesaz.morphont
          releaseFiles: ${{ steps.outputs.outputs.aab }}
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
