# Deploys the MeatPiety data worker (worker/) to Cloudflare. Bound centrally to
# HereLiesAz/workflows' cloudflare-worker-deploy.yml, whose purpose profile points it at
# worker/; the controller replaces this file with its tracker once registered.
name: Deploy MeatPiety Worker
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: worker
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
