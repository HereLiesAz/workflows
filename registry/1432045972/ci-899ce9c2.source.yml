name: CI

# Runs the unit tests on every pull request and every push to main. Target-local CI: the
# ci-report step declares it to HereLiesAz/workflows (docs/WORKFLOW_POLICY.md, "Exception: CI").
# It does not publish anything; releases are the central android-*-release workflows.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for ci-report's OIDC token; no secret is used

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Report to central CI status
        if: always()
        uses: HereLiesAz/workflows/.github/actions/ci-report@main
        with:
          summary: JVM unit tests (:app:testDebugUnitTest)
