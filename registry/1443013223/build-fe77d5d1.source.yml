name: Build

# Validation only. Building, packaging and publishing releases (Android APK, desktop installers, web) is
# done by the shared workflows in HereLiesAz/workflows, not here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Tests and compile checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # authenticates the ci-report step; no repository secret involved
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: ./gradlew :shared:jvmTest :server:test
      - name: Compile every target
        run: ./gradlew :server:classes :composeApp:compileKotlinJvm :composeApp:compileKotlinWasmJs :androidApp:assembleDebug
      # Declares this workflow as target-local CI to HereLiesAz/workflows and records its progress.
      - if: always()
        uses: HereLiesAz/workflows/.github/actions/ci-report@main

  ios:
    name: iOS framework
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:iosSimulatorArm64Test :composeApp:linkDebugFrameworkIosSimulatorArm64
      - if: always()
        uses: HereLiesAz/workflows/.github/actions/ci-report@main
