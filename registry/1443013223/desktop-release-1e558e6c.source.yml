# Built, packaged and published by HereLiesAz/workflows (.github/workflows/multi-platform-app-release.yml):
# a GitHub Release with the desktop installers (Windows .msi, macOS .dmg, Linux .deb and .rpm).
# This file is the trigger contract; the central sync replaces it with a tracker.
name: Desktop Release
on:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "composeApp/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:
jobs:
  hand-off:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Desktop Release runs centrally in HereLiesAz/workflows."
