# Diagnostic branch only: exercise the already deployed application in a real browser.
name: CI
on:
  pull_request:
permissions:
  contents: read
  id-token: write
jobs:
  artist-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install browser and photo fixture
        run: |
          python3 -m venv "$RUNNER_TEMP/stencil-e2e"
          "$RUNNER_TEMP/stencil-e2e/bin/pip" install playwright==1.57.0 Pillow==12.0.0 scikit-image==0.25.2 pypdf==6.4.0
          "$RUNNER_TEMP/stencil-e2e/bin/python" -m playwright install --with-deps chromium
      - name: Transparent-image baseline
        run: '"$RUNNER_TEMP/stencil-e2e/bin/python" tools/tests/browser-smoke.py --url https://hereliesaz.com/stencil-artist/ --artifacts build/browser-smoke'
        continue-on-error: true
      - name: Photograph to stencil and physical exports
        run: '"$RUNNER_TEMP/stencil-e2e/bin/python" tools/tests/artist-workflow-diagnostic.py --url https://hereliesaz.com/stencil-artist/ --artifacts build/artist-workflow'
      - name: Capture browser screenshots and downloaded stencil files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artist-workflow-evidence
          path: |
            build/browser-smoke
            build/artist-workflow
      - if: always()
        uses: HereLiesAz/workflows/.github/actions/ci-report@main
        with:
          summary: Diagnostic live artist workflow; no release
