# Static Kotlin/JS workspace; central GitHub Pages workflow owns publication.
name: GitHub Pages Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p webApp jsBrowserDistribution jsBrowserTest --no-daemon --stacktrace
